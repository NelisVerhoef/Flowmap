<title>__TITLE__</title>
<!--fonts--><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..100,500..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"><!--/fonts-->
<style>
/* Layout: overview first, one part at a time, evidence on demand. The left rail is the whole
   change (its parts, then the flows they land on); the pane shows one part: before -> after, why,
   what to ask. Proof, ripple and code stay folded until asked for. */
:root {
  --paper: #eef1f4;
  --surface: #ffffff;
  --ink: #17202b;
  --muted: #5b6676;
  --rule: #cdd4dc;
  --line: #9aa6b4;
  --accent: #2e5bff;
  --accent-soft: rgba(46, 91, 255, .12);
  --core: #2e5bff;
  --support: #0f7c86;
  --refactor: #6b7686;
  --outside: #b7791f;
  --gain: #1e8a4c;
  --loss: #c8423b;
  --code-bg: #f6f8fa;
  --display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f141a; --surface: #161d26; --ink: #e6ebf1; --muted: #93a0b0; --rule: #2a3441;
    --line: #4a5666; --accent: #7c9cff; --accent-soft: rgba(124, 156, 255, .16);
    --core: #7c9cff; --support: #3cc0cb; --refactor: #93a0b0; --outside: #f0b429;
    --gain: #3fbf78; --loss: #ef6b63; --code-bg: #10161d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f141a; --surface: #161d26; --ink: #e6ebf1; --muted: #93a0b0; --rule: #2a3441;
  --line: #4a5666; --accent: #7c9cff; --accent-soft: rgba(124, 156, 255, .16);
  --core: #7c9cff; --support: #3cc0cb; --refactor: #93a0b0; --outside: #f0b429;
  --gain: #3fbf78; --loss: #ef6b63; --code-bg: #10161d; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 15px/1.55 var(--body); }
.wrap { padding: 24px 16px 96px; max-width: 1240px; margin: 0 auto; display: grid; gap: 22px; }
code, .mono { font-family: var(--mono); font-size: .86em; }
p code, li code, dd code, h2 code { background: var(--accent-soft); padding: 0 .3em; border-radius: 4px; overflow-wrap: anywhere; }
h1, h2, h3 { text-wrap: balance; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.label { font: 600 11px var(--body); text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin: 0; }
.core { --role: var(--core); } .supporting { --role: var(--support); } .refactor { --role: var(--refactor); }
.outside, .unassigned, .off-map { --role: var(--outside); }

/* header: which change; the overview pane says what it does */
header { display: grid; gap: 6px; max-width: 80ch; }
header h1 { font: 800 clamp(24px, 3.4vw, 34px)/1.08 var(--display); font-stretch: 74%; margin: 0; }
.range { color: var(--muted); font-size: 13px; }
.range a { color: inherit; }
.delta { font-size: 18px; line-height: 1.55; margin: 0; max-width: 68ch; }
/* the lens verdict: the first thing to know, its reasons one click away */
.verdict { justify-self: start; max-width: 80ch; font-size: 14px; }
.verdict summary { cursor: pointer; display: inline-flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
.verdict b { font: 700 11px var(--body); text-transform: uppercase; letter-spacing: .08em; border-radius: 4px; padding: 2px 7px; color: var(--surface); }
.verdict.contained b { background: var(--gain); } .verdict.spreads b { background: var(--outside); } .verdict.blind b { background: var(--loss); }
.verdict ul { margin: 8px 0 0; padding-left: 20px; display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.shape { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; font-size: 12.5px; }
.shape li { background: var(--surface); border: 1px solid var(--rule); border-radius: 999px; padding: 2px 10px; }
.shape b { font-variant-numeric: tabular-nums; }

/* rail + pane */

@media (max-width: 900px) { .body { grid-template-columns: minmax(0, 1fr); } }

/* the parts, as a table of contents */
.toc { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.toc button { width: 100%; text-align: left; background: none; border: 1px solid transparent; border-radius: 8px; padding: 8px 10px;
  display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 2px 10px; cursor: pointer; }
.toc button:hover { background: var(--surface); }
.toc button[aria-current="true"] { background: var(--surface); border-color: var(--rule); box-shadow: inset 3px 0 0 var(--role); }

.toc .w { font-size: 12px; color: var(--muted); line-height: 1.3; }

/* the map: flows as lines, the selected part's stops lit, the others faint */

.stop .nm { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.stop.lit .nm { -webkit-line-clamp: unset; }
/* the overview's map: each touched flow as a line of stops, the parts that run each stop under it */
.lanes { display: grid; gap: 14px; }
.lane { display: grid; gap: 6px; }
.lane h3 { font: 700 13px/1.2 var(--display); font-stretch: 80%; margin: 0; letter-spacing: .02em; }

.lane li::before { content: ""; position: absolute; top: 6px; left: 0; right: 0; height: 2px; background: var(--line); }
.lane li:first-child::before { left: 6px; } .lane li:last-child::before { right: calc(100% - 8px); }
.lane .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--surface); border: 2px solid var(--line); position: relative; }
.lane li.touched { color: var(--ink); }
.lane li.touched .dot { background: var(--role); border-color: var(--role); }
.lane .refs { display: flex; flex-wrap: wrap; gap: 4px; }
.ref { font: 600 11px/1 var(--mono); border-radius: 999px; padding: 3px 7px; border: 1px solid var(--role); color: var(--role); background: var(--surface); cursor: pointer; }
.ref:hover { background: var(--accent-soft); }
.quiet-flows { font-size: 12px; color: var(--muted); margin: 4px 0 0; }
.folded { font-size: 12px; color: var(--muted); margin: 0; overflow-wrap: anywhere; }

/* the pane: one part */
.pane { background: var(--surface); border: 1px solid var(--rule); border-top: 4px solid var(--role); border-radius: 12px;
  padding: 22px 24px; display: grid; gap: 18px; min-width: 0; }
.ch-tags { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.num { font: 700 12px var(--mono); color: var(--surface); background: var(--role); border-radius: 6px; padding: 2px 8px; }
.tag { font: 600 11px var(--body); text-transform: uppercase; letter-spacing: .08em; color: var(--role); }
.kind { font-size: 12px; color: var(--muted); }
.pane h2 { font: 750 clamp(21px, 2.6vw, 28px)/1.15 var(--display); font-stretch: 80%; margin: 4px 0 0; }

.pane:focus { outline: none; }
.runs { margin: 0; font-size: 13px; color: var(--muted); }

.ba { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
@media (max-width: 720px) { .ba { grid-template-columns: minmax(0, 1fr); } }

.why { margin: 0; max-width: 72ch; padding-left: 12px; border-left: 3px solid var(--role); }

.qs { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }

.q label { display: grid; gap: 3px; cursor: pointer; }

.qkind.ask { background: var(--accent-soft); color: var(--accent); }
.qkind.check, .qkind.graph { background: var(--paper); color: var(--muted); border: 1px solid var(--rule); }
.qkind.graph { color: var(--support); }

/* evidence, folded */
.more { display: grid; gap: 0; border-top: 1px solid var(--rule); }

.more summary { cursor: pointer; padding: 10px 2px; font-size: 14px; font-weight: 500; display: flex; gap: 10px; align-items: baseline; }
.more summary small { color: var(--muted); font-weight: 400; font-size: 12.5px; }
.more details > div { padding: 2px 2px 14px; display: grid; gap: 10px; }
.paths, .rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 12.5px; }
.path { display: flex; flex-wrap: wrap; align-items: center; gap: 3px; font-family: var(--mono); font-size: 11.5px; }
.path span { background: var(--paper); border: 1px solid var(--rule); border-radius: 4px; padding: 1px 5px; }
.path span.end { border-color: var(--role); color: var(--role); }
.path i { color: var(--muted); font-style: normal; }
.rows li { display: flex; gap: 8px; align-items: baseline; font-family: var(--mono); font-size: 11.5px; overflow-wrap: anywhere; }
.mark { font-family: var(--body); font-size: 11px; font-weight: 600; flex: none; width: 80px; }
.mark.add { color: var(--gain); } .mark.rem { color: var(--loss); } .mark.no { color: var(--outside); } .mark.yes { color: var(--gain); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 11.5px/1 var(--mono); border: 1px solid var(--rule); background: var(--paper); border-radius: 999px; padding: 4px 9px; cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--role); color: var(--role); background: var(--surface); }
.chip i { font-style: normal; color: var(--muted); margin-left: 4px; }
.hunk { border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
[hidden] { display: none !important; }
.hunk .hh { font: 11.5px var(--mono); color: var(--muted); padding: 6px 10px; background: var(--paper); border-bottom: 1px solid var(--rule); overflow-wrap: anywhere; }
.hunk pre { margin: 0; overflow-x: auto; background: var(--code-bg); font: 12px/1.5 var(--mono); padding: 6px 0; }
.hunk pre span { display: block; padding: 0 10px; white-space: pre; min-width: max-content; }
.hunk .a { background: rgba(30, 138, 76, .13); } .hunk .r { background: rgba(200, 66, 59, .13); }

.step-nav { display: flex; justify-content: space-between; gap: 12px; }
.step-nav button { background: none; border: 1px solid var(--rule); border-radius: 8px; padding: 8px 12px; cursor: pointer; text-align: left;
  display: grid; gap: 1px; max-width: 48%; font-size: 13px; }
.step-nav button:hover { border-color: var(--accent); }
.step-nav button[data-dir="1"] { text-align: right; margin-left: auto; }
.step-nav small { color: var(--muted); font-size: 11.5px; }
.keys { font-size: 12px; color: var(--muted); margin: 0; }
kbd { font: 11px var(--mono); border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--surface); }

/* the review tray: ticked questions, ready to paste */
.tray { position: fixed; inset: auto 0 0 0; background: var(--surface); border-top: 1px solid var(--rule); box-shadow: 0 -6px 18px rgba(0,0,0,.06); z-index: 5; }
.tray-in { max-width: 1240px; margin: 0 auto; padding: 10px 16px; display: grid; gap: 10px; }
.tray .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.tray .count { font-weight: 600; }
.tray textarea { width: 100%; min-height: 140px; font: 13px/1.5 var(--mono); color: var(--ink); background: var(--paper);
  border: 1px solid var(--rule); border-radius: 8px; padding: 10px; resize: vertical; }
button.primary { font: 600 14px var(--body); background: var(--accent); color: var(--surface); border: 0; border-radius: 8px; padding: 7px 14px; cursor: pointer; }
button.ghost { background: none; border: 1px solid var(--rule); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
.status { font-size: 13px; color: var(--muted); }

/* viewer mode: no data in the page or the link, so ask for a file */
.drop { background: var(--surface); border: 2px dashed var(--rule); border-radius: 12px; padding: 32px 20px; display: grid; gap: 10px; justify-items: start; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop h1 { font: 800 28px/1.1 var(--display); font-stretch: 74%; margin: 0; }
.drop p { margin: 0; max-width: 68ch; color: var(--muted); }
.drop .err { color: var(--loss); }
</style>

<div class="wrap">
  <header id="top"></header>
  <div class="body">
    <nav class="rail" aria-label="The change">
      <section><h2 class="label" id="toc-h"></h2><p class="folded">Core first, then what it needs; refactors and files off the map last.</p><ol class="toc" id="toc"></ol></section>
      <section id="rail-map"><h2 class="label">Where it lands</h2><div id="map"></div></section>
      <p class="folded" id="folded"></p>
    </nav>
    <main class="pane" id="pane" tabindex="-1"></main>
  </div>
</div>
<aside class="tray" aria-label="Review note">
  <div class="tray-in">
    <div class="row">
      <span><span class="count" id="count"></span> <span class="status">ticked for the author</span></span>
      <button class="ghost" id="peek" type="button" aria-expanded="false" aria-controls="note">Show</button>
      <button class="primary" id="copy" type="button">Copy questions</button>
      <span class="status" id="status" aria-live="polite"></span>
    </div>
    <textarea id="note" aria-label="Review note" readonly hidden></textarea>
  </div>
</aside>

<script type="module">
// The data is embedded by `flowmap change`, or, in the hosted viewer, carried in the link's fragment
// (#v1.<base64url of raw-deflated JSON>), which browsers never send to the server; failing both,
// the reader drops a change page or its JSON. Either way it is read here and goes nowhere else.
const EMBEDDED = /*__CHANGE_DATA__*/null;
const PAYLOAD = /^#v1\.([\w-]+)$/.exec(location.hash);
// another link pasted into this tab changes only the fragment, which does not reload the page
addEventListener("hashchange", () => { if (location.hash.startsWith("#v1.")) location.reload(); });

async function inflate(b64) {
  const bytes = Uint8Array.from(atob(b64.replace(/-/g, "+").replace(/_/g, "/")), (c) => c.charCodeAt(0));
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return JSON.parse(await new Response(stream).text());
}

function fromFile(error) {
  const box = document.createElement("section");
  box.className = "drop";
  box.innerHTML = `<h1>Open a flowmap change</h1>
    <p>Drop a change page (<code>docs/flowmap/changes/&lt;name&gt;.html</code>) or its data as JSON here.
    It is read in this tab and sent nowhere.</p>
    <p><input type="file" accept=".html,.json"></p><p class="err" hidden></p>`;
  const err = box.querySelector(".err");
  if (error) { err.hidden = false; err.textContent = error; }
  document.querySelector(".wrap").replaceChildren(box);
  document.querySelector(".tray").hidden = true;
  return new Promise((resolve) => {
    const read = async (f) => {
      try {
        const text = await f.text();
        const m = /const EMBEDDED = (\{.*?\});\n/s.exec(text) || /const DATA = (\{.*?\});\n/s.exec(text);
        const data = JSON.parse(m ? m[1] : text);
        if (!data.facts || !data.chapters) throw new Error("not flowmap change data");
        resolve(data);
      } catch (e) { err.hidden = false; err.textContent = `Could not read ${f.name}: ${e.message}`; }
    };
    box.querySelector("input").addEventListener("change", (e) => e.target.files[0] && read(e.target.files[0]));
    addEventListener("dragover", (e) => { e.preventDefault(); box.classList.add("over"); });
    addEventListener("dragleave", () => box.classList.remove("over"));
    addEventListener("drop", (e) => { e.preventDefault(); box.classList.remove("over"); e.dataTransfer.files[0] && read(e.dataTransfer.files[0]); });
  });
}

async function load() {
  if (EMBEDDED) return EMBEDDED;
  if (PAYLOAD) {
    try { return await inflate(PAYLOAD[1]); }
    catch (e) { return fromFile("The link's data is cut off or damaged. Was the whole link copied?"); }
  }
  return fromFile();
}

const WRAP = document.querySelector(".wrap").cloneNode(true);
const DATA = await load();
document.querySelector(".wrap").replaceWith(WRAP);
document.querySelector(".tray").hidden = false;
if (DATA.story.title) document.title = DATA.story.title;
const F = DATA.facts, S = DATA.story;
const $ = (s) => document.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v; else if (k === "text") n.textContent = v; else if (k === "html") n.innerHTML = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
  }
  for (const c of kids) if (c != null) n.append(c);
  return n;
};
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const md = (s) => esc(s || "").replace(/`([^`]+)`/g, "<code>$1</code>");
const sym = (id) => id.split(":").pop();
const file = (id) => id.split(":")[0].split("/").pop();
const flowName = (id) => id.replace(/^new:/, "").replace(/-/g, " ");
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
const ROLE = { core: "Core change", supporting: "Supporting change", refactor: "Refactor", outside: "Outside the map",
  unassigned: "Not in the story", "off-map": "Off the map" };

const steps = new Map();
F.map.forEach((f, fi) => f.steps.forEach((s, si) => steps.set(s.key, { ...s, flow: f.id, fi, si })));
const symById = new Map(F.symbols.map(s => [s.id, s]));
const byPlace = (a, b) => (steps.get(a).fi - steps.get(b).fi) || (steps.get(a).si - steps.get(b).si);

// chapter facts
const chapters = DATA.chapters.map((c, i) => {
  const syms = (c.symbols || []).map(id => symById.get(id)).filter(Boolean);
  const keys = [...new Set(syms.flatMap(s => s.steps))].sort(byPlace);
  const ids = new Set(c.symbols || []);
  const mine = (n) => ids.has(n) || ids.has(n + ".__init__");  // calls to a class are calls to its constructor
  const edgesIn = (list) => list.filter(([a, b]) => mine(a) || mine(b));
  const callers = new Map();
  syms.filter(s => s.status === "modified").forEach(s => s.callers.forEach(c => { if (!ids.has(c.id)) callers.set(c.id, c.edited); }));
  const hunks = F.hunks.filter(h => h.symbols.some(x => ids.has(x)) || (c.files || []).includes(h.file));
  const role = c.role || (c.kind === "outside" ? "outside" : c.kind === "unassigned" ? "unassigned" : c.kind === "off-map" ? "off-map" : i === 0 ? "core" : "supporting");
  return { ...c, n: i + 1, syms, keys, role, callers, qs: questions(c, i + 1, syms, keys),
    added: edgesIn(F.edges.added), removed: edgesIn(F.edges.removed), hunks };
});

// the story's questions, then what the graph raises on its own
function questions(c, n, syms, keys) {
  const qs = [];
  const myEps = new Set(keys.flatMap(k => steps.get(k).endpoints));
  const moved = (table) => Object.entries(table).map(([s, eps]) => [s, eps.filter(e => myEps.has(e))]).filter(([, eps]) => eps.length);
  moved(F.reach.lost).forEach(([s, eps], i) => qs.push({ id: `c${n}l${i}`, kind: "graph", q: `${eps.join(", ")} no longer reaches ${sym(s)} (${file(s)}). Was dropping it intended?`, why: "Lost reach to existing code is how a removed check looks." }));
  moved(F.reach.gained).forEach(([s, eps], i) => qs.push({ id: `c${n}w${i}`, kind: "graph", q: `${eps.join(", ")} now reaches existing ${sym(s)} (${file(s)}). Is it safe to run there?`, why: "Existing code running under a new entry point." }));
  (c.questions || []).forEach((q, i) => qs.push({ ...q, id: `c${n}q${i}` }));
  syms.filter(s => s.contract).forEach((s, i) => {
    const still = s.callers.filter(x => !x.edited).map(x => sym(x.id));
    if (still.length) qs.push({ id: `c${n}g${i}`, kind: "graph", q: `${sym(s.id)} changed its arguments (${s.signature[0]} → ${s.signature[1]}) but ${still.length} caller(s) were not edited: ${still.join(", ")}. Are they still correct?`, why: "Signature changed, callers did not." });
  });
  const orphans = syms.filter(s => s.status === "new" && !s.steps.length).map(s => sym(s.id));
  if (orphans.length) qs.push({ id: `c${n}o`, kind: "graph", why: "New code no flow reaches is either a map gap or dead.",
    q: orphans.length === 1 ? `New ${orphans[0]} is not run by any flow on the map. Which step is it for?`
      : `${orphans.length} new functions (${orphans.join(", ")}) are not run by any flow on the map. Which step are they for?` });
  return qs;
}
const picked = new Set(chapters.flatMap(c => c.qs.filter(q => q.kind === "ask" || q.kind === "graph").map(q => q.id)));
const minor = (c) => ["refactor", "outside", "unassigned"].includes(c.role);
const where = (c) => c.keys.length
  ? [...new Set(c.keys.map(k => flowName(steps.get(k).flow)))].join(", ") + ` · ${plural(c.keys.length, "step")}`
  : (c.files || []).length ? "off the map · " + c.files.map(f => f.split("/").pop()).slice(0, 3).join(", ") + (c.files.length > 3 ? " …" : "")
  : "off the map";

// header: which change
const range = el("div", { class: "range" });
range.append(S.pr ? (S.url ? el("a", { href: S.url, text: S.pr }) : S.pr) : "", S.pr ? " · " : "",
  el("span", { class: "mono", text: `${F.base_sha} → ${F.head_sha}` }), ` · ${F.name}`);
$("#top").append(range, el("h1", { text: S.title || `${F.base}..${F.head}` }));
if (F.verdict) {
  const V = F.verdict, flowsOf = new Set(F.map.filter(f => f.steps.some(s => s.endpoints.some(e => V.spreads_to.includes(e)))).map(f => flowName(f.id)));
  const spread = V.spreads_to.length ? `reaches ${plural(V.spreads_to.length, "existing entry point")}` + (flowsOf.size ? ` in ${[...flowsOf].join(", ")}` : "") : "";
  const line = { contained: "no existing entry point runs changed code; only new code changed",
    spreads: spread, blind: `${plural(V.blind.length, "thing")} the call graph can't see` + (spread ? `; what it can see ${spread}` : "") }[V.verdict];
  const items = [...V.blind.map(b => "Can't see: " + b), ...(V.spreads_to.length ? ["Entry points that run changed code: " + V.spreads_to.map(e => "`" + e + "`").join(", ")] : [])];
  $("#top").append(el("details", { class: "verdict " + V.verdict }, el("summary", {}, el("b", { text: V.verdict }), line),
    items.length ? el("ul", {}, ...items.map(i => el("li", { html: md(i) }))) : null));
}

// overview: how the system moves, and only the numbers that are not zero
const touchedFlows = new Set(F.symbols.flatMap(s => s.steps.map(k => k.split("/")[0])));
const nNew = F.symbols.filter(s => s.status === "new").length, nMod = F.symbols.filter(s => s.status === "modified").length;
const shape = [
  [`${touchedFlows.size} of ${F.map.length}`, "flows run changed code"],
  F.endpoints.added.length && [`+${F.endpoints.added.length}`, "entry points", F.endpoints.added.join(", ")],
  F.endpoints.removed.length && [`−${F.endpoints.removed.length}`, "entry points", F.endpoints.removed.join(", ")],
  nNew && [nNew, "new functions"], nMod && [nMod, "changed functions"],
  (Object.keys(F.reach.gained).length || Object.keys(F.reach.lost).length) &&
    [`+${Object.keys(F.reach.gained).length} −${Object.keys(F.reach.lost).length}`, "existing code reached"],
  F.modules.added.length && [`+${F.modules.added.length}`, "module links", F.modules.added.map(([a, b]) => `${a.split("/").pop()} → ${b.split("/").pop()}`).join(", ")],
  [F.tests.changed.length || "no", F.tests.changed.length === 1 ? "test changed" : "tests changed", F.tests.changed.join(", ")],
].filter(Boolean);
function overview(pane) {
  pane.className = "pane";
  pane.append(el("div", {}, el("div", { class: "ch-tags" }, el("span", { class: "tag", text: "Overview" })),
    el("h2", { text: `What this change does, in ${plural(chapters.length, "part")}` })));
  if (S.delta) pane.append(el("p", { class: "delta", html: md(S.delta) }));
  pane.append(el("ul", { class: "shape", "aria-label": "Shape of the change" },
    ...shape.map(([v, k, t]) => el("li", { title: t || null }, el("b", { text: String(v) }), " " + k))));
  if (S.intent) pane.append(el("p", { class: "note", html: "<b>Author's intent:</b> " + md(S.intent) }));
  const ref = (c) => el("button", { type: "button", class: "ref " + c.role, title: c.title, onclick: () => show(c.n) }, String(c.n));
  const lanes = el("div", { class: "lanes" });
  for (const f of F.map) {
    const at = (k) => chapters.filter(c => c.keys.includes(k));
    if (!f.steps.some(s => at(s.key).length)) continue;
    lanes.append(el("section", { class: "lane" }, el("h3", { text: flowName(f.id) }), el("ol", {}, ...f.steps.map(s => {
      const hits = at(s.key);
      return el("li", { class: hits.length ? "touched " + hits[0].role : null }, el("span", { class: "dot", "aria-hidden": "true" }),
        el("span", { text: s.name }), hits.length ? el("span", { class: "refs" }, ...hits.map(ref)) : null);
    }))));
  }
  const off = chapters.filter(c => !c.keys.length);
  if (off.length) lanes.append(el("section", { class: "lane" }, el("h3", { text: "No flow runs this" }),
    el("div", { class: "refs", style: "display:grid;gap:6px" }, ...off.map(c => el("span", { style: "display:flex;gap:8px;align-items:baseline;font-size:13px" }, ref(c), c.title)))));
  if (lanes.children.length) pane.append(el("section", { style: "display:grid;gap:10px" }, el("h3", { class: "label", text: "Where it lands" }),
    el("p", { class: "note", text: "Each line is a user flow, its stops in order. A filled stop runs changed code; the numbers under it are the parts that change it." }), lanes,
    quiet.length ? el("p", { class: "quiet-flows", text: `Untouched flows: ${quiet.join(", ")}` }) : null));
  if (!S.delta) pane.append(el("p", { class: "note", text: "No story for this change: each part below is grouped by the flow steps that run its code." }));
}

// rail: the parts
$("#toc-h").textContent = `The change in ${plural(chapters.length, "part")}`;
$("#toc").append(el("li", { class: "ov" }, el("button", { type: "button", "data-ch": 0, onclick: () => show(0) },
  el("span", { class: "n", text: "◎" }), el("span", { class: "t", text: "Overview" }), el("span", { class: "w", text: "what moves, and how much" }))));
for (const c of chapters) {
  $("#toc").append(el("li", { class: minor(c) ? "minor" : null }, el("button", { type: "button", class: c.role, "data-ch": c.n, onclick: () => show(c.n) },
    el("span", { class: "n", text: String(c.n) }), el("span", { class: "t", text: c.title }), el("span", { class: "w", text: where(c) }))));
}

// rail: the map, touched flows only; a stop says which parts run there
const quiet = [];
for (const f of F.map) {
  const at = (k) => chapters.filter(c => c.keys.includes(k));
  if (!f.steps.some(s => at(s.key).length)) { quiet.push(flowName(f.id)); continue; }
  const ol = el("ol", { class: "stops" });
  for (const s of f.steps) {
    const hits = at(s.key);
    ol.append(el("li", {}, el(hits.length ? "button" : "div", {
      class: "stop" + (hits.length ? " touched " + hits[0].role : ""), "data-key": s.key, type: hits.length ? "button" : null,
      title: hits.length ? `${s.name}\nParts: ${hits.map(c => c.n).join(", ")}` : `${s.name}\nNot touched`,
      onclick: hits.length ? () => { const i = hits.findIndex(c => c.n === current); show(hits[(i + 1) % hits.length].n); } : null },
      el("span", { class: "dot", "aria-hidden": "true" }), el("span", { class: "nm", text: s.name }))));
  }
  $("#map").append(el("section", { class: "flow" }, el("h3", { text: flowName(f.id) }), ol));
}
const off = chapters.filter(c => !c.keys.length);
if (off.length) {
  const ol = el("ol", { class: "stops" });
  off.forEach(c => ol.append(el("li", {}, el("button", { type: "button", class: "stop touched " + c.role, "data-off": c.n, title: c.title, onclick: () => show(c.n) },
    el("span", { class: "dot", "aria-hidden": "true" }), el("span", { class: "nm", text: `${c.n} · ${c.title}` })))));
  $("#map").append(el("section", { class: "flow" }, el("h3", { text: "No flow runs this" }), ol));
}
if (quiet.length) $("#map").append(el("p", { class: "quiet-flows", text: `Untouched: ${quiet.join(", ")}` }));
if (DATA.folded.length) $("#folded").textContent = `Not shown: ${plural(DATA.folded.length, "generated or test file")} (${DATA.folded.map(p => p.split("/").pop()).join(", ")})`;

function pathEl(p) {
  const box = el("div", { class: "path" });
  p.forEach((n, i) => {
    if (i) box.append(el("i", { text: "›" }));
    box.append(el("span", { class: i === p.length - 1 ? "end" : "", title: n, text: i === 0 ? file(n) : sym(n) }));
  });
  return box;
}
const fold = (title, sub, ...body) => el("details", {}, el("summary", {}, title, sub ? el("small", { text: sub }) : null), el("div", {}, ...body));

// pane: one part at a time
let current = 0;
function show(n, focus = true) {
  const c = chapters[n - 1];
  current = n;
  document.querySelectorAll("#toc button").forEach(b => b.setAttribute("aria-current", String(+b.dataset.ch === n)));
  // the overview lights every touched stop in its own part's colour; a part lights only its own
  document.querySelectorAll("#map .stop").forEach(s => s.classList.toggle("lit", c ? c.keys.includes(s.dataset.key) || +s.dataset.off === n : s.classList.contains("touched")));
  $("#map").style.removeProperty("--sel");
  if (c) $("#map").style.setProperty("--sel", `var(--${{ core: "core", supporting: "support", refactor: "refactor" }[c.role] || "outside"})`);
  $("#rail-map").hidden = !c;
  const pane = $("#pane");
  pane.replaceChildren();
  if (!c) overview(pane);
  else part(pane, c);

  const nav = el("div", { class: "step-nav" });
  for (const [dir, label] of [[-1, "Previous"], [1, n ? "Next" : "Start"]]) {
    const o = n + dir === 0 ? { n: 0, title: "Overview" } : chapters[n - 1 + dir];
    if (o) nav.append(el("button", { type: "button", "data-dir": String(dir), onclick: () => show(o.n) }, el("small", { text: o.n ? `${label} · ${o.n} of ${chapters.length}` : label }), o.title));
  }
  pane.append(nav, el("p", { class: "keys", html: "<kbd>←</kbd> <kbd>→</kbd> or <kbd>j</kbd> <kbd>k</kbd> to move between parts" }));
  if (focus) { pane.focus({ preventScroll: true }); if (pane.getBoundingClientRect().top < 0) pane.scrollIntoView({ block: "start" }); }
}

function part(pane, c) {
  pane.className = "pane " + c.role;

  pane.append(el("div", {},
    el("div", { class: "ch-tags" }, el("span", { class: "num", text: `${c.n} of ${chapters.length}` }), el("span", { class: "tag", text: ROLE[c.role] || c.role }),
      c.kind && c.kind !== c.role ? el("span", { class: "kind", text: c.kind }) : null),
    el("h2", { html: md(c.title) })));
  if (c.claim) pane.append(el("p", { class: "claim", html: md(c.claim) }));
  pane.append(el("p", { class: "runs", html: c.keys.length
    ? "Runs in " + F.map.filter(f => c.keys.some(k => steps.get(k).flow === f.id)).map(f => {
        const mine = f.steps.filter(s => c.keys.includes(s.key));
        return `<b title="${esc(mine.map(s => s.name).join("\n"))}">${esc(flowName(f.id))}</b> (${mine.length === 1 ? esc(mine[0].name) : `${mine.length} of ${f.steps.length} steps`})`;
      }).join(" · ")
    : "No flow on the map runs this." }));

  if (c.before || c.after) pane.append(el("div", { class: "ba" },
    el("div", {}, el("p", { class: "label", text: "Before" }), el("p", { html: md(c.before || "—") })),
    el("div", { class: "after" }, el("p", { class: "label", text: "After" }), el("p", { html: md(c.after || "—") }))));
  if (c.why) pane.append(el("p", { class: "why", html: "<b>Why it matters.</b> " + md(c.why) }));
  if (!c.before && !c.after && !c.why) pane.append(el("p", { class: "note", text: "No story for this part: the facts below are all flowmap knows. Add it to the story file to say what changes and why." }));

  if (c.qs.length) {
    const ol = el("ol", { class: "qs" });
    for (const q of c.qs) {
      const kind = { ask: "Ask the author", check: "Check yourself", graph: "From the graph" }[q.kind] || q.kind;
      ol.append(el("li", { class: "q" },
        el("input", { type: "checkbox", id: q.id, checked: picked.has(q.id) ? "" : null,
          onchange: (e) => { e.target.checked ? picked.add(q.id) : picked.delete(q.id); renderNote(); } }),
        el("label", { for: q.id }, el("span", { class: "qtext", html: `<span class="qkind ${esc(q.kind)}">${esc(kind)}</span>` + md(q.q) }),
          q.why ? el("span", { class: "qwhy", html: md(q.why) }) : null)));
    }
    pane.append(el("section", { style: "display:grid;gap:10px" }, el("h3", { class: "label", text: "Questions, most decisive first" }), ol));
  }

  // evidence, on demand
  const more = el("div", { class: "more" });
  const witnesses = new Map();
  c.syms.forEach(s => Object.entries(s.witness).forEach(([k, p]) => { if (!witnesses.has(k) || witnesses.get(k).length > p.length) witnesses.set(k, p); }));
  if (witnesses.size) {
    const unproved = c.keys.filter(k => !witnesses.has(k));
    more.append(fold("How the flows reach this code", `${plural(witnesses.size, "call path")} from an entry point`,
      el("ul", { class: "paths" }, ...[...witnesses].map(([k, p]) => el("li", {}, el("p", { class: "note", text: `${steps.get(k).name} · ${steps.get(k).endpoints.join(", ")}` }), pathEl(p)))),
      unproved.length ? el("p", { class: "note", text: `Also on the map's own anchors for: ${unproved.map(k => steps.get(k).name).join("; ")} (no call path found).` }) : null));
  }
  const myEps = new Set(c.keys.flatMap(k => steps.get(k).endpoints));
  const moved = (table) => Object.entries(table).map(([s, eps]) => [s, eps.filter(e => myEps.has(e))]).filter(([, eps]) => eps.length);
  const ripple = [
    ...moved(F.reach.lost).map(([s, eps]) => ["rem", "no longer", `${file(s)} · ${sym(s)} from ${eps.join(", ")}`]),
    ...moved(F.reach.gained).map(([s, eps]) => ["add", "now reaches", `${file(s)} · ${sym(s)} from ${eps.join(", ")}`]),
    ...[...c.callers].sort((a, b) => a[1] - b[1]).map(([id, edited]) => [edited ? "yes" : "no", edited ? "caller, edited" : "caller, not edited", `${file(id)} · ${sym(id)}`]),
    ...c.added.map(([a, b]) => ["add", "+ call", `${sym(a)} → ${sym(b)}`]),
    ...c.removed.map(([a, b]) => ["rem", "− call", `${sym(a)} → ${sym(b)}`]),
  ];
  if (ripple.length) {
    const notEdited = [...c.callers.values()].filter(e => !e).length;
    more.append(fold("Ripple", [notEdited && `${notEdited} caller${notEdited === 1 ? "" : "s"} not edited`, (c.added.length || c.removed.length) && `+${c.added.length} −${c.removed.length} calls`].filter(Boolean).join(" · "),
      el("ul", { class: "rows" }, ...ripple.map(([k, m, t]) => el("li", {}, el("span", { class: "mark " + k, text: m }), el("span", { text: t }))))));
  }
  if (c.hunks.length) {
    const box = el("div", { style: "display:grid;gap:10px" });
    const hunkEls = c.hunks.map(h => {
      const pre = el("pre");
      h.lines.forEach(l => pre.append(el("span", { class: l[0] === "+" ? "a" : l[0] === "-" ? "r" : "", text: l })));
      const n = el("div", { class: "hunk" }, el("div", { class: "hh", text: `${h.file} @ ${h.new}${h.ctx ? " · " + h.ctx : ""}` }), pre);
      n._syms = h.symbols; n._file = h.file;
      return n;
    });
    // pick a symbol (or file) to see only its hunks
    const keysOf = [...new Set([...c.syms.map(s => s.id), ...c.hunks.filter(h => !h.symbols.length).map(h => h.file)])];
    const chips = el("div", { class: "chips" });
    const filter = (key) => {
      chips.querySelectorAll(".chip").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.k === key)));
      hunkEls.forEach(n => { n.hidden = key != null && !(n._syms.includes(key) || (!n._syms.length && n._file === key)); });
    };
    if (keysOf.length > 1) keysOf.forEach(k => {
      const s = symById.get(k);
      chips.append(el("button", { type: "button", class: "chip", "data-k": k, "aria-pressed": "false", title: k,
        onclick: (e) => filter(e.currentTarget.getAttribute("aria-pressed") === "true" ? null : k) },
        s ? (c.syms.filter(o => sym(o.id) === sym(k)).length > 1 ? `${file(k)} · ${sym(k)}` : sym(k)) : k.split("/").pop(), s && s.status !== "modified" ? el("i", { text: s.status }) : null));
    });
    box.append(chips, ...hunkEls);
    const files = [...new Set(c.hunks.map(h => h.file.split("/").pop()))];
    more.append(fold("Code", `${plural(c.hunks.length, "hunk")} in ${files.slice(0, 4).join(", ")}${files.length > 4 ? ` and ${files.length - 4} more` : ""}`, box));
  }
  if (more.children.length) pane.append(more);
}

function renderNote() {
  const lines = [];
  for (const c of chapters) {
    const qs = c.qs.filter(q => picked.has(q.id));
    if (!qs.length) continue;
    lines.push(`${c.n}. ${c.title}`);
    qs.forEach(q => lines.push(`   - ${q.q}`));
  }
  $("#note").value = lines.join("\n");
  $("#count").textContent = plural(picked.size, "question");
}

addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  const d = { ArrowRight: 1, j: 1, ArrowLeft: -1, k: -1 }[e.key];
  if (d && current + d >= 0 && current + d <= chapters.length) { e.preventDefault(); show(current + d); }
});
$("#peek").addEventListener("click", (e) => {
  const open = $("#note").hidden;
  $("#note").hidden = !open;
  e.target.setAttribute("aria-expanded", String(open));
  e.target.textContent = open ? "Hide" : "Show";
});
$("#copy").addEventListener("click", async () => {
  const t = $("#note");
  try { await navigator.clipboard.writeText(t.value); $("#status").textContent = "Copied"; }
  catch (e) { t.hidden = false; t.focus(); t.select(); $("#status").textContent = "Selected: press Ctrl+C or Cmd+C to copy"; }
});
renderNote();
show(0, false);
</script>
