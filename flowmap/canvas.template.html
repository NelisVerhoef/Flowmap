<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__CANVAS_NAME__ · flowmap canvas</title>
<!--fonts--><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..100,500..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"><!--/fonts-->
<style>
/* One canvas, read left to right: screens, the flows and their steps, the code they run (a card
   per file, placed by call depth), the data they write. A flow is a path on it; a change is paint
   on it. Positions follow the map's own order, so the picture stays put between builds. */
:root {
  --paper: #eef1f4; --surface: #ffffff; --ink: #17202b; --muted: #5b6676; --faint: #8a95a3;
  --rule: #d5dbe2; --wire: #aab4c0; --wire-hi: #2e5bff; --accent: #2e5bff; --accent-soft: rgba(46, 91, 255, .10);
  --chg: #c77700; --chg-soft: rgba(230, 150, 20, .16); --new: #1e8a4c; --new-soft: rgba(30, 138, 76, .13);
  --ev-good: #2f9e5b; --ev-mid: #d99a0b; --ev-bad: #c8423b;
  --k-screen: #7a4fd6; --k-code: #2e5bff; --k-data: #0f8a8a; --k-flow: #17202b;
  --display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f141a; --surface: #171e27; --ink: #e6ebf1; --muted: #9aa6b5; --faint: #6b7787; --rule: #2a3441;
    --wire: #3f4b5b; --wire-hi: #7c9cff; --accent: #7c9cff; --accent-soft: rgba(124, 156, 255, .14);
    --chg: #f0a83a; --chg-soft: rgba(240, 168, 58, .16); --new: #4cc27f; --new-soft: rgba(76, 194, 127, .14);
    --k-screen: #a98cf0; --k-code: #7c9cff; --k-data: #3cc2c2; --k-flow: #e6ebf1; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f141a; --surface: #171e27; --ink: #e6ebf1; --muted: #9aa6b5; --faint: #6b7787; --rule: #2a3441;
  --wire: #3f4b5b; --wire-hi: #7c9cff; --accent: #7c9cff; --accent-soft: rgba(124, 156, 255, .14);
  --chg: #f0a83a; --chg-soft: rgba(240, 168, 58, .16); --new: #4cc27f; --new-soft: rgba(76, 194, 127, .14);
  --k-screen: #a98cf0; --k-code: #7c9cff; --k-data: #3cc2c2; --k-flow: #e6ebf1; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--paper); color: var(--ink); font: 14px/1.45 var(--body); display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
button { font: inherit; color: inherit; }
.mono { font-family: var(--mono); }

/* header */
header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 12px 16px; border-bottom: 1px solid var(--rule); background: var(--surface); z-index: 5; }
h1 { font: 800 22px/1 var(--display); font-stretch: 75%; margin: 0; letter-spacing: .01em; }
.crumbs { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; min-width: 0; }
.crumbs a { color: inherit; cursor: pointer; text-decoration: none; }
.crumbs a:hover { color: var(--ink); text-decoration: underline; }
.crumbs b { color: var(--ink); font-weight: 600; }
.spacer { flex: 1; }
.ctl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
select, input[type="search"] { font: 13px var(--body); color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; padding: 6px 10px; }
input[type="search"] { width: 200px; }
.btn { border: 1px solid var(--rule); background: var(--surface); border-radius: 8px; padding: 6px 11px; cursor: pointer; font-size: 13px; }
.btn:hover { border-color: var(--muted); }
.btn.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }

/* stage */
main { display: grid; grid-template-columns: 1fr 360px; min-height: 0; }
#stage { position: relative; overflow: hidden; cursor: grab; touch-action: none; background-image: radial-gradient(var(--rule) 1px, transparent 1px); background-size: 22px 22px; }
#stage.panning { cursor: grabbing; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#wires { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.zoom { position: absolute; left: 14px; bottom: 14px; display: flex; gap: 4px; z-index: 3; }
.zoom .btn { width: 34px; padding: 6px 0; text-align: center; }
.colhead { position: absolute; font: 600 11px/1 var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); white-space: nowrap; }

/* wires */
.w { fill: none; stroke: var(--wire); stroke-width: 1.3; transition: opacity .15s, stroke .15s; }
.w.ui { stroke-dasharray: 4 4; }
.w.writes { stroke: var(--k-data); stroke-opacity: .55; stroke-dasharray: 2 3; }
.w.hi { stroke: var(--wire-hi); stroke-opacity: 1; stroke-width: 2.2; }
.w.writes.hi { stroke: var(--k-data); stroke-width: 2.2; }
.dim .w:not(.hi) { opacity: .18; }
.pulse { fill: var(--wire-hi); }

/* cards */
.card { position: absolute; background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; padding: 10px 12px; cursor: pointer; transition: opacity .15s, box-shadow .15s, border-color .15s; overflow: hidden; }
.card:hover { border-color: var(--muted); }
.card.sel { box-shadow: 0 0 0 2px var(--accent); border-color: var(--accent); }
.dim .card:not(.hi):not(.sel), .dim .flowbox:not(.hi) > .fbhead { opacity: .28; }
.kind { display: inline-flex; align-items: center; gap: 6px; font: 600 10.5px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.kind i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.title { font-weight: 600; font-size: 14px; line-height: 1.3; margin-top: 4px; display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; }
.sub { color: var(--muted); font-size: 12px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card.screen .kind i { background: var(--k-screen); }
.card.file .kind i { background: var(--k-code); }
.card.data { border-style: dashed; }
.card.off { border-style: dashed !important; }
.card.data .kind i { background: var(--k-data); border-radius: 50%; }
.card.file .title { font-family: var(--mono); font-size: 13.5px; -webkit-line-clamp: 1; }
.card.step { border-radius: 10px; padding: 8px 11px; }
.card.step .title { -webkit-line-clamp: 2; font-weight: 500; font-size: 13px; margin-top: 0; }
.card.step .foot { display: flex; gap: 6px; align-items: center; margin-top: 5px; color: var(--muted); font-size: 11.5px; min-width: 0; }
.ep { font: 500 11px/1.2 var(--mono); background: var(--paper); border-radius: 5px; padding: 2px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
.ev { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: none; }
.ev.confirmed, .ev.tested, .ev.agreed { background: var(--ev-good); }
.ev.contested { background: var(--ev-mid); }
.ev.single-source, .ev.single { background: var(--ev-bad); }
.card.flow { border-width: 1.5px; border-color: var(--k-flow); border-radius: 16px; }
.card.flow .title { font: 700 17px/1.15 var(--display); font-stretch: 85%; -webkit-line-clamp: 1; }
.card.flow .summary { color: var(--muted); font-size: 12px; margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tag { display: inline-block; font: 600 10.5px/1 var(--body); padding: 3px 6px; border-radius: 5px; background: var(--paper); color: var(--muted); letter-spacing: .02em; }
.flowbox { position: absolute; border: 1.5px solid var(--k-flow); border-radius: 18px; background: color-mix(in srgb, var(--surface) 55%, transparent); }
.fbhead { position: absolute; left: 14px; right: 10px; top: 10px; display: flex; align-items: center; gap: 8px; cursor: pointer; }
.fbhead .title { font: 700 17px/1.15 var(--display); font-stretch: 85%; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.icon-btn { border: 0; background: none; cursor: pointer; color: var(--muted); padding: 2px 6px; border-radius: 6px; font-size: 13px; }
.icon-btn:hover { background: var(--paper); color: var(--ink); }
.fnlist { margin-top: 4px; line-height: 1.35 !important; font: 11.5px/1.45 var(--mono); color: var(--muted); }
.fnlist span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.far .sub, .far .fnlist, .far .card.step .foot, .far .summary { visibility: hidden; }

/* change paint */
.card.p-changed { background: linear-gradient(var(--chg-soft), var(--chg-soft)), var(--surface); border-color: var(--chg); border-width: 2px; }
.card.p-new { background: linear-gradient(var(--new-soft), var(--new-soft)), var(--surface); border-color: var(--new); border-width: 2px; }
.card.p-direct { box-shadow: inset 4px 0 0 var(--chg); border-color: var(--chg); }
.card.p-reach { box-shadow: inset 4px 0 0 var(--chg); border-style: dashed; border-color: var(--chg); }
.card.p-newstep { box-shadow: inset 4px 0 0 var(--new); border-color: var(--new); }
.card.sel.p-direct, .card.sel.p-reach, .card.sel.p-newstep { box-shadow: 0 0 0 2px var(--accent); }
.badges { position: absolute; top: -9px; right: 10px; display: flex; gap: 4px; }
.badge { min-width: 20px; height: 20px; border-radius: 10px; background: var(--chg); color: #fff; font: 700 11px/20px var(--body); text-align: center; padding: 0 6px; box-shadow: 0 0 0 2px var(--paper); }
.badge.n { background: var(--ink); color: var(--surface); }
.card { overflow: visible; }
.card .clip { overflow: hidden; }
.pill { position: absolute; border: 1px dashed var(--muted); border-radius: 999px; padding: 6px 14px; background: var(--surface); font-size: 12.5px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill:hover { border-style: solid; }

/* flow bar */
#flowbar { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; padding: 10px 14px; display: none; gap: 12px; align-items: center; z-index: 4; box-shadow: 0 8px 24px rgba(0,0,0,.08); max-width: min(720px, calc(100% - 28px)); }
#flowbar.on { display: flex; }
#flowbar .fb-text { min-width: 0; }
#flowbar .fb-k { font-size: 11px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
#flowbar .fb-t { font-weight: 600; font-size: 13.5px; }

/* panel */
aside { border-left: 1px solid var(--rule); background: var(--surface); overflow: auto; padding: 18px 18px 40px; }
aside h2 { font: 800 21px/1.12 var(--display); font-stretch: 80%; margin: 4px 0 8px; }
aside h3 { font: 600 11px/1 var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 20px 0 8px; }
aside p { margin: 6px 0; }
aside .lead { color: var(--muted); }
aside ul { margin: 4px 0; padding-left: 18px; }
aside li { margin: 3px 0; }
.rowlink { display: flex; gap: 8px; align-items: baseline; padding: 6px 8px; margin: 0 -8px; border-radius: 8px; cursor: pointer; }
.rowlink:hover { background: var(--paper); }
.rowlink > span { min-width: 0; }
.rowlink .sub { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.rowlink .n { font: 700 11px/18px var(--body); min-width: 18px; height: 18px; border-radius: 9px; text-align: center; background: var(--paper); color: var(--muted); flex: none; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { font: 12px var(--mono); background: var(--paper); border-radius: 6px; padding: 2px 7px; cursor: pointer; }
.chip:hover { outline: 1px solid var(--muted); }
.kv { display: grid; grid-template-columns: 88px 1fr; gap: 4px 10px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.verdict { display: inline-block; font: 700 11px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; padding: 4px 7px; border-radius: 5px; color: #fff; }
.verdict.contained { background: var(--ev-good); }
.verdict.spreads { background: var(--chg); }
.verdict.blind { background: var(--ev-bad); }
.ba { display: grid; grid-template-columns: 1fr; gap: 6px; margin: 8px 0; }
.ba div { background: var(--paper); border-radius: 8px; padding: 8px 10px; font-size: 13px; }
.ba b { display: block; font: 600 10.5px/1.4 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.legend { display: grid; gap: 7px; font-size: 12.5px; }
.legend div { display: flex; gap: 9px; align-items: center; }
.sw { width: 22px; height: 14px; border-radius: 4px; border: 1px solid var(--rule); background: var(--surface); flex: none; }
.calltree { font: 12px/1.6 var(--mono); }
.calltree ul { list-style: none; padding-left: 14px; margin: 0; border-left: 1px solid var(--rule); }
.calltree > ul { border: 0; padding-left: 0; }
.struck { text-decoration: line-through; text-decoration-color: var(--ev-bad); color: var(--muted); }
.q { border-left: 3px solid var(--accent); padding: 2px 0 2px 10px; margin: 6px 0; font-size: 13px; }
a.ext { color: var(--accent); }
@media (max-width: 860px) {
  main { grid-template-columns: 1fr; grid-template-rows: 1fr 42%; }
  aside { border-left: 0; border-top: 1px solid var(--rule); }
  input[type="search"] { width: 140px; }
}
</style>

<header>
  <h1>__CANVAS_NAME__</h1>
  <nav class="crumbs" id="crumbs"></nav>
  <span class="spacer"></span>
  <div class="ctl">
    <select id="change" aria-label="Paint a change"></select>
    <button class="btn" id="expand" title="Show every step (E)">Expand all</button>
    <input type="search" id="find" placeholder="Find a step, file, endpoint…" aria-label="Find">
  </div>
</header>
<main>
  <div id="stage" tabindex="0" aria-label="Map canvas">
    <div id="world"><svg id="wires"></svg></div>
    <div id="flowbar"><button class="icon-btn" id="fb-prev" aria-label="Previous step">←</button><div class="fb-text"><div class="fb-k" id="fb-k"></div><div class="fb-t" id="fb-t"></div></div><button class="icon-btn" id="fb-next" aria-label="Next step">→</button><button class="icon-btn" id="fb-x" aria-label="Stop">✕</button></div>
    <div class="zoom"><button class="btn" id="z-in" aria-label="Zoom in">+</button><button class="btn" id="z-out" aria-label="Zoom out">−</button><button class="btn" id="z-fit" aria-label="Fit" title="Fit (F)">⤢</button></div>
  </div>
  <aside id="panel"></aside>
</main>

<script type="module">
// The data is embedded by `flowmap canvas`, or, in the hosted viewer, carried in the link's fragment
// (#v1.<base64url of raw-deflated JSON>), which browsers never send to the server. The view's state
// follows it in the fragment, so it survives a reload. Either way it goes nowhere else.
const EMBEDDED = /*__CANVAS_DATA__*/null;
const PAYLOAD = EMBEDDED ? null : /^#(v1\.[\w-]+)&?(.*)$/.exec(location.hash);
// another link pasted into this tab changes only the fragment, which does not reload the page
addEventListener("hashchange", () => { if (location.hash.startsWith("#v1.") && !EMBEDDED) location.reload(); });

async function load() {
  if (EMBEDDED) return EMBEDDED;
  let why = "Open a flowmap map from the link `flowmap canvas --link` prints. Its data stays in this tab.";
  if (PAYLOAD) {
    try {
      const b64 = PAYLOAD[1].slice(3).replace(/-/g, "+").replace(/_/g, "/");
      const bytes = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
      const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
      return JSON.parse(await new Response(stream).text());
    } catch (e) { why = "The link's data is cut off or damaged. Was the whole link copied?"; }
  }
  const p = document.createElement("p");
  p.style.padding = "24px";
  p.textContent = why;
  document.body.replaceChildren(p);
  return new Promise(() => {});  // nothing to draw
}

const G = await load();
document.title = `${G.name} · flowmap canvas`;
document.querySelector("h1").textContent = G.name;
const $ = s => document.querySelector(s);
function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (k === "style") n.style.cssText = v;
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) n.append(c.nodeType ? c : document.createTextNode(String(c)));
  return n;
}
// story prose marks code with backticks: show it as code
const md = s => String(s || "").split("`").map((part, i) => i % 2 ? el("code", { class: "mono", style: "font-size:.92em;background:var(--paper);padding:0 3px;border-radius:4px" }, part) : part);
const NS = "http://www.w3.org/2000/svg";
const svgEl = (tag, attrs) => { const n = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v); return n; };

const FLOWS = G.flows, STEPS = G.steps, FILES = G.files, DATA = G.data, SCREENS = G.screens, FNS = G.fns;
const flowOf = Object.fromEntries(FLOWS.map(f => [f.id, f]));
const ALL = { ...STEPS, ...FILES, ...DATA, ...SCREENS, ...flowOf };
const short = s => s.split(":").pop();
let OFF = {};

// ---------- state ----------
const total = Object.keys(STEPS).length;
const S = {
  view: "map",            // "map" | file id (inside a file)
  expanded: new Set(total <= 12 ? FLOWS.map(f => f.id) : []),
  sel: null,              // node id or "ch:<n>"
  change: G.changes.length ? 0 : -1,
  play: null,             // {flow, i}
};
const change = () => S.change >= 0 ? G.changes[S.change] : null;

// ---------- geometry ----------
const SIZE = { screen: [210, 66], flow: [300, 98], step: [276, 62], file: [236, 112], data: [200, 62] };
const GAP_X = 100, GAP_Y = 14, FB_HEAD = 46, FB_PAD = 12, STEP_GAP = 8, FLOW_GAP = 18;

function rep(id) {
  // what stands for a node in the current view: a step of a collapsed flow is its flow
  if (id.startsWith("s:")) { const f = STEPS[id].flow; return S.expanded.has(f) ? id : f; }
  return id;
}

function layoutMap() {
  const nodes = {}, boxes = [], heads = [];
  // the left spine: flows, expanded into their steps or folded into one card
  let y = 0;
  for (const f of FLOWS) {
    if (S.expanded.has(f.id)) {
      const h = FB_HEAD + f.steps.length * (SIZE.step[1] + STEP_GAP) - STEP_GAP + FB_PAD;
      boxes.push({ id: f.id, y, h });
      f.steps.forEach((sid, i) => nodes[sid] = { id: sid, kind: "step", y: y + FB_HEAD + i * (SIZE.step[1] + STEP_GAP), h: SIZE.step[1], w: SIZE.step[0] });
      y += h + FLOW_GAP;
    } else {
      nodes[f.id] = { id: f.id, kind: "flow", y, h: SIZE.flow[1], w: SIZE.flow[0] };
      y += SIZE.flow[1] + FLOW_GAP;
    }
  }
  // the wires between whatever is visible, merged
  const wires = {};
  for (const e of G.edges) {
    if (e.kind === "ui" && !S.expanded.has(STEPS[e.b].flow)) continue;  // screens show with their steps
    const a = rep(e.a), b = rep(e.b);
    if (a === b) continue;
    const k = a + "|" + b + "|" + e.kind;
    const w = wires[k] || (wires[k] = { a, b, kind: e.kind, steps: new Set(), w: 0, labels: new Set() });
    e.steps.forEach(s => w.steps.add(s)); w.w += e.w; (e.labels || []).forEach(l => w.labels.add(l));
  }
  const W = Object.values(wires);
  const cy = n => n.y + n.h / 2;
  const into = id => W.filter(w => w.b === id && nodes[w.a]);
  const outof = id => W.filter(w => w.a === id && nodes[w.b]);
  const place = (ids, kind, desired) => {
    const [w, h] = SIZE[kind];
    const want = ids.map(id => ({ id, d: desired(id) })).sort((p, q) => p.d - q.d || (p.id < q.id ? -1 : 1));
    let floor = -Infinity;
    const placed = want.map(({ id, d }) => { const top = Math.max(d - h / 2, floor); floor = top + h + GAP_Y; return { id, top }; });
    // pull the column back up so it sits around what it serves, not below it
    const drift = placed.reduce((s, p, i) => s + (p.top - (want[i].d - h / 2)), 0) / (placed.length || 1);
    const shift = Math.min(drift, placed.length ? placed[0].top - Math.min(...want.map(p => p.d - h / 2)) : 0);
    for (const p of placed) nodes[p.id] = { id: p.id, kind, y: p.top - Math.max(0, shift), h, w };
  };
  const bary = (id, side) => {
    const ws = side === "in" ? into(id) : outof(id);
    if (!ws.length) return null;
    let s = 0, n = 0;
    for (const w of ws) { const o = nodes[side === "in" ? w.a : w.b]; s += cy(o) * w.w; n += w.w; }
    return s / n;
  };
  // screens sit left of the steps they start
  const scr = Object.keys(SCREENS).filter(id => W.some(w => w.a === id));
  // files by call depth, each placed beside what calls it
  const depthMax = Math.max(0, ...Object.values(FILES).map(f => f.depth));
  const layers = [...Array(depthMax + 1)].map((_, d) => Object.values(FILES).filter(f => f.depth === d).map(f => f.id));
  for (const L of layers) place(L, "file", id => bary(id, "in") ?? 0);
  const dat = Object.keys(DATA);
  place(dat, "data", id => bary(id, "in") ?? 0);
  const offs = change() ? change().off_files.map(o => o.id) : [];
  if (offs.length) { OFF = Object.fromEntries(change().off_files.map(o => [o.id, o])); offs.forEach((id, i) => nodes[id] = { id, kind: "off", y: i * (SIZE.file[1] + GAP_Y), h: SIZE.file[1], w: SIZE.file[0] }); }
  if (scr.length) place(scr, "screen", id => bary(id, "out") ?? 0);
  // columns, left to right
  const cols = [];
  if (scr.length) cols.push({ name: "Screens", ids: scr, w: SIZE.screen[0] });
  cols.push({ name: "Flows and steps", ids: [...FLOWS.filter(f => !S.expanded.has(f.id)).map(f => f.id), ...Object.keys(STEPS).filter(s => nodes[s])], w: SIZE.flow[0], spine: true });
  layers.forEach((L, d) => cols.push({ name: d === 0 ? "Handlers" : d === 1 ? "Code they call" : "", ids: L, w: SIZE.file[0] }));
  if (dat.length) cols.push({ name: "Data written", ids: dat, w: SIZE.data[0] });
  if (offs.length) cols.push({ name: "Changed, not on the map", ids: offs, w: SIZE.file[0] });
  let x = 0;
  for (const c of cols) {
    for (const id of c.ids) { const n = nodes[id]; n.x = x + (c.spine && n.kind === "step" ? (SIZE.flow[0] - SIZE.step[0]) / 2 : 0); }
    if (c.spine) boxes.forEach(b => b.x = x);
    heads.push({ x, name: c.name });
    x += c.w + GAP_X;
  }
  const top = Math.min(0, ...Object.values(nodes).map(n => n.y));
  return { nodes, wires: W, boxes, heads, top };
}

function layoutInside(fid) {
  // one file opened up: callers on the left, its functions by call depth, what it calls on the right
  const F = FILES[fid], mine = new Set(F.fns);
  const calls = new Map();
  for (const s of Object.values(STEPS)) for (const [a, b] of s.calls) calls.set(a + ">" + b, [a, b]);
  const C = [...calls.values()];
  const inner = C.filter(([a, b]) => mine.has(a) && mine.has(b) && a !== b);
  const callers = {}, callees = {};
  for (const [a, b] of C) {
    if (!mine.has(a) && mine.has(b)) (callers[FNS[a].file] ||= new Set()).add(b);
    if (mine.has(a) && !mine.has(b)) (callees[FNS[b].file] ||= new Set()).add(a);
  }
  for (const s of Object.values(STEPS)) for (const r of s.roots) if (mine.has(r)) (callers[s.id] ||= new Set()).add(r);
  const writes = G.edges.filter(e => e.kind === "writes" && e.a === fid).map(e => e.b);
  for (const d of writes) (callees[d] ||= new Set());
  const entered = new Set(Object.values(callers).flatMap(s => [...s]));
  const depth = {};
  const q = F.fns.filter(n => entered.has(n) || !inner.some(([, b]) => b === n));
  q.forEach(n => depth[n] = 0);
  for (let i = 0; i < q.length; i++) for (const [a, b] of inner) if (a === q[i] && depth[b] == null) { depth[b] = depth[a] + 1; q.push(b); }
  F.fns.forEach(n => depth[n] ??= 0);
  const nodes = {}, W = [];
  const PW = 230, FW = 230, FH = 62;
  const colsN = Math.max(...Object.values(depth)) + 1;
  const left = Object.keys(callers), right = Object.keys(callees);
  left.forEach((id, i) => nodes["L:" + id] = { id: "L:" + id, ref: id, kind: "pill", x: 0, y: i * 54, w: PW, h: 36 });
  for (let d = 0; d < colsN; d++) {
    const ids = F.fns.filter(n => depth[n] === d);
    ids.forEach((n, i) => nodes["F:" + n] = { id: "F:" + n, ref: n, kind: "fn", x: PW + 110 + d * (FW + 90), y: i * (FH + 16), w: FW, h: FH });
  }
  const rx = PW + 110 + colsN * (FW + 90) + 20;
  right.forEach((id, i) => nodes["R:" + id] = { id: "R:" + id, ref: id, kind: "pill", x: rx, y: i * 54, w: PW, h: 36 });
  for (const [id, set] of Object.entries(callers)) for (const n of set) W.push({ a: "L:" + id, b: "F:" + n, kind: id.startsWith("s:") ? "entry" : "call", steps: new Set(id.startsWith("s:") ? [id] : []), w: 1 });
  for (const [a, b] of inner) W.push({ a: "F:" + a, b: "F:" + b, kind: "call", steps: new Set(), w: 1 });
  for (const [id, set] of Object.entries(callees)) {
    if (!set.size) W.push({ a: "F:" + F.fns[0], b: "R:" + id, kind: "writes", steps: new Set(), w: 1 });
    for (const n of set) W.push({ a: "F:" + n, b: "R:" + id, kind: id.startsWith("d:") ? "writes" : "call", steps: new Set(), w: 1 });
  }
  // centre the columns on each other
  const colH = xs => xs.length ? Math.max(...xs.map(n => n.y + n.h)) : 0;
  const groups = {};
  for (const n of Object.values(nodes)) (groups[n.x] ||= []).push(n);
  const tallest = Math.max(...Object.values(groups).map(colH));
  for (const g of Object.values(groups)) { const off = (tallest - colH(g)) / 2; g.forEach(n => n.y += off); }
  const heads = [{ x: 0, name: "Used by" }, { x: PW + 110, name: "Inside " + F.label }, { x: rx, name: "Uses" }];
  return { nodes, wires: W, boxes: [], heads, top: 0 };
}

function wirePath(a, b, ia, na, ib, nb) {
  const ya = a.y + a.h * (na > 1 ? 0.2 + 0.6 * ia / (na - 1) : 0.5);
  const yb = b.y + b.h * (nb > 1 ? 0.2 + 0.6 * ib / (nb - 1) : 0.5);
  const x1 = a.x + a.w, x2 = b.x;
  if (x2 > x1 + 10) { const dx = Math.max(36, (x2 - x1) * 0.5); return `M${x1} ${ya}C${x1 + dx} ${ya},${x2 - dx} ${yb},${x2} ${yb}`; }
  // backwards (a cycle, or a call into an earlier column): loop out and come back in
  const lift = Math.min(a.y, b.y) - 26;
  return `M${x1} ${ya}C${x1 + 70} ${ya},${x1 + 70} ${lift},${(x1 + x2) / 2} ${lift}S${x2 - 70} ${yb},${x2} ${yb}`;
}

function draw() {
  L = S.view === "map" ? layoutMap() : layoutInside(S.view);
  world.querySelectorAll(".card,.flowbox,.colhead,.pill").forEach(n => n.remove());
  wiresSvg.replaceChildren();
  const off = -L.top + 40;
  for (const n of Object.values(L.nodes)) n.y += off;
  for (const b of L.boxes) {
    const f = flowOf[b.id];
    const box = el("div", { class: "flowbox", "data-id": b.id, style: `left:${b.x}px;top:${b.y + off}px;width:${SIZE.flow[0]}px;height:${b.h}px` },
      el("div", { class: "fbhead", onclick: ev => { ev.stopPropagation(); select(b.id); } },
        el("span", { class: "title" }, f.title),
        el("button", { class: "icon-btn", title: "Play this flow", onclick: ev => { ev.stopPropagation(); play(b.id); } }, "▶"),
        el("button", { class: "icon-btn", title: "Fold", onclick: ev => { ev.stopPropagation(); toggleFlow(b.id, false); } }, "−")));
    world.append(box);
  }
  for (const h of L.heads) if (h.name) world.append(el("div", { class: "colhead", style: `left:${h.x}px;top:${off - 28}px` }, h.name));
  // ports: spread each card's wires along its side, ordered by where the other end is
  const outs = {}, ins = {};
  for (const w of L.wires) { (outs[w.a] ||= []).push(w); (ins[w.b] ||= []).push(w); }
  const cy = id => L.nodes[id].y + L.nodes[id].h / 2;
  Object.values(outs).forEach(ws => ws.sort((p, q) => cy(p.b) - cy(q.b)));
  Object.values(ins).forEach(ws => ws.sort((p, q) => cy(p.a) - cy(q.a)));
  for (const w of L.wires) {
    const a = L.nodes[w.a], b = L.nodes[w.b];
    if (!a || !b) continue;
    w.d = wirePath(a, b, outs[w.a].indexOf(w), outs[w.a].length, ins[w.b].indexOf(w), ins[w.b].length);
    w.el = svgEl("path", { d: w.d, class: "w " + w.kind, "stroke-width": (1.2 + Math.min(2.4, Math.log2(w.w) * 0.5)).toFixed(2) });
    if (w.labels && w.labels.size) { const t = svgEl("title", {}); t.textContent = [...w.labels].join("\n"); w.el.append(t); }
    wiresSvg.append(w.el);
  }
  for (const n of Object.values(L.nodes)) world.append(card(n));
  const maxX = Math.max(...Object.values(L.nodes).map(n => n.x + n.w)), maxY = Math.max(...Object.values(L.nodes).map(n => n.y + n.h));
  wiresSvg.setAttribute("width", maxX + 40); wiresSvg.setAttribute("height", maxY + 40);
  L.bounds = { w: maxX, h: maxY + 20 };
  crumbs(); highlight(); panel(); writeHash();
}

// ---------- selection and highlight ----------
function stepsOf(id) {
  if (!id) return null;
  if (id.startsWith("ch:")) { const ch = change().story.chapters[+id.slice(3) - 1]; return new Set([...ch.steps, ...ch.files.flatMap(f => FILES[f] ? FILES[f].steps : [])]); }
  if (STEPS[id]) return new Set([id]);
  if (flowOf[id]) return new Set(flowOf[id].steps);
  if (FILES[id]) return new Set(FILES[id].steps);
  if (DATA[id] || SCREENS[id]) return new Set(G.edges.filter(e => e.a === id || e.b === id).flatMap(e => e.steps));
  if (FNS[id]) return new Set(Object.values(STEPS).filter(s => s.fns.includes(id)).map(s => s.id));
  if (OFF[id]) return new Set();
  return null;
}
function highlight() {
  const H = stepsOf(S.sel);
  world.classList.toggle("dim", !!H);
  const lit = new Set();
  for (const w of L.wires) {
    const on = !!H && [...w.steps].some(s => H.has(s));
    w.el && w.el.classList.toggle("hi", on);
    if (on) { lit.add(w.a); lit.add(w.b); }
  }
  if (H) for (const s of H) { lit.add(rep(s)); lit.add(STEPS[s].flow); }
  if (S.sel && S.sel.startsWith("ch:")) change().story.chapters[+S.sel.slice(3) - 1].files.forEach(f => lit.add(f));
  world.querySelectorAll("[data-id]").forEach(n => {
    const id = n.dataset.id, ref = id.replace(/^[LRF]:/, "");
    n.classList.toggle("hi", lit.has(id) || lit.has(ref));
    n.classList.toggle("sel", id === S.sel || ref === S.sel);
  });
  wiresSvg.querySelectorAll(".pulse").forEach(n => n.remove());
  if (S.play && H) for (const w of L.wires) if (w.el && w.el.classList.contains("hi")) {
    const c = svgEl("circle", { r: 4.5, class: "pulse" });
    c.append(svgEl("animateMotion", { dur: "1.6s", repeatCount: "indefinite", path: w.d }));
    wiresSvg.append(c);
  }
}
function select(id) {
  S.sel = S.sel === id && !S.play ? null : id;
  if (S.play && !(STEPS[id] && STEPS[id].flow === S.play.flow)) stop();
  highlight(); panel(); writeHash();
}
function toggleFlow(fid, open) {
  open ? S.expanded.add(fid) : S.expanded.delete(fid);

}
function openInside(fid) { stop(); S.view = fid; S.sel = null; draw(); fit(); }
function back() { if (S.view !== "map") { const f = S.view; S.view = "map"; S.sel = f; draw(); fitTo([f]); } }

// ---------- playback ----------
function play(fid) {
  S.expanded.add(fid); S.play = { flow: fid, i: 0 }; S.view = "map"; draw(); stepTo(0); fit();
}
function stepTo(i) {
  const f = flowOf[S.play.flow]; i = Math.max(0, Math.min(f.steps.length - 1, i)); S.play.i = i;
  const sid = f.steps[i]; S.sel = sid;

  $("#fb-t").textContent = STEPS[sid].name;

function callTree(s) {
  const kids = {};
  for (const [a, b] of s.calls) (kids[a] ||= []).push(b);
  const seen = new Set();
  const node = id => { const f = FNS[id]; if (seen.has(id)) return el("li", {}, f.sym + " …"); seen.add(id);
    return el("li", {}, el("span", { title: id }, f.sym), el("span", { style: "color:var(--faint)" }, "  " + FILES[f.file].label), kids[id] ? el("ul", {}, kids[id].map(node)) : null); };
  return el("div", { class: "calltree" }, el("ul", {}, s.roots.map(node)));
}

function panel() {
  P.replaceChildren();
  const id = S.sel, c = change();
  if (!id && S.view !== "map") return filePanel(S.view, true);
  if (!id) {
    P.append(el("h2", {}, S.view === "map" ? G.name : FILES[S.view].label),
      el("p", { class: "lead" }, S.view === "map"
        ? `${FLOWS.length} flows, ${Object.keys(STEPS).length} steps, ${Object.keys(FILES).length} files of code, ${Object.keys(DATA).length} kinds of data.` + (G.commit ? ` Built at ${G.commit}.` : "")
        : "Its functions, laid out by who calls whom. Callers on the left, what it calls on the right."));
    if (c) P.append(...changeSummary(c));
    if (S.view === "map") {
      P.append(el("h3", {}, "Flows"));
      for (const f of FLOWS) P.append(el("div", { class: "rowlink", onclick: () => select(f.id) }, el("span", {}, el("b", {}, f.title), el("div", { class: "sub" }, f.steps.length + " steps · " + f.summary)),
        el("button", { class: "icon-btn", title: "Play", onclick: ev => { ev.stopPropagation(); play(f.id); } }, "▶")));
    }
    P.append(...legend());
    return;
  }
  if (id.startsWith("ch:")) {
    const ch = c.story.chapters[+id.slice(3) - 1];
    P.append(el("div", { class: "kind" }, `Part ${ch.n} of ${c.story.chapters.length} · ${ch.role}`), el("h2", {}, ch.title));
    if (ch.claim) P.append(el("p", { class: "lead" }, md(ch.claim)));
    P.append(el("div", { class: "ba" }, el("div", {}, el("b", {}, "Before"), md(ch.before)), el("div", {}, el("b", {}, "After"), md(ch.after))));
    if (ch.why) P.append(el("p", {}, el("b", {}, "Why it matters. "), md(ch.why)));
    if (ch.verified.length) P.append(el("p", { class: "sub", style: "white-space:normal" }, "Verified by: " + ch.verified.join(", ")));
    if (ch.files.length || ch.outside.length) P.append(el("h3", {}, "Where it sits"), el("div", { class: "chips" }, ch.files.map(f => chip(f, (FILES[f] || OFF[f] || { label: f }).label)), ch.outside.map(f => el("span", { class: "chip", style: "cursor:default" }, f))));
    if (ch.questions.length) P.append(el("h3", {}, "Questions"), ...ch.questions.map(q => el("div", { class: "q" }, md(q))));
    const n = c.story.chapters.length;
    P.append(el("p", {}, ch.n > 1 ? el("button", { class: "btn", onclick: () => select("ch:" + (ch.n - 1)) }, "← Part " + (ch.n - 1)) : null, " ", ch.n < n ? el("button", { class: "btn", onclick: () => select("ch:" + (ch.n + 1)) }, "Part " + (ch.n + 1) + " →") : null));
    return;
  }
  const back_ = el("p", {}, el("button", { class: "btn", onclick: () => { stop(); S.sel = null; highlight(); panel(); writeHash(); } }, "← Overview"));
  if (flowOf[id]) {
    const f = flowOf[id];
    P.append(back_, el("div", { class: "kind" }, "Flow"), el("h2", {}, f.title), el("p", { class: "lead" }, f.summary),
      el("p", {}, el("button", { class: "btn", onclick: () => play(id) }, "▶ Walk through it"), " ", el("button", { class: "btn", onclick: () => toggleFlow(id, !S.expanded.has(id)) }, S.expanded.has(id) ? "Fold steps" : "Show steps")));
    if (f.draft) P.append(el("p", { class: "sub", style: "white-space:normal" }, "Draft name: proposed by the mapping passes, not yet named in flowmap.toml."));
    P.append(el("h3", {}, "Steps"), ...f.steps.map((s, i) => el("div", { class: "rowlink", onclick: () => { if (!S.expanded.has(id)) { S.expanded.add(id); draw(); } select(s); } }, el("span", { class: "n" }, i + 1), el("span", {}, STEPS[s].name))));
    return;
  }
  if (STEPS[id]) {
    const s = STEPS[id], p = c && c.steps[id];
    P.append(back_, el("div", { class: "kind" }, flowOf[s.flow].title + " · step " + (flowOf[s.flow].steps.indexOf(id) + 1)), el("h2", {}, s.name));
    if (p) P.append(el("p", { style: "color:var(--chg)" }, p.kind === "new" ? "New in this change" : p.kind === "direct" ? "Runs changed code: " : "Reaches changed code further down: ", p.via.join(", ")));
    P.append(el("dl", { class: "kv" }, el("dt", {}, "Actor"), el("dd", {}, s.actor || "—"), el("dt", {}, "Evidence"), el("dd", {}, el("span", { class: "ev " + s.evidence }), " ", s.evidence),
      el("dt", {}, "Entry"), el("dd", { class: "mono" }, s.endpoints.join(", ") || "—"),
      s.ui.length ? [el("dt", {}, "Screen"), el("dd", {}, s.ui.map(u => u.split(":").pop()).join(", "))] : null,
      s.writes.length ? [el("dt", {}, "Writes"), el("dd", {}, s.writes.join(", "))] : null));
    if (s.roots.length) P.append(el("h3", {}, "What it runs"), callTree(s));
    if (s.also.length) P.append(el("p", { class: "sub", style: "white-space:normal" }, "Also calls (shared plumbing, not drawn): " + s.also.join(", ")));
    return;
  }
  if (FILES[id]) return filePanel(id, false);
  if (DATA[id] || SCREENS[id]) {
    const X = DATA[id] || SCREENS[id], ss = [...stepsOf(id)];
    P.append(back_, el("div", { class: "kind" }, DATA[id] ? "Data" : "Screen"), el("h2", {}, X.label), el("p", { class: "sub" }, X.path));
    if (DATA[id] && X.parts.length) P.append(el("p", {}, "Fields written: " + X.parts.join(", ")));
    P.append(el("h3", {}, DATA[id] ? "Written by" : "Starts"), ...ss.map(s => link(s, STEPS[s].name)));
    return;
  }
  if (OFF[id]) {
    const o = OFF[id];
    P.append(back_, el("div", { class: "kind" }, "Changed, not on the map"), el("h2", { class: "mono", style: "font-size:18px" }, o.label), el("p", { class: "sub" }, o.path),
      el("p", {}, "No step on the map runs this file, so the canvas can't say which flows it affects. Either it is new behaviour the map hasn't caught up with, or it is code no entry point reaches."),
      el("h3", {}, o.new ? "New" : "Changed"), el("div", { class: "chips" }, o.syms.map(s => el("span", { class: "chip", style: "cursor:default" }, s))));
    return;
  }
  if (FNS[id]) {
    const f = FNS[id];
    P.append(el("p", {}, el("button", { class: "btn", onclick: () => { S.sel = null; highlight(); panel(); } }, "← " + FILES[f.file].label)), el("div", { class: "kind" }, "Function"), el("h2", { class: "mono", style: "font-size:18px" }, f.sym + "()"));
    if (f.sig) P.append(el("p", { class: "mono sub" }, "(" + f.sig + ")"));
    if (f.doc) P.append(el("p", {}, f.doc));
    if (f.url) P.append(el("p", {}, el("a", { class: "ext", href: f.url, target: "_blank", rel: "noopener" }, "Read the code")));
    P.append(el("h3", {}, "Run by"), ...[...stepsOf(id)].map(s => link(s, STEPS[s].name)));
  }
}

function filePanel(id, inside) {
  const F = FILES[id], c = change(), p = c && c.files[id];
  const callers = G.edges.filter(e => e.kind === "call" && e.b === id).map(e => e.a);
  const calls = G.edges.filter(e => e.kind === "call" && e.a === id).map(e => e.b);
  const writes = G.edges.filter(e => e.kind === "writes" && e.a === id).map(e => e.b);
  const byFlow = {};
  F.steps.forEach(s => (byFlow[STEPS[s].flow] ||= []).push(s));
  P.append(inside ? el("p", {}, el("button", { class: "btn", onclick: back }, "← Map")) : el("p", {}, el("button", { class: "btn", onclick: () => { stop(); S.sel = null; highlight(); panel(); writeHash(); } }, "← Overview")),
    el("div", { class: "kind" }, "Code"), el("h2", { class: "mono", style: "font-size:18px" }, F.label), el("p", { class: "sub" }, F.path),
    inside ? el("p", { class: "lead" }, "Its functions by who calls whom: callers on the left, what it calls on the right. Click a function to see which steps run it.")
           : el("p", {}, el("button", { class: "btn", onclick: () => openInside(id) }, "Open it up →")));
  if (p) P.append(el("p", { style: "color:var(--chg)" }, (p.kind === "new" ? "New: " : "Changed: ") + p.syms.join(", ")));
  P.append(el("h3", {}, "Used by"), ...Object.entries(byFlow).map(([f, ss]) => el("div", {}, el("b", {}, flowOf[f].title), el("div", {}, ss.map(s => link(s, STEPS[s].name))))));
  if (callers.length) P.append(el("div", { class: "chips", style: "margin-top:6px" }, callers.map(f => chip(f, FILES[f].label))));
  P.append(el("h3", {}, "Inside"), el("div", { class: "calltree" }, el("ul", {}, F.fns.map(n => el("li", {}, FNS[n].url ? el("a", { class: "ext", href: FNS[n].url, target: "_blank", rel: "noopener" }, FNS[n].sym) : FNS[n].sym, FNS[n].doc ? el("div", { class: "sub", style: "font-family:var(--body);white-space:normal" }, FNS[n].doc) : null)))));
  if (calls.length || writes.length) P.append(el("h3", {}, "Uses"), el("div", { class: "chips" }, calls.map(f => chip(f, FILES[f].label)), writes.map(d => chip(d, DATA[d].label))));
  }

function crumbs() {
  const c = $("#crumbs"); c.replaceChildren();
  if (S.view === "map") c.append(el("b", {}, "Map"));
  else c.append(el("a", { onclick: back }, "Map"), " / ", el("b", { class: "mono" }, FILES[S.view].label));
}

// ---------- pan and zoom ----------
let T = { x: 40, y: 20, k: 1 };
const apply = () => { world.style.transform = `translate(${T.x}px,${T.y}px) scale(${T.k})`; world.classList.toggle("far", T.k < 0.55); };
function fitBox(x0, y0, x1, y1, maxK = 1.1) {
  const r = stage.getBoundingClientRect(), pad = 48;
  const k = Math.min(maxK, (r.width - pad * 2) / (x1 - x0 || 1), (r.height - pad * 2) / (y1 - y0 || 1));
  T = { k, x: (r.width - (x1 - x0) * k) / 2 - x0 * k, y: (r.height - (y1 - y0) * k) / 2 - y0 * k + 10 };
  apply();
}
function fit() {
  // whole picture when it reads; otherwise full width from the top, and scroll down
  const r = stage.getBoundingClientRect(), pad = 48;
  const kw = (r.width - pad * 2) / L.bounds.w, kh = (r.height - pad * 2) / L.bounds.h;
  if (Math.min(kw, kh) >= 0.42) return fitBox(0, 0, L.bounds.w, L.bounds.h, 1);
  const k = Math.min(1, Math.max(0.6, kw));
  T = { k, x: kw >= k ? (r.width - L.bounds.w * k) / 2 : pad / 2, y: 12 }; apply();
}
function fitTo(ids, neighbours = true) {
  const ns = ids.map(i => L.nodes[i] || L.boxes.find(b => b.id === i)).filter(Boolean);
  if (!ns.length) return;
  const lit = neighbours ? L.wires.filter(w => ids.includes(w.a) || ids.includes(w.b)).flatMap(w => [L.nodes[w.a], L.nodes[w.b]]) : [];
  const all = [...ns.map(n => ({ x: n.x ?? 0, y: n.y, w: n.w ?? SIZE.flow[0], h: n.h })), ...lit];
  fitBox(Math.min(...all.map(n => n.x)), Math.min(...all.map(n => n.y)) - 30, Math.max(...all.map(n => n.x + n.w)), Math.max(...all.map(n => n.y + n.h)), 1);
}
function centre(id) {
  const n = L.nodes[rep(id)] || L.nodes[id]; if (!n) return;
  const r = stage.getBoundingClientRect();
  T.x = r.width / 2 - (n.x + n.w / 2) * T.k; T.y = r.height / 2 - (n.y + n.h / 2) * T.k; apply();
}
stage.addEventListener("wheel", ev => {
  ev.preventDefault();
  const r = stage.getBoundingClientRect(), mx = ev.clientX - r.left, my = ev.clientY - r.top;
  const k = Math.max(0.15, Math.min(2.5, T.k * Math.exp(-ev.deltaY * (ev.ctrlKey ? 0.01 : 0.0018))));
  T.x = mx - (mx - T.x) * k / T.k; T.y = my - (my - T.y) * k / T.k; T.k = k; apply();
}, { passive: false });
let drag = null; const touches = new Map(); let pinch = null;
stage.addEventListener("pointerdown", ev => { touches.set(ev.pointerId, ev); if (touches.size === 2) { const [a, b] = [...touches.values()]; pinch = { d: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), k: T.k, x: T.x, y: T.y, mx: (a.clientX + b.clientX) / 2, my: (a.clientY + b.clientY) / 2 }; drag = null; } });
stage.addEventListener("pointermove", ev => { if (!touches.has(ev.pointerId)) return; touches.set(ev.pointerId, ev); if (!pinch || touches.size < 2) return;
  const [a, b] = [...touches.values()], r = stage.getBoundingClientRect(), d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
  const k = Math.max(0.15, Math.min(2.5, pinch.k * d / pinch.d)), mx = pinch.mx - r.left, my = pinch.my - r.top;
  T.k = k; T.x = mx - (mx - pinch.x) * k / pinch.k; T.y = my - (my - pinch.y) * k / pinch.k; apply(); });
["pointerup", "pointercancel"].forEach(t => stage.addEventListener(t, ev => { touches.delete(ev.pointerId); if (touches.size < 2) pinch = null; }));
stage.addEventListener("pointerdown", ev => { if (ev.target.closest(".card,.pill,.fbhead,.zoom,#flowbar")) return; drag = { x: ev.clientX, y: ev.clientY, tx: T.x, ty: T.y, moved: false }; stage.setPointerCapture(ev.pointerId); stage.classList.add("panning"); });
stage.addEventListener("pointermove", ev => { if (!drag || pinch) return; const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y; if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true; T.x = drag.tx + dx; T.y = drag.ty + dy; apply(); });
stage.addEventListener("pointerup", () => { if (drag && !drag.moved && S.sel && !S.play) { S.sel = null; highlight(); panel(); writeHash(); } drag = null; stage.classList.remove("panning"); });
$("#z-in").onclick = () => { T.k = Math.min(2.5, T.k * 1.25); apply(); };
$("#z-out").onclick = () => { T.k = Math.max(0.15, T.k / 1.25); apply(); };
$("#z-fit").onclick = fit;

// ---------- controls ----------
const chSel = $("#change");
chSel.append(el("option", { value: -1 }, "No change painted"), ...G.changes.map((c, i) => el("option", { value: i }, "Paint: " + (c.story && c.story.title ? c.title + " — " + c.story.title.slice(0, 48) + (c.story.title.length > 48 ? "…" : "") : c.title))));
if (!G.changes.length) chSel.style.display = "none";
chSel.onchange = () => { S.change = +chSel.value; S.sel = null; draw(); fitChange(); };
$("#expand").onclick = () => { const all = S.expanded.size === FLOWS.length; S.expanded = new Set(all ? [] : FLOWS.map(f => f.id)); draw(); fit(); };
const find = $("#find");
find.addEventListener("keydown", ev => {
  if (ev.key !== "Enter") return;
  const q = find.value.trim().toLowerCase(); if (!q) return;
  const hit = Object.values(STEPS).find(s => s.name.toLowerCase().includes(q) || s.endpoints.some(e => e.toLowerCase().includes(q)))
    || Object.values(FILES).find(f => f.path.toLowerCase().includes(q) || f.fns.some(n => FNS[n].sym.toLowerCase().includes(q)))
    || Object.values(DATA).find(d => d.label.toLowerCase().includes(q)) || FLOWS.find(f => f.title.toLowerCase().includes(q));
  if (!hit) { find.style.borderColor = "var(--ev-bad)"; return; }
  find.style.borderColor = "";
  if (S.view !== "map") S.view = "map";
  if (STEPS[hit.id]) S.expanded.add(STEPS[hit.id].flow);
  draw(); select(hit.id); centre(hit.id);
});
document.addEventListener("keydown", ev => {
  if (ev.target.matches("input,select")) return;
  if (S.play && ev.key === "ArrowRight") stepTo(S.play.i + 1);
  else if (S.play && ev.key === "ArrowLeft") stepTo(S.play.i - 1);
  else if (ev.key === "Escape") { if (S.play) { stop(); panel(); } else if (S.sel) { S.sel = null; highlight(); panel(); writeHash(); } else back(); }
  else if (ev.key === "Backspace") back();
  else if (ev.key === "f" || ev.key === "F") fit();
  else if (ev.key === "e" || ev.key === "E") $("#expand").click();
  else if (ev.key === "/") { ev.preventDefault(); find.focus(); }
});

// ---------- the view lives in the URL ----------
function writeHash() {
  const p = new URLSearchParams();
  if (S.view !== "map") p.set("in", S.view);
  if (S.sel) p.set("s", S.sel);
  if (S.change >= 0) p.set("c", S.change); else if (G.changes.length) p.set("c", -1);
  if (S.expanded.size && S.expanded.size < FLOWS.length) p.set("x", [...S.expanded].map(f => f.slice(5)).join(","));
  else if (S.expanded.size === FLOWS.length && total > 12) p.set("x", "all");
  history.replaceState(null, "", "#" + (PAYLOAD ? PAYLOAD[1] + "&" : "") + p.toString());
}
function readHash() {
  const p = new URLSearchParams(PAYLOAD ? PAYLOAD[2] : location.hash.slice(1));
  if (p.has("c")) S.change = Math.min(G.changes.length - 1, +p.get("c"));
  if (p.has("x")) S.expanded = new Set(p.get("x") === "all" ? FLOWS.map(f => f.id) : p.get("x").split(",").map(f => "flow:" + f).filter(f => flowOf[f]));
  if (p.has("in") && FILES[p.get("in")]) S.view = p.get("in");
  if (p.has("s")) S.sel = p.get("s");
}
readHash();
chSel.value = S.change;
draw();
const changeIds = () => { const c = change(); return c ? [...Object.keys(c.files), ...Object.keys(c.steps).map(rep), ...c.off_files.map(o => o.id)].filter(id => L.nodes[id]) : []; };
const fitChange = () => change() && Object.keys(change().files).length ? fitTo(changeIds(), false) : fit();
if (S.sel && L.nodes[rep(S.sel)]) fitTo([rep(S.sel)]); else fitChange();
window.addEventListener("resize", () => fit());
</script>
