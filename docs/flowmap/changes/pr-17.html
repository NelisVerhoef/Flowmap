/* Layout: overview first, one part at a time, evidence on demand. The left rail is the whole

  --muted: #5b6676;

  --accent: #2e5bff;
  --accent-soft: rgba(46, 91, 255, .12);
  --core: #2e5bff;
  --support: #0f7c86;
  --refactor: #6b7686;
  --outside: #b7791f;
  --gain: #1e8a4c;
  --loss: #c8423b;
  --code-bg: #f6f8fa;
  --display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f141a; --surface: #161d26; --ink: #e6ebf1; --muted: #93a0b0; --rule: #2a3441;
    --line: #4a5666; --accent: #7c9cff; --accent-soft: rgba(124, 156, 255, .16);
    --core: #7c9cff; --support: #3cc0cb; --refactor: #93a0b0; --outside: #f0b429;
    --gain: #3fbf78; --loss: #ef6b63; --code-bg: #10161d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {

  --core: #7c9cff; --support: #3cc0cb; --refactor: #93a0b0; --outside: #f0b429;
  --gain: #3fbf78; --loss: #ef6b63; --code-bg: #10161d; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 15px/1.55 var(--body); }
.wrap { padding: 24px 16px 96px; max-width: 1240px; margin: 0 auto; display: grid; gap: 22px; }

button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.label { font: 600 11px var(--body); text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin: 0; }
.core { --role: var(--core); } .supporting { --role: var(--support); } .refactor { --role: var(--refactor); }
.outside, .unassigned, .off-map { --role: var(--outside); }

/* header: which change; the overview pane says what it does */
header { display: grid; gap: 6px; max-width: 80ch; }
header h1 { font: 800 clamp(24px, 3.4vw, 34px)/1.08 var(--display); font-stretch: 74%; margin: 0; }
.range { color: var(--muted); font-size: 13px; }
.range a { color: inherit; }
.delta { font-size: 18px; line-height: 1.55; margin: 0; max-width: 68ch; }
/* the lens verdict: the first thing to know, its reasons one click away */
.verdict { justify-self: start; max-width: 80ch; font-size: 14px; }
.verdict summary { cursor: pointer; }
.verdict summary b { margin-right: 8px; }
.verdict b { font: 700 11px var(--body); text-transform: uppercase; letter-spacing: .08em; border-radius: 4px; padding: 2px 7px; color: var(--surface); }
.verdict.contained b { background: var(--gain); } .verdict.spreads b { background: var(--outside); } .verdict.blind b { background: var(--loss); }
.verdict ul { margin: 8px 0 0; padding-left: 20px; display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.lint { justify-self: start; max-width: 80ch; font-size: 13px; border: 1px solid var(--loss); border-radius: 8px; padding: 8px 12px; }
.lint ul { margin: 4px 0 0; padding-left: 18px; }
.was { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; font-size: 14px; }
.was s { text-decoration-color: var(--loss); text-decoration-thickness: 1px; }
.was small, .kept small { color: var(--muted); font-size: 12px; }
.kept { margin: 0; font-size: 14px; max-width: 72ch; }
.shape { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; font-size: 12.5px; }
.shape li { background: var(--surface); border: 1px solid var(--rule); border-radius: 999px; padding: 2px 10px; }
.shape b { font-variant-numeric: tabular-nums; }

/* rail + pane */
.body { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 22px; align-items: start; }
@media (max-width: 900px) { .body { grid-template-columns: minmax(0, 1fr); } }
.rail { display: grid; gap: 18px; position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow-y: auto; padding-bottom: 8px; }
@media (max-width: 900px) { .rail { position: static; max-height: none; } }
.rail section { display: grid; gap: 8px; }

/* the parts, as a table of contents */
.toc { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.toc button { width: 100%; text-align: left; background: none; border: 1px solid transparent; border-radius: 8px; padding: 8px 10px;
  display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 2px 10px; cursor: pointer; }

.toc .n { grid-row: span 2; font: 700 12px/20px var(--mono); text-align: center; border-radius: 6px; height: 20px; color: var(--surface); background: var(--role); }
.toc .t { font-weight: 500; font-size: 13.5px; line-height: 1.35; }
.toc .w { font-size: 12px; color: var(--muted); line-height: 1.3; }
.toc .ov .n { background: var(--ink); }
.toc .minor .t { font-weight: 400; color: var(--muted); }

/* the map: flows as lines, the selected part's stops lit, the others faint */
.flow { display: grid; gap: 2px; }
.flow h3 { font: 700 12.5px/1.2 var(--display); font-stretch: 80%; margin: 6px 0 2px; letter-spacing: .02em; }
.stops { list-style: none; margin: 0; padding: 0; position: relative; display: grid; }
.stops::before { content: ""; position: absolute; left: 7px; top: 10px; bottom: 10px; width: 2px; background: var(--line); }
.stop { position: relative; display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 8px; align-items: start; width: 100%;
  text-align: left; background: none; border: 0; border-radius: 6px; padding: 3px 4px 3px 0; font-size: 12.5px; line-height: 1.3; color: var(--muted); }
button.stop { cursor: pointer; }
button.stop:hover { background: var(--surface); }
.stop .dot { width: 12px; height: 12px; margin: 1px 2px; border-radius: 50%; background: var(--paper); border: 2px solid var(--line); position: relative; z-index: 1; }
.stop.touched { color: var(--ink); }
.stop.touched .dot { border-color: var(--role); }
.stop.lit { font-weight: 600; }
.stop.lit .dot { background: var(--sel, var(--role)); border-color: var(--sel, var(--role)); box-shadow: 0 0 0 3px var(--paper), 0 0 0 5px var(--sel, var(--role)); }
.stop .nm { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.stop.lit .nm { -webkit-line-clamp: unset; }
/* the overview's map: each touched flow as a line of stops, the parts that run each stop under it */
.lanes { display: grid; gap: 14px; }
.lane { display: grid; gap: 6px; }
.lane h3 { font: 700 13px/1.2 var(--display); font-stretch: 80%; margin: 0; letter-spacing: .02em; }
.lane ol { list-style: none; margin: 0; padding: 0; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(120px, 1fr); overflow-x: auto; }
.lane li { position: relative; display: grid; gap: 6px; align-content: start; padding: 0 8px 4px 0; font-size: 12px; line-height: 1.3; color: var(--muted); }
.lane li::before { content: ""; position: absolute; top: 6px; left: 0; right: 0; height: 2px; background: var(--line); }
.lane li:first-child::before { left: 6px; } .lane li:last-child::before { right: calc(100% - 8px); }
.lane .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--surface); border: 2px solid var(--line); position: relative; }
.lane li.touched { color: var(--ink); }
.lane li.touched .dot { background: var(--role); border-color: var(--role); }
.lane .refs { display: flex; flex-wrap: wrap; gap: 4px; }
.ref { font: 600 11px/1 var(--mono); border-radius: 999px; padding: 3px 7px; border: 1px solid var(--role); color: var(--role); background: var(--surface); cursor: pointer; }
.ref:hover { background: var(--accent-soft); }
.quiet-flows { font-size: 12px; color: var(--muted); margin: 4px 0 0; }
.folded { font-size: 12px; color: var(--muted); margin: 0; overflow-wrap: anywhere; }

/* the pane: one part */
.pane { background: var(--surface); border: 1px solid var(--rule); border-top: 4px solid var(--role); border-radius: 12px;
  padding: 22px 24px; display: grid; gap: 18px; min-width: 0; }
.ch-tags { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.num { font: 700 12px var(--mono); color: var(--surface); background: var(--role); border-radius: 6px; padding: 2px 8px; }
.tag { font: 600 11px var(--body); text-transform: uppercase; letter-spacing: .08em; color: var(--role); }
.kind { font-size: 12px; color: var(--muted); }
.pane h2 { font: 750 clamp(21px, 2.6vw, 28px)/1.15 var(--display); font-stretch: 80%; margin: 4px 0 0; }
.claim { margin: 0; font-size: 16px; color: var(--muted); max-width: 70ch; }
.pane:focus { outline: none; }
.runs { margin: 0; font-size: 13px; color: var(--muted); }
.runs b { color: var(--ink); font-weight: 500; }

.ba { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
@media (max-width: 720px) { .ba { grid-template-columns: minmax(0, 1fr); } }
.ba > div { background: var(--surface); padding: 12px 14px; display: grid; gap: 4px; align-content: start; }
.ba .after { background: var(--paper); }
.ba p { margin: 0; font-size: 14px; }
.tree { margin: 0; overflow-x: auto; background: var(--code-bg); border: 1px solid var(--rule); border-radius: 8px; font: 12px/1.6 var(--mono); padding: 8px 0; }
.tree span { display: block; padding: 0 12px; white-space: pre; min-width: max-content; }
.tree .add { color: var(--gain); } .tree .rem { color: var(--loss); } .tree .from, .tree i { color: var(--muted); font-style: normal; }
.verified { margin: 0; font-size: 13px; color: var(--muted); }
.verified .how { font: 600 10.5px var(--body); text-transform: uppercase; letter-spacing: .08em; color: var(--gain); }
.verified .how.no { color: var(--outside); }
.why { margin: 0; max-width: 72ch; padding-left: 12px; border-left: 3px solid var(--role); }
.note { font-size: 13px; color: var(--muted); margin: 0; }

.qs { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.q { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; align-items: start; }
.q input { margin-top: 4px; width: 16px; height: 16px; accent-color: var(--accent); }
.q label { display: grid; gap: 3px; cursor: pointer; }
.q .qtext { font-weight: 500; }
.q .qwhy { color: var(--muted); font-size: 13px; }
.qkind { font: 600 10.5px var(--body); text-transform: uppercase; letter-spacing: .08em; border-radius: 4px; padding: 1px 6px; margin-right: 6px; white-space: nowrap; }
.qkind.ask { background: var(--accent-soft); color: var(--accent); }
.qkind.check, .qkind.graph { background: var(--paper); color: var(--muted); border: 1px solid var(--rule); }
.qkind.graph { color: var(--support); }

.more { display: grid; gap: 0; border-top: 1px solid var(--rule); }
.more details { border-bottom: 1px solid var(--rule); }

.more summary small { color: var(--muted); font-weight: 400; font-size: 12.5px; }
.more details > div { padding: 2px 2px 14px; display: grid; gap: 10px; }
.rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 12.5px; }
.rows li { display: flex; gap: 8px; align-items: baseline; font-family: var(--mono); font-size: 11.5px; overflow-wrap: anywhere; }
.mark { font-family: var(--body); font-size: 11px; font-weight: 600; flex: none; width: 80px; }

.step-nav button:hover { border-color: var(--accent); }
.step-nav button[data-dir="1"] { text-align: right; margin-left: auto; }
.step-nav small { color: var(--muted); font-size: 11.5px; }
.keys { font-size: 12px; color: var(--muted); margin: 0; }
kbd { font: 11px var(--mono); border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--surface); }

.tray textarea { width: 100%; min-height: 140px; font: 13px/1.5 var(--mono); color: var(--ink); background: var(--paper);
  border: 1px solid var(--rule); border-radius: 8px; padding: 10px; resize: vertical; }
button.primary { font: 600 14px var(--body); background: var(--accent); color: var(--surface); border: 0; border-radius: 8px; padding: 7px 14px; cursor: pointer; }
button.ghost { background: none; border: 1px solid var(--rule); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
.status { font-size: 13px; color: var(--muted); }

/* viewer mode: no data in the page or the link, so ask for a file */
.drop { background: var(--surface); border: 2px dashed var(--rule); border-radius: 12px; padding: 32px 20px; display: grid; gap: 10px; justify-items: start; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop h1 { font: 800 28px/1.1 var(--display); font-stretch: 74%; margin: 0; }
.drop p { margin: 0; max-width: 68ch; color: var(--muted); }
.drop .err { color: var(--loss); }
</style>

astapi-template/map/canvas.html","old":0,"new":1,"ctx":"","lines":["+<!doctype html>","+<meta charset=\"utf-8\">","+<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">","+<title>Full Stack FastAPI Template \u00b7 flowmap canvas<\/title>","+<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">","+<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>","+<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..100,500..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap\">","+<style>","+/* One canvas, read left to right: screens, the flows and their steps, the code they run (a card","+   per file, placed by call depth), the data they write. A flow is a path on it; a change is paint","+   on it. Positions follow the map's own order, so the picture stays put between builds. */","+:root {","+  --paper: #eef1f4; --surface: #ffffff; --ink: #17202b; --muted: #5b6676; --faint: #8a95a3;","+  --rule: #d5dbe2; --wire: #aab4c0; --wire-hi: #2e5bff; --accent: #2e5bff; --accent-soft: rgba(46, 91, 255, .10);","+  --chg: #c77700; --chg-soft: rgba(230, 150, 20, .16); --new: #1e8a4c; --new-soft: rgba(30, 138, 76, .13);","+  --ev-good: #2f9e5b; --ev-mid: #d99a0b; --ev-bad: #c8423b;","+  --k-screen: #7a4fd6; --k-code: #2e5bff; --k-data: #0f8a8a; --k-flow: #17202b;","+  --display: \"Archivo\", \"Arial Narrow\", system-ui, sans-serif;","+  --body: \"IBM Plex Sans\", system-ui, -apple-system, \"Segoe UI\", sans-serif;","+  --mono: \"IBM Plex Mono\", ui-monospace, \"SFMono-Regular\", Menlo, monospace;","+}","+@media (prefers-color-scheme: dark) {","+  :root:not([data-theme=\"light\"]) {","+    --paper: #0f141a; --surface: #171e27; --ink: #e6ebf1; --muted: #9aa6b5; --faint: #6b7787; --rule: #2a3441;","+    --wire: #3f4b5b; --wire-hi: #7c9cff; --accent: #7c9cff; --accent-soft: rgba(124, 156, 255, .14);","+    --chg: #f0a83a; --chg-soft: rgba(240, 168, 58, .16); --new: #4c " : \"\") : c.title))));","+if (!G.changes.length) chSel.style.display = \"none\";","+chSel.onchange = () => { S.change = +chSel.value; S.sel = null; draw(); fitChange(); };","+$(\"#expand\").onclick = () => { const all = S.expanded.size === FLOWS.length; S.expanded = new Set(all ? [] : FLOWS.map(f => f.id)); draw(); fit(); };","+const find = $(\"#find\");","+find.addEventListener(\"keydown\", ev => {","+  if (ev.key !== \"Enter\") return;","+  const q = find.value.trim().toLowerCase(); if (!q) return;","+  const hit = Object.values(STEPS).find(s => s.name.toLowerCase().includes(q) || s.endpoints.some(e => e.toLowerCase().includes(q)))","+    || Object.values(FILES).find(f => f.path.toLowerCase().includes(q) || f.fns.some(n => FNS[n].sym.toLowerCase().includes(q)))","+    || Object.values(DATA).find(d => d.label.toLowerCase().includes(q)) || FLOWS.find(f => f.title.toLowerCase().includes(q));","+  if (!hit) { find.style.borderColor = \"var(--ev-bad)\"; return; }","+  find.style.borderColor = \"\";","+  if (S.view !== \"map\") S.view = \"map\";","+  if (STEPS[hit.id]) S.expanded.add(STEPS[hit.id].flow);","+  draw(); select(hit.id); centre(hit.id);","+});","+document.addEventListener(\"keydown\", ev => {","+  if (ev.target.matches(\"input,select\")) return;","+  if (S.play && ev.key === \"ArrowRight\") stepTo(S.play.i + 1);","+  else if (S.play && ev.key === \"ArrowLeft\") stepTo(S.play.i - 1);","+  else if (ev.key === \"Escape\") { if (S.play) { stop(); panel(); } else if (S.sel) { S.sel = null; highlight(); panel(); writeHash(); } else back(); }","+  else if (ev.key === \"Backspace\") back();","+  else if (ev.key === \"f\" || ev.key === \"F\") fit();","+  else if (ev.key === \"e\" || ev.key === \"E\") $(\"#expand\").click();","+  else if (ev.key === \"/\") { ev.preventDefault(); find.focus(); }","+});","+","+// ---------- the view lives in the URL ----------","+function writeHash() {","+  const p = new URLSearchParams();","+  if (S.view !== \"map\") p.set(\"in\", S.view);","+  if (S.sel) p.set(\"s\", S.sel);","+  if (S.change >= 0) p.set(\"c\", S.change); else if (G.changes.length) p.set(\"c\", -1);","+  if (S.expanded.size && S.expanded.size < FLOWS.length) p.set(\"x\", [...S.expanded].map(f => f.slice(5)).join(\",\"));","+  else if (S.expanded.size === FLOWS.length && total > 12) p.set(\"x\", \"all\");","+  history.replaceState(null, \"\", \"#\" + p.toString());","+}","+function readHash() {","+  const p = new URLSearchParams(location.hash.slice(1));","+  if (p.has(\"c\")) S.change = Math.min(G.changes.length - 1, +p.get(\"c\"));","+  if (p.has(\"x\")) S.expanded = new Set(p.get(\"x\") === \"all\" ? FLOWS.map(f => f.id) : p.get(\"x\").split(\",\").map(f => \"flow:\" + f).filter(f => flowOf[f]));","+  if (p.has(\"in\") && FILES[p.get(\"in\")]) S.view = p.get(\"in\");","+  if (p.has(\"s\")) S.sel = p.get(\"s\");","+}","+readHash();","+chSel.value = S.change;","+draw();","+const changeIds = () => { const c = change(); return c ? [...Object.keys(c.files), ...Object.keys(c.steps).map(rep), ...c.off_files.map(o => o.id)].filter(id => L.nodes[id]) : []; };","+const fitChange = () => change() && Object.keys(change().files).length ? fitTo(changeIds(), false) : fit();","+if (S.sel && L.nodes[rep(S.sel)]) fitTo([rep(S.sel)]); else fitChange();","+window.addEventListener(\"resize\", () => fit());","+<\/script>"],"symbols":[]},{"file":"bin/flowmap","old":10,"new":10,"ctx":"Run from inside the repo you're mapping (or set FLOWMAP_ROOT).","lines":["   flowmap diagrams                      Mermaid at system / flow / step zoom","   flowmap atlas [--pr base..head=label] the interactive map, optionally with PR overlays","+  flowmap canvas [--change name=b..h]   the map as one left-to-right picture; a change painted on it","   flowmap lens <base> [<head>] [--json] place a change on the map (verdict, flows, reach, blind spots)","   flowmap change <base> [<head>]        the change as chapters on the map: where, what, why, questions"],"symbols":[]},{"file":"bin/flowmap","old":52,"new":53,"ctx":"if py:","lines":["     os.environ[\"FLOWMAP_REEXEC\"] = \"1\"","     os.execv(py, [py, __file__, *sys.argv[1:]])","-COMMANDS = {\"inventory\", \"brief\", \"verify\", \"reconcile\", \"diagrams\", \"atlas\", \"lens\", \"change\", \"viewer\", \"callgraph\"}","+COMMANDS = {\"inventory\", \"brief\", \"verify\", \"reconcile\", \"diagrams\", \"atlas\", \"canvas\", \"lens\", \"change\", \"viewer\", \"callgraph\"}"," "," if len(sys.argv) < 2 or sys.argv[1] not in COMMANDS:"],"symbols":[]},{"file":"docs/flowmap/MAP.md","old":1,"new":1,"ctx":"","lines":[" # Flow map"," ","-_Generated by `tools/flowmap/reconcile.py` from runs bu-1, bu-2, td-1, td-2 at `b2f9699`. Do not hand-edit \u2014 pin decisions in `decisions.json` and re-run._","+_Generated by `tools/flowmap/reconcile.py` from runs bu-1, bu-2, td-1, td-2 at `9f7d221`. Do not hand-edit \u2014 pin decisions in `decisions.json` and re-run._"," "," Evidence: **confirmed** (you said so) > **tested** (agreed + a backend test hits every endpoint) > **agreed** (runs independently grouped it the same way) > **contested** > **single-source**. Busyness = consensus code hops / files."," ","-## new:discover-entry-points","+## build-the-map"," ","-_Maintainer scans the repo being mapped and gets the list of every entry point, the join key for all later passes._","+_Map a repo as flows -> steps -> code by agreement: list its entry points, hand briefs to independent passes, check their citations, and vote them into one map a human settles._"," "," | # | Step | Actor | Evidence | Busy | Endpoints |"," |---|---|---|---|---|---|","-| 1 | Maintainer lists every entry point the repo exposes into inventory.json | user | agreed | 11/4 | `CLI flowmap inventory` |","+| 1 | Maintainer lists every entry point the repo exposes into inventory.json | user | agreed | 9/4 | `CLI flowmap inventory` |","+| 2 | Maintainer checks that every entry point's handler is a call-graph node | user | agreed | 9/6 | `CLI flowmap callgraph` |","+| 3 | Maintainer writes one brief per independent mapping pass (bottom-up or top-down) | user | agreed | 5/2 | `CLI flowmap brief` |","+| 4 | Agent running a pass checks that every cited anchor exists and every entry point is placed | user | agreed | 5/1 | `CLI flowmap verify` |","+| 5 | Maintainer votes the passes into one map with evidence levels and a list of open questions | user | agreed | 9/1 | `CLI flowmap reconcile` |"," ","-## new:review-change-on-map","+## browse-the-map"," ","-_See the map: flows, their steps and the code each step runs, as Mermaid diagrams and an interactive atlas page._","+_See the settled map: Mermaid diagrams at system/flow/step zoom, the interactive atlas, and the left-to-right canvas of screens, steps, code and data._"," "," | # | Step | Actor | Evidence | Busy | Endpoints |"," |---|---|---|---|---|---|","-| 1 | Maintainer generates Mermaid diagrams at system, flow and step zoom | user | agreed | 12/2 | `CLI flowmap diagrams` |","-| 2 | Reviewer places a base..head diff on the map (steps touched, call-graph reach, off-map code) | user | agreed | 12/3 | `CLI flowmap lens` |","-| 3 | Developer asks which entry points and flows can reach a file:symbol | user | agreed | 8/1 | `CLI flowmap callgraph` |","-| 4 | Maintainer builds the interactive atlas page and browses flows, steps and components | user | agreed | 12/4 | `CLI flowmap atlas` |","+| 1 | Maintainer generates Mermaid diagrams of the map at system, flow and step zoom | user | agreed | 9/2 | `CLI flowmap diagrams` |","+| 2 | Maintainer builds the interactive atlas page and browses flows, steps, merges and code | user | agreed | 10/2 | `CLI flowmap atlas` |","+| 3 | Maintainer draws the map as one left-to-right canvas, or redraws it from an existing atlas page | user | agreed | 7/2 | `CLI flowmap canvas` |"," ","-## new:run-mapping-passes","+## review-a-change"," ","-_Turn a repo into a first flow map: list its entry points, brief independent mapping passes, check each pass, and vote them into one map._","+_Turn a PR into a change page: chapters anchored to the map saying where it sits, what it changes, why, and what to ask, backed by facts and linkable from the PR body._"," "," | # | Step | Actor | Evidence | Busy | Endpoints |"," |---|---|---|---|---|---|","-| 1 | Maintainer writes one brief per independent pass (run id + bottom-up/top-down method) | user | agreed | 5/2 | `CLI flowmap brief` |","-| 2 | Maintainer votes the passes into one map with evidence levels and a list of open questions | user | agreed | 10/1 | `CLI flowmap reconcile` |","-| 3 | Maintainer checks each pass's anchors exist and every entry point is placed | user | agreed | 6/2 | `CLI flowmap verify` |","+| 1 | Reviewer runs lens on base..head to get the verdict, touched steps, reach and blind spots | user | agreed | 13/2 | `CLI flowmap lens` |","+| 2 | Author pulls the change's deterministic facts as JSON to write the story from | user | agreed | 12/3 | `CLI flowmap change` |","+| 3 | Maintainer builds the empty hosted viewer page to deploy on a static host | admin | agreed | 3/2 | `CLI flowmap viewer` |"],"symbols":[]},{"file":"docs/flowmap/QUESTIONS.md","old":3,"new":3,"ctx":"","lines":[" Where independent runs disagreed. Each answer can be pinned in `decisions.json`."," ","-## Proposed flows (name them, then paste into flowmap.toml)","-","-Passes proposed these flows independently; ones covering the same entry points were merged. Rename, merge or drop them, then paste the block into `flowmap.toml`. From then on they are your fixed vocabulary.","-","-| proposed id | steps | entry points | seen by | summary |","-|---|---|---|---|---|","-| `new:discover-entry-points` | 1 | 1 | bu-1, bu-2, td-1, td-2 | Maintainer scans the repo being mapped and gets the list of every entry point, the join key for all later passes. |","-| `new:review-change-on-map` | 4 | 4 | bu-1, bu-2, td-1, td-2 | See the map: flows, their steps and the code each step runs, as Mermaid diagrams and an interactive atlas page. |","-| `new:run-mapping-passes` | 3 | 3 | bu-1, bu-2, td-1, td-2 | Turn a repo into a first flow map: list its entry points, brief independent mapping passes, check each pass, and vote them into one map. |","-","-```toml","-[[flows.vocabulary]]","-id = \"discover-entry-points\"","-scope = \"Maintainer scans the repo being mapped and gets the list of every entry point, the join key for all later passes.\"","-[[flows.vocabulary]]","-id = \"review-change-on-map\"","-scope = \"See the map: flows, their steps and the code each step runs, as Mermaid diagrams and an interactive atlas page.\"","-[[flows.vocabulary]]","-id = \"run-mapping-passes\"","-scope = \"Turn a repo into a first flow map: list its entry points, brief independent mapping passes, check each pass, and vote them into one map.\"","-```","-"," ## Split votes (placed by router-file affinity \u2014 please decide)"," "],"symbols":[]},{"file":"docs/flowmap/QUESTIONS.md","old":30,"new":8,"ctx":"scope = \"Turn a repo into a first flow map: list its entry points, brief indepen","lines":[" ## Endpoints the runs put in different flows"," ","-- `CLI flowmap inventory` (`flowmap/inventory.py:__main__`): bu-1\u2192new:run-mapping-passes, bu-2\u2192new:discover-entry-points, td-1\u2192new:discover-entry-points, td-2\u2192new:discover-entry-points","+- `CLI flowmap change` (`flowmap/change.py:__main__`): bu-1\u2192review-a-change, bu-2\u2192browse-the-map, td-1\u2192review-a-change, td-2\u2192review-a-change"," "," ## Endpoints at least one run could not place in any flow"],"symbols":[]},{"file":"docs/flowmap/QUESTIONS.md","old":37,"new":15,"ctx":"scope = \"Turn a repo into a first flow map: list its entry points, brief indepen","lines":[" ## Busiest steps (hops \u2265 8)"," ","-- new:discover-entry-points / **Maintainer lists every entry point the repo exposes into inventory.json** \u2014 11 hops over 4 files","-- new:review-change-on-map / **Maintainer generates Mermaid diagrams at system, flow and step zoom** \u2014 12 hops over 2 files","-- new:review-change-on-map / **Reviewer places a base..head diff on the map (steps touched, call-graph reach, off-map code)** \u2014 12 hops over 3 files","-- new:review-change-on-map / **Developer asks which entry points and flows can reach a file:symbol** \u2014 8 hops over 1 files","-- new:review-change-on-map / **Maintainer builds the interactive atlas page and browses flows, steps and components** \u2014 12 hops over 4 files","-- new:run-mapping-passes / **Maintainer votes the passes into one map with evidence levels and a list of open questions** \u2014 10 hops over 1 files","+- build-the-map / **Maintainer lists every entry point the repo exposes into inventory.json** \u2014 9 hops over 4 files","+- build-the-map / **Maintainer checks that every entry point's handler is a call-graph node** \u2014 9 hops over 6 files","+- build-the-map / **Maintainer votes the passes into one map with evidence levels and a list of open questions** \u2014 9 hops over 1 files","+- browse-the-map / **Maintainer generates Mermaid diagrams of the map at system, flow and step zoom** \u2014 9 hops over 2 files","+- browse-the-map / **Maintainer builds the interactive atlas page and browses flows, steps, merges and code** \u2014 10 hops over 2 files","+- review-a-change / **Reviewer runs lens on base..head to get the verdict, touched steps, reach and blind spots** \u2014 13 hops over 2 files","+- review-a-change / **Author pulls the change's deterministic facts as JSON to write the story from** \u2014 12 hops over 3 files"," "," ## Observations (\"fighting the system\"), by run"," "," ### bu-1 (bottom-up)","-- Two implementations of 'place a diff on the map': flowmap/atlas.py:overlay re-derives changed/new symbols and call-graph reach itself using lens helpers, instead of sharing logic with flowmap/lens.py:main. They already differ: overlay skips test files and '<module>' hits, lens.main counts '<module>' as a changed symbol and classifies steps by anchor match first.","-- flowmap/atlas.py:build calls flowmap/diagrams.py:Diagrams.system and throws away the Mermaid it returns, only to get self.matrix set as a side effect.","-- flowmap/atlas.py:split_votes scrapes split votes back out of the human-facing QUESTIONS.md written by flowmap/reconcile.py:write_questions_md (regex on '\u2192 placed'): a generated report doubles as a data interface, and the vote data is never written to map.json.","-- The call graph is rebuilt from scratch in four places: flowmap/callgraph.py:__main__, flowmap/diagrams.py:Diagrams.__init__, flowmap/lens.py:main and once per --pr in flowmap/atlas.py:overlay (plus Diagrams again in flowmap/atlas.py:build).","-- flowmap/adapters/cli.py:_files lists commands with git ls-files, so a new, untracked command script is invisible to inventory while every other tool reads the worktree; flowmap/config.py:detect_entries never auto-detects the cli adapter, so CLI repos depend on flowmap.toml.","-- flowmap/verify.py:anchor_ok checks each dotted part of 'Class.method' independently anywhere in the file, so a method cited under the wrong class still passes.","-- flowmap/reconcile.py:canonical_new_flows merges proposed flows transitively at Jaccard >= 0.3 via union-find, so a chain of partially overlapping proposals can collapse into one flow.","-- Docstrings and messages still name another repo's layout ('tools/flowmap/...', 'backend/app' in flowmap/callgraph.py and flowmap/reconcile.py:write_map_md), though the real path is flowmap/ under config.root().","+- Three separate implementations of 'which symbols did this diff change': flowmap/lens.py:analyse (filters docstring/format-only edits via flowmap/lens.py:cosmetic), flowmap/change.py:facts (no cosmetic filter, adds new/deleted/modified status and class folding) and flowmap/atlas.py:overlay (no cosmetic filter, its own new-vs-changed split). change.facts then calls lens.analyse anyway just for the verdict, and flowmap/canvas.py:main calls lens.analyse again after atlas.overlay already walked the same diff, so a docstring-only edit can be 'changed' on the change page and canvas paint yet not count toward the lens verdict.","+- The same bounded breadth-first 'code under a step' walk exists twice: flowmap/diagrams.py:Diagrams.step and flowmap/atlas.py:step_code (same MAX_NODES/MAX_DEPTH, same noise skip), differing only in output shape.","+- State round-tripped through prose: reconcile records tie-broken split votes only in QUESTIONS.md (flowmap/reconcile.py:write_questions_md), and flowmap/atlas.py:split_votes regex-scrapes them back out of that markdown; flowmap/canvas.py:from_page likewise regex-scrapes JSON out of a rendered atlas HTML page; bin/flowmap-pr-hook:hook regex-scrapes counts from lens's markdown instead of using its --json mode.","+- Building the static, data-free viewer (flowmap/viewer.py:main -> flowmap/change.py:viewer_html) imports change.py, which imports lens, atlas, diagrams, graphs and config at module level (lens compiles CODE from config.app_dirs(), atlas/diagrams read config.load()), so `flowmap viewer` needs a git repo and flowmap config even though the page it writes holds no repo data.","+- flowmap/diagrams.py:Diagrams.write hard-codes text from the app this tool was extracted from ('workflow engine = `executor.run_workflow`') and tells the reader to override plumbing 'in decisions.json', while plumbing is actually read from flowmap.toml [flows].plumbing via flowmap/config.py:load.","+- Reads with side effects: flowmap/lens.py:defs calls flowmap/graphs/codegraph.py:outline, which runs a full codegraph index into a temp dir and fills a module-level cache keyed by file text; flowmap/lens.py:endpoint_set records failures into the module-global INVENTORY_ERRORS that flowmap/lens.py:blind_spots later reads, so blind spots depend on what earlier calls in the same process happened to inventory.","+- `flowmap callgraph` is three commands behind one entry point (check, impact, dump), and only impact needs map.json (flowmap/callgraph.py:endpoint_flows), so the reach check used during setup works before a map exists but impact does not.","+- Every command is dispatched by bin/flowmap via runpy after flowmap's bin/flowmap:project_python may re-exec under the target repo's .venv; the inventory's handlers (`file:__main__`) hide that dispatcher, so it appears on no step's code path."," "," ### bu-2 (bottom-up)","-- flowmap/atlas.py:overlay re-implements PR change detection (changed_lines/symbols_at/endpoint_set from lens.py) with its own changed/new classification, parallel to flowmap/lens.py:main.","-- flowmap/atlas.py:build and flowmap/callgraph.py:__main__ import other command scripts as libraries (diagrams, lens), so 'commands' are also shared modules; flowmap/atlas.py:step_code duplicates flowmap/diagrams.py:Diagrams.step.","-- flowmap/callgraph.py:endpoint_flows and flowmap/diagrams.py:Diagrams.__init__ each independently load inventory.json and map.json to build the endpoint-to-handler lookup.","-- flowmap/verify.py:anchor_ok uses regex definition matching while flowmap/callgraph.py:Graph uses the AST, so what counts as a valid symbol can differ between verify and the call graph.","-- flowmap/reconcile.py:main is one very large function doing voting, step clustering, evidence and file writing in one body.","-- flowmap/inventory.py:endpoints is reused by lens.py via git revisions through a custom read callable; the 'inventory' command itself only writes the worktree view.","+- `CLI flowmap callgraph` (flowmap/callgraph.py:__main__) and `CLI flowmap change` (flowmap/change.py:main) are each one entry point that fronts several unrelated intents chosen by argv/flags (dump / check / impact / summary; --facts / --check / --link / render). The inventory cannot tell these apart, so I had to repeat the same endpoint in several steps.","+- `--link` still renders and writes the change HTML (flowmap/change.py:main) although its documented job is only to print a link; `--facts` and `--check` return before writing. Same command, three different write behaviours.","+- reconcile writes QUESTIONS.md as prose and atlas re-parses it with a regex to recover split votes (flowmap/reconcile.py:write_questions_md writes it; flowmap/atlas.py:split_votes parses it). State round-trips through Markdown.","+- flowmap/atlas.py:data calls Diagrams.system() only for its side effect of filling d.matrix (comment: `fills d.matrix`), so the atlas depends on the Mermaid diagram generator's internal state; flowmap/diagrams.py:Diagrams.system reads as a pure render but mutates the object.","+- flowmap/reconcile.py:main is one long function that votes flows, clusters steps, scores evidence, clusters endpoint-less steps, builds map.json and drives two renderers; by far the busiest single hop.","+- Several modules evaluate config at import time (flowmap/lens.py MAP/CODE regex, flowmap/diagrams.py ENGINE_ROOT/PLUMBING/APP_DIRS, flowmap/atlas.py OUT, flowmap/verify.py ROOT), and flowmap/viewer.py imports flowmap/change.py:viewer_html, which drags in lens, atlas, graphs and config just to read a template. Running the viewer builder needs a valid repo config.","+- flowmap/change.py:facts, flowmap/lens.py:analyse and flowmap/canvas.py:main all recompute overlapping facts (changed symbols, graph at base and head, endpoint sets); change.facts even calls lens.analyse for the verdict after recomputing most of it itself. lru_cache on lens.graph_at is what keeps this affordable.","+- Three overlapping notions of 'app code': config.graph_files/graph_roots ([code].graph), config.app_dirs (adapter roots plus other) feeding lens.CODE, and the adapter-specific file listings in flowmap/adapters/cli.py:_files. A file can be in one and not the others (bin/ is `other` only, so bin/flowmap-pr-hook is not an entry point and is not in the call graph).","+- Symbol-definition detection exists in multiple places with different rules: flowmap/verify.py:anchor_ok (regex), flowmap/lens.py:defs (builder.symbols or ts_symbols/rb_symbols regex outlines) and flowmap/graphs/python.py:symbols (AST). A citation verify accepts may not be a node the graph knows.","+- flowmap/diagrams.py still hard-codes an app-specific `workflow engine` notion (ENGINE_ROOT from [flows].engine, text mentioning `executor.run_workflow`) in an otherwise generic tool; this repo sets no engine, so that branch is dead here.","+- flowmap/callgraph.py:endpoint_flows reads docs/flowmap/map.json, so `callgraph impact` crashes before the first reconcile, while `callgraph check` and the plain/dump forms do not need it. The dependency on reconcile's output is invisible from the command list."," "," ### td-1 (top-down)","-- flowmap/bin/flowmap dispatches by runpy, so every command is a `__main__` block with business logic inline (flowmap/inventory.py:__main__, flowmap/diagrams.py:__main__) while others delegate to main(); inconsistent shape.","-- flowmap/lens.py:main is a ~200-line function mixing diff parsing, map matching, call-graph reach and markdown rendering.","-- flowmap/atlas.py:overlay duplicates the changed/new symbol computation from flowmap/lens.py:main instead of sharing it.","-- flowmap/reconcile.py:main is very large and writes map.json, MAP.md and QUESTIONS.md in one pass (write_map_md, write_questions_md).","-- flowmap/config.py:load is cached and also auto-detects entries (detect_entries), so a read of config can scan the filesystem with glob.","-- flowmap/brief.py:main reads flowmap/RUN_SPEC.md and drops the first lines by split, so the template header layout is load-bearing.","-- Commands lens, callgraph, diagrams and atlas require docs/flowmap/map.json (from reconcile) at import time (flowmap/lens.py MAP, flowmap/callgraph.py:endpoint_flows), so ordering between commands is implicit.","+- Changed-symbol detection is done three times with near-identical loops: flowmap/lens.py:analyse, flowmap/change.py:facts and flowmap/atlas.py:overlay each call changed_lines/symbols_at/defs and classify new vs modified separately, so lens, change and atlas --pr can disagree on what 'changed' means.","+- flowmap/atlas.py:split_votes reads generated Markdown (QUESTIONS.md) back with a regex to recover data that reconcile.py:main already had in memory; an edit to reconcile.py:write_questions_md silently breaks atlas.","+- flowmap/canvas.py:from_page scrapes `const DATA = {...};` out of a rendered atlas.html, coupling canvas to the atlas template's exact text.","+- The `CLI flowmap callgraph` entry point serves four unrelated jobs (summary, dump, check, impact) in one __main__ block (flowmap/callgraph.py:__main__); check is a setup step while impact is a review step, so one inventory endpoint has to appear in two flows.","+- Module-level side effects at import: flowmap/lens.py reads config and compiles CODE/MAP, flowmap/diagrams.py reads ENGINE_ROOT/PLUMBING/APP_DIRS, flowmap/atlas.py fixes OUT, flowmap/verify.py fixes ROOT. atlas, canvas and change all import these, so config is frozen at first import (config.load/root are also @cache).","+- flowmap/diagrams.py:Diagrams.system is called by flowmap/atlas.py:data purely for its side effect of filling d.matrix ('d.system()  # fills d.matrix'), a read that writes hidden state.","+- flowmap/reconcile.py:tested_endpoints has a special CLI heuristic that greps test text for the module's file name or 'import <module>', a much weaker notion of 'tested' than the path match used for HTTP endpoints.","+- bin/flowmap-pr-hook and bin/flowmap are shell/script entry points a person or Claude Code hook runs but they are not in inventory.json (the cli adapter only scans flowmap/*.py), so the PR hook flow described in README is invisible to the map."," "," ### td-2 (top-down)","-- Two implementations of 'which symbols did this diff change': flowmap/lens.py:main (keeps <module>, tracks new_symbols vs base) and flowmap/atlas.py:overlay (drops <module>, splits new/changed) each re-derive it from flowmap/lens.py:changed_lines + flowmap/lens.py:symbols_at, and each rebuilds a head-revision flowmap/callgraph.py:Graph.__init__ separately.","-- flowmap/atlas.py:split_votes reads split votes back out of the human-facing QUESTIONS.md with a regex instead of from map.json; the data written by flowmap/reconcile.py:write_questions_md becomes an implicit machine format.","-- flowmap/atlas.py:overlay calls flowmap/lens.py:endpoint_set(head) twice, each re-running the whole inventory over git show.","-- Stale/mismatched prose baked into outputs: flowmap/diagrams.py:Diagrams.write always prints '**workflow engine** = `executor.run_workflow`' and says plumbing is overridden in decisions.json, while plumbing actually comes from flowmap.toml via flowmap/config.py:load; flowmap/reconcile.py:write_map_md cites 'tools/flowmap/reconcile.py'; callgraph's docstring still says 'backend/app'.","-- flowmap/callgraph.py:Graph.reaches has no callers in the repo (dead code).","-- Importing flowmap/atlas.py pulls in flowmap/lens.py, whose module-level code compiles regexes from flowmap/config.py:app_dirs, so even a plain atlas build depends on lens's config side effects.","-- flowmap/verify.py:anchor_ok treats any line matching `^\\s*name\\s*[:=(]` as a definition, so a local assignment or a call at line start satisfies a citation; verification is looser than 'defined in that file'.","-- Nothing writes flowmap.toml or decisions.json; the human decision step between two reconcile runs is entirely off-CLI, and flowmap/callgraph.py:endpoint_flows and flowmap/diagrams.py:Diagrams.__init__ fail outright if map.json does not yet exist.","+- Three separate derivations of 'which symbols changed': flowmap/lens.py:analyse (drops docstring/format-only edits via flowmap/lens.py:cosmetic), flowmap/change.py:facts (no cosmetic filter, adds new/deleted/modified status) and flowmap/atlas.py:overlay (no cosmetic filter, new vs changed by base defs). A change page can list a symbol whose edit the verdict on the same page ignored.","+- flowmap/change.py:facts calls flowmap/lens.py:analyse in full just to read verdict/blind/spreads_to, after already recomputing changed lines, graphs and endpoint sets itself; flowmap/canvas.py:main does the same per --change on top of flowmap/atlas.py:overlay. `flowmap change` is busier than its intent ('render a page') because it is lens plus a second lens.","+- flowmap/atlas.py:data builds the call graph from the working tree (flowmap/diagrams.py:Diagrams.__init__ -> flowmap/callgraph.py:Graph.__init__) while flowmap/atlas.py:overlay uses flowmap/lens.py:graph_at(head) from git; one atlas page can mix two graphs when the worktree differs from head.","+- flowmap/atlas.py:split_votes reads the reconciler's split votes back by regex-parsing the generated QUESTIONS.md prose instead of structured data from flowmap/reconcile.py:main: a markdown wording change in flowmap/reconcile.py:write_questions_md silently empties the atlas's split badges.","+- flowmap/change.py imports flowmap/atlas.py:step_keys, which pulls in flowmap/diagrams.py (module-level config reads, Diagrams) just for a tiny key helper: the change command depends on the atlas/diagram stack.","+- flowmap/lens.py:endpoint_set records failures into the module-global INVENTORY_ERRORS that flowmap/lens.py:blind_spots later reads; since flowmap/change.py:facts calls endpoint_set itself and then lens.analyse, state from one call leaks into the next analysis in the same process.","+- flowmap/diagrams.py:Diagrams.write hardcodes '`executor.run_workflow`' in the generated README text regardless of the configured [flows].engine, and generated docs still say 'tools/flowmap/...'; leftovers from the app the tool was first built in.","+- Two lists of commands must stay in sync: bin/flowmap's COMMANDS set dispatches via runpy, while the inventory derives commands from every flowmap/*.py with a __main__ block (flowmap/adapters/cli.py:entries); bin/flowmap-pr-hook, the only automatic caller, is not an entry point at all.","+- flowmap/change.py:main writes the HTML page before refusing --link on story lint problems, so a 'refused' run still overwrites docs/flowmap/changes/<name>.html."],"symbols":[]},{"file":"docs/flowmap/atlas.html","old":199,"new":199,"ctx":"button.chip:hover { border-color: var(--accent); }","lines":[" "," <script>","-const DATA = {\"flows\":[{\"id\":\"new:discover-entry-points\",\"summary\":\"Maintainer scans the repo being mapped and gets the list of every entry point, the join key for all later passes.\",\"steps\":[{\"key\":\"new:discover-entry-points/list-entry-points\",\"name\":\"Maintainer lists every entry point the repo exposes into inventory.json\",\"actor\":\"user\",\"evidence\":\"agreed\",\"busy\":{\"hops\":11,\"files\":4},\"endpoints\":[\"CLI flowmap inventory\"],\"writes\":[\"docs/flowmap/inventory.json\"],\"ui\":[],\"runs\":[\"bu-1\",\"bu-2\",\"td-1\",\"td-2\"],\"split\":{},\"components\":[],\"code\":{\"nodes\":[{\"id\":\"flowmap/inventory.py:__main__\",\"file\":\"inventory.py\",\"sym\":\"__main__\",\"depth\":0,\"root\":true}],\"edges\":[],\"hidden\":0,\"also\":[\"endpoints\",\"out\",\"root\"]}}]},{\"id\":\"new:review-change-on-map\",\"summary\":\"See the map: flows, their steps and the code each step runs, as Mermaid diagrams and an interactive atlas page.\",\"steps\":[{\"key\":\"new:review-change-on-map/generate-diagrams\",\"name\":\"Maintainer generates Mermaid diagrams at system, flow and step zoom\",\"actor\":\"user\",\"evidence\":\"agreed\",\"busy\":{\"hops\":12,\"files\":2},\"endpoints\":[\"CLI flowmap diagrams\"],\"writes\":[\"docs/flowmap/diagrams/<flow>.md\",\"docs/flowmap/diagrams/README.md\"],\"ui\":[\"flowmap/diagrams.py:Diagrams.write\"],\"runs\":[\"bu-1\",\"bu-2\",\"td-1\",\"td-2\"],\"split\":{},\"components\":[],\"code\":{\"nodes\":[{\"id\":\"flowmap/diagrams.py:__main__\",\"file\":\"diagrams.py\",\"sym\":\"__main__\",\"depth\":0,\"root\":true},{\"id\":\"flowmap/diagrams.py:Diagrams.write\" EXT = {","   confirmed: \"You pinned this in decisions.json.\","],"symbols":[]},{"file":"docs/flowmap/canvas.html","old":0,"new":1,"ctx":"","lines":["+<!doctype html>","+<meta charset=\"utf-8\">","+<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">","+<title>flowmap \u00b7 flowmap canvas<\/title>","+<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">","+<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>","+<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..100,500..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap\">","+<style>","+/* One canvas, read left to right: screens, the flows and their steps, the code they run (a card","+   per file, placed by call depth), the data they write. A flow is a path on it; a change is paint","+   on it. Positions follow the map's own order, so the picture stays put between builds. */","+:root {","+  --paper: #eef1f4; --surface: #ffffff; --ink: #17202b; --muted: #5b6676; --faint: #8a95a3;","+  --rule: #d5dbe2; --wire: #aab4c0; --wire-hi: #2e5bff; --accent: #2e5bff; --accent-soft: rgba(46, 91, 255, .10);","+  --chg: #c77700; --chg-soft: rgba(230, 150, 20, .16); --new: #1e8a4c; --new-soft: rgba(30, 138, 76, .13);","+  --ev-good: #2f9e5b; --ev-mid: #d99a0b; --ev-bad: #c8423b;","+  --k-screen: #7a4fd6; --k-code: #2e5bff; --k-data: #0f8a8a; --k-flow: #17202b;","+  --display: \"Archivo\", \"Arial Narrow\", system-ui, sans-serif;","+  --body: \"IBM Plex Sans\", system-ui, -apple-system, \"Segoe UI\", sans-serif;","+  --mono: \"IBM Plex Mono\", ui-monospace, \"SFMono-Regular\", Menlo, monospace;","+}","+@media (prefers-color-scheme: dark) {","+  :root:not([data-theme=\"light\"]) {","+    --paper: #0f141a; --surface: #171e27; --ink: #e6ebf1; --muted: #9aa6b5; --faint: #6b7787; --rule: #2a3441;","+    --wire: #3f4b5b; --wire-hi: #7c9cff; --accent: #7c9cff; --accent-soft: rgba(124, 156, 255, .14);","+    --chg: #f0a83a; --chg-soft: rgba(240, 168, 58, .16); --new: #4cc27f; --new-soft: rgba(76, 194, 127, .14);","+    --k-screen: #a98cf0; --k-code: #7c9cff; --k-data: #3cc2c2; --k-flow: #e6ebf1; color-scheme: dark;","+  }","+}","+:root[data-theme=\"dark\"] {","+  --paper: #0f141a; --surface: #171e27; --ink: #e6ebf1; --muted: #9aa6b5; --faint: #6b7787; --rule: #2a3441;","+  --wire: #3f4b5b; --wire-hi: #7c9cff; --accent: #7c9cff; --accent-soft: rgba(124, 156, 255, .14);","+  --chg: #f0a83a; --chg-soft: rgba(240, 168, 58, .16); --new: #4cc27f; --new-soft: rgba(76, 194, 127, .14);","+  --k-screen: #a98cf0; --k-code: #7c9cff; --k-data: #3cc2c2; --k-flow: #e6ebf1; color-scheme: dark;","+}","+* { box-sizing: border-box; }","+html, body { height: 100%; margin: 0; }","+body { background: var(--paper); color: var(--ink); font: 14px/1.45 var(--body); display: grid; grid-template-rows: auto 1fr; overflow: hidden; }","+button { font: inherit; color: inherit; }","+.mono { font-family: var(--mono); }","+","+/* header */","+header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 12px 16px; border-bottom: 1px solid var(--rule); background: var(--surface); z-index: 5; }","+h1 { font: 800 22px/1 var(--display); font-stretch: 75%; margin: 0; letter-spacing: .01em; }","+.crumbs { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; min-width: 0; }","+.crumbs a { color: inherit; cursor: pointer; text-decoration: none; }","+.crumbs a:hover { color: var(--ink); text-decoration: underline; }","+.crumbs b { color: var(--ink); font-weight: 600; }","+.spacer { flex: 1; }","+.ctl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }","+select, input[type=\"search\"] { font: 13px var(--body); color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; padding: 6px 10px; }","+input[type=\"search\"] { width: 200px; }","+.btn { border: 1px solid var(--rule); background: var(--surface); border-radius: 8px; padding: 6px 11px; cursor: pointer; font-size: 13px; }","+.btn:hover { border-color: var(--muted); }","+.btn.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }","+","+/* stage */","+main { display: grid; grid-template-columns: 1fr 360px; min-height: 0; }","+#stage { position: relative; overflow: hidden; cursor: grab; touch-action: none; background-image: radial-gradient(var(--rule) 1px, transparent 1px); background-size: 22px 22px; }","+#stage.panning { cursor: grabbing; }","+#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }","+#wires { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }","+.zoom { position: absolute; left: 14px; bottom: 14px; display: flex; gap: 4px; z-index: 3; }","+.zoom .btn { width: 34px; padding: 6px 0; text-align: center; }","+.colhead { position: absolute; font: 600 11px/1 var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); white-space: nowrap; }","+","+/* wires */","+.w { fill: none; stroke: var(--wire); stroke-width: 1.3; transition: opacity .15s, stroke .15s; }","+.w.ui { stroke-dasharray: 4 4; }","+.w.writes { stroke: var(--k-data); stroke-opacity: .55; stroke-dasharray: 2 3; }","+.w.hi { stroke: var(--wire-hi); stroke-opacity: 1; stroke-width: 2.2; }","+.w.writes.hi { stroke: var(--k-data); stroke-width: 2.2; }","+.dim .w:not(.hi) { opacity: .18; }","+.pulse { fill: var(--wire-hi); }","+","+/* cards */","+.card { position: absolute; background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; padding: 10px 12px; cursor: pointer; transition: opacity .15s, box-shadow .15s, border-color .15s; overflow: hidden; }","+.card:hover { border-color: var(--muted); }","+.card.sel { box-shadow: 0 0 0 2px var(--accent); border-color: var(--accent); }","+.dim .card:not(.hi):not(.sel), .dim .flowbox:not(.hi) > .fbhead { opacity: .28; }","+.kind { display: inline-flex; align-items: center; gap: 6px; font: 600 10.5px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }","+.kind i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }","+.title { font-weight: 600; font-size: 14px; line-height: 1.3; margin-top: 4px; display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; }","+.sub { color: var(--muted); font-size: 12px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }","+.card.screen .kind i { background: var(--k-screen); }","+.card.file .kind i { background: var(--k-code); }","+.card.data { border-style: dashed; }","+.card.off { border-style: dashed !important; }","+.card.data .kind i { background: var(--k-data); border-radius: 50%; }","+.card.file .title { font-family: var(--mono); font-size: 13.5px; -webkit-line-clamp: 1; }","+.card.step { border-radius: 10px; padding: 8px 11px; }","+.card.step .title { -webkit-line-clamp: 2; font-weight: 500; font-size: 13px; margin-top: 0; }","+.card.step .foot { display: flex; gap: 6px; align-items: center; margin-top: 5px; color: var(--muted); font-size: 11.5px; min-width: 0; }","+.ep { font: 500 11px/1.2 var(--mono); background: var(--paper); border-radius: 5px; padding: 2px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }","+.ev { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: none; }","+.ev.confirmed, .ev.tested, .ev.agreed { background: var(--ev-good); }","+.ev.contested { background: var(--ev-mid); }","+.ev.single-source, .ev.single { background: var(--ev-bad); }","+.card.flow { border-width: 1.5px; border-color: var(--k-flow); border-radius: 16px; }","+.card.flow .title { font: 700 17px/1.15 var(--display); font-stretch: 85%; -webkit-line-clamp: 1; }","+.card.flow .summary { color: var(--muted); font-size: 12px; margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }","+.tag { display: inline-block; font: 600 10.5px/1 var(--body); padding: 3px 6px; border-radius: 5px; background: var(--paper); color: var(--muted); letter-spacing: .02em; }","+.flowbox { position: absolute; border: 1.5px solid var(--k-flow); border-radius: 18px; background: color-mix(in srgb, var(--surface) 55%, transparent); }","+.fbhead { position: absolute; left: 14px; right: 10px; top: 10px; display: flex; align-items: center; gap: 8px; cursor: pointer; }","+.fbhead .title { font: 700 17px/1.15 var(--display); font-stretch: 85%; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }","+.icon-btn { border: 0; background: none; cursor: pointer; color: var(--muted); padding: 2px 6px; border-radius: 6px; font-size: 13px; }","+.icon-btn:hover { background: var(--paper); color: var(--ink); }","+.fnlist { margin-top: 4px; line-height: 1.35 !important; font: 11.5px/1.45 var(--mono); color: var(--muted); }","+.fnlist span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }","+.far .sub, .far .fnlist, .far .card.step .foot, .far .summary { visibility: hidden; }","+","+/* change paint */","+.card.p-changed { background: linear-gradient(var(--chg-soft), var(--chg-soft)), var(--surface); border-color: var(--chg); border-width: 2px; }","+.card.p-new { background: linear-gradient(var(--new-soft), var(--new-soft)), var(--surface); border-color: var(--new); border-width: 2px; }","+.card.p-direct { box-shadow: inset 4px 0 0 var(--chg); border-color: var(--chg); }","+.card.p-reach { box-shadow: inset 4px 0 0 var(--chg); border-style: dashed; border-color: var(--chg); }","+.card.p-newstep { box-shadow: inset 4px 0 0 var(--new); border-color: var(--new); }","+.card.sel.p-direct, .card.sel.p-reach, .card.sel.p-newstep { box-shadow: 0 0 0 2px var(--accent); }","+.badges { position: absolute; top: -9px; right: 10px; display: flex; gap: 4px; }","+.badge { min-width: 20px; height: 20px; border-radius: 10px; background: var(--chg); color: #fff; font: 700 1 \",\"sym\":\"problem\",\"file\":\"f:change.py\",\"sig\":\"code, subject, text, fix\",\"lines\":[283,284],\"url\":\"https://github.com/NelisVerhoef/Flowmap/blob/b50aa95276c4aea7e565108cb0f29d99b8f5d328/flowmap/change.py#L283-L284\"},\"flowmap/viewer.py:__main__\":{\"id\":\"flowmap/viewer.py:__main__\",\"sym\":\"__main__\",\"file\":\"f:viewer.py\",\"lines\":[29,30],\"url\":\"https://github.com/NelisVerhoef/Flowmap/blob/b50aa95276c4aea7e565108cb0f29d99b8f5d328/flowmap/viewer.py#L29-L30\"},\"flowmap/viewer.py:main\":{\"id\":\"flowmap/viewer.py:main\",\"sym\":\"main\",\"file\":\"f:viewer.py\",\"lines\":[19,26],\"url\":\"https://github.com/NelisVerhoef/Flowmap/blob/b50aa95276c4aea7e565108cb0f29d99b8f5d328/flowmap/viewer.py#L19-L26\"},\"flowmap/change.py:viewer_html\":{\"id\":\"flowmap/change.py:viewer_html\",\"sym\":\"viewer_html\",\"file\":\"f:change.py\",\"doc\":\"The page with no data in it: it reads a link's fragment or a dropped file. No fonts or other requests, and a CSP that forbids any, so a reader can see their data stays in the tab.\",\"lines\":[347,353],\"url\":\"https://github.com/NelisVerhoef/Flowmap/blob/b50aa95276c4aea7e565108cb0f29d99b8f5d328/flowmap/change.py#L347-L353\"}},\"screens\":{\"u:flowmap/atlas.template\":{\"id\":\"u:flowmap/atlas.template\",\"label\":\"atlas.template\",\"path\":\"flowmap/atlas.template\",\"parts\":[\"codeFlow\",\"renderMerges\",\"select\"]},\"u:flowmap/canvas.template\":{\"id\":\"u:flowmap/canvas.template\",\"label\":\"canvas.template\",\"path\":\"flowmap/canvas.template\",\"parts\":[\"draw\",\"layoutMap\",\"select\"]}},\"data\":{\"d:docs/flowmap/inventory.json\":{\"id\":\"d:docs/flowmap/inventory.json\",\"label\":\"inventory.json\",\"parts\":[\"docs/flowmap\"],\"path\":\"docs/flowmap/inventory.json\"},\"d:docs/flowmap/runs/<run-id>.brief.md\":{\"id\":\"d:docs/flowmap/runs/<run-id>.brief.md\",\"label\":\"<run-id>.brief.md\",\"parts\":[\"docs/flowmap/runs\"],\"path\":\"docs/flowmap/runs/<run-id>.brief.md\"},\"d:docs/flowmap/MAP.m
