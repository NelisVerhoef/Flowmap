w\":1},{\"a\":\"f:viewer.py\",\"b\":\"d:<dir>/change.html\",\"kind\":\"writes\",\"steps\":[\"s:review-a-change/build-viewer\"],\"w\":1}],\"plumbing\":[\"analytics\",\"auth\",\"config\",\"db\",\"logging\",\"sentry\",\"serialisation\",\"settings\"],\"commit\":\"b50aa95\",\"changes\":[{\"id\":\"pr-17\",\"title\":\"PR #17\",\"range\":\"8675ccd..HEAD\",\"files\":{\"f:atlas.py\":{\"kind\":\"changed\",\"syms\":[\"build\",\"overlay\",\"data\"]},\"f:reconcile.py\":{\"kind\":\"changed\",\"syms\":[\"canonical_new_flows\",\"write_questions_md\",\"adopted_flows\"]},\"f:canvas.py\":{\"kind\":\"new\",\"syms\":[\"__main__\",\"data_label\",\"flow_title\",\"from_page\",\"graph\",\"graph.edge\",\"graph.walk\",\"main\",\"paint\",\"paint.file_of\",\"screen_group\"]}},\"steps\":{\"s:build-the-map/reconcile-passes\":{\"kind\":\"direct\",\"via\":[\"canonical_new_flows\",\"write_questions_md\"]},\"s:browse-the-map/build-atlas\":{\"kind\":\"direct\",\"via\":[\"build\",\"data\"]},\"s:browse-the-map/draw-canvas\":{\"kind\":\"new\",\"via\":[\"__main__\",\"data\",\"data_label\",\"from_page\"]}},\"off\":[],\"off_files\":[],\"changed\":4,\"new\":13,\"added_endpoints\":[\"CLI flowmap canvas\"],\"verdict\":{\"verdict\":\"blind\",\"spreads_to\":[\"CLI flowmap atlas\",\"CLI flowmap canvas\",\"CLI flowmap reconcile\"],\"blind\":[\"module-level code changed (constants, config, router registration): `flowmap/canvas.py`\",\"files outside the analysed code: `bench/fastapi-template/map/canvas.html`, `bin/flowmap`, `flowmap.toml`, `flowmap/canvas.template.html`\"]},\"story\":{\"title\":\"The map draws as one canvas a change is painted on, and flowmap's own map is current again\",\"intent\":\"Prototype a left-to-right canvas of the map (flows, code, data) that a reviewer can learn by looking, paint a PR on it, and refresh flowmap's own stale map so the canvas has something current to show.\",\"delta\":\"browse-the-map gains a step: `flowmap canvas` draws the map as one picture, files placed by call depth, and paints a change with its story's parts numbered on the cards. The atlas page and its command behave as before; atlas.data now builds the dict both pages draw. build-the-map's reconcile can adopt a proposed flow under a name of the user's own. flowmap's own map is rebuilt from four agreeing passes into three named flows. lens, the change page and its --link are unchanged. lens calls this blind: canvas.py has module-level constants, and the page template, bin/flowmap (which wires up the command) and flowmap.toml sit outside the analysed code, so read those in the diff.\",\"url\":\"https://github.com/NelisVerhoef/Flowmap/pull/17\",\"pr\":\"PR #17\",\"no_longer\":[\"A vocabulary entry adopts a proposed flow only when its id equals the proposal's id without `new:`; renaming one, as QUESTIONS.md invites, leaves its steps under the old `new:` flow\",\"flowmap's own map has three unnamed draft flows and no step for `flowmap change` or `flowmap viewer`\",\"A PR overlay records how many functions a change touched, not which ones\"],\"chapters\":[{\"n\":1,\"title\":\"The map draws as one left-to-right canvas, and a change is painted on it\",\"role\":\"core\",\"before\":\"The map had two views: Mermaid diagrams and the atlas, which lists each flow's steps as a column of sentences. A change was read on the change page, a document whose only picture is a row of dots per flow.\",\"after\":\"`flowmap canvas` writes docs/flowmap/canvas.html: screens, flows and steps, one card per file placed by call depth, and the data the steps write, wired left to right from the call graph. Click a flow to light its path, \\u25b6 to walk it step by step, double-click a file to see its functions with callers left and callees right. `--change <name>=<base>..<head>` paints changed and new files, marks the steps that run them, numbers the story's parts on their cards, and gives changed code no step runs its own \\\"not on the map\\\" column. `--from <atlas.html>` redraws an existing atlas page's data. The paint comes from the atlas overlay (`atlas.overlay`); the verdict on the page comes from `lens.analyse`, which `canvas.main` also runs.\",\"claim\":\"A reviewer sees where a change sits on a picture of the system instead of reading it.\",\"why\":\"Whoever reviews a flowmap PR reads it here first. The atlas and change page never built a picture people could learn, so the reviewer fell back to the diff. Rather than inlining a full graph-layout library such as ELK into every page, the page does a small column layout itself, because positions follow the map's order and that keeps the picture the same between builds; the cost is wires that can cross.\",\"questions\":[\"canvas paints changed code from `atlas.overlay`, which unlike `lens.analyse` doesn't skip docstring-only edits, so a file can be painted amber while the verdict ignores it. Should `canvas.main` take changed symbols from lens's facts instead?\",\"`canvas.from_page` scrapes `const DATA = \\u2026` out of a rendered atlas page. Should the atlas also write its data as JSON beside the page?\",\"Should the canvas become the page `flowmap change --link` opens, replacing the document-style change page?\",\"Open bench/fastapi-template/map/canvas.html, press \\u25b6 on Sign in, then open docs/flowmap/canvas.html and paint PR #16: can you say where each lands without the diff?\"],\"verified\":[\"test\",\"test\",\"test\",\"ran\",\"not checked\"],\"files\":[\"f:canvas.py\"],\"steps\":[\"s:browse-the-map/draw-canvas\"],\"outside\":[\"flowmap/canvas.template.html\",\"bin/flowmap\",\"README.md\",\"docs/flowmap/canvas.html\",\"bench/fastapi-template/map/canvas.html\"]},{\"n\":2,\"title\":\"The atlas's data is built once, and an overlay names the functions a change touched\",\"role\":\"supporting\",\"before\":\"`atlas.build` computed the atlas data and wrote the page in one function. A PR overlay carried counts of changed and new functions.\",\"after\":\"`atlas.data` returns the dict and `atlas.build` writes the page from it, so the canvas draws the same data. An overlay also carries `changed_ids`, `new_ids` and `added_endpoints`, which the canvas paints; the atlas page ignores them.\",\"claim\":\"One builder feeds both pages.\",\"why\":\"Runs under `flowmap atlas` and `flowmap canvas`. Rather than a second copy of the step and merge logic in canvas.py, the canvas reuses the atlas's, because two copies would drift. The cost: `atlas.data` and `atlas.overlay` now sit under both pages, so a bug there breaks the atlas and the canvas together.\",\"questions\":[\"`atlas.data` still calls `Diagrams.system()` only to fill `d.matrix`. With two pages built on it, should that become a function that returns the matrix?\",\"Diff a fresh `flowmap atlas` against the committed atlas.html: only the overlay keys and the map itself should differ.\"],\"verified\":[\"ran\",\"test\"],\"files\":[\"f:atlas.py\"],\"steps\":[\"s:browse-the-map/build-atlas\",\"s:browse-the-map/draw-canvas\"],\"outside\":[]},{\"n\":3,\"title\":\"A flow renamed when it is adopted keeps its steps\",\"role\":\"supporting\",\"before\":\"reconcile adopted a proposed flow only when a vocabulary id equalled the proposal without `new:`. Renaming it in flowmap.toml, as QUESTIONS.md invites, left its steps under the `new:` flow.\",\"after\":\"A vocabulary entry can name the proposal it adopts with `proposed = \\\"new:...\\\"` (one id or a list); any id in a merged proposal ties it to the user's name. The TOML block in QUESTIONS.md now writes that line, so a pasted block still works after renaming `id`. flowmap/config.py only gains the `proposed` line in its documented example.\",\"claim\":\"Naming flows works the way QUESTIONS.md says it does.\",\"why\":\"Runs once per map build, at the human step: whoever names the flows. Found while naming this repo's flows, whose chosen names differ from the proposals. Rather than pinning every entry point in decisions.json, which would mark each step \\\"confirmed\\\" when only its flow was named, the vocabulary says what it adopts.\",\"questions\":[\"Should reconcile warn when a `proposed` names no proposal (a typo), instead of silently leaving the `new:` flow beside the empty vocabulary one?\",\"Paste QUESTIONS.md's TOML block, rename one `id`, reconcile: does the flow keep its steps?\"],\"verified\":[\"test\",\"ran\"],\"files\":[\"f:reconcile.py\"],\"steps\":[\"s:build-the-map/reconcile-passes\"],\"outside\":[\"flowmap/config.py\"]},{\"n\":4,\"title\":\"flowmap's own map is current, with three named flows\",\"role\":\"outside\",\"before\":\"The map was built 21 commits ago: 8 steps in 3 unnamed draft flows, with no step for `flowmap change`, `canvas` or `viewer`.\",\"after\":\"11 entry points, 11 steps, all agreed by independent passes, in build-the-map, browse-the-map and review-a-change. lens's flow is pinned to review-a-change in decisions.json (the step itself is still \\\"agreed\\\": that grades how the passes grouped the step, not which flow it sits in). The goldens are regenerated: only step and flow placement and flow spread moved; the graph goldens did not. The anchors-lost test moved to its own fixture repo.\",\"claim\":\"Change pages from here on land on a map that knows today's commands.\",\"why\":\"Every later PR is placed on this map. On the old one, a change to change.py (PR #15) landed off the map entirely. The anchors-lost test cited functions deleted long ago; a fresh map can't cite them, so rather than rewriting its expected value to empty it now builds a repo whose map does.\",\"questions\":[\"lens is pinned to review-a-change against three of four passes, which put it under browse-the-map. Keep the pin?\",\"`bin/flowmap-pr-hook` runs `flowmap lens` on every push but is not an entry point: bin/ is outside `[code].graph` and the file has no .py. Map it in a follow-up?\"],\"verified\":[\"ran\",\"test\",\"test\",\"looked\"],\"files\":[],\"steps\":[],\"outside\":[\"docs/flowmap/map.json\",\"docs/flowmap/MAP.md\",\"docs/flowmap/QUESTIONS.md\",\"docs/flowmap/decisions.json\",\"flowmap.toml\",\"docs/flowmap/inventory.json\",\"docs/flowmap/atlas.html\",\"tests/golden/lens-6d9eaff-770f1a7.md\",\"tests/golden/change-facts-6d9eaff-770f1a7.json\"]}]}},{\"id\":\"pr-16\",\"title\":\"PR #16\",\"range\":\"69be006..8675ccd\",\"files\":{\"f:callgraph.py\":{\"kind\":\"changed\",\"syms\":[\"__main__\"]},\"f:lens.py\":{\"kind\":\"changed\",\"syms\":[\"analyse\",\"blind_spots\",\"defs\"]},\"f:graphs/codegraph.py\":{\"kind\":\"new\",\"syms\":[\"_part\",\"build\",\"doc\",\"hint\",\"outline\",\"signature\",\"symbols\"]}},\"steps\":{\"s:build-the-map/check-handlers-are-nodes\":{\"kind\":\"direct\",\"via\":[\"__main__\",\"build\",\"hint\"]},\"s:browse-the-map/build-atlas\":{\"kind\":\"reach\",\"via\":[\"defs\"]},\"s:review-a-change/run-lens\":{\"kind\":\"direct\",\"via\":[\"analyse\",\"blind_spots\",\"defs\"]},\"s:review-a-change/pull-change-facts\":{\"kind\":\"direct\",\"via\":[\"analyse\"]}},\"off\":[],\"off_files\":[],\"changed\":4,\"new\":7,\"added_endpoints\":[],\"verdict\":{\"verdict\":\"blind\",\"spreads_to\":[\"CLI flowmap atlas\",\"CLI flowmap callgraph\",\"CLI flowmap change\",\"CLI flowmap lens\"],\"blind\":[\"module-level code changed (constants, config, router registration): `flowmap/graphs/__init__.py`, `flowmap/graphs/codegraph.py`\",\"files outside the analysed code: `.claude-plugin/plugin.json`\"]},\"story\":{\"title\":\"The call graph covers TypeScript/JS, Ruby, Go, Java and more when codegraph is installed, and says to install it when it isn't\",\"intent\":\"Reuse codegraph (github.com/colbymchenry/codegraph, a tree-sitter indexer for 20+ languages) so flowmap gives deterministic reach for languages other than Python, and recommend installing it strongly without forcing it.\",\"delta\":\"A second call-graph builder now sits next to the Python one. When `codegraph` is on PATH, it indexes the graph files of every non-Python language at the revision being read and turns codegraph's SQLite graph into flowmap's `rel:Qual.name` nodes and call edges. Reach, the verdict, `callgraph check`, change pages and the atlas then cover that code. Without codegraph nothing changes: those files stay blind spots, but lens, `callgraph check` and the flowmap-build skill now name the install command. The Python builder, the graph format, adapters and map files are unchanged. Rails handlers still don't match codegraph's names (`index` vs `Admin.UsersController.index`), so Rails reach is still \\\"not yet\\\". lens calls this PR blind because `graphs/__init__.py` and `codegraph.py` gained module-level code (the builder list, the suffix and kind tables) and because of the plugin version bump.\",\"url\":\"https://github.com/NelisVerhoef/Flowmap/pull/16\",\"pr\":\"PR #16\",\"no_longer\":[\"A change to a TypeScript/JS or Ruby file always gets the blind-spot line \\\"code with no call graph (no builder for its language \\u2026)\\\", so lens can't name what it reaches\",\"The flowmap-build skill treats the call graph as Python-only (\\\"Python today\\\") and goes on without asking about other languages\"],\"chapters\":[{\"n\":1,\"title\":\"Non-Python code gets a call graph from codegraph's index\",\"role\":\"core\",\"before\":\"The only builder was graphs/python.py. Files in any other language had no nodes or edges: a Next.js route or a TS helper was \\\"not graphed\\\", and any change to one made lens say blind.\",\"after\":\"`build` writes the files (plus tsconfig/jsconfig/package.json/go.mod at the root and up to two levels down) into a temp dir and runs `codegraph init --yes` with DO_NOT_TRACK=1 and CODEGRAPH_NO_DAEMON=1. `_part` then reads functions, methods, constructors, classes, structs, modules and components as nodes. `A::b` becomes `rel:A.b`. calls, instantiations and references become edges, and a class also reaches its constructor (`constructor`, `initialize`, `__init__`, `init`, `new`). extends/implements become bases, and files with parse errors are reported as unparsed. `symbols`, `signature` and `doc` answer from the outline recorded while building, since flowmap asks them with file text alone. Python files keep their own builder. When `codegraph init` exits non-zero, every file it was given is reported as unparsed, so lens says blind (\\\"could not parse \\u2026\\\") instead of guessing. The builder reads codegraph's tables directly: a renamed column raises an error, and a renamed node kind would leave handlers out of the graph, which `flowmap callgraph check` reports as broken.\",\"claim\":\"With codegraph installed, a TS/JS, Ruby, Go or Java change gets reach like a Python one.\",\"why\":\"Reach is what lets a reviewer trust lens when it is quiet, and so far only Python repos had it. Rather than writing tree-sitter resolution in flowmap (a dependency, and a lot of resolver work per language), this reads a maintained indexer's output. Its node names already match what flowmap's adapters emit: all 36 handlers in a real Next.js app are nodes.\",\"questions\":[\"Rails: should the adapter emit class-qualified handlers (`users_controller.rb:Admin.UsersController.index`) so codegraph reach works, even though that renames handler ids in existing Rails maps?\",\"Run `flowmap callgraph check` with codegraph on a TS or Go repo you know: are any handlers broken, and are the edges into shared helpers the ones you'd expect?\",\"`build` runs codegraph twice per lens (base and head), about 1.2s each on 263 files. Is that acceptable on your largest repo, or should it reuse a `.codegraph/` index when the ref is the working tree?\"],\"verified\":[\"test\",\"ran\",\"ran\",\"looked\"],\"files\":[\"f:graphs/codegraph.py\"],\"steps\":[\"s:browse-the-map/build-atlas\",\"s:browse-the-map/draw-canvas\"],\"outside\":[]},{\"n\":2,\"title\":\"lens and atlas name the method a change sits in, not its class\",\"role\":\"supporting\",\"before\":\"Callers place diff lines on definitions through `lens.defs`, and lens and `atlas --pr` do it before building any graph. An indexer outlines a file only once it has indexed it, so a change inside `InsurerRegistry.isSupported` came out as `InsurerRegistry` (the regex outline's top-level name).\",\"after\":\"`lens.defs` asks a builder that has `outline` to index a text no build has seen, on its own (a single-file codegraph index), before reading its symbols. Every caller goes through `defs`: lens, `atlas --pr` and change facts. `analyse` also builds the base and head graphs first when there are graph roots, so changed files are outlined from those builds instead of one by one; it built both later anyway.\",\"claim\":\"Reach is reported for the changed method itself.\",\"why\":\"Reach is looked up by node id, and the class node doesn't carry the method's callers, so naming the class hid the endpoints that reach the method. The fix is in `defs` rather than in each caller because `atlas --pr` had the same order and never builds the base graph. Rather than giving `symbols()` a file path (changing the builder interface for Python too), the indexer gets an optional `outline(rel, text)`.\",\"questions\":[\"A single-file index can't resolve imports, but `outline` only reads definitions from it. Is any caller of `codegraph.signature` or `doc` reached with a text that no full build saw, where a missing signature would hide a contract change?\",\"When codegraph fails on a file (exit code non-zero), `outline` retries every time `defs` asks for it. Worth caching the failure?\"],\"verified\":[\"test\",\"test\",\"ran\",\"not checked\"],\"files\":[\"f:graphs/codegraph.py\",\"f:lens.py\"],\"steps\":[],\"outside\":[]},{\"n\":3,\"title\":\"Where codegraph is missing, flowmap says how to install it\",\"role\":\"supporting\",\"before\":\"Nothing told anyone a builder for other languages existed: the blind spot said \\\"no builder for its language\\\" and the skill said \\\"Python today\\\".\",\"after\":\"When codegraph is absent and a file it would parse has no graph, lens's blind spot and `callgraph check`'s \\\"no builder for .ts\\\" end with \\\"(`npm i -g @colbymchenry/codegraph` gives these a call graph)\\\". The flowmap-build skill has a step 0: if the repo has non-Python code and no codegraph, stop, explain that reach will be blind there, and ask to install it. Carry on without it only if the user says so. README lists it under \\\"On a new machine\\\". The plugin version moves to 0.3.0 so installed copies update.\",\"claim\":\"codegraph is strongly recommended at the moment its absence costs something, never installed behind anyone's back.\",\"why\":\"Claude Code plugins can't declare npm dependencies. Forcing it would mean a hook running a global npm install on every teammate's machine, which changes their machine and runs third-party install scripts without asking. Rather than a SessionStart nudge in every session, the hint appears only where reach is actually missing: lens output, which pr-lens copies into PR summaries, and setup.\",\"questions\":[\"Should the install line pin the tested version (`@colbymchenry/codegraph@1.6.2`), given that the builder reads codegraph's database schema directly?\",\"Is asking at build time enough, or do teammates who only review PRs (pr-lens) also need a nudge before their first lens?\"],\"verified\":[\"test\",\"ran\",\"not checked\"],\"files\":[\"f:callgraph.py\",\"f:graphs/codegraph.py\",\"f:lens.py\"],\"steps\":[\"s:build-the-map/check-handlers-are-nodes\"],\"outside\":[\"skills/flowmap-build/SKILL.md\",\"README.md\",\".claude-plugin/plugin.json\"]}]}}]};","+const $ = s => document.querySelector(s);","+function el(tag, attrs, ...kids) {","+  const n = document.createElement(tag);","+  for (const [k, v] of Object.entries(attrs || {})) {","+    if (v == null || v === false) continue;","+    if (k === \"class\") n.className = v;","+    else if (k.startsWith(\"on\")) n.addEventListener(k.slice(2), v);","+    else if (k === \"style\") n.style.cssText = v;","+    else n.setAttribute(k, v === true ? \"\" : v);","+  }","+  for (const c of kids.flat()) if (c != null && c !== false) n.append(c.nodeType ? c : document.createTextNode(String(c)));","+  return n;","+}","+// story prose marks code with backticks: show it as code","+const md = s => String(s || \"\").split(\"`\").map((part, i) => i % 2 ? el(\"code\", { class: \"mono\", style: \"font-size:.92em;background:var(--paper);padding:0 3px;border-radius:4px\" }, part) : part);","+const NS = \"http://www.w3.org/2000/svg\";","+const svgEl = (tag, attrs) => { const n = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v); return n; };","+","+const FLOWS = G.flows, STEPS = G.steps, FILES = G.files, DATA = G.data, SCREENS = G.screens, FNS = G.fns;","+const flowOf = Object.fromEntries(FLOWS.map(f => [f.id, f]));","+const ALL = { ...STEPS, ...FILES, ...DATA, ...SCREENS, ...flowOf };","+const short = s => s.split(\":\").pop();","+let OFF = {};","+","+// ---------- state ----------","+const total = Object.keys(STEPS).length;","+const S = {","+  view: \"map\",            // \"map\" | file id (inside a file)","+  expanded: new Set(total <= 12 ? FLOWS.map(f => f.id) : []),","+  sel: null,              // node id or \"ch:<n>\"","+  change: G.changes.length ? 0 : -1,","+  play: null,             // {flow, i}","+};","+const change = () => S.change >= 0 ? G.changes[S.change] : null;","+","+// ---------- geometry ----------","+const SIZE = { screen: [210, 66], flow: [300, 98], step: [276, 62], file: [236, 112], data: [200, 62] };","+const GAP_X = 100, GAP_Y = 14, FB_HEAD = 46, FB_PAD = 12, STEP_GAP = 8, FLOW_GAP = 18;","+","+function rep(id) {","+  // what stands for a node in the current view: a step of a collapsed flow is its flow","+  if (id.startsWith(\"s:\")) { const f = STEPS[id].flow; return S.expanded.has(f) ? id : f; }","+  return id;","+}","+","+function layoutMap() {","+  const nodes = {}, boxes = [], heads = [];","+  // the left spine: flows, expanded into their steps or folded into one card","+  let y = 0;","+  for (const f of FLOWS) {","+    if (S.expanded.has(f.id)) {","+      const h = FB_HEAD + f.steps.length * (SIZE.step[1] + STEP_GAP) - STEP_GAP + FB_PAD;","+      boxes.push({ id: f.id, y, h });","+      f.steps.forEach((sid, i) => nodes[sid] = { id: sid, kind: \"step\", y: y + FB_HEAD + i * (SIZE.step[1] + STEP_GAP), h: SIZE.step[1], w: SIZE.step[0] });","+      y += h + FLOW_GAP;","+    } else {","+      nodes[f.id] = { id: f.id, kind: \"flow\", y, h: SIZE.flow[1], w: SIZE.flow[0] };","+      y += SIZE.flow[1] + FLOW_GAP;","+    }","+  }","+  // the wires between whatever is visible, merged","+  const wires = {};","+  for (const e of G.edges) {","+    if (e.kind === \"ui\" && !S.expanded.has(STEPS[e.b].flow)) continue;  // screens show with their steps","+    const a = rep(e.a), b = rep(e.b);","+    if (a === b) continue;","+    const k = a + \"|\" + b + \"|\" + e.kind;","+    const w = wires[k] || (wires[k] = { a, b, kind: e.kind, steps: new Set(), w: 0, labels: new Set() });","+    e.steps.forEach(s => w.steps.add(s)); w.w += e.w; (e.labels || []).forEach(l => w.labels.add(l));","+  }","+  const W = Object.values(wires);","+  const cy = n => n.y + n.h / 2;","+  const into = id => W.filter(w => w.b === id && nodes[w.a]);","+  const outof = id => W.filter(w => w.a === id && nodes[w.b]);","+  const place = (ids, kind, desired) => {","+    const [w, h] = SIZE[kind];","+    const want = ids.map(id => ({ id, d: desired(id) })).sort((p, q) => p.d - q.d || (p.id < q.id ? -1 : 1));","+    let floor = -Infinity;","+    const placed = want.map(({ id, d }) => { const top = Math.max(d - h / 2, floor); floor = top + h + GAP_Y; return { id, top }; });","+    // pull the column back up so it sits around what it serves, not below it","+    const drift = placed.reduce((s, p, i) => s + (p.top - (want[i].d - h / 2)), 0) / (placed.length || 1);","+    const shift = Math.min(drift, placed.length ? placed[0].top - Math.min(...want.map(p => p.d - h / 2)) : 0);","+    for (const p of placed) nodes[p.id] = { id: p.id, kind, y: p.top - Math.max(0, shift), h, w };","+  };","+  const bary = (id, side) => {","+    const ws = side === \"in\" ? into(id) : outof(id);","+    if (!ws.length) return null;","+    let s = 0, n = 0;","+    for (const w of ws) { const o = nodes[side === \"in\" ? w.a : w.b]; s += cy(o) * w.w; n += w.w; }","+    return s / n;","+  };","+  // screens sit left of the steps they start","+  const scr = Object.keys(SCREENS).filter(id => W.some(w => w.a === id));","+  // files by call depth, each placed beside what calls it","+  const depthMax = Math.max(0, ...Object.values(FILES).map(f => f.depth));","+  const layers = [...Array(depthMax + 1)].map((_, d) => Object.values(FILES).filter(f => f.depth === d).map(f => f.id));","+  for (const L of layers) place(L, \"file\", id => bary(id, \"in\") ?? 0);","+  const dat = Object.keys(DATA);","+  place(dat, \"data\", id => bary(id, \"in\") ?? 0);","+  const offs = change() ? change().off_files.map(o => o.id) : [];","+  if (offs.length) { OFF = Object.fromEntries(change().off_files.map(o => [o.id, o])); offs.forEach((id, i) => nodes[id] = { id, kind: \"off\", y: i * (SIZE.file[1] + GAP_Y), h: SIZE.file[1], w: SIZE.file[0] }); }","+  if (scr.length) place(scr, \"screen\", id => bary(id, \"out\") ?? 0);","+  // columns, left to right","+  const cols = [];","+  if (scr.length) cols.push({ name: \"Screens\", ids: scr, w: SIZE.screen[0] });","+  cols.push({ name: \"Flows and steps\", ids: [...FLOWS.filter(f => !S.expanded.has(f.id)).map(f => f.id), ...Object.keys(STEPS).filter(s => nodes[s])], w: SIZE.flow[0], spine: true });","+  layers.forEach((L, d) => cols.push({ name: d === 0 ? \"Handlers\" : d === 1 ? \"Code they call\" : \"\", ids: L, w: SIZE.file[0] }));","+  if (dat.length) cols.push({ name: \"Data written\", ids: dat, w: SIZE.data[0] });","+  if (offs.length) cols.push({ name: \"Changed, not on the map\", ids: offs, w: SIZE.file[0] });","+  let x = 0;","+  for (const c of cols) {" ta.\"","+[[flows.vocabulary]]","+id = \"review-a-change\"","+proposed = \"new:tell-a-change-as-a-story\"","+scope = \"Review a PR on the map: lens places the diff and gives its verdict, and the change page tells it as chapters with what to ask, linkable from the PR body.\""],"symbols":[]},{"file":"flowmap/atlas.py","old":175,"new":175,"ctx":"def overlay(d, spec, ms):","lines":["     return {\"id\": re.sub(r\"\\W\", \"\", title) or \"pr\", \"title\": title or rng, \"range\": rng,","             \"steps\": steps, \"merges\": hit, \"changed\": len(changed), \"new\": len(new),","-            \"widest\": [{\"sym\": s, \"endpoints\": n} for n, s in widest if n]}","+            \"widest\": [{\"sym\": s, \"endpoints\": n} for n, s in widest if n],","+            \"changed_ids\": sorted(changed), \"new_ids\": sorted(new), \"added_endpoints\": sorted(added_eps)}"," "," ","-def build(prs):","+def data(prs):","+    \"\"\"Everything the atlas draws, as one dict (the canvas draws the same data another way).\"\"\"","     d = Diagrams()","     d.system()  # fills d.matrix"],"symbols":["flowmap/atlas.py:build","flowmap/atlas.py:data","flowmap/atlas.py:overlay"]},{"file":"flowmap/atlas.py","old":206,"new":208,"ctx":"def build(prs):","lines":["         data[\"flows\"].append({\"id\": f[\"id\"], \"summary\": f[\"summary\"], \"steps\": steps})","     data[\"functions\"] = functions(d, {n[\"id\"] for f in data[\"flows\"] for s in f[\"steps\"] if s[\"code\"] for n in s[\"code\"][\"nodes\"]})","-    commit = lens.git(\"rev-parse\", \"--short\", \"HEAD\").strip()","-    data[\"commit\"] = commit","+    data[\"commit\"] = lens.git(\"rev-parse\", \"--short\", \"HEAD\").strip()","+    return data","+","+","+def build(prs):","+    data_ = data(prs)","+    ms = data_[\"merges\"]","     name = config.load().get(\"name\") or ROOT.name.replace(\"-\", \" \").replace(\"_\", \" \").title()","     html = (TEMPLATE.read_text().replace(\"__ATLAS_NAME__\", name.replace(\"<\", \"&lt;\"))","-            .re  its own.\"\"\"","+    parts = rel.split(\"/\")","+    stem = parts[-1].rsplit(\".\", 1)[0]","+    if len(parts) == 1 or parts[-2] in (\"routes\", \"pages\", \"app\", \"views\", \"screens\") or rel.endswith(\".html\"):","+        return \"/\".join(parts[:-1] + [stem]), stem.replace(\"_\", \"\").replace(\"-\", \" \").strip() or stem","+    return \"/\".join(parts[:-1]), parts[-2]","+","+","+def data_label(w):","+    \"\"\"A write as the map records it: `User.email` is the User model, a path is that file.\"\"\"","+    if \"/\" in w or w.endswith((\".json\", \".md\", \".html\", \".toml\")):","+        return w, w.rsplit(\"/\", 1)[-1], w.rsplit(\"/\", 1)[0] if \"/\" in w else \"\"","+    model, _, field = w.partition(\".\")","+    return model, model, field","+","+","+def graph(atlas):","+    \"\"\"Nodes and edges of the canvas. Every edge carries the steps that run along it, so a step,","+    a flow or a change lights its own path.\"\"\"","+    flows, steps, files, fns, screens, datas, edges = [], {}, {}, {}, {}, {}, {}","+","+    def edge(a, b, kind, sid, label=None):","+        e = edges.setdefault((a, b, kind), {\"a\": a, \"b\": b, \"kind\": kind, \"steps\": set(), \"w\": 0})","+        e[\"steps\"].add(sid)","+        e[\"w\"] += 1","+        if label:","+            e.setdefault(\"labels\", set()).add(label)","+","+    for f in atlas[\"flows\"]:","+        flow = {\"id\": \"flow:\" + f[\"id\"], \"key\": f[\"id\"], \"title\": flow_title(f[\"id\"]),","+                \"summary\": f.get(\"summary\", \"\"), \"steps\": [], \"draft\": f[\"id\"].startswith(\"new:\")}","+        for s in f[\"steps\"]:","+            sid = \"s:\" + s[\"key\"]","+            code = s.get(\"code\") or {\"nodes\": [], \"edges\": []}","+            for n in code[\"nodes\"]:","+                fid = \"f:\" + n[\"file\"]","+                fns.setdefault(n[\"id\"], {\"id\": n[\"id\"], \"sym\": n[\"sym\"], \"file\": fid})","+                F = files.setdefault(fid, {\"id\": fid, \"label\": n[\"file\"], \"path\": n[\"id\"].rsplit(\":\", 1)[0],","+                                           \"fns\": [], \"steps\": set()})","+                if n[\"id\"] not in F[\"fns\"]:","+                    F[\"fns\"].append(n[\"id\"])","+                F[\"steps\"].add(sid)","+            roots = [n for n in code[\"nodes\"] if n[\"root\"]]","+            for r in roots:","+                edge(sid, \"f:\" + r[\"file\"], \"entry\", sid, \" \u00b7 \".join(s[\"endpoints\"]))","+            calls = []","+            for a, b in code[\"edges\"]:","+                calls.append([a, b])","+                fa, fb = fns[a][\"file\"], fns[b][\"file\"]","+                if fa != fb:","+                    edge(fa, fb, \"call\", sid)","+            for u in s.get(\"ui\", []):","+                rel, _, sym = u.rpartition(\":\")","+                if rel.endswith(UI_EXT):","+                    key, label = screen_group(rel)","+                    uid = \"u:\" + key","+                    U = screens.setdefault(uid, {\"id\": uid, \"label\": label, \"path\": key, \"parts\": []})","+                    if (sym or rel) not in U[\"parts\"]:","+                        U[\"parts\"].append(sym or rel.rsplit(\"/\", 1)[-1])","+                    edge(uid, sid, \"ui\", sid)","+            for w in s.get(\"writes\", []):","+                key, label, part = data_label(w)","+                did = \"d:\" + key","+                D = datas.setdefault(did, {\"id\": did, \"label\": label, \"parts\": set(), \"path\": key})","+                if part:","+                    D[\"parts\"].add(part)","+                # the write is drawn from the step's handler file: the map records what a step","+                # writes, not which function does it","+                edge(\"f:\" + roots[0][\"file\"] if roots else sid, did, \"writes\", sid)","+            steps[sid] = {\"id\": sid, \"key\": s[\"key\"], \"flow\": flow[\"id\"], \"name\": s[\"name\"],","+                          \"actor\": s.get(\"actor\"), \"evidence\": s.get(\"evidence\"),","+                          \"endpoints\": s[\"endpoints\"], \"writes\": s.get(\"writes\", []),","+                          \"ui\": s.get(\"ui\", []), \"handlers\": sorted({\"f:\" + r[\"file\"] for r in roots}),","+                          \"roots\": [r[\"id\"] for r in roots], \"fns\": [n[\"id\"] for n in code[\"nodes\"]],","+                          \"calls\": calls, \"hidden\": code.get(\"hidden\", 0), \"also\": code.get(\"also\", [])}","+            flow[\"steps\"].append(sid)","+        flows.append(flow)","+","+    # call depth of each file: longest path from a handler file, back edges ignored","+    out = {}","+    for e in edges.values():","+        if e[\"kind\"] == \"call\":","+            out.setdefault(e[\"a\"], set()).add(e[\"b\"])","+    depth = {h: 0 for s in steps.values() for h in s[\"handlers\"]}","+","+    def walk(n, d, stack):","+        if d < depth.get(n, -1):","+            return","+        depth[n] = d","+        for m in sorted(out.get(n, ())):","+            if m not in stack:","+                walk(m, d + 1, stack | {m})","+","+    for h in sorted({h for s in steps.values() for h in s[\"handlers\"]}):","+        walk(h, 0, {h})","+    for fid, F in files.items():","+        F[\"depth\"] = depth.get(fid, 0)","+        F[\"steps\"] = sorted(F[\"steps\"])","+","+    funcs = atlas.get(\"functions\", {})","+    for n, info in funcs.items():","+        if n in fns:","+            fns[n].update({k: v for k, v in info.items() if k in (\"sig\", \"doc\", \"lines\", \"url\")})","+    return {","+        \"flows\": flows, \"steps\": steps, \"files\": files, \"fns\": fns, \"screens\": screens,","+        \"data\": {k: {**v, \"parts\": sorted(v[\"parts\"])} for k, v in datas.items()},","+        \"edges\": [{**e, \"steps\": sorted(e[\"steps\"]), **({\"labels\": sorted(e[\"labels\"])} if \"labels\" in e else {})}","+                  for e in edges.values()],","+        \"plumbing\": atlas.get(\"plumbing\", []), \"commit\": atlas.get(\"commit\"),","+    }","+","+","+def paint(g, overlay, story=None, verdict=None):","+    \"\"\"A change as paint: files holding changed or new code, steps it touches, and the story's","+    chapters numbered on the cards they are about.\"\"\"","+    by_path = {}","+    for F in g[\"files\"].values():","+        by_path.setdefault(F[\"path\"], F[\"id\"])","+","+    def file_of(sym):","+        rel = sym.rsplit(\":\", 1)[0]","+        return by_path.get(rel) or next((fid for p, fid in by_path.items() if rel.endswith(p) or p.endswith(rel)), None)","+","+    files, off = {}, []","+    for kind, ids in ((\"changed\", overlay.get(\"changed_ids\", [])), (\"new\", overlay.get(\"new_ids\", []))):","+        for sym in ids:","+            fid = file_of(sym)","+            if fid:","+                files.setdefault(fid, {\"kind\": kind, \"syms\": []})[\"syms\"].append(sym.rsplit(\":\", 1)[1])","+            else:","+                off.append(sym)","+    steps = {\"s:\" + k: v for k, v in overlay.get(\"steps\", {}).items()}","+    # changed code no step runs: the map doesn't know it yet, which is itself news for a reviewer","+    off_files = {}","+    for sym in off:","+        rel, _, name = sym.rpartition(\":\")","+        off_files.setdefault(rel, []).append(name)","+    out = {\"id\": overlay[\"id\"], \"title\": overlay[\"title\"], \"range\": overlay[\"range\"], \"files\": files,","+           \"steps\": steps, \"off\": off,","+           \"off_files\": [{\"id\": \"o:\" + rel, \"path\": rel, \"label\": rel.rsplit(\"/\", 1)[-1], \"syms\": syms,","+                          \"new\": all(f\"{rel}:{s}\" in overlay.get(\"new_ids\", []) for s in syms)}","+                         for rel, syms in sorted(off_files.items())], \"changed\": overlay.get(\"changed\", 0), \"new\": overlay.get(\"new\", 0),","+           \"added_endpoints\": overlay.get(\"added_endpoints\", [])}","+    if verdict:","+        out[\"verdict\"] = verdict","+    if story:","+        chapters = []","+        for i, c in enumerate(story.get(\"chapters\", []), 1):","+            cf = sorted({fid for s in c.get(\"symbols\", []) if (fid := file_of(s))}","+                        | {\"o:\" + s.rsplit(\":\", 1)[0] for s in c.get(\"symbols\", []) if not file_of(s) and \":\" in s})","+            cs = sorted({sid for sid, s in g[\"steps\"].items() if set(s[\"fns\"]) & set(c.get(\"symbols\", []))})","+            chapters.append({\"n\": i, \"title\": c.get(\"title\", \"\"), \"role\": c.get(\"role\", \"\"),","+                             \"before\": c.get(\"before\", \"\"), \"after\": c.get(\"after\", \"\"),","+                             \"claim\": c.get(\"claim\", \"\"), \"why\": c.get(\"why\", \"\"),","+                             \"questions\": [q.get(\"q\", \"\") for q in c.get(\"questions\", [])],","+                             \"verified\": [v.get(\"how\", \"\") for v in c.get(\"verified\", [])],","+                             \"files\": cf, \"steps\": cs, \"outside\": c.get(\"files\", [])})","+        out[\"story\"] = {\"title\": story.get(\"title\", \"\"), \"intent\": story.get(\"intent\", \"\"),","+                        \"delta\": story.get(\"delta\", \"\"), \"url\": story.get(\"url\", \"\"), \"pr\": story.get(\"pr\", \"\"),","+                        \"no_longer\": [n.get(\"was\", \"\") for n in story.get(\"no_longer\", [])],","+                        \"chapters\": chapters}","+    return out","+","+","+def from_page(path):","+    m = re.search(r\"const DATA = (\\{.*?\\});\\n\", Path(path).read_text())","+    if not m:","+        sys.exit(f\"{path}: no atlas data found\")","+    return json.loads(m.group(1))","+","+","+def main():","+    ap = argparse.ArgumentParser(description=__doc__.strip().splitlines()[0])","+    ap.add_argument(\"--change\", action=\"append\", default=[], help=\"<name>=<base>..<head>\")","+    ap.add_argument(\"--from\", dest=\"src\", help=\"draw this atlas page's data instead of building it\")","+    ap.add_argument(\"--name\", help=\"map name (default: flowmap.toml's name, or the repo's)\")","+    ap.add_argument(\"--out\", help=\"default: <out>/canvas.html\")","+    args = ap.parse_args()","+    changes = []","+    for spec in args.change:","+        name, _, rng = spec.partition(\"=\")","+        if \"..\" not in rng:","+            sys.exit(f\"--change {spec}: expected <name>=<base>..<head>\")","+        changes.append((name, rng))","+    if args.src:","+        if changes:","+            sys.exit(\"--change needs the repo's own map; it can't paint onto --from data\")","+        atlas = from_page(args.src)","+        name = args.name or re.search(r\"<title>(.*?) System Atlas<\/title>\", Path(args.src).read_text())[1]","+    else:","+        import atlas as atlas_mod  # needs the map and the code: only import when building","+        import lens","+        atlas = atlas_mod.data([f\"{rng}={name}\" for name, rng in changes])","+        name = args.name or config.load().get(\"name\") or config.root().name.replace(\"-\", \" \").replace(\"_\", \" \").title()","+    g = graph(atlas)","+    g[\"changes\"] = []","+    for (cname, rng), ov in zip(changes, atlas.get(\"overlays\", [])):","+        story_path = config.out() / \"changes\" / f\"{cname}.story.json\"","+        story = json.loads(story_path.read_text()) if story_path.exists() else None","+        base, head = rng.split(\"..\")","+        facts, _ = lens.analyse(base, head)","+        verdict = {\"verdict\": facts.get(\"verdict\"), \"spreads_to\": facts.get(\"spreads_to\", []),","+                   \"blind\": [b if isinstance(b, str) else b.get(\"what\", str(b)) for b in facts.get(\"blind\", [])][:6]}","+        g[\"changes\"].append(paint(g, {**ov, \"id\": cname, \"title\": story.get(\"pr\") if story and story.get(\"pr\") else cname}, story, verdict))","+    out = Path(args.out) if args.out else config.out() / \"canvas.html\"","+    html = (TEMPLATE.read_text().replace(\"__CANVAS_NAME__\", name.replace(\"<\", \"&lt;\"))","+            .replace(\"/*__CANVAS_DATA__*/null\", json.dumps(g, separators=(\",\", \":\"))))","+    out.parent.mkdir(parents=True, exist_ok=True)","+    out.write_text(html)","+    print(f\"wrote {out} ({len(html) // 1024} KB: {len(g['flows'])} flows, {len(g['steps'])} steps, \"","+          f\"{len(g['files'])} files, {len(g['data'])} data, {len(g['screens'])} screens, {len(g['changes'])} changes)\")","+","+","+if __name__ == \"__main__\":","+    main()"],"symbols":["flowmap/canvas.py:__main__","flowmap/canvas.py:data_label","flowmap/canvas.py:flow_title","flowmap/canvas.py:from_page","flowmap/canvas.py:graph","flowmap/canvas.py:graph.edge","flowmap/canvas.py:graph.walk","flowmap/canvas.py:main","flowmap/canvas.py:paint","flowmap/canvas.py:paint.file_of","flowmap/canvas.py:screen_group"]},{"file":"flowmap/canvas.template.html","old":0,"new":1,"ctx":"","lines":["+<!doctype html>","+<meta charset=\"utf-8\">","+<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">","+<title>__CANVAS_NAME__ \u00b7 flowmap canvas<\/title>","+<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">","+<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>","+<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..100,500..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap\">","+<style>","+/* One canvas, read left to right: screens, the flows and their steps, the code they run (a card","+   per file, placed by call depth), the data they write. A flow is a path on it; a change is paint","+   on it. Positions follow the map's own order, so the picture stays put between builds. */","+:root {","+  --paper: #eef1f4; --surface: #ffffff; --ink: #17202b; --muted: #5b6676; --faint: #8a95a3;","+  --rule: #d5dbe2; --wire: #aab4c0; --wire-hi: #2e5bff; --accent: #2e5bff; --accent-soft: rgba(46, 91, 255, .10);","+  --chg: #c77700; --chg-soft: rgba(230, 150, 20, .16); --new: #1e8a4c; --new-soft: rgba(30, 138, 76, .13);","+  --ev-good: #2f9e5b; --ev-mid: #d99a0b; --ev-bad: #c8423b;","+  --k-screen: #7a4fd6; --k-code: #2e5bff; --k-data: #0f8a8a; --k-flow: #17202b;","+  --display: \"Archivo\", \"Arial Narrow\", system-ui, sans-serif;","+  --body: \"IBM Plex Sans\", system-ui, -apple-system, \"Segoe UI\", sans-serif;","+  --mono: \"IBM Plex Mono\", ui-monospace, \"SFMono-Regular\", Menlo, monospace;","+}","+@media (prefers-color-scheme: dark) {","+  :root:not([data-theme=\"light\"]) {","+    --paper: #0f141a; --surface: #171e27; --ink: #e6ebf1; --muted: #9aa6b5; --faint: #6b7787; --rule: #2a3441;","+    --wire: #3f4b5b; --wire-hi: #7c9cff; --accent: #7c9cff; --accent-soft: rgba(124, 156, 255, .14);","+    --chg: #f0a83a; --chg-soft: rgba(240, 168, 58, .16); --new: #4cc27f; --new-soft: rgba(76, 194, 127, .14);","+    --k-screen: #a98cf0; --k-code: #7c9cff; --k-data: #3cc2c2; --k-flow: #e6ebf1; color-scheme: dark;","+  }","+}","+:root[data-theme=\"dark\"] {","+  --paper: #0f141a; --surface: #171e27; --ink: #e6ebf1; --muted: #9aa6b5; --faint: #6b7787; --rule: #2a3441;","+  --wire: #3f4b5b; --wire-hi: #7c9cff; --accent: #7c9cff; --accent-soft: rgba(124, 156, 255, .14);","+  --chg: #f0a83a; --chg-soft: rgba(240, 168, 58, .16); --new: #4cc27f; --new-soft: rgba(76, 194, 127, .14);","+  --k-screen: #a98cf0; --k-code: #7c9cff; --k-data: #3cc2c2; --k-flow: #e6ebf1; color-scheme: dark;","+}","+* { box-sizing: border-box; }","+html, body { height: 100%; margin: 0; }","+body { background: var(--paper); color: var(--ink); font: 14px/1.45 var(--body); display: grid; grid-template-rows: auto 1fr; overflow: hidden; }","+button { font: inherit; color: inherit; }","+.mono { font-family: var(--mono); }","+","+/* header */","+header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 12px 16px; border-bottom: 1px solid var(--rule); background: var(--surface); z-index: 5; }","+h1 { font: 800 22px/1 var(--display); font-stretch: 75%; margin: 0; letter-spacing: .01em; }","+.crumbs { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; min-width: 0; }","+.crumbs a { color: inherit; cursor: pointer; text-decoration: none; }","+.crumbs a:hover { color: var(--ink); text-decoration: underline; }","+.crumbs b { color: var(--ink); font-weight: 600; }","+.spacer { flex: 1; }","+.ctl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }","+select, input[type=\"search\"] { font: 13px var(--body); color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; padding: 6px 10px; }","+input[type=\"search\"] { width: 200px; }","+.btn { border: 1px solid var(--rule); background: var(--surface); border-radius: 8px; padding: 6px 11px; cursor: pointer; font-size: 13px; }","+.btn:hover { border-color: var(--muted); }","+.btn.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }","+","+/* stage */","+main { display: grid; grid-template-columns: 1fr 360px; min-height: 0; }","+#stage { position: relative; overflow: hidden; cursor: grab; touch-action: none; background-image: radial-gradient(var(--rule) 1px, transparent 1px); background-size: 22px 22px; }","+#stage.panning { cursor: grabbing; }","+#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }","+#wires { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }","+.zoom { position: absolute; left: 14px; bottom: 14px; display: flex; gap: 4px; z-index: 3; }","+.zoom .btn { width: 34px; padding: 6px 0; text-align: center; }","+.colhead { position: absolute; font: 600 11px/1 var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); white-space: nowrap; }","+","+/* wires */","+.w { fill: none; stroke: var(--wire); stroke-width: 1.3; transition: opacity .15s, stroke .15s; }","+.w.ui { stroke-dasharray: 4 4; }","+.w.writes { stroke: var(--k-data); stroke-opacity: .55; stroke-dasharray: 2 3; }","+.w.hi { async function inflate(b64) {
  const bytes = Uint8Array.from(atob(b64.replace(/-/g, "+").replace(/_/g, "/")), (c) => c.charCodeAt(0));
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return JSON.parse(await new Response(stream).text());
}

function fromFile(error) {
  const box = document.createElement("section");
  box.className = "drop";
  box.innerHTML = `<h1>Open a flowmap change</h1>
    <p>Drop a change page (<code>docs/flowmap/changes/&lt;name&gt;.html</code>) or its data as JSON here.
    It is read in this tab and sent nowhere.</p>
    <p><input type="file" accept=".html,.json"></p><p class="err" hidden></p>`;
  const err = box.querySelector(".err");
  if (error) { err.hidden = false; err.textContent = error; }
  document.querySelector(".wrap").replaceChildren(box);
  document.querySelector(".tray").hidden = true;
  return new Promise((resolve) => {
    const read = async (f) => {
      try {
        const text = await f.text();
        const m = /const EMBEDDED = (\{.*?\});\n/s.exec(text) || /const DATA = (\{.*?\});\n/s.exec(text);
        const data = JSON.parse(m ? m[1] : text);
        if (!data.facts || !data.chapters) throw new Error("not flowmap change data");
        resolve(data);
      } catch (e) { err.hidden = false; err.textContent = `Could not read ${f.name}: ${e.message}`; }
    };
    box.querySelector("input").addEventListener("change", (e) => e.target.files[0] && read(e.target.files[0]));
    addEventListener("dragover", (e) => { e.preventDefault(); box.classList.add("over"); });
    addEventListener("dragleave", () => box.classList.remove("over"));
    addEventListener("drop", (e) => { e.preventDefault(); box.classList.remove("over"); e.dataTransfer.files[0] && read(e.dataTransfer.files[0]); });
  });
}

async function load() {
  if (EMBEDDED) return EMBEDDED;
  if (PAYLOAD) {

  nNew && [nNew, "new functions"], nMod && [nMod, "changed functions"],
  Object.keys(F.reach.gained).length && [Object.keys(F.reach.gained).length, "existing functions newly reached", Object.keys(F.reach.gained).map(sym).join(", ")],
  Object.keys(F.reach.lost).length && [Object.keys(F.reach.lost).length, "existing functions no longer reached", Object.keys(F.reach.lost).map(sym).join(", ")],
  F.modules.added.length && [`+${F.modules.added.length}`, "module links", F.modules.added.map(([a, b]) => `${a.split("/").pop()} → ${b.split("/").pop()}`).join(", ")],
  [F.tests.changed.length || "no", F.tests.changed.length === 1 ? "test changed" : "tests changed", F.tests.changed.join(", ")],
].filter(Boolean);
function overview(pane) {
  pane.className = "pane";
  pane.append(el("div", {}, el("div", { class: "ch-tags" }, el("span", { class: "tag", text: "Overview" })),
    el("h2", { text: `What this change does, in ${plural(chapters.length, "part")}` })));
  if (S.intent) pane.append(el("p", { class: "claim", html: md(S.intent) }));
  if (S.delta) pane.append(el("p", { class: "delta", html: md(S.delta) }));
  const was = noLonger();
  if (was.length) pane.append(el("section", { style: "display:grid;gap:8px" }, el("h3", { class: "label", text: "No longer true" }),
    el("ul", { class: "was" }, ...was.map(([t, cite]) => el("li", { html: `<s>${t}</s>` + (cite ? ` <small>${cite}</small>` : "") })))));
  pane.append(el("p", { class: "kept", html: "<b>Still true.</b> " + stillTrue() }));
  pane.append(el("ul", { class: "shape", "aria-label": "Shape of the change" },
    ...shape.map(([v, k, t]) => el("li", { title: t || null }, el("b", { text: String(v) }), " " + k))));
  const ref = (c) => el("button", { type: "button", class: "ref " + c.role, title: c.title, onclick: () => show(c.n) }, String(c.n));
  const lanes = el("div", { class: "lanes" });
  for (const f of F.map) {
    const at = (k) => chapters.filter(c => c.keys.includes(k));
    if (!f.steps.some(s => at(s.key).length)) continue;
    lanes.append(el("section", { class: "lane" }, el("h3", { text: flowName(f.id) }), el("ol", {}, ...f.steps.map(s => {
      const hits = at(s.key);
      return el("li", { class: hits.length ? "touched " + hits[0].role : null }, el("span", { class: "dot", "aria-hidden": "true" }),
        el("span", { text: s.name }), hits.length ? el("span", { class: "refs" }, ...hits.map(ref)) : null);
    }))));
  }
  const off = chapters.filter(c => !c.keys.length);
  if (off.length) lanes.append(el("section", { class: "lane" }, el("h3", { text: "Off the map" }),
    el("div", { class: "refs", style: "display:grid;gap:6px" }, ...off.map(c => el("span", { style: "display:flex;gap:8px;align-items:baseline;font-size:13px" }, ref(c), c.title)))));
  if (lanes.children.length) pane.append(el("section", { style: "display:grid;gap:10px" }, el("h3", { class: "label", text: "Where it lands" }),
    el("p", { class: "note", text: "Each line is a user flow, its stops in order. A filled stop runs changed code; the numbers under it are the parts that change it." }), lanes));
  if (!S.delta) pane.append(el("p", { class: "note", text: "No story for this change: each part below is grouped by the flow steps that run its code." }));
}

// what a reader of the old map believed that this change makes false: the story's lines (each
// cites the diff), then what the facts show on their own
function noLonger() {
  const name = (k) => steps.has(k) ? steps.get(k).name : k;
  return [
    ...(S.no_longer || []).map(w => [md(w.was), md("`" + (w.cite || "") + "`") +
      (w.step ? ` · the map's step “${esc(name(w.step))}” still says this: re-run the map loop` : "")]),
    ...F.endpoints.removed.map(e => [md("`" + e + "` is an entry point"), "removed"]),
    ...Object.entries(F.reach.lost).map(([s, eps]) => [md(`${eps.map(e => "`" + e + "`").join(", ")} can run \`${sym(s)}\``), esc(file(s))]),
    ...F.modules.removed.map(([a, b]) => [md(`\`${a.split("/").pop()}\` calls into \`${b.split("/").pop()}\``), "no call left"]),
    ...(F.anchors_lost || []).map(a => [md(`The map's step “${name(a.step)}” runs \`${sym(a.anchor)}\``), "gone from the code: re-run the map loop"]),
  ];
}
// what the reader can keep, scoped to what the call graph can vouch for
function stillTrue() {
  const V = F.verdict, parts = [];
  if (quiet.length) parts.push(`${quiet.join(", ")} ${quiet.length === 1 ? "is" : "are"} untouched`);
  if (V && F.endpoints.total) parts.push(`${F.endpoints.total - V.spreads_to.length} of ${F.endpoints.total} entry points run no changed code`);
  if (!Object.keys(F.reach.lost).length && !F.endpoints.removed.length) parts.push("no entry point lost reach to existing code");
  if (!F.edges.removed.length) parts.push("no existing call was removed");
  const scope = V && V.blind.length ? ` <small>(in code the call graph sees; it can't vouch for: ${V.blind.map(md).join("; ")})</small>`
    : ` <small>(in code the call graph sees)</small>`;
  return (parts.length ? parts.join("; ") : "nothing the graph can vouch for") + "." + scope;
}

// rail: the parts
$("#toc-h").textContent = `The change in ${plural(chapters.length, "part")}`;
$("#toc").append(el("li", { class: "ov" }, el("button", { type: "button", "data-ch": 0, onclick: () => show(0) },
  el("span", { class: "n", text: "◎" }), el("span", { class: "t", text: "Overview" }), el("span", { class: "w", text: "what moves, and how much" }))));
for (const c of chapters) {
  $("#toc").append(el("li", { class: minor(c) ? "minor" : null }, el("button", { type: "button", class: c.role, "data-ch": c.n, onclick: () => show(c.n) },
    el("span", { class: "n", text: String(c.n) }), el("span", { class: "t", text: c.title }), el("span", { class: "w", text: where(c) }))));
}

// rail: the map, touched flows only; a stop says which parts run there
const quiet = [];
for (const f of F.map) {
  const at = (k) => chapters.filter(c => c.keys.includes(k));
  if (!f.steps.some(s => at(s.key).length)) { quiet.push(flowName(f.id)); continue; }
  const ol = el("ol", { class: "stops" });
  for (const s of f.steps) {
    const hits = at(s.key);
    ol.append(el("li", {}, el(hits.length ? "button" : "div", {
      class: "stop" + (hits.length ? " touched " + hits[0].role : ""), "data-key": s.key, type: hits.length ? "button" : null,
      title: hits.length ? `${s.name}\nParts: ${hits.map(c => c.n).join(", ")}` : `${s.name}\nNot touched`,
      onclick: hits.length ? () => { const i = hits.findIndex(c => c.n === current); show(hits[(i + 1) % hits.length].n); } : null },
      el("span", { class: "dot", "aria-hidden": "true" }), el("span", { class: "nm", text: s.name }))));
  }
  $("#map").append(el("section", { class: "flow" }, el("h3", { text: flowName(f.id) }), ol));
}
const off = chapters.filter(c => !c.keys.length);
if (off.length) {
  const ol = el("ol", { class: "stops" });
  off.forEach(c => ol.append(el("li", {}, el("button", { type: "button", class: "stop touched " + c.role, "data-off": c.n, title: c.title, onclick: () => show(c.n) },
    el("span", { class: "dot", "aria-hidden": "true" }), el("span", { class: "nm", text: `${c.n} · ${c.title}` })))));
  $("#map").append(el("section", { class: "flow" }, el("h3", { text: "Off the map" }), ol));
}
if (quiet.length) $("#map").append(el("p", { class: "quiet-flows", text: `Untouched: ${quiet.join(", ")}` }));
if (DATA.folded.length) $("#folded").textContent = `Not shown: ${plural(DATA.folded.length, "generated or test file")} (${DATA.folded.map(p => p.split("/").pop()).join(", ")})`;
if ((DATA.trimmed || []).length) $("#folded").textContent = `${$("#folded").textContent} Left out of this link to fit a PR body: ${DATA.trimmed.join(" and ")}; see the PR diff.`.trim();

// a part's code as a call tree: the shape that existed, with the calls this change added (+) or
// removed (−); a changed function in the part opens its own calls, everything else is a leaf, and
// calls nothing changed collapse to a count
const label = (n) => `${n.split(":")[0].replace(/(\/__init__)?\.\w+$/, "").split("/").pop()}.${sym(n)}`;  // graphs/__init__.py -> graphs
function callTree(c) {
  const ids = new Set(c.symbols || []);
  const node = (id) => id.replace(/\.__init__$/, "");
  const symOf = (n) => symById.get(n) || symById.get(n + ".__init__");
  const edge = (list, a, b) => list.some(([x, y]) => x === a && y === b);
  const kids = (n) => {
    const out = [...F.edges.added.filter(([a]) => a === n).map(([, b]) => ["+", b]),
      ...F.edges.removed.filter(([a]) => a === n).map(([, b]) => ["−", b]),
      ...F.symbols.filter(t => node(t.id) !== n && t.callers.some(x => x.id === n) && !edge(F.edges.added, n, node(t.id)) &&
        !edge(F.edges.removed, n, node(t.id))).map(t => ["", node(t.id)])];
    const rest = (symOf(n) || {}).kept_calls - out.filter(([m]) => !m).length;
    return [out, rest > 0 ? rest : 0];
  };
  const note = (n) => {
    const s = symOf(n);
    if (s) {
      const o = chapters.find(x => x !== c && (x.symbols || []).includes(s.id));
      return { new: "new", modified: "changed", deleted: "deleted" }[s.status] + (o ? ` → part ${o.n}` : "");
    }
    if (F.reach.gained[n]) return "existing, now runs from " + F.reach.gained[n].join(", ");
    if (F.reach.lost[n]) return "existing, no longer runs from " + F.reach.lost[n].join(", ");
    return "";
  };
  const lines = [], seen = new Set();
  const walk = (n, mark, prefix, last, root) => {
    lines.push([(root ? "" : prefix + (last ? "└─ " : "├─ ")) + (mark || " ") + " " + label(n), mark, note(n), n]);
    if (seen.has(n) || !(root || inIds(ids, n))) return;
    seen.add(n);
    const [out, rest] = kids(n), sub = root ? "" : prefix + (last ? "   " : "│  ");
    out.forEach(([m, b], i) => walk(b, m, sub, i === out.length - 1 && !rest, false));
    if (rest) lines.push([sub + "└─   " + plural(rest, "call") + " unchanged", "", "", null]);
  };
  const roots = c.syms.filter(s => !s.callers.some(x => inIds(ids, x.id)));
  for (const s of roots.length ? roots : c.syms.slice(0, 1)) {
    if (seen.has(node(s.id))) continue;
    const [k, path] = Object.entries(s.witness)[0] || [];
    const hops = path ? path.slice(0, -1).map(label) : [];
    if (k) lines.push([[steps.get(k).endpoints[0], ...(hops.length > 3 ? [hops[0], "…", ...hops.slice(-2)] : hops)].join(" › "), "from", "", null]);
    walk(node(s.id), "", "", true, true);
  }
  if (!lines.length) return null;
  const MAX = 18, shown = lines.length > MAX ? [...lines.slice(0, MAX - 1), [`… ${lines.length - MAX + 1} more lines`, "from", "", null]] : lines;
  const blind = (c.files || []).filter(f => !["code", "test", "generated"].includes((F.files.find(x => x.path === f) || {}).kind));
  const read = blind.filter(f => c.hunks.some(h => h.file === f)), unread = blind.filter(f => !read.includes(f));
  if (read.length) shown.push([`?  ${read.join(", ")}: not in the call graph, read its code below`, "from", "", null]);
  if (unread.length) shown.push([`?  ${unread.join(", ")}: not in the call graph, see the PR diff`, "from", "", null]);
  return el("pre", { class: "tree" }, ...shown.map(([t, m, n, id]) => el("span", { class: { "+": "add", "−": "rem", from: "from" }[m] || "", title: id },
    t, n ? el("i", { text: "   " + n }) : null)));
}
const fold = (title, sub, ...body) => el("details", {}, el("summary", {}, title, sub ? el("small", { text: sub }) : null), el("div", {}, ...body));

// pane: one part at a time
let current = 0;
function show(n, focus = true) {
  const c = chapters[n - 1];
  current = n;
  document.querySelectorAll("#toc button").forEach(b => b.setAttribute("aria-current", String(+b.dataset.ch === n)));
  // the overview lights every touched stop in its own part's colour; a part lights only its own
  document.querySelectorAll("#map .stop").forEach(s => s.classList.toggle("lit", c ? c.keys.includes(s.dataset.key) || +s.dataset.off === n : s.classList.contains("touched")));
  $("#map").style.removeProperty("--sel");
  if (c) $("#map").style.setProperty("--sel", `var(--${{ core: "core", supporting: "support", refactor: "refactor" }[c.role] || "outside"})`);
  $("#rail-map").hidden = !c;
  const pane = $("#pane");
  pane.replaceChildren();
  if (!c) overview(pane);
  else part(pane, c);

  const nav = el("div", { class: "step-nav" });
  for (const [dir, label] of [[-1, "Previous"], [1, n ? "Next" : "Start"]]) {
    const o = n + dir === 0 ? { n: 0, title: "Overview" } : chapters[n - 1 + dir];
    if (o) nav.append(el("button", { type: "button", "data-dir": String(dir), onclick: () => show(o.n) }, el("small", { text: o.n ? `${label} · ${o.n} of ${chapters.length}` : label }), o.title));
  }
  pane.append(nav, el("p", { class: "keys", html: "<kbd>←</kbd> <kbd>→</kbd> or <kbd>j</kbd> <kbd>k</kbd> to move between parts" }));
  if (focus) { pane.focus({ preventScroll: true }); if (pane.getBoundingClientRect().top < 0) pane.scrollIntoView({ block: "start" }); }
}

function part(pane, c) {
  pane.className = "pane " + c.role;

  pane.append(el("div", {},
    el("div", { class: "ch-tags" }, el("span", { class: "num", text: `${c.n} of ${chapters.length}` }), el("span", { class: "tag", text: ROLE[c.role] || c.role }),
      c.kind && c.kind !== c.role ? el("span", { class: "kind", text: c.kind }) : null),
    el("h2", { html: md(c.title) })));
  if (c.claim) pane.append(el("p", { class: "claim", html: md(c.claim) }));
  pane.append(el("p", { class: "runs", html: c.keys.length
    ? "Runs in " + F.map.filter(f => c.keys.some(k => steps.get(k).flow === f.id)).map(f => {
        const mine = f.steps.filter(s => c.keys.includes(s.key));
        return `<b title="${esc(mine.map(s => s.name).join("\n"))}">${esc(flowName(f.id))}</b> (${mine.length === 1 ? esc(mine[0].name) : `${mine.length} of ${f.steps.length} steps`})`;
      }).join(" · ")
    : "No flow on the map runs this." }));

  if (c.before || c.after) pane.append(el("div", { class: "ba" },
    el("div", {}, el("p", { class: "label", text: "Before" }), el("p", { html: md(c.before || "—") })),
    el("div", { class: "after" }, el("p", { class: "label", text: "After" }), el("p", { html: md(c.after || "—") }))));
  if ((c.verified || []).length) pane.append(el("p", { class: "verified", html: "<b>Verified:</b> " +
    c.verified.map(v => `<span class="how${v.how === "not checked" ? " no" : ""}">${esc(v.how)}</span> ${md(v.what)}`).join(" · ") }));
  const tree = callTree(c);
  if (tree) pane.append(el("section", { style: "display:grid;gap:8px" }, el("h3", { class: "label", text: "Calls, before → after" }), tree,
    el("p", { class: "note", text: "+ added, − removed by this change; the rest existed before. Built from the call graph, so dispatch it can't follow (dicts, templates) is missing." })));
  if (c.why) pane.append(el("p", { class: "why", html: "<b>Why it matters.</b> " + md(c.why) }));
  if (!c.before && !c.after && !c.why) pane.append(el("p", { class: "note", text: "No story for this part: the facts below are all flowmap knows. Add it to the story file to say what changes and why." }));

  if (c.qs.length) {
    const ol = el("ol", { class: "qs" });
    for (const q of c.qs) {
      const kind = { ask: "Ask the author", check: "Check yourself", graph: "From the graph" }[q.kind] || q.kind;
      ol.append(el("li", { class: "q" },
        el("input", { type: "checkbox", id: q.id, checked: picked.has(q.id) ? "" : null,
          onchange: (e) => { e.target.checked ? picked.add(q.id) : picked.delete(q.id); renderNote(); } }),
        el("label", { for: q.id }, el("span", { class: "qtext", html: `<span class="qkind ${esc(q.kind)}">${esc(kind)}</span>` + md(q.q) }),
          q.why ? el("span", { class: "qwhy", html: md(q.why) }) : null)));
    }
    pane.append(el("section", { style: "display:grid;gap:10px" }, el("h3", { class: "label", text: "Questions, most decisive first" }), ol));
  }

  // evidence, on demand
  const more = el("div", { class: "more" });
  const rows = [
    ...movesFor(c, c.keys, "lost").map(([s, eps]) => ["rem", "no longer", `${file(s)} · ${sym(s)} from ${eps.join(", ")}`]),
    ...movesFor(c, c.keys, "gained").map(([s, eps]) => ["add", "now reaches", `${file(s)} · ${sym(s)} from ${eps.join(", ")}`]),
    ...[...c.callers].sort((a, b) => a[1] - b[1]).map(([id, edited]) => [edited ? "yes" : "no", edited ? "caller, edited" : "caller, not edited", `${file(id)} · ${sym(id)}`]),
  ];
  if (rows.length) {
    const notEdited = [...c.callers.values()].filter(e => !e).length;
    more.append(fold("Callers and reach", notEdited ? `${notEdited} caller${notEdited === 1 ? "" : "s"} not edited` : "",
      el("ul", { class: "rows" }, ...rows.map(([k, m, t]) => el("li", {}, el("span", { class: "mark " + k, text: m }), el("span", { text: t }))))));
  }
  if (c.hunks.length) {
    const box = el("div", { style: "display:grid;gap:10px" });
    const hunkEls = c.hunks.map(h => {
      const pre = el("pre");
      h.lines.forEach(l => pre.append(el("span", { class: l[0] === "+" ? "a" : l[0] === "-" ? "r" : "", text: l })));
      const n = el("div", { class: "hunk" }, el("div", { class: "hh", text: `${h.file} @ ${h.new}${h.ctx ? " · " + h.ctx : ""}` }), pre);
      n._syms = h.symbols; n._file = h.file;
      return n;
    });
    // pick a symbol (or file) to see only its hunks
    const keysOf = [...new Set([...c.syms.map(s => s.id), ...c.hunks.filter(h => !h.symbols.length).map(h => h.file)])];
    const chips = el("div", { class: "chips" });
    const filter = (key) => {
      chips.querySelectorAll(".chip").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.k === key)));
      hunkEls.forEach(n => { n.hidden = key != null && !(n._syms.includes(key) || (!n._syms.length && n._file === key)); });
    };
    if (keysOf.length > 1) keysOf.forEach(k => {
      const s = symById.get(k);
      chips.append(el("button", { type: "button", class: "chip", "data-k": k, "aria-pressed": "false", title: k,
        onclick: (e) => filter(e.currentTarget.getAttribute("aria-pressed") === "true" ? null : k) },
        s ? (c.syms.filter(o => sym(o.id) === sym(k)).length > 1 ? `${file(k)} · ${sym(k)}` : sym(k)) : k.split("/").pop(), s && s.status !== "modified" ? el("i", { text: s.status }) : null));
    });
    box.append(chips, ...hunkEls);
    const files = [...new Set(c.hunks.map(h => h.file.split("/").pop()))];
    more.append(fold("Code", `${plural(c.hunks.length, "hunk")} in ${files.slice(0, 4).join(", ")}${files.length > 4 ? ` and ${files.length - 4} more` : ""}`, box));
  }
  if (more.children.length) pane.append(more);
}

function renderNote() {
  const lines = [];
  for (const c of chapters) {
    const qs = c.qs.filter(q => picked.has(q.id));
    if (!qs.length) continue;
    lines.push(`${c.n}. ${c.title}`);
    qs.forEach(q => lines.push(`   - ${q.q}`));
  }
  $("#note").value = lines.join("\n");
  $("#count").textContent = plural(picked.size, "question");
}

addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  const d = { ArrowRight: 1, j: 1, ArrowLeft: -1, k: -1 }[e.key];
  if (d && current + d >= 0 && current + d <= chapters.length) { e.preventDefault(); show(current + d); }
});
$("#peek").addEventListener("click", (e) => {
  const open = $("#note").hidden;
  $("#note").hidden = !open;
  e.target.setAttribute("aria-expanded", String(open));
  e.target.textContent = open ? "Hide" : "Show";
});
$("#copy").addEventListener("click", async () => {
  const t = $("#note");
  try { await navigator.clipboard.writeText(t.value); $("#status").textContent = "Copied"; }
  catch (e) { t.hidden = false; t.focus(); t.select(); $("#status").textContent = "Selected: press Ctrl+C or Cmd+C to copy"; }
});
renderNote();
show(0, false);
</script>
