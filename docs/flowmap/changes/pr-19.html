/* Layout: overview first, one part at a time, evidence on demand. The left rail is the whole

  --muted: #5b6676;
  --rule: #cdd4dc;
  --line: #9aa6b4;
  --accent: #2e5bff;
  --accent-soft: rgba(46, 91, 255, .12);
  --core: #2e5bff;
  --support: #0f7c86;
  --refactor: #6b7686;
  --outside: #b7791f;
  --gain: #1e8a4c;
  --loss: #c8423b;
  --code-bg: #f6f8fa;
  --display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}

  :root:not([data-theme="light"]) {
    --paper: #0f141a; --surface: #161d26; --ink: #e6ebf1; --muted: #93a0b0; --rule: #2a3441;
    --line: #4a5666; --accent: #7c9cff; --accent-soft: rgba(124, 156, 255, .16);
    --core: #7c9cff; --support: #3cc0cb; --refactor: #93a0b0; --outside: #f0b429;
    --gain: #3fbf78; --loss: #ef6b63; --code-bg: #10161d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f141a; --surface: #161d26; --ink: #e6ebf1; --muted: #93a0b0; --rule: #2a3441;
  --line: #4a5666; --accent: #7c9cff; --accent-soft: rgba(124, 156, 255, .16);
  --core: #7c9cff; --support: #3cc0cb; --refactor: #93a0b0; --outside: #f0b429;
  --gain: #3fbf78; --loss: #ef6b63; --code-bg: #10161d; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 15px/1.55 var(--body); }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.core { --role: var(--core); } .supporting { --role: var(--support); } .refactor { --role: var(--refactor); }
.outside, .unassigned, .off-map { --role: var(--outside); }

/* header: which change; the overview pane says what it does */

.range { color: var(--muted); font-size: 13px; }
.range a { color: inherit; }
.delta { font-size: 18px; line-height: 1.55; margin: 0; max-width: 68ch; }
/* the lens verdict: the first thing to know, its reasons one click away */
.verdict { justify-self: start; max-width: 80ch; font-size: 14px; }
.verdict summary { cursor: pointer; }
.verdict summary b { margin-right: 8px; }
.verdict b { font: 700 11px var(--body); text-transform: uppercase; letter-spacing: .08em; border-radius: 4px; padding: 2px 7px; color: var(--surface); }
.verdict.contained b { background: var(--gain); } .verdict.spreads b { background: var(--outside); } .verdict.blind b { background: var(--loss); }
.verdict ul { margin: 8px 0 0; padding-left: 20px; display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.lint { justify-self: start; max-width: 80ch; font-size: 13px; border: 1px solid var(--loss); border-radius: 8px; padding: 8px 12px; }
.lint ul { margin: 4px 0 0; padding-left: 18px; }
.was { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; font-size: 14px; }
.was s { text-decoration-color: var(--loss); text-decoration-thickness: 1px; }
.was small, .kept small { color: var(--muted); font-size: 12px; }
.kept { margin: 0; font-size: 14px; max-width: 72ch; }
.shape { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; font-size: 12.5px; }
.shape li { background: var(--surface); border: 1px solid var(--rule); border-radius: 999px; padding: 2px 10px; }
.shape b { font-variant-numeric: tabular-nums; }

/* rail + pane */
.body { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 22px; align-items: start; }
@media (max-width: 900px) { .body { grid-template-columns: minmax(0, 1fr); } }
.rail { display: grid; gap: 18px; position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow-y: auto; padding-bottom: 8px; }
@media (max-width: 900px) { .rail { position: static; max-height: none; } }
.rail section { display: grid; gap: 8px; }

/* the parts, as a table of contents */
.toc { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.toc button { width: 100%; text-align: left; background: none; border: 1px solid transparent; border-radius: 8px; padding: 8px 10px;
  display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 2px 10px; cursor: pointer; }

.toc .t { font-weight: 500; font-size: 13.5px; line-height: 1.35; }
.toc .w { font-size: 12px; color: var(--muted); line-height: 1.3; }

/* the map: flows as lines, the selected part's stops lit, the others faint */
.flow { display: grid; gap: 2px; }
.flow h3 { font: 700 12.5px/1.2 var(--display); font-stretch: 80%; margin: 6px 0 2px; letter-spacing: .02em; }
.stops { list-style: none; margin: 0; padding: 0; position: relative; display: grid; }
.stops::before { content: ""; position: absolute; left: 7px; top: 10px; bottom: 10px; width: 2px; background: var(--line); }
.stop { position: relative; display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 8px; align-items: start; width: 100%;

button.stop { cursor: pointer; }
button.stop:hover { background: var(--surface); }
.stop .dot { width: 12px; height: 12px; margin: 1px 2px; border-radius: 50%; background: var(--paper); border: 2px solid var(--line); position: relative; z-index: 1; }
.stop.touched { color: var(--ink); }

.stop.lit { font-weight: 600; }
.stop.lit .dot { background: var(--sel, var(--role)); border-color: var(--sel, var(--role)); box-shadow: 0 0 0 3px var(--paper), 0 0 0 5px var(--sel, var(--role)); }
.stop .nm { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.stop.lit .nm { -webkit-line-clamp: unset; }
/* the overview's map: each touched flow as a line of stops, the parts that run each stop under it */
.lanes { display: grid; gap: 14px; }
.lane { display: grid; gap: 6px; }
.lane h3 { font: 700 13px/1.2 var(--display); font-stretch: 80%; margin: 0; letter-spacing: .02em; }
.lane ol { list-style: none; margin: 0; padding: 0; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(120px, 1fr); overflow-x: auto; }
.lane li { position: relative; display: grid; gap: 6px; align-content: start; padding: 0 8px 4px 0; font-size: 12px; line-height: 1.3; color: var(--muted); }
.lane li::before { content: ""; position: absolute; top: 6px; left: 0; right: 0; height: 2px; background: var(--line); }
.lane li:first-child::before { left: 6px; } .lane li:last-child::before { right: calc(100% - 8px); }
.lane .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--surface); border: 2px solid var(--line); position: relative; }
.lane li.touched { color: var(--ink); }
.lane li.touched .dot { background: var(--role); border-color: var(--role); }
.lane .refs { display: flex; flex-wrap: wrap; gap: 4px; }
.ref { font: 600 11px/1 var(--mono); border-radius: 999px; padding: 3px 7px; border: 1px solid var(--role); color: var(--role); background: var(--surface); cursor: pointer; }
.ref:hover { background: var(--accent-soft); }
.quiet-flows { font-size: 12px; color: var(--muted); margin: 4px 0 0; }
.folded { font-size: 12px; color: var(--muted); margin: 0; overflow-wrap: anywhere; }

/* the pane: one part */
.pane { background: var(--surface); border: 1px solid var(--rule); border-top: 4px solid var(--role); border-radius: 12px;
  padding: 22px 24px; display: grid; gap: 18px; min-width: 0; }
.ch-tags { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.num { font: 700 12px var(--mono); color: var(--surface); background: var(--role); border-radius: 6px; padding: 2px 8px; }
.tag { font: 600 11px var(--body); text-transform: uppercase; letter-spacing: .08em; color: var(--role); }
.kind { font-size: 12px; color: var(--muted); }
.pane h2 { font: 750 clamp(21px, 2.6vw, 28px)/1.15 var(--display); font-stretch: 80%; margin: 4px 0 0; }
.claim { margin: 0; font-size: 16px; color: var(--muted); max-width: 70ch; }
.pane:focus { outline: none; }
.runs { margin: 0; font-size: 13px; color: var(--muted); }
.runs b { color: var(--ink); font-weight: 500; }

.ba { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
@media (max-width: 720px) { .ba { grid-template-columns: minmax(0, 1fr); } }
.ba > div { background: var(--surface); padding: 12px 14px; display: grid; gap: 4px; align-content: start; }
.ba .after { background: var(--paper); }
.ba p { margin: 0; font-size: 14px; }
.tree { margin: 0; overflow-x: auto; background: var(--code-bg); border: 1px solid var(--rule); border-radius: 8px; font: 12px/1.6 var(--mono); padding: 8px 0; }
.tree span { display: block; padding: 0 12px; white-space: pre; min-width: max-content; }

button.primary { font: 600 14px var(--body); background: var(--accent); color: var(--surface); border: 0; border-radius: 8px; padding: 7px 14px; cursor: pointer; }
button.ghost { background: none; border: 1px solid var(--rule); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
.status { font-size: 13px; color: var(--muted); }

ow_title\",\"from_page\",\"graph\",\"graph.edge\",\"graph.walk\",\"main\",\"paint\",\"paint.file_of\",\"screen_group\"]}},\"steps\":{\"s:build-the-map/reconcile-passes\":{\"kind\":\"direct\",\"via\":[\"canonical_new_flows\",\"write_questions_md\"]},\"s:browse-the-map/build-atlas\":{\"kind\":\"direct\",\"via\":[\"build\",\"data\"]},\"s:browse-the-map/draw-canvas\":{\"kind\":\"new\",\"via\":[\"__main__\",\"data\",\"data_label\",\"from_page\"]}},\"off\":[],\"off_files\":[],\"changed\":4,\"new\":13,\"added_endpoints\":[\"CLI flowmap canvas\"],\"verdict\":{\"verdict\":\"blind\",\"spreads_to\":[\"CLI flowmap atlas\",\"CLI flowmap canvas\",\"CLI flowmap reconcile\"],\"blind\":[\"module-level code changed (constants, config, router registration): `flowmap/canvas.py`\",\"files outside the analysed code: `bench/fastapi-template/map/canvas.html`, `bin/flowmap`, `flowmap.toml`, `flowmap/canvas.template.html`\"]},\"story\":{\"title\":\"The map draws as one canvas a change is painted on, and flowmap's own map is current again\",\"intent\":\"Prototype a left-to-right canvas of the map (flows, code, data) that a reviewer can learn by looking, paint a PR on it, and refresh flowmap's own stale map so the canvas has something current to show.\",\"delta\":\"browse-the-map gains a step: `flowmap canvas` draws the map as one picture, files placed by call depth, and paints a change with its story's parts numbered on the cards. The atlas page and its command behave as before; atlas.data now builds the dict both pages draw. build-the-map's reconcile can adopt a proposed flow under a name of the user's own. flowmap's own map is rebuilt from four agreeing passes into three named flows. lens, the change page and its --link are unchanged. lens calls this blind: canvas.py has module-level constants, and the page template, bin/flowmap (which wires up the command) and flowmap.toml sit outside the analysed code, so read those in the diff.\",\"url\":\"https://github.com/NelisVerhoef/Flowmap/pull/17\",\"pr\":\"PR #17\",\"no_longer\":[\"A vocabulary entry adopts a proposed flow only when its id equals the proposal's id without `new:`; renaming one, as QUESTIONS.md invites, leaves its steps under the old `new:` flow\",\"flowmap's own map has three unnamed draft flows and no step for `flowmap change` or `flowmap viewer`\",\"A PR overlay records how many functions a change touched, not which ones\"],\"chapters\":[{\"n\":1,\"title\":\"The map draws as one left-to-right canvas, and a change is painted on it\",\"role\":\"core\",\"before\":\"The map had two views: Mermaid diagrams and the atlas, which lists each flow's steps as a column of sentences. A change was read on the change page, a document whose only picture is a row of dots per flow.\",\"after\":\"`flowmap canvas` writes docs/flowmap/canvas.html: screens, flows and steps, one card per file placed by call depth, and the data the steps write, wired left to right from the call graph. Click a flow to light its path, \\u25b6 to walk it step by step, double-click a file to see its functions with callers left and callees right. `--change <name>=<base>..<head>` paints changed and new files, marks the steps that run them, numbers the story's parts on their cards, and gives changed code no step runs its own \\\"not on the map\\\" column. `--from <atlas.html>` redraws an existing atlas page's data. The paint comes from the atlas overlay (`atlas.overlay`); the verdict on the page comes from `lens.analyse`, which `canvas.main` also runs.\",\"claim\":\"A reviewer sees where a change sits on a picture of the system instead of reading it.\",\"why\":\"Whoever reviews a flowmap PR reads it here first. The atlas and change page never built a picture people could learn, so the reviewer fell back to the diff. Rather than inlining a full graph-layout library such as ELK into every page, the page does a small column layout itself, because positions follow the map's order and that keeps the picture the same between builds; the cost is wires that can cross.\",\"questions\":[\"canvas paints changed code from `atlas.overlay`, which unlike `lens.analyse` doesn't skip docstring-only edits, so a file can be painted amber while the verdict ignores it. Should `canvas.main` take changed symbols from lens's facts instead?\",\"`canvas.from_page` scrapes `const DATA = \\u2026` out of a rendered atlas page. Should the atlas also write its data as JSON beside the page?\",\"Should the canvas become the page `flowmap change --link` opens, replacing the document-style change page?\",\"Open bench/fastapi-template/map/canvas.html, press \\u25b6 on Sign in, then open docs/flowmap/canvas.html and paint PR #16: can you say where each lands without the diff?\"],\"verified\":[\"test\",\"test\",\"test\",\"ran\",\"not checked\"],\"files\":[\"f:canvas.py\"],\"steps\":[\"s:browse-the-map/draw-canvas\"],\"outside\":[\"flowmap/canvas.template.html\",\"bin/flowmap\",\"README.md\",\"docs/flowmap/canvas.html\",\"bench/fastapi-template/map/canvas.html\"]},{\"n\":2,\"title\":\"The atlas's data is built once, and an overlay names the functions a change touched\",\"role\":\"supporting\",\"before\":\"`atlas.build` computed the atlas data and wrote the page in one function. A PR overlay carried counts of changed and new functions.\",\"after\":\"`atlas.data` returns the dict and `atlas.build` writes the page from it, so the canvas draws the same data. An overlay also carries `changed_ids`, `new_ids` and `added_endpoints`, which the canvas paints; the atlas page ignores them.\",\"claim\":\"One builder feeds both pages.\",\"why\":\"Runs under `flowmap atlas` and `flowmap canvas`. Rather than a second copy of the step and merge logic in canvas.py, the canvas reuses the atlas's, because two copies would drift. The cost: `atlas.data` and `atlas.overlay` now sit under both pages, so a bug there breaks the atlas and the canvas together.\",\"questions\":[\"`atlas.data` still calls `Diagrams.system()` only to fill `d.matrix`. With two pages built on it, should that become a function that returns the matrix?\",\"Diff a fresh `flowmap atlas` against the committed atlas.html: only the overlay keys and the map itself should differ.\"],\"verified\":[\"ran\",\"test\"],\"files\":[\"f:atlas.py\"],\"steps\":[\"s:browse-the-map/build-atlas\",\"s:browse-the-map/draw-canvas\"],\"outside\":[]},{\"n\":3,\"title\":\"A flow renamed when it is adopted keeps its steps\",\"role\":\"supporting\",\"before\":\"reconcile adopted a proposed flow only when a vocabulary id equalled the proposal without `new:`. Renaming it in flowmap.toml, as QUESTIONS.md invites, left its steps under the `new:` flow.\",\"after\":\"A vocabulary entry can name the proposal it adopts with `proposed = \\\"new:...\\\"` (one id or a list); any id in a merged proposal ties it to the user's name. The TOML block in QUESTIONS.md now writes that line, so a pasted block still works after renaming `id`. flowmap/config.py only gains the `proposed` line in its documented example.\",\"claim\":\"Naming flows works the way QUESTIONS.md says it does.\",\"why\":\"Runs once per map build, at the human step: whoever names the flows. Found while naming this repo's flows, whose chosen names differ from the proposals. Rather than pinning every entry point in decisions.json, which would mark each step \\\"confirmed\\\" when only its flow was named, the vocabulary says what it adopts.\",\"questions\":[\"Should reconcile warn when a `proposed` names no proposal (a typo), instead of silently leaving the `new:` flow beside the empty vocabulary one?\",\"Paste QUESTIONS.md's TOML block, rename one `id`, reconcile: does the flow keep its steps?\"],\"verified\":[\"test\",\"ran\"],\"files\":[\"f:reconcile.py\"],\"steps\":[\"s:build-the-map/reconcile-passes\"],\"outside\":[\"flowmap/config.py\"]},{\"n\":4,\"title\":\"flowmap's own map is current, with three named flows\",\"role\":\"outside\",\"before\":\"The map was built 21 commits ago: 8 steps in 3 unnamed draft flows, with no step for `flowmap change`, `canvas` or `viewer`.\",\"after\":\"11 entry points, 11 steps, all agreed by independent passes, in build-the-map, browse-the-map and review-a-change. lens's flow is pinned to review-a-change in decisions.json (the step itself is still \\\"agreed\\\": that grades how the passes grouped the step, not which flow it sits in). The goldens are regenerated: only step and flow placement and flow spread moved; the graph goldens did not. The anchors-lost test moved to its own fixture repo.\",\"claim\":\"Change pages from here on land on a map that knows today's commands.\",\"why\":\"Every later PR is placed on this map. On the old one, a change to change.py (PR #15) landed off the map entirely. The anchors-lost test cited functions deleted long ago; a fresh map can't cite them, so rather than rewriting its expected value to empty it now builds a repo whose map does.\",\"questions\":[\"lens is pinned to review-a-change against three of four passes, which put it under browse-the-map. Keep the pin?\",\"`bin/flowmap-pr-hook` runs `flowmap lens` on every push but is not an entry point: bin/ is outside `[code].graph` and the file has no .py. Map it in a follow-up?\"],\"verified\":[\"ran\",\"test\",\"test\",\"looked\"],\"files\":[],\"steps\":[],\"outside\":[\"docs/flowmap/map.json\",\"docs/flowmap/MAP.md\",\"docs/flowmap/QUESTIONS.md\",\"docs/flowmap/decisions.json\",\"flowmap.toml\",\"docs/flowmap/inventory.json\",\"docs/flowmap/atlas.html\",\"tests/golden/lens-6d9eaff-770f1a7.md\",\"tests/golden/change-facts-6d9eaff-770f1a7.json\"]}]}},{\"id\":\"pr-16\",\"title\":\"PR #16\",\"range\":\"69be006..8675ccd\",\"files\":{\"f:callgraph.py\":{\"kind\":\"changed\",\"syms\":[\"__main__\"]},\"f:lens.py\":{\"kind\":\"changed\",\"syms\":[\"analyse\",\"blind_spots\",\"defs\"]},\"f:graphs/codegraph.py\":{\"kind\":\"new\",\"syms\":[\"_part\",\"build\",\"doc\",\"hint\",\"outline\",\"signature\",\"symbols\"]}},\"steps\":{\"s:build-the-map/check-handlers-are-nodes\":{\"kind\":\"direct\",\"via\":[\"__main__\",\"build\",\"hint\"]},\"s:browse-the-map/build-atlas\":{\"kind\":\"reach\",\"via\":[\"defs\"]},\"s:review-a-change/run-lens\":{\"kind\":\"direct\",\"via\":[\"analyse\",\"blind_spots\",\"defs\"]},\"s:review-a-change/pull-change-facts\":{\"kind\":\"direct\",\"via\":[\"analyse\"]}},\"off\":[],\"off_files\":[],\"changed\":4,\"new\":7,\"added_endpoints\":[],\"verdict\":{\"verdict\":\"blind\",\"spreads_to\":[\"CLI flowmap atlas\",\"CLI flowmap callgraph\",\"CLI flowmap change\",\"CLI flowmap lens\"],\"blind\":[\"module-level code changed (constants, config, router registration): `flowmap/graphs/__init__.py`, `flowmap/graphs/codegraph.py`\",\"files outside the analysed code: `.claude-plugin/plugin.json`\"]},\"story\":{\"title\":\"The call graph covers TypeScript/JS, Ruby, Go, Java and more when codegraph is installed, and says to install it when it isn't\",\"intent\":\"Reuse codegraph (github.com/colbymchenry/codegraph, a tree-sitter indexer for 20+ languages) so flowmap gives deterministic reach for languages other than Python, and recommend installing it strongly without forcing it.\",\"delta\":\"A second call-graph builder now sits next to the Python one. When `codegraph` is on PATH, it indexes the graph files of every non-Python language at the revision being read and turns codegraph's SQLite graph into flowmap's `rel:Qual.name` nodes and call edges. Reach, the verdict, `callgraph check`, change pages and the atlas then cover that code. Without codegraph nothing changes: those files stay blind spots, but lens, `callgraph check` and the flowmap-build skill now name the install command. The Python builder, the graph format, adapters and map files are unchanged. Rails handlers still don't match codegraph's names (`index` vs `Admin.UsersController.index`), so Rails reach is still \\\"not yet\\\". lens calls this PR blind because `graphs/__init__.py` and `codegraph.py` gained module-level code (the builder list, the suffix and kind tables) and because of the plugin version bump.\",\"url\":\"https://github.com/NelisVerhoef/Flowmap/pull/16\",\"pr\":\"PR #16\",\"no_longer\":[\"A change to a TypeScript/JS or Ruby file always gets the blind-spot line \\\"code with no call graph (no builder for its language \\u2026)\\\", so lens can't name what it reaches\",\"The flowmap-build skill treats the call graph as Python-only (\\\"Python today\\\") and goes on without asking about other languages\"],\"chapters\":[{\"n\":1,\"title\":\"Non-Python code gets a call graph from codegraph's index\",\"role\":\"core\",\"before\":\"The only builder was graphs/python.py. Files in any other language had no nodes or edges: a Next.js route or a TS helper was \\\"not graphed\\\", and any change to one made lens say blind.\",\"after\":\"`build` writes the files (plus tsconfig/jsconfig/package.json/go.mod at the root and up to two levels down) into a temp dir and runs `codegraph init --yes` with DO_NOT_TRACK=1 and CODEGRAPH_NO_DAEMON=1. `_part` then reads functions, methods, constructors, classes, structs, modules and components as nodes. `A::b` becomes `rel:A.b`. calls, instantiations and references become edges, and a class also reaches its constructor (`constructor`, `initialize`, `__init__`, `init`, `new`). extends/implements become bases, and files with parse errors are reported as unparsed. `symbols`, `signature` and `doc` answer from the outline recorded while building, since flowmap asks them with file text alone. Python files keep their own builder. When `codegraph init` exits non-zero, every file it was given is reported as unparsed, so lens says blind (\\\"could not parse \\u2026\\\") instead of guessing. The builder reads codegraph's tables directly: a renamed column raises an error, and a renamed node kind would leave handlers out of the graph, which `flowmap callgraph check` reports as broken.\",\"claim\":\"With codegraph installed, a TS/JS, Ruby, Go or Java change gets reach like a Python one.\",\"why\":\"Reach is what lets a reviewer trust lens when it is quiet, and so far only Python repos had it. Rather than writing tree-sitter resolution in flowmap (a dependency, and a lot of resolver work per language), this reads a maintained indexer's output. Its node names already match what flowmap's adapters emit: all 36 handlers in a real Next.js app are nodes.\",\"questions\":[\"Rails: should the adapter emit class-qualified handlers (`users_controller.rb:Admin.UsersController.index`) so codegraph reach works, even though that renames handler ids in existing Rails maps?\",\"Run `flowmap callgraph check` with codegraph on a TS or Go repo you know: are any handlers broken, and are the edges into shared helpers the ones you'd expect?\",\"`build` runs codegraph twice per lens (base and head), about 1.2s each on 263 files. Is that acceptable on your largest repo, or should it reuse a `.codegraph/` index when the ref is the working tree?\"],\"verified\":[\"test\",\"ran\",\"ran\",\"looked\"],\"files\":[\"f:graphs/codegraph.py\"],\"steps\":[\"s:browse-the-map/build-atlas\",\"s:browse-the-map/draw-canvas\"],\"outside\":[]},{\"n\":2,\"title\":\"lens and atlas name the method a change sits in, not its class\",\"role\":\"supporting\",\"before\":\"Callers place diff lines on definitions through `lens.defs`, and lens and `atlas --pr` do it before building any graph. An indexer outlines a file only once it has indexed it, so a change inside `InsurerRegistry.isSupported` came out as `InsurerRegistry` (the regex outline's top-level name).\",\"after\":\"`lens.defs` asks a builder that has `outline` to index a text no build has seen, on its own (a single-file codegraph index), before reading its symbols. Every caller goes through `defs`: lens, `atlas --pr` and change facts. `analyse` also builds the base and head graphs first when there are graph roots, so changed files are outlined from those builds instead of one by one; it built both later anyway.\",\"claim\":\"Reach is reported for the changed method itself.\",\"why\":\"Reach is looked up by node id, and the class node doesn't carry the method's callers, so naming the class hid the endpoints that reach the method. The fix is in `defs` rather than in each caller because `atlas --pr` had the same order and never builds the base graph. Rather than giving `symbols()` a file path (changing the builder interface for Python too), the indexer gets an optional `outline(rel, text)`.\",\"questions\":[\"A single-file index can't resolve imports, but `outline` only reads definitions from it. Is any caller of `codegraph.signature` or `doc` reached with a text that no full build saw, where a missing signature would hide a contract change?\",\"When codegraph fails on a file (exit code non-zero), `outline` retries every time `defs` asks for it. Worth caching the failure?\"],\"verified\":[\"test\",\"test\",\"ran\",\"not checked\"],\"files\":[\"f:graphs/codegraph.py\",\"f:lens.py\"],\"steps\":[],\"outside\":[]},{\"n\":3,\"title\":\"Where codegraph is missing, flowmap says how to install it\",\"role\":\"supporting\",\"before\":\"Nothing told anyone a builder for other languages existed: the blind spot said \\\"no builder for its language\\\" and the skill said \\\"Python today\\\".\",\"after\":\"When codegraph is absent and a file it would parse has no graph, lens's blind spot and `callgraph check`'s \\\"no builder for .ts\\\" end with \\\"(`npm i -g @colbymchenry/codegraph` gives these a call graph)\\\". The flowmap-build skill has a step 0: if the repo has non-Python code and no codegraph, stop, explain that reach will be blind there, and ask to install it. Carry on without it only if the user says so. README lists it under \\\"On a new machine\\\". The plugin version moves to 0.3.0 so installed copies update.\",\"claim\":\"codegraph is strongly recommended at the moment its absence costs something, never installed behind anyone's back.\",\"why\":\"Claude Code plugins can't declare npm dependencies. Forcing it would mean a hook running a global npm install on every teammate's machine, which changes their machine and runs third-party install scripts without asking. Rather than a SessionStart nudge in every session, the hint appears only where reach is actually missing: lens output, which pr-lens copies into PR summaries, and setup.\",\"questions\":[\"Should the install line pin the tested version (`@colbymchenry/codegraph@1.6.2`), given that the builder reads codegraph's database schema directly?\",\"Is asking at build time enough, or do teammates who only review PRs (pr-lens) also need a nudge before their first lens?\"],\"verified\":[\"test\",\"ran\",\"not checked\"],\"files\":[\"f:callgraph.py\",\"f:graphs/codegraph.py\",\"f:lens.py\"],\"steps\":[\"s:build-the-map/check-handlers-are-nodes\"],\"outside\":[\"skills/flowmap-build/SKILL.md\",\"README.md\",\".claude-plugin/plugin.json\"]}]}}]};","+<script type=\"module\">","+// The data is embedded by `flowmap canvas`, or, in the hosted viewer, carried in the link's fragment","+// (#v1.<base64url of raw-deflated JSON>), which browsers never send to the server. The view's state","+// follows it in the fragment, so it survives a reload. Either way it goes nowhere else.","+const EMBEDDED = {\"flows\":[{\"id\":\"flow:build-the-map\",\"key\":\"build-the-map\",\"title\":\"Build the map\",\"summary\":\"Map a repo as flows -> steps -> code by agreement: list its entry points, hand briefs to independent passes, check their citations, and vote them into one map a human settles.\",\"steps\":[\"s:build-the-map/list-entry-points\",\"s:build-the-map/check-handlers-are-nodes\",\"s:build-the-map/write-pass-briefs\",\"s:build-the-map/verify-pass\",\"s:build-the-map/reconcile-passes\"],\"draft\":false},{\"id\":\"flow:browse-the-map\",\"key\":\"browse-the-map\",\"title\":\"Browse the map\",\"summary\":\"See the settled map: Mermaid diagrams at system/flow/step zoom, the interactive atlas, and the left-to-right canvas of screens, steps, code and data.\",\ s before; atlas.data now builds the dict both pages draw. build-the-map's reconcile can adopt a proposed flow under a name of the user's own. flowmap's own map is rebuilt from four agreeing passes into three named flows. lens, the change page and its --link are unchanged. lens calls this blind: canvas.py has module-level constants, and the page template, bin/flowmap (which wires up the command) and flowmap.toml sit outside the analysed code, so read those in the diff.\",\"url\":\"https://github.com/NelisVerhoef/Flowmap/pull/17\",\"pr\":\"PR #17\",\"no_longer\":[\"A vocabulary entry adopts a proposed flow only when its id equals the proposal's id without `new:`; renaming one, as QUESTIONS.md invites, leaves its steps under the old `new:` flow\",\"flowmap's own map has three unnamed draft flows and no step for `flowmap change` or `flowmap viewer`\",\"A PR overlay records how many functions a change touched, not which ones\"],\"chapters\":[{\"n\":1,\"title\":\"The map draws as one left-to-right canvas, and a change is painted on it\",\"role\":\"core\",\"before\":\"The map had two views: Mermaid diagrams and the atlas, which lists each flow's steps as a column of sentences. A change was read on the change page, a document whose only picture is a row of dots per flow.\",\"after\":\"`flowmap canvas` writes docs/flowmap/canvas.html: screens, flows and steps, one card per file placed by call depth, and the data the steps write, wired left to right from the call graph. Click a flow to light its path, \\u25b6 to walk it step by step, double-click a file to see its functions with callers left and callees right. `--change <name>=<base>..<head>` paints changed and new files, marks the steps that run them, numbers the story's parts on their cards, and gives changed code no step runs its own \\\"not on the map\\\" column. `--from <atlas.html>` redraws an existing atlas page's data. The paint comes from the atlas overlay (`atlas.overlay`); the verdict on the page comes from `lens.analyse`, which `canvas.main` also runs.\",\"claim\":\"A reviewer sees where a change sits on a picture of the system instead of reading it.\",\"why\":\"Whoever reviews a flowmap PR reads it here first. The atlas and change page never built a picture people could learn, so the reviewer fell back to the diff. Rather than inlining a full graph-layout library such as ELK into every page, the page does a small column layout itself, because positions follow the map's order and that keeps the picture the same between builds; the cost is wires that can cross.\",\"questions\":[\"canvas paints changed code from `atlas.overlay`, which unlike `lens.analyse` doesn't skip docstring-only edits, so a file can be painted amber while the verdict ignores it. Should `canvas.main` take changed symbols from lens's facts instead?\",\"`canvas.from_page` scrapes `const DATA = \\u2026` out of a rendered atlas page. Should the atlas also write its data as JSON beside the page?\",\"Should the canvas become the page `flowmap change --link` opens, replacing the document-style change page?\",\"Open bench/fastapi-template/map/canvas.html, press \\u25b6 on Sign in, then open docs/flowmap/canvas.html and paint PR #16: can you say where each lands without the diff?\"],\"verified\":[\"test\",\"test\",\"test\",\"ran\",\"not checked\"],\"files\":[\"f:canvas.py\"],\"steps\":[\"s:browse-the-map/draw-canvas\"],\"outside\":[\"flowmap/canvas.template.html\",\"bin/flowmap\",\"README.md\",\"docs/flowmap/canvas.html\",\"bench/fastapi-template/map/canvas.html\"]},{\"n\":2,\"title\":\"The atlas's data is built once, and an overlay names the functions a change touched\",\"role\":\"supporting\",\"before\":\"`atlas.build` computed the atlas data and wrote the page in one function. A PR overlay carried counts of changed and new functions.\",\"after\":\"`atlas.data` returns the dict and `atlas.build` writes the page from it, so the canvas draws the same data. An overlay also carries `changed_ids`, `new_ids` and `added_endpoints`, which the canvas paints; the atlas page ignores them.\",\"claim\":\"One builder feeds both pages.\",\"why\":\"Runs under `flowmap atlas` and `flowmap canvas`. Rather than a second copy of the step and merge logic in canvas.py, the canvas reuses the atlas's, because two copies would drift. The cost: `atlas.data` and `atlas.overlay` now sit under both pages, so a bug there breaks the atlas and the canvas together.\",\"questions\":[\"`atlas.data` still calls `Diagrams.system()` only to fill `d.matrix`. With two pages built on it, should that become a function that returns the matrix?\",\"Diff a fresh `flowmap atlas` against the committed atlas.html: only the overlay keys and the map itself should differ.\"],\"verified\":[\"ran\",\"test\"],\"files\":[\"f:atlas.py\"],\"steps\":[\"s:browse-the-map/build-atlas\",\"s:browse-the-map/draw-canvas\"],\"outside\":[]},{\"n\":3,\"title\":\"A flow renamed when it is adopted keeps its steps\",\"role\":\"supporting\",\"before\":\"reconcile adopted a proposed flow only when a vocabulary id equalled the proposal without `new:`. Renaming it in flowmap.toml, as QUESTIONS.md invites, left its steps under the `new:` flow.\",\"after\":\"A vocabulary entry can name the proposal it adopts with `proposed = \\\"new:...\\\"` (one id or a list); any id in a merged proposal ties it to the user's name. The TOML block in QUESTIONS.md now writes that line, so a pasted block still works after renaming `id`. flowmap/config.py only gains the `proposed` line in its documented example.\",\"claim\":\"Naming flows works the way QUESTIONS.md says it does.\",\"why\":\"Runs once per map build, at the human step: whoever names the flows. Found while naming this repo's flows, whose chosen names differ from the proposals. Rather than pinning every entry point in decisions.json, which would mark each step \\\"confirmed\\\" when only its flow was named, the vocabulary says what it adopts.\",\"questions\":[\"Should reconcile warn when a `proposed` names no proposal (a typo), instead of silently leaving the `new:` flow beside the empty vocabulary one?\",\"Paste QUESTIONS.md's TOML block, rename one `id`, reconcile: does the flow keep its steps?\"],\"verified\":[\"test\",\"ran\"],\"files\":[\"f:reconcile.py\"],\"steps\":[\"s:build-the-map/reconcile-passes\"],\"outside\":[\"flowmap/config.py\"]},{\"n\":4,\"title\":\"flowmap's own map is current, with three named flows\",\"role\":\"outside\",\"before\":\"The map was built 21 commits ago: 8 steps in 3 unnamed draft flows, with no step for `flowmap change`, `canvas` or `viewer`.\",\"after\":\"11 entry points, 11 steps, all agreed by independent passes, in build-the-map, browse-the-map and review-a-change. lens's flow is pinned to review-a-change in decisions.json (the step itself is still \\\"agreed\\\": that grades how the passes grouped the step, not which flow it sits in). The goldens are regenerated: only step and flow placement and flow spread moved; the graph goldens did not. The anchors-lost test moved to its own fixture repo.\",\"claim\":\"Change pages from here on land on a map that knows today's commands.\",\"why\":\"Every later PR is placed on this map. On the old one, a change to change.py (PR #15) landed off the map entirely. The anchors-lost test cited functions deleted long ago; a fresh map can't cite them, so rather than rewriting its expected value to empty it now builds a repo whose map does.\",\"questions\":[\"lens is pinned to review-a-change against three of four passes, which put it under browse-the-map. Keep the pin?\",\"`bin/flowmap-pr-hook` runs `flowmap lens` on every push but is not an entry point: bin/ is outside `[code].graph` and the file has no .py. Map it in a follow-up?\"],\"verified\":[\"ran\",\"test\",\"test\",\"looked\"],\"files\":[],\"steps\":[],\"outside\":[\"docs/flowmap/map.json\",\"docs/flowmap/MAP.md\",\"docs/flowmap/QUESTIONS.md\",\"docs/flowmap/decisions.json\",\"flowmap.toml\",\"docs/flowmap/inventory.json\",\"docs/flowmap/atlas.html\",\"tests/golden/lens-6d9eaff-770f1a7.md\",\"tests/golden/change-facts-6d9eaff-770f1a7.json\"]}]}},{\"id\":\"pr-16\",\"title\":\"PR #16\",\"range\":\"69be006..8675ccd\",\"files\":{\"f:callgraph.py\":{\"kind\":\"changed\",\"syms\":[\"__main__\"]},\"f:lens.py\":{\"kind\":\"changed\",\"syms\":[\"analyse\",\"blind_spots\",\"defs\"]},\"f:graphs/codegraph.py\":{\"kind\":\"new\",\"syms\":[\"_part\",\"build\",\"doc\",\"hint\",\"outline\",\"signature\",\"symbols\"]}},\"steps\":{\"s:build-the-map/check-handlers-are-nodes\":{\"kind\":\"direct\",\"via\":[\"__main__\",\"build\",\"hint\"]},\"s:browse-the-map/build-atlas\":{\"kind\":\"reach\",\"via\":[\"defs\"]},\"s:review-a-change/run-lens\":{\"kind\":\"direct\",\"via\":[\"analyse\",\"blind_spots\",\"defs\"]},\"s:review-a-change/pull-change-facts\":{\"kind\":\"direct\",\"via\":[\"analyse\"]}},\"off\":[],\"off_files\":[],\"changed\":4,\"new\":7,\"added_endpoints\":[],\"verdict\":{\"verdict\":\"blind\",\"spreads_to\":[\"CLI flowmap atlas\",\"CLI flowmap callgraph\",\"CLI flowmap change\",\"CLI flowmap lens\"],\"blind\":[\"module-level code changed (constants, config, router registration): `flowmap/graphs/__init__.py`, `flowmap/graphs/codegraph.py`\",\"files outside the analysed code: `.claude-plugin/plugin.json`\"]},\"story\":{\"title\":\"The call graph covers TypeScript/JS, Ruby, Go, Java and more when codegraph is installed, and says to install it when it isn't\",\"intent\":\"Reuse codegraph (github.com/colbymchenry/codegraph, a tree-sitter indexer for 20+ languages) so flowmap gives deterministic reach for languages other than Python, and recommend installing it strongly without forcing it.\",\"delta\":\"A second call-graph builder now sits next to the Python one. When `codegraph` is on PATH, it indexes the graph files of every non-Python language at the revision being read and turns codegraph's SQLite graph into flowmap's `rel:Qual.name` nodes and call edges. Reach, the verdict, `callgraph check`, change pages and the atlas then cover that code. Without codegraph nothing changes: those files stay blind spots, but lens, `callgraph check` and the flowmap-build skill now name the install command. The Python builder, the graph format, adapters and map files are unchanged. Rails handlers still don't match codegraph's names (`index` vs `Admin.UsersController.index`), so Rails reach is still \\\"not yet\\\". lens calls this PR blind because `graphs/__init__.py` and `codegraph.py` gained module-level code (the builder list, the suffix and kind tables) and because of the plugin version bump.\",\"url\":\"https://github.com/NelisVerhoef/Flowmap/pull/16\",\"pr\":\"PR #16\",\"no_longer\":[\"A change to a TypeScript/JS or Ruby file always gets the blind-spot line \\\"code with no call graph (no builder for its language \\u2026)\\\", so lens can't name what it reaches\",\"The flowmap-build skill treats the call graph as Python-only (\\\"Python today\\\") and goes on without asking about other languages\"],\"chapters\":[{\"n\":1,\"title\":\"Non-Python code gets a call graph from codegraph's index\",\"role\":\"core\",\"before\":\"The only builder was graphs/python.py. Files in any other language had no nodes or edges: a Next.js route or a TS helper was \\\"not graphed\\\", and any change to one made lens say blind.\",\"after\":\"`build` writes the files (plus tsconfig/jsconfig/package.json/go.mod at the root and up to two levels down) into a temp dir and runs `codegraph init --yes` with DO_NOT_TRACK=1 and CODEGRAPH_NO_DAEMON=1. `_part` then reads functions, methods, constructors, classes, structs, modules and components as nodes. `A::b` becomes `rel:A.b`. calls, instantiations and references become edges, and a class also reaches its constructor (`constructor`, `initialize`, `__init__`, `init`, `new`). extends/implements become bases, and files with parse errors are reported as unparsed. `symbols`, `signature` and `doc` answer from the outline recorded while building, since flowmap asks them with file text alone. Python files keep their own builder. When `codegraph init` exits non-zero, every file it was given is reported as unparsed, so lens says blind (\\\"could not parse \\u2026\\\") instead of guessing. The builder reads codegraph's tables directly: a renamed column raises an error, and a renamed node kind would leave handlers out of the graph, which `flowmap callgraph check` reports as broken.\",\"claim\":\"With codegraph installed, a TS/JS, Ruby, Go or Java change gets reach like a Python one.\",\"why\":\"Reach is what lets a reviewer trust lens when it is quiet, and so far only Python repos had it. Rather than writing tree-sitter resolution in flowmap (a dependency, and a lot of resolver work per language), this reads a maintained indexer's output. Its node names already match what flowmap's adapters emit: all 36 handlers in a real Next.js app are nodes.\",\"questions\":[\"Rails: should the adapter emit class-qualified handlers (`users_controller.rb:Admin.UsersController.index`) so codegraph reach works, even though that renames handler ids in existing Rails maps?\",\"Run `flowmap callgraph check` with codegraph on a TS or Go repo you know: are any handlers broken, and are the edges into shared helpers the ones you'd expect?\",\"`build` runs codegraph twice per lens (base and head), about 1.2s each on 263 files. Is that acceptable on your largest repo, or should it reuse a `.codegraph/` index when the ref is the working tree?\"],\"verified\":[\"test\",\"ran\",\"ran\",\"looked\"],\"files\":[\"f:graphs/codegraph.py\"],\"steps\":[\"s:browse-the-map/build-atlas\",\"s:browse-the-map/draw-canvas\"],\"outside\":[]},{\"n\":2,\"title\":\"lens and atlas name the method a change sits in, not its class\",\"role\":\"supporting\",\"before\":\"Callers place diff lines on definitions through `lens.defs`, and lens and `atlas --pr` do it before building any graph. An indexer outlines a file only once it has indexed it, so a change inside `InsurerRegistry.isSupported` came out as `InsurerRegistry` (the regex outline's top-level name).\",\"after\":\"`lens.defs` asks a builder that has `outline` to index a text no build has seen, on its own (a single-file codegraph index), before reading its symbols. Every caller goes through `defs`: lens, `atlas --pr` and change facts. `analyse` also builds the base and head graphs first when there are graph roots, so changed files are outlined from those builds instead of one by one; it built both later anyway.\",\"claim\":\"Reach is reported for the changed method itself.\",\"why\":\"Reach is looked up by node id, and the class node doesn't carry the method's callers, so naming the class hid the endpoints that reach the method. The fix is in `defs` rather than in each caller because `atlas --pr` had the same order and never builds the base graph. Rather than giving `symbols()` a file path (changing the builder interface for Python too), the indexer gets an optional `outline(rel, text)`.\",\"questions\":[\"A single-file index can't resolve imports, but `outline` only reads definitions from it. Is any caller of `codegraph.signature` or `doc` reached with a text that no full build saw, where a missing signature would hide a contract change?\",\"When codegraph fails on a file (exit code non-zero), `outline` retries every time `defs` asks for it. Worth caching the failure?\"],\"verified\":[\"test\",\"test\",\"ran\",\"not checked\"],\"files\":[\"f:graphs/codegraph.py\",\"f:lens.py\"],\"steps\":[],\"outside\":[]},{\"n\":3,\"title\":\"Where codegraph is missing, flowmap says how to install it\",\"role\":\"supporting\",\"before\":\"Nothing told anyone a builder for other languages existed: the blind spot said \\\"no builder for its language\\\" and the skill said \\\"Python today\\\".\",\"after\":\"When codegraph is absent and a file it would parse has no graph, lens's blind spot and `callgraph check`'s \\\"no builder for .ts\\\" end with \\\"(`npm i -g @colbymchenry/codegraph` gives these a call graph)\\\". The flowmap-build skill has a step 0: if the repo has non-Python code and no codegraph, stop, explain that reach will be blind there, and ask to install it. Carry on without it only if the user says so. README lists it under \\\"On a new machine\\\". The plugin version moves to 0.3.0 so installed copies update.\",\"claim\":\"codegraph is strongly recommended at the moment its absence costs something, never installed behind anyone's back.\",\"why\":\"Claude Code plugins can't declare npm dependencies. Forcing it would mean a hook running a global npm install on every teammate's machine, which changes their machine and runs third-party install scripts without asking. Rather than a SessionStart nudge in every session, the hint appears only where reach is actually missing: lens output, which pr-lens copies into PR summaries, and setup.\",\"questions\":[\"Should the install line pin the tested version (`@colbymchenry/codegraph@1.6.2`), given that the builder reads codegraph's database schema directly?\",\"Is asking at build time enough, or do teammates who only review PRs (pr-lens) also need a nudge before their first lens?\"],\"verified\":[\"test\",\"ran\",\"not checked\"],\"files\":[\"f:callgraph.py\",\"f:graphs/codegraph.py\",\"f:lens.py\"],\"steps\":[\"s:build-the-map/check-handlers-are-nodes\"],\"outside\":[\"skills/flowmap-build/SKILL.md\",\"README.md\",\".claude-plugin/plugin.json\"]}]}}]};","+const PAYLOAD = EMBEDDED ? null : /^#(v1\\.[\\w-]+)&?(.*)$/.exec(location.hash);","+// another link pasted into this tab changes only the fragment, which does not reload the page","+addEventListener(\"hashchange\", () => { if (location.hash.startsWith(\"#v1.\") && !EMBEDDED) location.reload(); });","+","+async function load() {","+  if (EMBEDDED) return EMBEDDED;","+  let why = \"Open a flowmap map from the link `flowmap canvas --link` prints. Its data stays in this tab.\";","+  if (PAYLOAD) {","+    try {","+      const b64 = PAYLOAD[1].slice(3).replace(/-/g, \"+\").re const PAYLOAD = /^#v1\.([\w-]+)$/.exec(location.hash);
// another link pasted into this tab changes only the fragment, which does not reload the page
addEventListener("hashchange", () => { if (location.hash.startsWith("#v1.")) location.reload(); });

async function inflate(b64) {
  const bytes = Uint8Array.from(atob(b64.replace(/-/g, "+").replace(/_/g, "/")), (c) => c.charCodeAt(0));
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return JSON.parse(await new Response(stream).text());
}

function fromFile(error) {
  const box = document.createElement("section");
  box.className = "drop";
  box.innerHTML = `<h1>Open a flowmap change</h1>
    <p>Drop a change page (<code>docs/flowmap/changes/&lt;name&gt;.html</code>) or its data as JSON here.
    It is read in this tab and sent nowhere.</p>
    <p><input type="file" accept=".html,.json"></p><p class="err" hidden></p>`;
  const err = box.querySelector(".err");
  if (error) { err.hidden = false; err.textContent = error; }
  document.querySelector(".wrap").replaceChildren(box);
  document.querySelector(".tray").hidden = true;
  return new Promise((resolve) => {
    const read = async (f) => {
      try {
        const text = await f.text();
        const m = /const EMBEDDED = (\{.*?\});\n/s.exec(text) || /const DATA = (\{.*?\});\n/s.exec(text);
        const data = JSON.parse(m ? m[1] : text);
        if (!data.facts || !data.chapters) throw new Error("not flowmap change data");
        resolve(data);
      } catch (e) { err.hidden = false; err.textContent = `Could not read ${f.name}: ${e.message}`; }
    };
    box.querySelector("input").addEventListener("change", (e) => e.target.files[0] && read(e.target.files[0]));
    addEventListener("dragover", (e) => { e.preventDefault(); box.classList.add("over"); });
    addEventListener("dragleave", () => box.classList.remove("over"));
    addEventListener("drop", (e) => { e.preventDefault(); box.classList.remove("over"); e.dataTransfer.files[0] && read(e.dataTransfer.files[0]); });
  });
}

async function load() {
  if (EMBEDDED) return EMBEDDED;
  if (PAYLOAD) {
    try { return await inflate(PAYLOAD[1]); }
    catch (e) { return fromFile("The link's data is cut off or damaged. Was the whole link copied?"); }
  }
  return fromFile();
}

  pane.append(el("p", { class: "kept", html: "<b>Still true.</b> " + stillTrue() }));
  pane.append(el("ul", { class: "shape", "aria-label": "Shape of the change" },
    ...shape.map(([v, k, t]) => el("li", { title: t || null }, el("b", { text: String(v) }), " " + k))));
  const ref = (c) => el("button", { type: "button", class: "ref " + c.role, title: c.title, onclick: () => show(c.n) }, String(c.n));
  const lanes = el("div", { class: "lanes" });
  for (const f of F.map) {
    const at = (k) => chapters.filter(c => c.keys.includes(k));
    if (!f.steps.some(s => at(s.key).length)) continue;
    lanes.append(el("section", { class: "lane" }, el("h3", { text: flowName(f.id) }), el("ol", {}, ...f.steps.map(s => {
      const hits = at(s.key);
      return el("li", { class: hits.length ? "touched " + hits[0].role : null }, el("span", { class: "dot", "aria-hidden": "true" }),
        el("span", { text: s.name }), hits.length ? el("span", { class: "refs" }, ...hits.map(ref)) : null);
    }))));
  }
  const off = chapters.filter(c => !c.keys.length);
  if (off.length) lanes.append(el("section", { class: "lane" }, el("h3", { text: "Off the map" }),
    el("div", { class: "refs", style: "display:grid;gap:6px" }, ...off.map(c => el("span", { style: "display:flex;gap:8px;align-items:baseline;font-size:13px" }, ref(c), c.title)))));
  if (lanes.children.length) pane.append(el("section", { style: "display:grid;gap:10px" }, el("h3", { class: "label", text: "Where it lands" }),
    el("p", { class: "note", text: "Each line is a user flow, its stops in order. A filled stop runs changed code; the numbers under it are the parts that change it." }), lanes));
  if (!S.delta) pane.append(el("p", { class: "note", text: "No story for this change: each part below is grouped by the flow steps that run its code." }));
}

// what a reader of the old map believed that this change makes false: the story's lines (each
// cites the diff), then what the facts show on their own
function noLonger() {
  const name = (k) => steps.has(k) ? steps.get(k).name : k;
  return [
    ...(S.no_longer || []).map(w => [md(w.was), md("`" + (w.cite || "") + "`") +
      (w.step ? ` · the map's step “${esc(name(w.step))}” still says this: re-run the map loop` : "")]),
    ...F.endpoints.removed.map(e => [md("`" + e + "` is an entry point"), "removed"]),
    ...Object.entries(F.reach.lost).map(([s, eps]) => [md(`${eps.map(e => "`" + e + "`").join(", ")} can run \`${sym(s)}\``), esc(file(s))]),
    ...F.modules.removed.map(([a, b]) => [md(`\`${a.split("/").pop()}\` calls into \`${b.split("/").pop()}\``), "no call left"]),
    ...(F.anchors_lost || []).map(a => [md(`The map's step “${name(a.step)}” runs \`${sym(a.anchor)}\``), "gone from the code: re-run the map loop"]),
  ];
}
// what the reader can keep, scoped to what the call graph can vouch for
function stillTrue() {
  const V = F.verdict, parts = [];
  if (quiet.length) parts.push(`${quiet.join(", ")} ${quiet.length === 1 ? "is" : "are"} untouched`);
  if (V && F.endpoints.total) parts.push(`${F.endpoints.total - V.spreads_to.length} of ${F.endpoints.total} entry points run no changed code`);
  if (!Object.keys(F.reach.lost).length && !F.endpoints.removed.length) parts.push("no entry point lost reach to existing code");
  if (!F.edges.removed.length) parts.push("no existing call was removed");
  const scope = V && V.blind.length ? ` <small>(in code the call graph sees; it can't vouch for: ${V.blind.map(md).join("; ")})</small>`
    : ` <small>(in code the call graph sees)</small>`;
  return (parts.length ? parts.join("; ") : "nothing the graph can vouch for") + "." + scope;
}

// rail: the parts
$("#toc-h").textContent = `The change in ${plural(chapters.length, "part")}`;
$("#toc").append(el("li", { class: "ov" }, el("button", { type: "button", "data-ch": 0, onclick: () => show(0) },
  el("span", { class: "n", text: "◎" }), el("span", { class: "t", text: "Overview" }), el("span", { class: "w", text: "what moves, and how much" }))));
for (const c of chapters) {
  $("#toc").append(el("li", { class: minor(c) ? "minor" : null }, el("button", { type: "button", class: c.role, "data-ch": c.n, onclick: () => show(c.n) },
    el("span", { class: "n", text: String(c.n) }), el("span", { class: "t", text: c.title }), el("span", { class: "w", text: where(c) }))));
}

// rail: the map, touched flows only; a stop says which parts run there
const quiet = [];
for (const f of F.map) {
  const at = (k) => chapters.filter(c => c.keys.includes(k));
  if (!f.steps.some(s => at(s.key).length)) { quiet.push(flowName(f.id)); continue; }
  const ol = el("ol", { class: "stops" });
  for (const s of f.steps) {
    const hits = at(s.key);
    ol.append(el("li", {}, el(hits.length ? "button" : "div", {
      class: "stop" + (hits.length ? " touched " + hits[0].role : ""), "data-key": s.key, type: hits.length ? "button" : null,
      title: hits.length ? `${s.name}\nParts: ${hits.map(c => c.n).join(", ")}` : `${s.name}\nNot touched`,
      onclick: hits.length ? () => { const i = hits.findIndex(c => c.n === current); show(hits[(i + 1) % hits.length].n); } : null },
      el("span", { class: "dot", "aria-hidden": "true" }), el("span", { class: "nm", text: s.name }))));
  }
  $("#map").append(el("section", { class: "flow" }, el("h3", { text: flowName(f.id) }), ol));
}
const off = chapters.filter(c => !c.keys.length);
if (off.length) {
  const ol = el("ol", { class: "stops" });
  off.forEach(c => ol.append(el("li", {}, el("button", { type: "button", class: "stop touched " + c.role, "data-off": c.n, title: c.title, onclick: () => show(c.n) },
    el("span", { class: "dot", "aria-hidden": "true" }), el("span", { class: "nm", text: `${c.n} · ${c.title}` })))));
  $("#map").append(el("section", { class: "flow" }, el("h3", { text: "Off the map" }), ol));
}
if (quiet.length) $("#map").append(el("p", { class: "quiet-flows", text: `Untouched: ${quiet.join(", ")}` }));
if (DATA.folded.length) $("#folded").textContent = `Not shown: ${plural(DATA.folded.length, "generated or test file")} (${DATA.folded.map(p => p.split("/").pop()).join(", ")})`;
if ((DATA.trimmed || []).length) $("#folded").textContent = `${$("#folded").textContent} Left out of this link to fit a PR body: ${DATA.trimmed.join(" and ")}; see the PR diff.`.trim();

// a part's code as a call tree: the shape that existed, with the calls this change added (+) or
// removed (−); a changed function in the part opens its own calls, everything else is a leaf, and
// calls nothing changed collapse to a count
const label = (n) => `${n.split(":")[0].replace(/(\/__init__)?\.\w+$/, "").split("/").pop()}.${sym(n)}`;  // graphs/__init__.py -> graphs
function callTree(c) {
  const ids = new Set(c.symbols || []);
  const node = (id) => id.replace(/\.__init__$/, "");
  const symOf = (n) => symById.get(n) || symById.get(n + ".__init__");
  const edge = (list, a, b) => list.some(([x, y]) => x === a && y === b);
  const kids = (n) => {
    const out = [...F.edges.added.filter(([a]) => a === n).map(([, b]) => ["+", b]),
      ...F.edges.removed.filter(([a]) => a === n).map(([, b]) => ["−", b]),
      ...F.symbols.filter(t => node(t.id) !== n && t.callers.some(x => x.id === n) && !edge(F.edges.added, n, node(t.id)) &&
        !edge(F.edges.removed, n, node(t.id))).map(t => ["", node(t.id)])];
    const rest = (symOf(n) || {}).kept_calls - out.filter(([m]) => !m).length;
    return [out, rest > 0 ? rest : 0];
  };
  const note = (n) => {
    const s = symOf(n);
    if (s) {
      const o = chapters.find(x => x !== c && (x.symbols || []).includes(s.id));
      return { new: "new", modified: "changed", deleted: "deleted" }[s.status] + (o ? ` → part ${o.n}` : "");
    }
    if (F.reach.gained[n]) return "existing, now runs from " + F.reach.gained[n].join(", ");
    if (F.reach.lost[n]) return "existing, no longer runs from " + F.reach.lost[n].join(", ");
    return "";
  };
  const lines = [], seen = new Set();
  const walk = (n, mark, prefix, last, root) => {
    lines.push([(root ? "" : prefix + (last ? "└─ " : "├─ ")) + (mark || " ") + " " + label(n), mark, note(n), n]);
    if (seen.has(n) || !(root || inIds(ids, n))) return;
    seen.add(n);
    const [out, rest] = kids(n), sub = root ? "" : prefix + (last ? "   " : "│  ");
    out.forEach(([m, b], i) => walk(b, m, sub, i === out.length - 1 && !rest, false));
    if (rest) lines.push([sub + "└─   " + plural(rest, "call") + " unchanged", "", "", null]);
  };
  const roots = c.syms.filter(s => !s.callers.some(x => inIds(ids, x.id)));
  for (const s of roots.length ? roots : c.syms.slice(0, 1)) {
    if (seen.has(node(s.id))) continue;
    const [k, path] = Object.entries(s.witness)[0] || [];
    const hops = path ? path.slice(0, -1).map(label) : [];
    if (k) lines.push([[steps.get(k).endpoints[0], ...(hops.length > 3 ? [hops[0], "…", ...hops.slice(-2)] : hops)].join(" › "), "from", "", null]);
    walk(node(s.id), "", "", true, true);
  }
  if (!lines.length) return null;
  const MAX = 18, shown = lines.length > MAX ? [...lines.slice(0, MAX - 1), [`… ${lines.length - MAX + 1} more lines`, "from", "", null]] : lines;
  const blind = (c.files || []).filter(f => !["code", "test", "generated"].includes((F.files.find(x => x.path === f) || {}).kind));
  const read = blind.filter(f => c.hunks.some(h => h.file === f)), unread = blind.filter(f => !read.includes(f));
  if (read.length) shown.push([`?  ${read.join(", ")}: not in the call graph, read its code below`, "from", "", null]);
  if (unread.length) shown.push([`?  ${unread.join(", ")}: not in the call graph, see the PR diff`, "from", "", null]);
  return el("pre", { class: "tree" }, ...shown.map(([t, m, n, id]) => el("span", { class: { "+": "add", "−": "rem", from: "from" }[m] || "", title: id },
    t, n ? el("i", { text: "   " + n }) : null)));
}
const fold = (title, sub, ...body) => el("details", {}, el("summary", {}, title, sub ? el("small", { text: sub }) : null), el("div", {}, ...body));

// pane: one part at a time
let current = 0;
function show(n, focus = true) {
  const c = chapters[n - 1];
  current = n;
  document.querySelectorAll("#toc button").forEach(b => b.setAttribute("aria-current", String(+b.dataset.ch === n)));
  // the overview lights every touched stop in its own part's colour; a part lights only its own
  document.querySelectorAll("#map .stop").forEach(s => s.classList.toggle("lit", c ? c.keys.includes(s.dataset.key) || +s.dataset.off === n : s.classList.contains("touched")));
  $("#map").style.removeProperty("--sel");
  if (c) $("#map").style.setProperty("--sel", `var(--${{ core: "core", supporting: "support", refactor: "refactor" }[c.role] || "outside"})`);
  $("#rail-map").hidden = !c;
  const pane = $("#pane");
  pane.replaceChildren();
  if (!c) overview(pane);
  else part(pane, c);

  const nav = el("div", { class: "step-nav" });
  for (const [dir, label] of [[-1, "Previous"], [1, n ? "Next" : "Start"]]) {
    const o = n + dir === 0 ? { n: 0, title: "Overview" } : chapters[n - 1 + dir];
    if (o) nav.append(el("button", { type: "button", "data-dir": String(dir), onclick: () => show(o.n) }, el("small", { text: o.n ? `${label} · ${o.n} of ${chapters.length}` : label }), o.title));
  }
  pane.append(nav, el("p", { class: "keys", html: "<kbd>←</kbd> <kbd>→</kbd> or <kbd>j</kbd> <kbd>k</kbd> to move between parts" }));
  if (focus) { pane.focus({ preventScroll: true }); if (pane.getBoundingClientRect().top < 0) pane.scrollIntoView({ block: "start" }); }
}

function part(pane, c) {
  pane.className = "pane " + c.role;

  pane.append(el("div", {},
    el("div", { class: "ch-tags" }, el("span", { class: "num", text: `${c.n} of ${chapters.length}` }), el("span", { class: "tag", text: ROLE[c.role] || c.role }),
      c.kind && c.kind !== c.role ? el("span", { class: "kind", text: c.kind }) : null),
    el("h2", { html: md(c.title) })));
  if (c.claim) pane.append(el("p", { class: "claim", html: md(c.claim) }));
  pane.append(el("p", { class: "runs", html: c.keys.length
    ? "Runs in " + F.map.filter(f => c.keys.some(k => steps.get(k).flow === f.id)).map(f => {
        const mine = f.steps.filter(s => c.keys.includes(s.key));
        return `<b title="${esc(mine.map(s => s.name).join("\n"))}">${esc(flowName(f.id))}</b> (${mine.length === 1 ? esc(mine[0].name) : `${mine.length} of ${f.steps.length} steps`})`;
      }).join(" · ")
    : "No flow on the map runs this." }));

  if (c.before || c.after) pane.append(el("div", { class: "ba" },
    el("div", {}, el("p", { class: "label", text: "Before" }), el("p", { html: md(c.before || "—") })),
    el("div", { class: "after" }, el("p", { class: "label", text: "After" }), el("p", { html: md(c.after || "—") }))));
  if ((c.verified || []).length) pane.append(el("p", { class: "verified", html: "<b>Verified:</b> " +
    c.verified.map(v => `<span class="how${v.how === "not checked" ? " no" : ""}">${esc(v.how)}</span> ${md(v.what)}`).join(" · ") }));
  const tree = callTree(c);
  if (tree) pane.append(el("section", { style: "display:grid;gap:8px" }, el("h3", { class: "label", text: "Calls, before → after" }), tree,
    el("p", { class: "note", text: "+ added, − removed by this change; the rest existed before. Built from the call graph, so dispatch it can't follow (dicts, templates) is missing." })));
  if (c.why) pane.append(el("p", { class: "why", html: "<b>Why it matters.</b> " + md(c.why) }));
  if (!c.before && !c.after && !c.why) pane.append(el("p", { class: "note", text: "No story for this part: the facts below are all flowmap knows. Add it to the story file to say what changes and why." }));

  if (c.qs.length) {
    const ol = el("ol", { class: "qs" });
    for (const q of c.qs) {
      const kind = { ask: "Ask the author", check: "Check yourself", graph: "From the graph" }[q.kind] || q.kind;
      ol.append(el("li", { class: "q" },
        el("input", { type: "checkbox", id: q.id, checked: picked.has(q.id) ? "" : null,
          onchange: (e) => { e.target.checked ? picked.add(q.id) : picked.delete(q.id); renderNote(); } }),
        el("label", { for: q.id }, el("span", { class: "qtext", html: `<span class="qkind ${esc(q.kind)}">${esc(kind)}</span>` + md(q.q) }),
          q.why ? el("span", { class: "qwhy", html: md(q.why) }) : null)));
    }
    pane.append(el("section", { style: "display:grid;gap:10px" }, el("h3", { class: "label", text: "Questions, most decisive first" }), ol));
  }

  // evidence, on demand
  const more = el("div", { class: "more" });
  const rows = [
    ...movesFor(c, c.keys, "lost").map(([s, eps]) => ["rem", "no longer", `${file(s)} · ${sym(s)} from ${eps.join(", ")}`]),
    ...movesFor(c, c.keys, "gained").map(([s, eps]) => ["add", "now reaches", `${file(s)} · ${sym(s)} from ${eps.join(", ")}`]),
    ...[...c.callers].sort((a, b) => a[1] - b[1]).map(([id, edited]) => [edited ? "yes" : "no", edited ? "caller, edited" : "caller, not edited", `${file(id)} · ${sym(id)}`]),
  ];
  if (rows.length) {
    const notEdited = [...c.callers.values()].filter(e => !e).length;
    more.append(fold("Callers and reach", notEdited ? `${notEdited} caller${notEdited === 1 ? "" : "s"} not edited` : "",
      el("ul", { class: "rows" }, ...rows.map(([k, m, t]) => el("li", {}, el("span", { class: "mark " + k, text: m }), el("span", { text: t }))))));
  }
  if (c.hunks.length) {
    const box = el("div", { style: "display:grid;gap:10px" });
    const hunkEls = c.hunks.map(h => {
      const pre = el("pre");
      h.lines.forEach(l => pre.append(el("span", { class: l[0] === "+" ? "a" : l[0] === "-" ? "r" : "", text: l })));
      const n = el("div", { class: "hunk" }, el("div", { class: "hh", text: `${h.file} @ ${h.new}${h.ctx ? " · " + h.ctx : ""}` }), pre);
      n._syms = h.symbols; n._file = h.file;
      return n;
    });
    // pick a symbol (or file) to see only its hunks
    const keysOf = [...new Set([...c.syms.map(s => s.id), ...c.hunks.filter(h => !h.symbols.length).map(h => h.file)])];
    const chips = el("div", { class: "chips" });
    const filter = (key) => {
      chips.querySelectorAll(".chip").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.k === key)));
      hunkEls.forEach(n => { n.hidden = key != null && !(n._syms.includes(key) || (!n._syms.length && n._file === key)); });
    };
    if (keysOf.length > 1) keysOf.forEach(k => {
      const s = symById.get(k);
      chips.append(el("button", { type: "button", class: "chip", "data-k": k, "aria-pressed": "false", title: k,
        onclick: (e) => filter(e.currentTarget.getAttribute("aria-pressed") === "true" ? null : k) },
        s ? (c.syms.filter(o => sym(o.id) === sym(k)).length > 1 ? `${file(k)} · ${sym(k)}` : sym(k)) : k.split("/").pop(), s && s.status !== "modified" ? el("i", { text: s.status }) : null));
    });
    box.append(chips, ...hunkEls);
    const files = [...new Set(c.hunks.map(h => h.file.split("/").pop()))];
    more.append(fold("Code", `${plural(c.hunks.length, "hunk")} in ${files.slice(0, 4).join(", ")}${files.length > 4 ? ` and ${files.length - 4} more` : ""}`, box));
  }
  if (more.children.length) pane.append(more);
}

function renderNote() {
  const lines = [];
  for (const c of chapters) {
    const qs = c.qs.filter(q => picked.has(q.id));
    if (!qs.length) continue;
    lines.push(`${c.n}. ${c.title}`);
    qs.forEach(q => lines.push(`   - ${q.q}`));
  }
  $("#note").value = lines.join("\n");
  $("#count").textContent = plural(picked.size, "question");
}

addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  const d = { ArrowRight: 1, j: 1, ArrowLeft: -1, k: -1 }[e.key];
  if (d && current + d >= 0 && current + d <= chapters.length) { e.preventDefault(); show(current + d); }
});
$("#peek").addEventListener("click", (e) => {
  const open = $("#note").hidden;
  $("#note").hidden = !open;
  e.target.setAttribute("aria-expanded", String(open));
  e.target.textContent = open ? "Hide" : "Show";
});
$("#copy").addEventListener("click", async () => {
  const t = $("#note");
  try { await navigator.clipboard.writeText(t.value); $("#status").textContent = "Copied"; }
  catch (e) { t.hidden = false; t.focus(); t.select(); $("#status").textContent = "Selected: press Ctrl+C or Cmd+C to copy"; }
});
renderNote();
show(0, false);
</script>
