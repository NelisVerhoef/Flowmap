/* Layout: overview first, one part at a time, evidence on demand. The left rail is the whole
   change (its parts, then the flows they land on); the pane shows one part: before -> after, why,
   what to ask. Proof, ripple and code stay folded until asked for. */
:root {
  --paper: #eef1f4;
  --surface: #ffffff;
  --ink: #17202b;
  --muted: #5b6676;
  --rule: #cdd4dc;
  --line: #9aa6b4;
  --accent: #2e5bff;
  --accent-soft: rgba(46, 91, 255, .12);
  --core: #2e5bff;
  --support: #0f7c86;
  --refactor: #6b7686;
  --outside: #b7791f;
  --gain: #1e8a4c;
  --loss: #c8423b;
  --code-bg: #f6f8fa;
  --display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f141a; --surface: #161d26; --ink: #e6ebf1; --muted: #93a0b0; --rule: #2a3441;
    --line: #4a5666; --accent: #7c9cff; --accent-soft: rgba(124, 156, 255, .16);
    --core: #7c9cff; --support: #3cc0cb; --refactor: #93a0b0; --outside: #f0b429;
    --gain: #3fbf78; --loss: #ef6b63; --code-bg: #10161d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f141a; --surface: #161d26; --ink: #e6ebf1; --muted: #93a0b0; --rule: #2a3441;
  --line: #4a5666; --accent: #7c9cff; --accent-soft: rgba(124, 156, 255, .16);
  --core: #7c9cff; --support: #3cc0cb; --refactor: #93a0b0; --outside: #f0b429;
  --gain: #3fbf78; --loss: #ef6b63; --code-bg: #10161d; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 15px/1.55 var(--body); }
.wrap { padding: 24px 16px 96px; max-width: 1240px; margin: 0 auto; display: grid; gap: 22px; }
code, .mono { font-family: var(--mono); font-size: .86em; }
p code, li code, dd code, h2 code { background: var(--accent-soft); padding: 0 .3em; border-radius: 4px; overflow-wrap: anywhere; }
h1, h2, h3 { text-wrap: balance; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.label { font: 600 11px var(--body); text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin: 0; }
.core { --role: var(--core); } .supporting { --role: var(--support); } .refactor { --role: var(--refactor); }
.outside, .unassigned, .off-map { --role: var(--outside); }

/* header: which change; the overview pane says what it does */
header { display: grid; gap: 6px; max-width: 80ch; }
header h1 { font: 800 clamp(24px, 3.4vw, 34px)/1.08 var(--display); font-stretch: 74%; margin: 0; }
.range { color: var(--muted); font-size: 13px; }
.range a { color: inherit; }
.delta { font-size: 18px; line-height: 1.55; margin: 0; max-width: 68ch; }
/* the lens verdict: the first thing to know, its reasons one click away */
.verdict { justify-self: start; max-width: 80ch; font-size: 14px; }
.verdict summary { cursor: pointer; }
.verdict summary b { margin-right: 8px; }
.verdict b { font: 700 11px var(--body); text-transform: uppercase; letter-spacing: .08em; border-radius: 4px; padding: 2px 7px; color: var(--surface); }
.verdict.contained b { background: var(--gain); } .verdict.spreads b { background: var(--outside); } .verdict.blind b { background: var(--loss); }
.verdict ul { margin: 8px 0 0; padding-left: 20px; display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.lint { justify-self: start; max-width: 80ch; font-size: 13px; border: 1px solid var(--loss); border-radius: 8px; padding: 8px 12px; }
.lint ul { margin: 4px 0 0; padding-left: 18px; }
.was { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; font-size: 14px; }
.was s { text-decoration-color: var(--loss); text-decoration-thickness: 1px; }
.was small, .kept small { color: var(--muted); font-size: 12px; }
.kept { margin: 0; font-size: 14px; max-width: 72ch; }
.shape { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; font-size: 12.5px; }
.shape li { background: var(--surface); border: 1px solid var(--rule); border-radius: 999px; padding: 2px 10px; }
.shape b { font-variant-numeric: tabular-nums; }

/* rail + pane */
.body { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 22px; align-items: start; }
@media (max-width: 900px) { .body { grid-template-columns: minmax(0, 1fr); } }
.rail { display: grid; gap: 18px; position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow-y: auto; padding-bottom: 8px; }
@media (max-width: 900px) { .rail { position: static; max-height: none; } }
.rail section { display: grid; gap: 8px; }

/* the parts, as a table of contents */
.toc { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.toc button { width: 100%; text-align: left; background: none; border: 1px solid transparent; border-radius: 8px; padding: 8px 10px;
  display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 2px 10px; cursor: pointer; }

.toc .n { grid-row: span 2; font: 700 12px/20px var(--mono); text-align: center; border-radius: 6px; height: 20px; color: var(--surface); background: var(--role); }
.toc .t { font-weight: 500; font-size: 13.5px; line-height: 1.35; }
.toc .w { font-size: 12px; color: var(--muted); line-height: 1.3; }
.toc .ov .n { background: var(--ink); }
.toc .minor .t { font-weight: 400; color: var(--muted); }

/* the map: flows as lines, the selected part's stops lit, the others faint */
.flow { display: grid; gap: 2px; }
.flow h3 { font: 700 12.5px/1.2 var(--display); font-stretch: 80%; margin: 6px 0 2px; letter-spacing: .02em; }
.stops { list-style: none; margin: 0; padding: 0; position: relative; display: grid; }
.stops::before { content: ""; position: absolute; left: 7px; top: 10px; bottom: 10px; width: 2px; background: var(--line); }
.stop { position: relative; display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 8px; align-items: start; width: 100%;
  text-align: left; background: none; border: 0; border-radius: 6px; padding: 3px 4px 3px 0; font-size: 12.5px; line-height: 1.3; color: var(--muted); }
button.stop { cursor: pointer; }
button.stop:hover { background: var(--surface); }
.stop .dot { width: 12px; height: 12px; margin: 1px 2px; border-radius: 50%; background: var(--paper); border: 2px solid var(--line); position: relative; z-index: 1; }
.stop.touched { color: var(--ink); }
.stop.touched .dot { border-color: var(--role); }
.stop.lit { font-weight: 600; }
.stop.lit .dot { background: var(--sel, var(--role)); border-color: var(--sel, var(--role)); box-shadow: 0 0 0 3px var(--paper), 0 0 0 5px var(--sel, var(--role)); }
.stop .nm { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.stop.lit .nm { -webkit-line-clamp: unset; }
/* the overview's map: each touched flow as a line of stops, the parts that run each stop under it */
.lanes { display: grid; gap: 14px; }
.lane { display: grid; gap: 6px; }
.lane h3 { font: 700 13px/1.2 var(--display); font-stretch: 80%; margin: 0; letter-spacing: .02em; }
.lane ol { list-style: none; margin: 0; padding: 0; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(120px, 1fr); overflow-x: auto; }
.lane li { position: relative; display: grid; gap: 6px; align-content: start; padding: 0 8px 4px 0; font-size: 12px; line-height: 1.3; color: var(--muted); }
.lane li::before { content: ""; position: absolute; top: 6px; left: 0; right: 0; height: 2px; background: var(--line); }
.lane li:first-child::before { left: 6px; } .lane li:last-child::before { right: calc(100% - 8px); }
.lane .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--surface); border: 2px solid var(--line); position: relative; }
.lane li.touched { color: var(--ink); }
.lane li.touched .dot { background: var(--role); border-color: var(--role); }
.lane .refs { display: flex; flex-wrap: wrap; gap: 4px; }
.ref { font: 600 11px/1 var(--mono); border-radius: 999px; padding: 3px 7px; border: 1px solid var(--role); color: var(--role); background: var(--surface); cursor: pointer; }
.ref:hover { background: var(--accent-soft); }
.quiet-flows { font-size: 12px; color: var(--muted); margin: 4px 0 0; }
.folded { font-size: 12px; color: var(--muted); margin: 0; overflow-wrap: anywhere; }

/* the pane: one part */
.pane { background: var(--surface); border: 1px solid var(--rule); border-top: 4px solid var(--role); border-radius: 12px;
  padding: 22px 24px; display: grid; gap: 18px; min-width: 0; }
.ch-tags { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.num { font: 700 12px var(--mono); color: var(--surface); background: var(--role); border-radius: 6px; padding: 2px 8px; }
.tag { font: 600 11px var(--body); text-transform: uppercase; letter-spacing: .08em; color: var(--role); }
.kind { font-size: 12px; color: var(--muted); }
.pane h2 { font: 750 clamp(21px, 2.6vw, 28px)/1.15 var(--display); font-stretch: 80%; margin: 4px 0 0; }
.claim { margin: 0; font-size: 16px; color: var(--muted); max-width: 70ch; }
.pane:focus { outline: none; }
.runs { margin: 0; font-size: 13px; color: var(--muted); }
.runs b { color: var(--ink); font-weight: 500; }

.ba { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
@media (max-width: 720px) { .ba { grid-template-columns: minmax(0, 1fr); } }
.ba > div { background: var(--surface); padding: 12px 14px; display: grid; gap: 4px; align-content: start; }
.ba .after { background: var(--paper); }
.ba p { margin: 0; font-size: 14px; }
.tree { margin: 0; overflow-x: auto; background: var(--code-bg); border: 1px solid var(--rule); border-radius: 8px; font: 12px/1.6 var(--mono); padding: 8px 0; }
.tree span { display: block; padding: 0 12px; white-space: pre; min-width: max-content; }
.tree .add { color: var(--gain); } .tree .rem { color: var(--loss); } .tree .from, .tree i { color: var(--muted); font-style: normal; }
.verified { margin: 0; font-size: 13px; color: var(--muted); }
.verified .how { font: 600 10.5px var(--body); text-transform: uppercase; letter-spacing: .08em; color: var(--gain); }
.verified .how.no { color: var(--outside); }
.why { margin: 0; max-width: 72ch; padding-left: 12px; border-left: 3px solid var(--role); }
.note { font-size: 13px; color: var(--muted); margin: 0; }

.qs { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.q { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; align-items: start; }
.q input { margin-top: 4px; width: 16px; height: 16px; accent-color: var(--accent); }
.q label { display: grid; gap: 3px; cursor: pointer; }
.q .qtext { font-weight: 500; }
.q .qwhy { color: var(--muted); font-size: 13px; }

.qkind.ask { background: var(--accent-soft); color: var(--accent); }
.qkind.check, .qkind.graph { background: var(--paper); color: var(--muted); border: 1px solid var(--rule); }

.more { display: grid; gap: 0; border-top: 1px solid var(--rule); }

.more summary small { color: var(--muted); font-weight: 400; font-size: 12.5px; }
.more details > div { padding: 2px 2px 14px; display: grid; gap: 10px; }
.rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 12.5px; }
.rows li { display: flex; gap: 8px; align-items: baseline; font-family: var(--mono); font-size: 11.5px; overflow-wrap: anywhere; }
.mark { font-family: var(--body); font-size: 11px; font-weight: 600; flex: none; width: 80px; }

.step-nav button:hover { border-color: var(--accent); }
.step-nav button[data-dir="1"] { text-align: right; margin-left: auto; }
.step-nav small { color: var(--muted); font-size: 11.5px; }
.keys { font-size: 12px; color: var(--muted); margin: 0; }
kbd { font: 11px var(--mono); border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--surface); }

.tray textarea { width: 100%; min-height: 140px; font: 13px/1.5 var(--mono); color: var(--ink); background: var(--paper);
  border: 1px solid var(--rule); border-radius: 8px; padding: 10px; resize: vertical; }
button.primary { font: 600 14px var(--body); background: var(--accent); color: var(--surface); border: 0; border-radius: 8px; padding: 7px 14px; cursor: pointer; }
button.ghost { background: none; border: 1px solid var(--rule); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
.status { font-size: 13px; color: var(--muted); }

/* viewer mode: no data in the page or the link, so ask for a file */
.drop { background: var(--surface); border: 2px dashed var(--rule); border-radius: 12px; padding: 32px 20px; display: grid; gap: 10px; justify-items: start; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop h1 { font: 800 28px/1.1 var(--display); font-stretch: 74%; margin: 0; }
.drop p { margin: 0; max-width: 68ch; color: var(--muted); }
.drop .err { color: var(--loss); }
</style>

titude** \u2014 why is this handled at this layer rather than where the data enters?","-- **Alternatives** \u2014 what was the simpler version, and why didn't it work?","+- **Alternatives** \u2014 what was the simpler version, and why didn't it work? (Only for someone","+  else's PR: when you wrote the change, you know, so the story's `why` says it instead.)"," - **Reversibility** \u2014 if we roll this back, is the stored data still coherent?"," - **Map gap** \u2014 this code isn't on the map; which flow does it belong to?"],"symbols":[]},{"file":"skills/pr-lens/SKILL.md","old":93,"new":95,"ctx":"Also write the change as a page people can read without the diff:","lines":["     \"intent\": \"the author's stated intent, one sentence\",","     \"delta\": \"how the system moves, in 2-3 sentences of flow terms; say what did NOT change too\",","+    \"no_longer\": [{\"was\": \"a belief a reader of the old system holds that this change makes false\",","+                   \"cite\": \"the changed file, file:line or symbol that shows it\",","+                   \"step\": \"optional: the map step key whose text still says it\"}],","     \"chapters\": [{","       \"title\": \"one behaviour change, stated as what the system now does\","],"symbols":[]},{"file":"skills/pr-lens/SKILL.md","old":98,"new":103,"ctx":"Also write the change as a page people can read without the diff:","lines":["       \"symbols\": [\"path.py:Qual.name\", \"...\"], \"files\": [\"non-code files, e.g. a skill\"],","       \"before\": \"system behaviour before\", \"after\": \"system behaviour after\",","-      \"claim\": \"one line\", \"why\": \"who/what runs through this and what it costs or risks them\",","+      \"claim\": \"one line\",","+      \"why\": \"who/what runs through this and what it costs or risks them; when there was another way, 'rather than X, because Y'\",","+      \"verified\": [{\"how\": \"test | ran | looked | not checked\",","+                    \"what\": \"test: tests/test_x.py:Nam in `flowmap.toml`, drop `--link` and link","+   the committed page.","+4. Reader test, before the PR opens: give a subagent with none of your context only the story file","+   and the `--facts` output, and ask it: which flows changed; what is no longer true; what stayed","+   the same; what breaks for the user if the core part fails. Compare its answers with the facts","+   and your own understanding. Where it is wrong or has to guess, fix the story, not the reader,","+   and render again. It is the same model as you, so it catches what the story leaves out, not","+   what it gets subtly wrong."," "," ## After"],"symbols":[]}]},"story":{"title":"The change page says what is no longer true, draws each part's calls, and states its facts right","pr":"PR #11","url":"https://github.com/NelisVerhoef/Flowmap/pull/11","intent":"A reader should leave a change page with an updated picture of the system: what is new, what they believed that is now false, and what they can keep.","delta":"`flowmap change` pages now open with what is no longer true (the story's cited lines, plus lost reach, removed entry points, module links and map anchors the change removed) and what is still true, scoped to what the call graph sees. Each part draws its calls as a tree, with the calls this change added or removed marked, and says how its claim was verified. The facts stop stating three things wrongly, and a story that claims what the facts don't back gets no link. The code of lens, the atlas, the map and the call graph is unchanged (`flowmap change` now also calls `lens.show` and `Graph.callees`); only `flowmap change` output and the pr-lens skill move.","no_longer":[{"was":"Tests outside the code dirs are files off the map, so a page can say \"no tests changed\" when they did","cite":"flowmap/change.py:file_kind"},{"was":"A reach move is matched to parts by entry point, so every part on a step lists every move on that step","cite":"flowmap/change.template.html"},{"was":"A function whose nested defs changed drops off the list of changed code","cite":"flowmap/change.py:facts"}]},"chapters":[{"title":"The overview says what a reader believed that is no longer true, and what still is","role":"core","kind":"new view","symbols":["flowmap/change.py:facts"],"files":["flowmap/change.template.html"],"before":"The overview gave the delta, number chips (one read \"existing code reached +3 \u22120\"), the author's intent below them, and the flows a part lands on. What became false was only in prose, if the story said it, and \"Untouched flows\" was the only thing said to be kept.","after":"The intent is the subtitle. Under the delta, \"No longer true\" strikes through the story's `no_longer` lines, each with its cite, and adds what the facts show on their own: lost reach, removed entry points and module links, and map anchors the change removed (`facts` now lists them as `anchors_lost`). \"Still true\" says which flows are untouched, how many of all entry points run no changed code, and whether any reach or call was lost, ending with what the call graph can't vouch for when the verdict is blind. The reach chips say \"existing functions newly reached\" and \"no longer reached\".","claim":"On PR #4 the page would have said the map's steps still run 4 functions that change removed; nothing caught that until now.","why":"Readers add new things to their picture easily and keep old beliefs the change made false; saying the old belief out loud is what makes them replace it. Rather than seeding every line from the graph, which found something on only 1 of the last 6 PRs (#4), the story writes most of them and must cite the diff.","verified":[{"how":"test","what":"tests/test_change.py:test_map_anchors_the_change_removed"},{"how":"looked","what":"PR #10 rendered with a `no_longer` line, and PR #8's old page data in the new template, in a browser"},{"how":"not checked","what":"dark mode"}],"questions":[{"q":"A `no_longer` cite passes when it names a changed file or symbol. Should it have to name a line inside a hunk, so a plausible line that is still true is harder to write?","why":"Decides how much the lint, rather than the reader test, guards this block.","kind":"ask"},{"q":"\"Still true\" counts entry points that run no changed code from the verdict's `spreads_to`. On a blind verdict that is a floor. Is the scoping note under it enough?","why":"A kept line that overstates is the same failure as a false \"no longer\" line.","kind":"ask"},{"q":"Run `flowmap change 0d82693^ 0d82693 --name pr4-check` and open it: No longer true should list the map's steps that still run `Graph._collect`, `_link`, `_imports` and `py_symbols`. Delete the page after.","why":"The only past PR where the map went stale.","kind":"check"}]},{"title":"Each part draws its calls as a tree: what existed, and what this change added or removed","role":"supporting","kind":"new view","symbols":["flowmap/change.py:facts.causes","flowmap/change.py:facts.causes.below"],"before":"Calls a part added or removed were flat \"+ call a \u2192 b\" rows in the folded Ripple section; one shortest call path per step sat in another fold. Reach moves were matched to parts by entry point, so on PR #10 three questions showed in both parts, ticked.","after":"Under before/after, \"Calls, before \u2192 after\" draws each root of the part from its entry point: + for calls added, \u2212 for calls removed, plain for calls that existed, unchanged ones as a count (each changed function's `kept_calls`), at most 18 lines. Changed functions in another part say \"\u2192 part N\"; existing code that now runs somewhere new says so; non-code files the part claims end the tree as \"not in the call graph\". `facts.causes` names, for each reach move, the changed calls nearest the moved function on any path, and the page puts the move with the part that owns them. The Ripple fold becomes \"Callers and reach\" without the call rows.","claim":"PR #10 part 1 shows `build` now calling `merges` and `functions`, and `merges` calling `Diagrams.component`, which now runs under `flowmap atlas`.","why":"A reader keeps the shape they know and edits it, which costs less than rebuilding it from prose. Rather than an agent-drawn diagram per PR, the tree comes from the call graph, so it can't claim a call that isn't there.","verified":[{"how":"test","what":"tests/test_change.py:test_a_reach_move_names_the_call_that_caused_it"},{"how":"looked","what":"PR #10 part 1's tree matches the one built by hand from the call graph; PR #8's five parts render"},{"how":"not checked","what":"the tree's JavaScript has no automated test"}],"questions":[{"q":"The tree can't tell a name-matched edge (`reconcile.UnionFind.union` from `set().union`) from a real call. Should the graph mark name-resolved edges so the tree can say \"likely over-report\"?","why":"It is where the tree is most likely to mislead.","kind":"ask"},{"q":"The first version took the last changed call on one shortest path, and a test failed under some hash seeds because two paths tie. `causes` now takes every nearest changed call. Is crediting both `functions` and `doc` for `_find` right?","why":"Decides whether a move can show in two parts again.","kind":"ask"},{"q":"Open PR #10's page before and after this change: the tray should drop from 11 to 8 questions, with each reach question in one part.","why":"The duplicate questions were the visible symptom.","kind":"check"}]},{"title":"Facts the page stated wrongly are right","role":"supporting","kind":"fix","symbols":["flowmap/change.py:file_kind","flowmap/change.py:opens_class"],"before":"`file_kind` checked the code dirs before the test pattern, so `tests/` files were \"outside\" and PR #8 and #10 said \"no tests changed\". A def listed with its nested defs was dropped before callers were marked edited, so edited callers read \"not edited\", and a function whose own body changed vanished when a nested def changed too. The header's head sha was the pre-squash branch head, and `head` could be the literal `HEAD`.","after":"Tests are tests wherever they sit. Only a class is dropped for its methods (`opens_class` reads past decorators for `class `), and callers are marked edited against everything that changed. `base` and `head` are full shas; the header labels the short one \"branch head when rendered\". A page with no verdict says it came from an older flowmap.","claim":"On the golden test's range (6d9eaff..770f1a7), `change.py:facts` and `lens.py:main` are listed again and 13 callers now read edited.","why":"One wrong fact costs trust in every other line on the page.","verified":[{"how":"test","what":"tests/test_change.py:test_tests_outside_the_code_dirs_count_as_tests"},{"how":"test","what":"tests/test_golden.py:test_change_facts"}],"questions":[{"q":"Read the golden diff for `tests/golden/change-facts-6d9eaff-770f1a7.json`: besides new fields, only `edited` flags flip to true and `facts` and `lens.main` reappear.","why":"A changed golden is a behaviour change; these are the intended ones.","kind":"check"},{"q":"`opens_class` looks for `class ` after decorators, for regex-outlined TS and Ruby too. Good enough, or should builders say which defs are classes?","why":"A miss lists a class's in-between lines as a changed symbol again.","kind":"ask"}]},{"title":"A story can't claim what the facts don't back","role":"supporting","kind":"guard","symbols":["flowmap/change.py:lint_story","flowmap/change.py:merge","flowmap/change.py:main"],"before":"A story naming symbols the diff doesn't change printed one warning to stderr; files, cites and test names went unchecked, and `--link` printed a link regardless.","after":"`lint_story` checks story symbols and files against the diff, that each `no_longer` line cites a changed file or a map step, that `verified` uses test, ran, looked or not checked, and that a test named there is in the file at head. The page lists what fails under the title; `--link` prints the problems and no link.","claim":"A story with an uncited line, a file the diff doesn't touch or a test that doesn't exist can't reach a PR body as a link.","why":"Agent-written PR descriptions that claim what the code doesn't do get merged far less often; this catches the checkable claims before a reader sees them.","verified":[{"how":"test","what":"tests/test_change.py:test_unbacked_claims_are_named"},{"how":"test","what":"tests/test_change.py:test_a_backed_story_passes"},{"how":"ran","what":"`flowmap change origin/main HEAD --name pr-11 --link` on this story: no problems, link printed"}],"questions":[{"q":"A `test` entry passes when its name appears anywhere in the file at head: a name check, not a test run. Enough?","why":"Decides whether \"verified: test\" can be trusted without CI.","kind":"check"},{"q":"Lint never fires without a story, so auto-chaptered pages get no check at all. Fine, since they make no claims?","why":"The lint guards prose, and those pages have none.","kind":"ask"}]},{"title":"pr-lens asks for what is no longer true, how each part was verified, the other way, and a reader test","role":"supporting","kind":"prose that steers the agent","files":["skills/pr-lens/SKILL.md"],"before":"The story schema had no place for false beliefs or verification. \"Alternatives\" was a question for the author, even when the author's own agent wrote the story. The PR body had no door line, and nothing tested whether the story landed.","after":"The schema adds `no_longer` (at most three, each citing a changed file, symbol or map step, checked against the code at head) and `verified` per part. `why` says \"rather than X, because Y\" when there was another way, and the Alternatives question is only for someone else's PR. The PR body gains a one-way or two-way door line. Before the PR opens, a subagent with none of the author's context reads only the story and the facts and answers four questions; where it is wrong, the story is fixed.","claim":"The author's agent writes down what only it knows (the other way, how const PAYLOAD = /^#v1\.([\w-]+)$/.exec(location.hash);
// another link pasted into this tab changes only the fragment, which does not reload the page
addEventListener("hashchange", () => { if (location.hash.startsWith("#v1.")) location.reload(); });

async function inflate(b64) {
  const bytes = Uint8Array.from(atob(b64.replace(/-/g, "+").replace(/_/g, "/")), (c) => c.charCodeAt(0));
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return JSON.parse(await new Response(stream).text());
}

function fromFile(error) {
  const box = document.createElement("section");
  box.className = "drop";
  box.innerHTML = `<h1>Open a flowmap change</h1>
    <p>Drop a change page (<code>docs/flowmap/changes/&lt;name&gt;.html</code>) or its data as JSON here.
    It is read in this tab and sent nowhere.</p>
    <p><input type="file" accept=".html,.json"></p><p class="err" hidden></p>`;
  const err = box.querySelector(".err");
  if (error) { err.hidden = false; err.textContent = error; }
  document.querySelector(".wrap").replaceChildren(box);
  document.querySelector(".tray").hidden = true;
  return new Promise((resolve) => {
    const read = async (f) => {
      try {
        const text = await f.text();
        const m = /const EMBEDDED = (\{.*?\});\n/s.exec(text) || /const DATA = (\{.*?\});\n/s.exec(text);
        const data = JSON.parse(m ? m[1] : text);
        if (!data.facts || !data.chapters) throw new Error("not flowmap change data");
        resolve(data);
      } catch (e) { err.hidden = false; err.textContent = `Could not read ${f.name}: ${e.message}`; }
    };
    box.querySelector("input").addEventListener("change", (e) => e.target.files[0] && read(e.target.files[0]));
    addEventListener("dragover", (e) => { e.preventDefault(); box.classList.add("over"); });
    addEventListener("dragleave", () => box.classList.remove("over"));
    addEventListener("drop", (e) => { e.preventDefault(); box.classList.remove("over"); e.dataTransfer.files[0] && read(e.dataTransfer.files[0]); });
  });
}

async function load() {
  if (EMBEDDED) return EMBEDDED;
  if (PAYLOAD) {
    try { return await inflate(PAYLOAD[1]); }
    catch (e) { return fromFile("The link's data is cut off or damaged. Was the whole link copied?"); }
  }
  return fromFile();
}

const WRAP = document.querySelector(".wrap").cloneNode(true);
const DATA = await load();
document.querySelector(".wrap").replaceWith(WRAP);
document.querySelector(".tray").hidden = false;
if (DATA.story.title) document.title = DATA.story.title;
const F = DATA.facts, S = DATA.story;
const $ = (s) => document.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v; else if (k === "text") n.textContent = v; else if (k === "html") n.innerHTML = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
  }
  for (const c of kids) if (c != null) n.append(c);
  return n;
};
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const md = (s) => esc(s || "").replace(/`([^`]+)`/g, "<code>$1</code>");
const sym = (id) => id.split(":").pop();
const file = (id) => id.split(":")[0].split("/").pop();
const flowName = (id) => id.replace(/^new:/, "").replace(/-/g, " ");
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
const ROLE = { core: "Core change", supporting: "Supporting change", refactor: "Refactor", outside: "Off the map",
  unassigned: "Not in the story", "off-map": "Off the map" };

const steps = new Map();
F.map.forEach((f, fi) => f.steps.forEach((s, si) => steps.set(s.key, { ...s, flow: f.id, fi, si })));
const symById = new Map(F.symbols.map(s => [s.id, s]));
const byPlace = (a, b) => (steps.get(a).fi - steps.get(b).fi) || (steps.get(a).si - steps.get(b).si);

// a reach move belongs to the part whose added (or dropped) call caused it; when no part owns the

        el("input", { type: "checkbox", id: q.id, checked: picked.has(q.id) ? "" : null,
          onchange: (e) => { e.target.checked ? picked.add(q.id) : picked.delete(q.id); renderNote(); } }),
        el("label", { for: q.id }, el("span", { class: "qtext", html: `<span class="qkind ${esc(q.kind)}">${esc(kind)}</span>` + md(q.q) }),
          q.why ? el("span", { class: "qwhy", html: md(q.why) }) : null)));
    }
    pane.append(el("section", { style: "display:grid;gap:10px" }, el("h3", { class: "label", text: "Questions, most decisive first" }), ol));
  }

  // evidence, on demand
  const more = el("div", { class: "more" });
  const rows = [
    ...movesFor(c, c.keys, "lost").map(([s, eps]) => ["rem", "no longer", `${file(s)} · ${sym(s)} from ${eps.join(", ")}`]),
    ...movesFor(c, c.keys, "gained").map(([s, eps]) => ["add", "now reaches", `${file(s)} · ${sym(s)} from ${eps.join(", ")}`]),
    ...[...c.callers].sort((a, b) => a[1] - b[1]).map(([id, edited]) => [edited ? "yes" : "no", edited ? "caller, edited" : "caller, not edited", `${file(id)} · ${sym(id)}`]),
  ];
  if (rows.length) {
    const notEdited = [...c.callers.values()].filter(e => !e).length;
    more.append(fold("Callers and reach", notEdited ? `${notEdited} caller${notEdited === 1 ? "" : "s"} not edited` : "",
      el("ul", { class: "rows" }, ...rows.map(([k, m, t]) => el("li", {}, el("span", { class: "mark " + k, text: m }), el("span", { text: t }))))));
  }
  if (c.hunks.length) {
    const box = el("div", { style: "display:grid;gap:10px" });
    const hunkEls = c.hunks.map(h => {
      const pre = el("pre");
      h.lines.forEach(l => pre.append(el("span", { class: l[0] === "+" ? "a" : l[0] === "-" ? "r" : "", text: l })));
      const n = el("div", { class: "hunk" }, el("div", { class: "hh", text: `${h.file} @ ${h.new}${h.ctx ? " · " + h.ctx : ""}` }), pre);
      n._syms = h.symbols; n._file = h.file;
      return n;
    });
    // pick a symbol (or file) to see only its hunks
    const keysOf = [...new Set([...c.syms.map(s => s.id), ...c.hunks.filter(h => !h.symbols.length).map(h => h.file)])];
    const chips = el("div", { class: "chips" });
    const filter = (key) => {
      chips.querySelectorAll(".chip").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.k === key)));
      hunkEls.forEach(n => { n.hidden = key != null && !(n._syms.includes(key) || (!n._syms.length && n._file === key)); });
    };
    if (keysOf.length > 1) keysOf.forEach(k => {
      const s = symById.get(k);
      chips.append(el("button", { type: "button", class: "chip", "data-k": k, "aria-pressed": "false", title: k,
        onclick: (e) => filter(e.currentTarget.getAttribute("aria-pressed") === "true" ? null : k) },
        s ? (c.syms.filter(o => sym(o.id) === sym(k)).length > 1 ? `${file(k)} · ${sym(k)}` : sym(k)) : k.split("/").pop(), s && s.status !== "modified" ? el("i", { text: s.status }) : null));
    });
    box.append(chips, ...hunkEls);
    const files = [...new Set(c.hunks.map(h => h.file.split("/").pop()))];
    more.append(fold("Code", `${plural(c.hunks.length, "hunk")} in ${files.slice(0, 4).join(", ")}${files.length > 4 ? ` and ${files.length - 4} more` : ""}`, box));
  }
  if (more.children.length) pane.append(more);
}

function renderNote() {
  const lines = [];
  for (const c of chapters) {
    const qs = c.qs.filter(q => picked.has(q.id));
    if (!qs.length) continue;
    lines.push(`${c.n}. ${c.title}`);
    qs.forEach(q => lines.push(`   - ${q.q}`));
  }
  $("#note").value = lines.join("\n");
  $("#count").textContent = plural(picked.size, "question");
}

addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  const d = { ArrowRight: 1, j: 1, ArrowLeft: -1, k: -1 }[e.key];
  if (d && current + d >= 0 && current + d <= chapters.length) { e.preventDefault(); show(current + d); }
});
$("#peek").addEventListener("click", (e) => {
  const open = $("#note").hidden;
  $("#note").hidden = !open;
  e.target.setAttribute("aria-expanded", String(open));
  e.target.textContent = open ? "Hide" : "Show";
});
$("#copy").addEventListener("click", async () => {
  const t = $("#note");
  try { await navigator.clipboard.writeText(t.value); $("#status").textContent = "Copied"; }
  catch (e) { t.hidden = false; t.focus(); t.select(); $("#status").textContent = "Selected: press Ctrl+C or Cmd+C to copy"; }
});
renderNote();
show(0, false);
</script>
