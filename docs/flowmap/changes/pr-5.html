<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..100,500..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"><!--/fonts-->
<style>
/* Layout: a change told as chapters on a fixed system map. The map keeps the atlas's positions
   so the same place always looks the same; each chapter says where, before -> after, why, and
   what to ask. Code is folded at the end of each chapter. */
:root {
  --paper: #eef1f4;
  --surface: #ffffff;
  --ink: #17202b;
  --muted: #5b6676;
  --rule: #cdd4dc;
  --line: #9aa6b4;
  --accent: #2e5bff;
  --accent-soft: rgba(46, 91, 255, .12);
  --core: #2e5bff;
  --support: #0f7c86;
  --refactor: #6b7686;
  --outside: #b7791f;
  --gain: #1e8a4c;
  --loss: #c8423b;
  --code-bg: #f6f8fa;
  --display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f141a; --surface: #161d26; --ink: #e6ebf1; --muted: #93a0b0; --rule: #2a3441;
    --line: #4a5666; --accent: #7c9cff; --accent-soft: rgba(124, 156, 255, .16);
    --core: #7c9cff; --support: #3cc0cb; --refactor: #93a0b0; --outside: #f0b429;
    --gain: #3fbf78; --loss: #ef6b63; --code-bg: #10161d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f141a; --surface: #161d26; --ink: #e6ebf1; --muted: #93a0b0; --rule: #2a3441;
  --line: #4a5666; --accent: #7c9cff; --accent-soft: rgba(124, 156, 255, .16);
  --core: #7c9cff; --support: #3cc0cb; --refactor: #93a0b0; --outside: #f0b429;
  --gain: #3fbf78; --loss: #ef6b63; --code-bg: #10161d; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 15px/1.55 var(--body); }
.wrap { padding-inline: 16px; padding-block: 28px 64px; max-width: 1180px; margin: 0 auto; display: grid; gap: 28px; }
code, .mono { font-family: var(--mono); font-size: .86em; }
p code, li code, dd code { background: var(--accent-soft); padding: 0 .3em; border-radius: 4px; overflow-wrap: anywhere; }
h1, h2, h3 { text-wrap: balance; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.label { font: 600 11px var(--body); text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }

/* header */
header { display: grid; gap: 12px; }
header h1 { font: 800 clamp(28px, 4.4vw, 44px)/1.02 var(--display); font-stretch: 74%; margin: 0; max-width: 24ch; }
.range { color: var(--muted); font-size: 13px; }
.range a { color: inherit; }
.delta { font-size: 18px; line-height: 1.5; max-width: 68ch; margin: 0; }
.intent { color: var(--muted); max-width: 68ch; margin: 0; font-size: 14px; }

/* system numbers: each with what drives it */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1px; background: var(--rule);
  border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
.tile { background: var(--surface); padding: 12px 14px; display: grid; gap: 2px; align-content: start; min-width: 0; }
.tile b { font: 700 22px/1.1 var(--display); font-stretch: 80%; font-variant-numeric: tabular-nums; }
.tile small { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.tile.zero b { color: var(--muted); }

/* the map */
.map { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 16px; display: grid; gap: 10px; }
.map-head { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; justify-content: space-between; }
.map-head h2 { font: 700 15px var(--display); font-stretch: 80%; margin: 0; letter-spacing: .02em; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.lines { overflow-x: auto; }
.lines-inner { display: grid; grid-template-columns: repeat(var(--flows, 3), minmax(190px, 1fr)); gap: 14px; }
.flow h3 { font: 700 13px/1.2 var(--display); font-stretch: 78%; margin: 0 0 8px; padding-left: 4px; letter-spacing: .02em; }
.flow.quiet h3 { color: var(--muted); }
.stations { list-style: none; margin: 0; padding: 0; position: relative; display: grid; gap: 2px; }
.stations::before { content: ""; position: absolute; left: 11px; top: 12px; bottom: 12px; width: 3px; background: var(--line); border-radius: 2px; }
.st { position: relative; display: grid; grid-template-columns: 25px minmax(0, 1fr); gap: 6px; align-items: start;
  padding: 5px 6px 5px 0; border-radius: 6px; font-size: 12.5px; line-height: 1.3; }
.st .pin { width: 13px; height: 13px; border-radius: 50%; background: var(--surface); border: 3px solid var(--line);
  justify-self: center; margin-top: 2px; position: relative; z-index: 1; }
.st.hit .pin { border-color: var(--accent); background: var(--accent); }
.st.quiet { color: var(--muted); }
.st .refs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.ref { font: 600 11px/1 var(--mono); border-radius: 999px; padding: 3px 7px; border: 1px solid currentColor; color: var(--role, var(--accent));
  background: none; cursor: pointer; text-decoration: none; }
.ref:hover { background: var(--accent-soft); }
.offmap { font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

/* chapters */
.chapters { display: grid; gap: 22px; counter-reset: ch; }
.chapter { --role: var(--accent); background: var(--surface); border: 1px solid var(--rule); border-radius: 12px;
  padding: 20px; display: grid; gap: 16px; scroll-margin-top: 16px; border-top: 4px solid var(--role); }
.chapter.core { --role: var(--core); } .chapter.supporting { --role: var(--support); }
.chapter.refactor { --role: var(--refactor); } .chapter.outside, .chapter.unassigned, .chapter.off-map { --role: var(--outside); }
.chapter:target, .chapter.targeted { box-shadow: 0 0 0 3px var(--accent-soft); }
.ch-head { display: grid; gap: 6px; }
.ch-tags { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.num { font: 800 13px var(--mono); color: var(--surface); background: var(--role); border-radius: 6px; padding: 2px 8px; }
.tag { font: 600 11px var(--body); text-transform: uppercase; letter-spacing: .08em; color: var(--role); }
.kind { font-size: 12px; color: var(--muted); }
.chapter h2 { font: 750 clamp(20px, 2.6vw, 26px)/1.15 var(--display); font-stretch: 80%; margin: 0; }
.claim { margin: 0; color: var(--muted); max-width: 70ch; }

.where { display: grid; grid-template-columns: minmax(0, 260px) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 720px) { .where { grid-template-columns: minmax(0, 1fr); } }
.here { display: grid; gap: 8px; }
.minimap { background: var(--paper); border-radius: 8px; padding: 10px; }
.minimap svg { display: block; width: 100%; height: auto; }
.minimap .dot { fill: var(--surface); stroke: var(--line); stroke-width: 2; }
.minimap .dot.on { fill: var(--role); stroke: var(--role); }
.minimap .rail { stroke: var(--line); stroke-width: 2; }
.minimap text { fill: var(--muted); font: 9px var(--body); }
.crumbs { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 13px; }
.crumbs li { display: grid; gap: 1px; }
.crumbs .flow-name { color: var(--muted); font-size: 11.5px; }

.morph { display: grid; gap: 10px; margin: 0; }
.morph > div { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 10px; }
.morph dt { font: 600 11px var(--body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding-top: 3px; }
.morph dd { margin: 0; }
.morph .after dd { font-weight: 500; }
.why { border-left: 3px solid var(--role); padding: 6px 12px; background: var(--paper); border-radius: 0 8px 8px 0; display: grid; gap: 2px; }
.why p { margin: 0; max-width: 72ch; }

.evidence { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px 24px; }
.evidence > div { display: grid; gap: 6px; align-content: start; min-width: 0; }
.paths, .callers, .edges { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 12.5px; }
.path { display: flex; flex-wrap: wrap; align-items: center; gap: 3px; font-family: var(--mono); font-size: 11.5px; }
.path span { background: var(--paper); border: 1px solid var(--rule); border-radius: 4px; padding: 1px 5px; }
.path span.end { border-color: var(--role); color: var(--role); }
.path i { color: var(--muted); font-style: normal; }
.callers li, .edges li { display: flex; gap: 8px; align-items: baseline; font-family: var(--mono); font-size: 11.5px; overflow-wrap: anywhere; }
.mark { font-family: var(--body); font-size: 11px; font-weight: 600; flex: none; width: 72px; }
.mark.yes { color: var(--gain); } .mark.no { color: var(--outside); }
.edges .add { color: var(--gain); } .edges .rem { color: var(--loss); }
.note { font-size: 12.5px; color: var(--muted); margin: 0; }

.qs { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; counter-reset: q; }
.q { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; align-items: start; }
.q input { margin-top: 4px; width: 16px; height: 16px; accent-color: var(--accent); }
.q label { display: grid; gap: 3px; cursor: pointer; }
.q .qtext { font-weight: 500; }
.q .qwhy { color: var(--muted); font-size: 13px; }
.qkind { font: 600 10.5px var(--body); text-transform: uppercase; letter-spacing: .08em; border-radius: 4px; padding: 1px 6px; margin-right: 6px; }
.qkind.ask { background: var(--accent-soft); color: var(--accent); }
.qkind.check { background: var(--paper); color: var(--muted); border: 1px solid var(--rule); }
.qkind.graph { background: var(--paper); color: var(--support); border: 1px solid var(--rule); }

details.code { border-top: 1px dashed var(--rule); padding-top: 10px; }
details.code summary { cursor: pointer; font-size: 13px; color: var(--muted); }
.hunk { margin-top: 10px; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.hunk .hh { font: 11.5px var(--mono); color: var(--muted); padding: 6px 10px; background: var(--paper); border-bottom: 1px solid var(--rule); overflow-wrap: anywhere; }
.hunk pre { margin: 0; overflow-x: auto; background: var(--code-bg); font: 12px/1.5 var(--mono); padding: 6px 0; }
.hunk pre span { display: block; padding: 0 10px; white-space: pre; min-width: max-content; }
.hunk .a { background: rgba(30, 138, 76, .13); } .hunk .r { background: rgba(200, 66, 59, .13); }

/* the review note */
.ask-box { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 20px; display: grid; gap: 12px; }
.ask-box h2 { font: 750 22px var(--display); font-stretch: 80%; margin: 0; }
.ask-box textarea { width: 100%; min-height: 160px; font: 13px/1.5 var(--mono); color: var(--ink); background: var(--paper);
  border: 1px solid var(--rule); border-radius: 8px; padding: 10px; resize: vertical; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
button.primary { font: 600 14px var(--body); background: var(--accent); color: var(--surface); border: 0; border-radius: 8px; padding: 8px 14px; cursor: pointer; }
.status { font-size: 13px; color: var(--muted); }
.folded { font-size: 13px; color: var(--muted); }

/* viewer mode: no data in the page or the link, so ask for a file */
.drop { background: var(--surface); border: 2px dashed var(--rule); border-radius: 12px; padding: 32px 20px; display: grid; gap: 10px; justify-items: start; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop h1 { font: 800 28px/1.1 var(--display); font-stretch: 74%; margin: 0; }
.drop p { margin: 0; max-width: 68ch; color: var(--muted); }
.drop .err { color: var(--loss); }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
html { scroll-behavior: smooth; }
</style>

<div class="wrap">
  <header id="top"></header>
  <section class="tiles" id="tiles" aria-label="How the system moved"></section>

    <div class="map-head">

    <div class="lines"><div class="lines-inner" id="lines"></div></div>
    <div class="offmap" id="offmap" hidden></div>
  </section>
  <section class="chapters" id="chapters" aria-label="Chapters"></section>
  <section class="ask-box" aria-labelledby="ask-h">
    <h2 id="ask-h">Questions for the author</h2>
    <p class="note">Ticked questions collect here. Copy them into the PR as your review.</p>
    <textarea id="note" aria-label="Review note" readonly></textarea>
    <div class="row"><button class="primary" id="copy" type="button">Copy questions</button><span class="status" id="status" aria-live="polite"></span></div>
    <p class="folded" id="folded"></p>
  </section>
</div>

thon tools/flowmap/viewer.py <dir>","+","+Writes <dir>/change.html. Host it anywhere static (S3, Cloudflare Pages, a public Pages repo) and","+point `viewer` in flowmap.toml at its URL. The data never reaches the host: browsers do not send","+the fragment, and the page's CSP forbids it from making any request.","+\"\"\"","+","+import argparse","+import sys","+from pathlib import Path","+","+sys.path.insert(0, str(Path(__file__).parent))","+from change import viewer_html  # noqa: E402","+","+","+def main():","+    ap = argparse.ArgumentParser()","+    ap.add_argument(\"dir\")","+    a = ap.parse_args()","+    out = Path(a.dir) / \"change.html\"","+    out.parent.mkdir(parents=True, exist_ok=True)","+    out.write_text(viewer_html())","+    print(f\"wrote {out}\")","+","+","+if __name__ == \"__main__\":","+    main()"],"symbols":["flowmap/viewer.py:__main__","flowmap/viewer.py:main"]},{"file":"skills/pr-lens/SKILL.md","old":102,"new":102,"ctx":"Also write the change as a page people can read without the diff:","lines":["    agent (skills, prompts) is behaviour: give it a chapter. Two to five questions per chapter.","    \"Ask\" means only the author can answer; \"check\" means the reviewer can settle it themselves.","-3. `flowmap change <base> <head> --name <name>` writes","-   `docs/flowmap/changes/<name>.html`. Symbols the story leaves out land in a \"not in the story\"","-   chapter, so nothing changed is hidden.","+3. `flowmap change <base> <head> --name <name> --link` writes","+   `docs/flowmap/changes/<name>.html` and prints a viewer link carrying the whole page, for the","+   PR body. Symbols the story leaves out land in a \"not in the story\" chapter, so nothing","+   changed is hidden. Without `viewer` in `flowmap.toml`, drop `--link` and link the committed page."," "," ## After"],"symbols":[]}]},"story":{"title":"A change page opens from a link, without publishing its data","pr":"PR #5","url":"https://github.com/NelisVerhoef/Flowmap/pull/5","intent":"Make change pages readable in a browser without putting a company's code on a public site: GitHub Pages cannot serve this private repo, and publishing the pages would expose their contents.","delta":"No flow or step on the map moves; the map does not yet have a step for `flowmap change`. That command gains `--link`, which prints a URL whose `#` fragment carries the whole page, and a new `flowmap viewer` command builds the page that renders such a link in the browser. Browsers never send the fragment, so the data stays in the tab. The viewer is deployed as a static site at flowmap.testabl.ai, and the PR instructions now link to it instead of GitHub Pages. The committed HTML change page is still written and renders as before."},"chapters":[{"title":"`flowmap change --link` prints a link that carries the page","role":"core","kind":"new capability","symbols":["flowmap/change.py:link","flowmap/change.py:main"],"files":["flowmap/config.py","flowmap.toml"],"before":"`flowmap change` wrote `<out>/changes/<name>.html` and nothing else; reading it in a browser needed a published copy (GitHub Pages).","after":"With `--link` it also prints `<viewer>#v1.<base64url of raw-deflated page data>`, with only the link on stdout so it can be captured. It reads the viewer URL from `FLOWMAP_VIEWER` or `viewer` in flowmap.toml, exits with guidance when neither is set, and warns on stderr when the link passes 60,000 characters (a PR body holds 65,536).","claim":"The page travels inside the link, so nothing has to be hosted per change.","why":"Every PR in this repo links its change page this way from now on (CLAUDE.md). PR #3's page is a 21 KB link; a large PR could pass the PR-body limit, and then the reviewer needs the dropped-file fallback.","questions":[{"q":"The payload is versioned in the fragment (`#v1.`), and the viewer is versioned in its path (`/v1/change.html`). When the page data's shape changes, which one should bump, and do old links keep working?","why":"Decides whether links in merged PRs still render after the template changes.","kind":"ask"},{"q":"Over 60,000 characters `--link` only warns. Should it fail instead, or print the committed page's path as the link to open?","why":"A truncated link in a PR body renders an error page for every reviewer.","kind":"ask"},{"q":"Paste the link from `flowmap change 770f1a7 a56bd10 --name pr-3 --link` into a browser: does PR #3's page render with its 4 chapters?","why":"Confirms the encoder and the viewer agree end to end.","kind":"check"}]},{"title":"One template renders from embedded data, a link, or a dropped file","role":"supporting","kind":"viewer","symbols":["flowmap/change.py:viewer_html","flowmap/viewer.py:main","flowmap/viewer.py:__main__"],"files":["flowmap/change.template.html","bin/flowmap"],"before":"The change template only worked with data embedded by `flowmap change`; its chapter links replaced the URL fragment.","after":"The template loads embedded data first, then a `#v1.` fragment, then asks for a dropped change page (old `const DATA` pages too) or its JSON. `flowmap viewer <dir>` writes it with no data, Google Fonts swapped for a CSP of `default-src 'none'`, so the hosted page cannot make any request. With a fragment, in-page links scroll instead of replacing it, and pasting a new link into the tab reloads it.","claim":"The hosted viewer is provably unable to send the data anywhere.","why":"This is what a company has to trust: that the page they open reads their change locally. The CSP is the evidence; a request-free page also means no fonts, so the viewer falls back to system fonts.","questions":[{"q":"The script is an inline module allowed by `script-src 'unsafe-inline'`. Should the viewer pin its script by hash instead, so an injected script could not run?","why":"Decides how strong the 'data never leaves the tab' claim is under review by a security team.","kind":"ask"},{"q":"Open https://flowmap.testabl.ai/v1/change.html with no fragment and drop `docs/flowmap/changes/pr-1.html` on it: does it render, with no requests in the network tab?","why":"Confirms the fallback and the CSP on the deployed copy.","kind":"check"}]},{"title":"The viewer is hosted on S3 and CloudFront via Fjall","role":"outside","kind":"infrastructure","symbols":[],"files":["fjall/flowmap/infrastructure.ts","fjall/flowmap/package.json","fjall/flowmap/package-lock.json","fjall/flowmap/cdk.json","fjall/flowmap/cdk.context.json","fjall/flowmap/tsconfig.json","fjall/flowmap/.gitignore","fjall/fjall-config.json","fjall/.gitignore",".gitignore"],"before":"No hosted viewer; `.github/workflows/flowmap-pages.yml` pushed pages to a gh-pages branch that a private repo cannot serve.","after":"A Fjall static site (`flowmap`, in the testabl.ai organisation) builds with `python3 bin/flowmap viewer site/v1` and serves it from a private S3 bucket behind CloudFront at https://flowmap.testabl.ai/v1/change.html. testabl.ai's DNS is on Cloudflare, so the certificate validation and `flowmap` CNAMEs live there; the Route53 zone the infrastructure names is not authoritative.","claim":"Hosting costs pennies and holds no change data.","why":"Deploys run from a laptop with Fjall credentials today; if the infrastructure and the DNS drift apart (Cloudflare vs Route53), the next certificate renewal or rebuild is where it shows.","questions":[{"q":"The infrastructure names Route53 zone Z074708715PBLRVPFKB72, but Cloudflare serves testabl.ai. Delegate flowmap.testabl.ai to Route53 so Fjall owns its records, or keep them by hand in Cloudflare?","why":"Decides who fixes DNS when the viewer is rebuilt or its certificate is re-issued.","kind":"ask"},{"q":"Should the viewer deploy from CI on merge (a Fjall CI token), so the hosted copy cannot lag the template?","why":"Today a template change only reaches flowmap.testabl.ai when someone runs `fjall deploy flowmap`.","kind":"ask"},{"q":"`.github/workflows/flowmap-pages.yml` still runs and nothing links to its output. Remove it here or in a follow-up?","why":"Le const PAYLOAD = /^#v1\.([\w-]+)$/.exec(location.hash);
// another link pasted into this tab changes only the fragment, which does not reload the page
addEventListener("hashchange", () => { if (location.hash.startsWith("#v1.")) location.reload(); });

async function inflate(b64) {
  const bytes = Uint8Array.from(atob(b64.replace(/-/g, "+").replace(/_/g, "/")), (c) => c.charCodeAt(0));
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return JSON.parse(await new Response(stream).text());
}

function fromFile(error) {
  const box = document.createElement("section");
  box.className = "drop";
  box.innerHTML = `<h1>Open a flowmap change</h1>
    <p>Drop a change page (<code>docs/flowmap/changes/&lt;name&gt;.html</code>) or its data as JSON here.
    It is read in this tab and sent nowhere.</p>
    <p><input type="file" accept=".html,.json"></p><p class="err" hidden></p>`;
  const err = box.querySelector(".err");
  if (error) { err.hidden = false; err.textContent = error; }
  document.querySelector(".wrap").replaceChildren(box);
  return new Promise((resolve) => {
    const read = async (f) => {
      try {
        const text = await f.text();
        const m = /const EMBEDDED = (\{.*?\});\n/s.exec(text) || /const DATA = (\{.*?\});\n/s.exec(text);
        const data = JSON.parse(m ? m[1] : text);
        if (!data.facts || !data.chapters) throw new Error("not flowmap change data");
        resolve(data);
      } catch (e) { err.hidden = false; err.textContent = `Could not read ${f.name}: ${e.message}`; }
    };
    box.querySelector("input").addEventListener("change", (e) => e.target.files[0] && read(e.target.files[0]));
    addEventListener("dragover", (e) => { e.preventDefault(); box.classList.add("over"); });
    addEventListener("dragleave", () => box.classList.remove("over"));
    addEventListener("drop", (e) => { e.preventDefault(); box.classList.remove("over"); e.dataTransfer.files[0] && read(e.dataTransfer.files[0]); });
  });
}

async function load() {
  if (EMBEDDED) return EMBEDDED;
  if (PAYLOAD) {
    try { return await inflate(PAYLOAD[1]); }
    catch (e) { return fromFile("The link's data is cut off or damaged. Was the whole link copied?"); }
  }
  return fromFile();
}

const WRAP = document.querySelector(".wrap").cloneNode(true);
const DATA = await load();
document.querySelector(".wrap").replaceWith(WRAP);
if (DATA.story.title) document.title = DATA.story.title;
// the fragment holds the data, so in-page links scroll instead of replacing it
if (PAYLOAD) document.addEventListener("click", (e) => {
  const a = e.target.closest('a[href^="#"]');
  const to = a && document.getElementById(a.getAttribute("href").slice(1));
  if (!to) return;
  e.preventDefault();
  document.querySelectorAll(".targeted").forEach((n) => n.classList.remove("targeted"));
  to.classList.add("targeted");
  to.scrollIntoView();
});
const F = DATA.facts, S = DATA.story;
const $ = (s) => document.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v; else if (k === "text") n.textContent = v; else if (k === "html") n.innerHTML = v; else n.setAttribute(k, v);
  }
  for (const c of kids) if (c != null) n.append(c);
  return n;
};
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const md = (s) => esc(s || "").replace(/`([^`]+)`/g, "<code>$1</code>");
const sym = (id) => id.split(":").pop();
const file = (id) => id.split(":")[0].split("/").pop();
const flowName = (id) => id.replace(/^new:/, "").replace(/-/g, " ");
const ROLE = { core: "Core change", supporting: "Supporting change", refactor: "Refactor", outside: "Outside the map",
  unassigned: "Not in the story", "off-map": "Off the map" };

const steps = new Map();
F.map.forEach((f, fi) => f.steps.forEach((s, si) => steps.set(s.key, { ...s, flow: f.id, fi, si })));
const symById = new Map(F.symbols.map(s => [s.id, s]));

// chapter facts
const chapters = DATA.chapters.map((c, i) => {
  const syms = (c.symbols || []).map(id => symById.get(id)).filter(Boolean);
  const keys = new Set(syms.flatMap(s => s.steps));
  const ids = new Set(c.symbols || []);
  const mine = (n) => ids.has(n) || ids.has(n + ".__init__");  // calls to a class are calls to its constructor
  const edgesIn = (list) => list.filter(([a, b]) => mine(a) || mine(b));
  const callers = new Map();
  syms.filter(s => s.status === "modified").forEach(s => s.callers.forEach(c => { if (!ids.has(c.id)) callers.set(c.id, c.edited); }));
  const hunks = F.hunks.filter(h => h.symbols.some(x => ids.has(x)) || (c.files || []).includes(h.file));
  const role = c.role || (c.kind === "outside" ? "outside" : c.kind === "unassigned" ? "unassigned" : c.kind === "off-map" ? "off-map" : i === 0 ? "core" : "supporting");
  return { ...c, n: i + 1, id: "ch" + (i + 1), syms, keys, role, callers,
    added: edgesIn(F.edges.added), removed: edgesIn(F.edges.removed), hunks };
});

// header
const range = el("div", { class: "range" });
range.append(S.pr ? (S.url ? el("a", { href: S.url, text: S.pr }) : S.pr) : "", S.pr ? " · " : "",
  el("span", { class: "mono", text: `${F.base_sha} → ${F.head_sha}` }), ` · ${F.name}`);
$("#top").append(range, el("h1", { text: S.title || `${F.base}..${F.head}` }));
if (S.delta) $("#top").append(el("p", { class: "delta", html: md(S.delta) }));
if (S.intent) $("#top").append(el("p", { class: "intent", html: "<b>Author's intent:</b> " + md(S.intent) }));

// system numbers, each with its drivers
const touchedFlows = new Set(F.symbols.flatMap(s => s.steps.map(k => k.split("/")[0])));
const gained = Object.keys(F.reach.gained), lost = Object.keys(F.reach.lost);
const outside = F.files.filter(f => f.kind === "outside" || f.kind === "doc");
const tiles = [
  [`${touchedFlows.size} of ${F.map.length}`, "flows run changed code",
    touchedFlows.size ? [...touchedFlows].map(flowName).join(", ") + (F.flow_entropy === 0 ? " · one flow, no spread" : ` · spread ${F.flow_entropy} bits`) : "none"],
  [`+${F.endpoints.added.length} −${F.endpoints.removed.length}`, "entry points",
    [...F.endpoints.added.map(e => "+ " + e), ...F.endpoints.removed.map(e => "− " + e)].join(", ") || "no capability added or removed"],
  [`+${gained.length} −${lost.length}`, "existing code reached",
    [...gained.slice(0, 2).map(s => "+ " + sym(s)), ...lost.slice(0, 2).map(s => "− " + sym(s))].join(", ") || "no entry point gains or loses existing code"],
  [`+${F.modules.added.length} −${F.modules.removed.length}`, "module dependencies",
    [...F.modules.added.map(([a, b]) => `${a.split("/").pop()} → ${b.split("/").pop()}`)].join(", ") || "no new links between modules"],
  [`+${F.edges.added.length} −${F.edges.removed.length}`, "calls", `${F.symbols.filter(s => s.status === "new").length} new functions, ${F.symbols.filter(s => s.status === "modified").length} changed`],
  [`${outside.length}`, "files outside the map", outside.map(f => f.path).join(", ") || "none"],
  [F.tests.changed.length ? `${F.tests.changed.length}` : "0", "tests changed", F.tests.configured ? (F.tests.changed.join(", ") || "none changed") : "no test suite configured"],
];
for (const [v, k, d] of tiles) {
  const zero = /^(\+0 −0|0|0 of \d+)$/.test(v);
  $("#tiles").append(el("div", { class: "tile" + (zero ? " zero" : "") }, el("span", { class: "label", text: k }), el("b", { text: v }), el("small", { text: d })));
}

// the map: positions fixed by map.json, refs say which chapters run where
$("#lines").style.setProperty("--flows", F.map.length);
for (const f of F.map) {
  const ol = el("ol", { class: "stations" });
  let any = false;
  for (const s of f.steps) {
    const hits = chapters.filter(c => c.keys.has(s.key));
    any = any || hits.length > 0;
    const refs = el("span", { class: "refs" }, ...hits.map(c => el("a", { class: "ref", href: "#" + c.id, text: String(c.n),
      style: `--role: var(--${c.role === "core" ? "core" : c.role === "supporting" ? "support" : c.role === "refactor" ? "refactor" : "outside"})`,
      title: c.title })));
    ol.append(el("li", { class: "st" + (hits.length ? " hit" : " quiet") }, el("span", { class: "pin", "aria-hidden": "true" }),
      el("span", {}, s.name, hits.length ? refs : null)));
  }
  $("#lines").append(el("section", { class: "flow" + (any ? "" : " quiet") }, el("h3", { text: flowName(f.id) }), ol));
}
const offChapters = chapters.filter(c => !c.keys.size);
if (offChapters.length) {
  const box = $("#offmap");
  box.hidden = false;
  box.append("Not on any flow:", ...offChapters.map(c => el("a", { class: "ref", href: "#" + c.id, text: `${c.n} · ${c.title}`, style: "--role: var(--outside)" })));
}

// minimap: same positions as the big map, dots only
function minimap(c) {
  const cols = F.map.length, rows = Math.max(...F.map.map(f => f.steps.length));
  const W = 240, colW = W / cols, rowH = 16, top = 22, H = top + rows * rowH + 4;
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", `System map, ${c.keys.size} of ${steps.size} steps highlighted`);
  F.map.forEach((f, fi) => {
    const x = colW * fi + colW / 2;
    const t = document.createElementNS(ns, "text");
    t.setAttribute("x", x); t.setAttribute("y", 11); t.setAttribute("text-anchor", "middle");
    const nm = flowName(f.id);
    t.textContent = nm.length > 18 ? nm.slice(0, 17) + "…" : nm;
    svg.append(t);
    if (f.steps.length > 1) {
      const l = document.createElementNS(ns, "line");
      Object.entries({ x1: x, x2: x, y1: top, y2: top + (f.steps.length - 1) * rowH, class: "rail" }).forEach(([k, v]) => l.setAttribute(k, v));
      svg.append(l);
    }
    f.steps.forEach((s, si) => {
      const d = document.createElementNS(ns, "circle");
      Object.entries({ cx: x, cy: top + si * rowH, r: 5, class: "dot" + (c.keys.has(s.key) ? " on" : "") }).forEach(([k, v]) => d.setAttribute(k, v));
      const tip = document.createElementNS(ns, "title"); tip.textContent = s.name; d.append(tip);
      svg.append(d);
    });
  });
  return el("div", { class: "minimap" }, svg);
}

function pathEl(p) {
  const box = el("div", { class: "path" });
  p.forEach((n, i) => {
    if (i) box.append(el("i", { text: "›" }));
    box.append(el("span", { class: i === p.length - 1 ? "end" : "", title: n, text: i === 0 ? file(n) : sym(n) }));
  });
  return box;
}

const picked = new Set();
function renderNote() {
  const lines = [];
  for (const c of chapters) {
    const qs = (c._qs || []).filter(q => picked.has(q.id));
    if (!qs.length) continue;
    lines.push(`${c.n}. ${c.title}`);
    qs.forEach(q => lines.push(`   - ${q.q}`));
  }
  $("#note").value = lines.join("\n") || "";
}

for (const c of chapters) {
  const card = el("article", { class: `chapter ${c.role}`, id: c.id });
  card.append(el("div", { class: "ch-head" },
    el("div", { class: "ch-tags" }, el("span", { class: "num", text: String(c.n) }), el("span", { class: "tag", text: ROLE[c.role] || c.role }),
      c.kind && c.kind !== c.role ? el("span", { class: "kind", text: c.kind }) : null),
    el("h2", { text: c.title }),
    c.claim ? el("p", { class: "claim", html: md(c.claim) }) : null));

  // where + before/after
  const crumbs = el("ul", { class: "crumbs" });
  const keys = [...c.keys].sort((a, b) => (steps.get(a).fi - steps.get(b).fi) || (steps.get(a).si - steps.get(b).si));
  for (const k of keys) {
    const s = steps.get(k);
    crumbs.append(el("li", {}, el("span", { class: "flow-name", text: flowName(s.flow) }), el("span", { text: s.name })));
  }
  if (!keys.length) crumbs.append(el("li", {}, el("span", { class: "flow-name", text: "No flow runs this" }),
    el("span", { text: (c.files || []).join(", ") || c.syms.map(s => s.id).join(", ") })));
  const here = el("div", { class: "here" }, el("span", { class: "label", text: "You are here" }), minimap(c), crumbs);
  const morph = el("dl", { class: "morph" });
  if (c.before) morph.append(el("div", {}, el("dt", { text: "Before" }), el("dd", { html: md(c.before) })));
  if (c.after) morph.append(el("div", { class: "after" }, el("dt", { text: "After" }), el("dd", { html: md(c.after) })));
  const right = el("div", { class: "here" }, el("span", { class: "label", text: "How the system changes" }), morph);
  if (c.why) right.append(el("div", { class: "why" }, el("span", { class: "label", text: "Why it matters" }), el("p", { html: md(c.why) })));
  if (!c.before && !c.after && !c.why) right.append(el("p", { class: "note", text: "No story for this chapter: the graph facts below are all flowmap knows. Add it to the story file to say what changes and why." }));
  card.append(el("div", { class: "where" }, here, right));

  // evidence from the graph
  const ev = el("div", { class: "evidence" });
  const graphQs = [];
  const witnesses = new Map();
  c.syms.forEach(s => Object.entries(s.witness).forEach(([k, p]) => { if (!witnesses.has(k) || witnesses.get(k).length > p.length) witnesses.set(k, p); }));
  if (witnesses.size) {
    const ul = el("ul", { class: "paths" });
    for (const [k, p] of witnesses) ul.append(el("li", {}, el("div", { class: "note", text: steps.get(k).endpoints.join(", ") }), pathEl(p)));
    const unproved = keys.filter(k => !witnesses.has(k));
    ev.append(el("div", {}, el("span", { class: "label", text: "Runs under (call path as proof)" }), ul,
      unproved.length ? el("p", { class: "note", text: `Also on the map's own anchors for: ${unproved.map(k => steps.get(k).name).join("; ")} (no call path found).` }) : null));
  }
  if (c.callers.size) {
    const ul = el("ul", { class: "callers" });
    [...c.callers].sort((a, b) => a[1] - b[1]).forEach(([id, edited]) =>
      ul.append(el("li", {}, el("span", { class: "mark " + (edited ? "yes" : "no"), text: edited ? "edited" : "not edited" }), el("span", { title: id, text: `${file(id)} · ${sym(id)}` }))));
    ev.append(el("div", {}, el("span", { class: "label", text: "Callers of what changed" }), ul));
  }
  if (c.added.length || c.removed.length) {
    const ul = el("ul", { class: "edges" });
    c.added.slice(0, 8).forEach(([a, b]) => ul.append(el("li", {}, el("span", { class: "mark add", text: "+ call" }), el("span", { text: `${sym(a)} → ${sym(b)}` }))));
    c.removed.slice(0, 8).forEach(([a, b]) => ul.append(el("li", {}, el("span", { class: "mark rem", text: "− call" }), el("span", { text: `${sym(a)} → ${sym(b)}` }))));
    ev.append(el("div", {}, el("span", { class: "label", text: "Calls added and removed" }), ul));
  }
  // reach that moved under this chapter's steps, though the code reached may be untouched
  const myEps = new Set(keys.flatMap(k => steps.get(k).endpoints));
  const moved = (table) => Object.entries(table).map(([s, eps]) => [s, eps.filter(e => myEps.has(e))]).filter(([, eps]) => eps.length);
  const gainedHere = moved(F.reach.gained), lostHere = moved(F.reach.lost);
  if (gainedHere.length || lostHere.length) {
    const ul = el("ul", { class: "edges" });
    lostHere.forEach(([s, eps]) => ul.append(el("li", {}, el("span", { class: "mark rem", text: "no longer" }), el("span", { title: s, text: `${file(s)} · ${sym(s)} from ${eps.join(", ")}` }))));
    gainedHere.forEach(([s, eps]) => ul.append(el("li", {}, el("span", { class: "mark add", text: "now reaches" }), el("span", { title: s, text: `${file(s)} · ${sym(s)} from ${eps.join(", ")}` }))));
    ev.prepend(el("div", {}, el("span", { class: "label", text: "Reach that moved (unedited code)" }), ul));
    lostHere.forEach(([s, eps], i) => graphQs.push({ id: `${c.id}l${i}`, kind: "graph", q: `${eps.join(", ")} no longer reaches ${sym(s)} (${file(s)}). Was dropping it intended?`, why: "Lost reach to existing code is how a removed check looks." }));
    gainedHere.forEach(([s, eps], i) => graphQs.push({ id: `${c.id}w${i}`, kind: "graph", q: `${eps.join(", ")} now reaches existing ${sym(s)} (${file(s)}). Is it safe to run there?`, why: "Existing code running under a new entry point." }));
  }
  if (ev.children.length) card.append(ev);

  // questions: the story's, then what the graph raises on its own
  const qs = [...graphQs, ...(c.questions || []).map((q, i) => ({ ...q, id: `${c.id}q${i}` }))];
  c.syms.filter(s => s.contract).forEach((s, i) => {
    const still = s.callers.filter(x => !x.edited).map(x => sym(x.id));
    if (still.length) qs.push({ id: `${c.id}g${i}`, kind: "graph", q: `${sym(s.id)} changed its arguments (${s.signature[0]} → ${s.signature[1]}) but ${still.length} caller(s) were not edited: ${still.join(", ")}. Are they still correct?`, why: "Signature changed, callers did not." });
  });
  c.syms.filter(s => s.status === "new" && !s.steps.length).forEach((s, i) =>
    qs.push({ id: `${c.id}o${i}`, kind: "graph", q: `New ${sym(s.id)} is not run by any flow on the map. Which step is it for?`, why: "New code no flow reaches is either a map gap or dead." }));
  c._qs = qs;
  if (qs.length) {
    const ol = el("ol", { class: "qs" });
    for (const q of qs) {
      const box = el("input", { type: "checkbox", id: q.id });
      if (q.kind === "ask" || q.kind === "graph") { box.checked = true; picked.add(q.id); }
      box.addEventListener("change", () => { box.checked ? picked.add(q.id) : picked.delete(q.id); renderNote(); });
      const kind = { ask: "Ask the author", check: "Check yourself", graph: "From the graph" }[q.kind] || q.kind;
      ol.append(el("li", { class: "q" }, box, el("label", { for: q.id },
        el("span", { class: "qtext", html: `<span class="qkind ${esc(q.kind)}">${esc(kind)}</span>` + md(q.q) }),
        q.why ? el("span", { class: "qwhy", html: md(q.why) }) : null)));
    }
    card.append(el("div", { class: "here" }, el("span", { class: "label", text: "Questions, most decisive first" }), ol));
  }

  // code last
  if (c.hunks.length) {
    const d = el("details", { class: "code" }, el("summary", { text: `Code: ${c.hunks.length} hunk${c.hunks.length === 1 ? "" : "s"} in ${[...new Set(c.hunks.map(h => h.file))].join(", ")}` }));
    for (const h of c.hunks) {
      const pre = el("pre");
      h.lines.forEach(l => pre.append(el("span", { class: l[0] === "+" ? "a" : l[0] === "-" ? "r" : "", text: l })));
      d.append(el("div", { class: "hunk" }, el("div", { class: "hh", text: `${h.file} @ ${h.new}${h.ctx ? " · " + h.ctx : ""}` }), pre));
    }
    card.append(d);
  }
  $("#chapters").append(card);
}
renderNote();
if (DATA.folded.length) $("#folded").textContent = "Folded, not shown: " + DATA.folded.join(", ");

$("#copy").addEventListener("click", async () => {
  const t = $("#note");
  try { await navigator.clipboard.writeText(t.value); $("#status").textContent = "Copied"; }
  catch (e) { t.focus(); t.select(); $("#status").textContent = "Selected: press Ctrl+C or Cmd+C to copy"; }
});
</script>
