<style>
/* Layout: overview first, one part at a time, evidence on demand. The left rail is the whole
   change (its parts, then the flows they land on); the pane shows one part: before -> after, why,
   what to ask. Proof, ripple and code stay folded until asked for. */
:root {
  --paper: #eef1f4;
  --surface: #ffffff;
  --ink: #17202b;
  --muted: #5b6676;
  --rule: #cdd4dc;
  --line: #9aa6b4;
  --accent: #2e5bff;
  --accent-soft: rgba(46, 91, 255, .12);
  --core: #2e5bff;
  --support: #0f7c86;
  --refactor: #6b7686;
  --outside: #b7791f;
  --gain: #1e8a4c;
  --loss: #c8423b;
  --code-bg: #f6f8fa;
  --display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f141a; --surface: #161d26; --ink: #e6ebf1; --muted: #93a0b0; --rule: #2a3441;
    --line: #4a5666; --accent: #7c9cff; --accent-soft: rgba(124, 156, 255, .16);
    --core: #7c9cff; --support: #3cc0cb; --refactor: #93a0b0; --outside: #f0b429;
    --gain: #3fbf78; --loss: #ef6b63; --code-bg: #10161d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f141a; --surface: #161d26; --ink: #e6ebf1; --muted: #93a0b0; --rule: #2a3441;
  --line: #4a5666; --accent: #7c9cff; --accent-soft: rgba(124, 156, 255, .16);
  --core: #7c9cff; --support: #3cc0cb; --refactor: #93a0b0; --outside: #f0b429;
  --gain: #3fbf78; --loss: #ef6b63; --code-bg: #10161d; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 15px/1.55 var(--body); }
.wrap { padding: 24px 16px 96px; max-width: 1240px; margin: 0 auto; display: grid; gap: 22px; }
code, .mono { font-family: var(--mono); font-size: .86em; }
p code, li code, dd code, h2 code { background: var(--accent-soft); padding: 0 .3em; border-radius: 4px; overflow-wrap: anywhere; }
h1, h2, h3 { text-wrap: balance; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.label { font: 600 11px var(--body); text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin: 0; }
.core { --role: var(--core); } .supporting { --role: var(--support); } .refactor { --role: var(--refactor); }
.outside, .unassigned, .off-map { --role: var(--outside); }

/* header: which change; the overview pane says what it does */
header { display: grid; gap: 6px; max-width: 80ch; }
header h1 { font: 800 clamp(24px, 3.4vw, 34px)/1.08 var(--display); font-stretch: 74%; margin: 0; }
.range { color: var(--muted); font-size: 13px; }
.range a { color: inherit; }
.delta { font-size: 18px; line-height: 1.55; margin: 0; max-width: 68ch; }
/* the lens verdict: the first thing to know, its reasons one click away */
.verdict { justify-self: start; max-width: 80ch; font-size: 14px; }
.verdict summary { cursor: pointer; display: inline-flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
.verdict b { font: 700 11px var(--body); text-transform: uppercase; letter-spacing: .08em; border-radius: 4px; padding: 2px 7px; color: var(--surface); }
.verdict.contained b { background: var(--gain); } .verdict.spreads b { background: var(--outside); } .verdict.blind b { background: var(--loss); }
.verdict ul { margin: 8px 0 0; padding-left: 20px; display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.shape { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; font-size: 12.5px; }
.shape li { background: var(--surface); border: 1px solid var(--rule); border-radius: 999px; padding: 2px 10px; }
.shape b { font-variant-numeric: tabular-nums; }

/* rail + pane */
.body { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 22px; align-items: start; }
@media (max-width: 900px) { .body { grid-template-columns: minmax(0, 1fr); } }
.rail { display: grid; gap: 18px; position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow-y: auto; padding-bottom: 8px; }
@media (max-width: 900px) { .rail { position: static; max-height: none; } }
.rail section { display: grid; gap: 8px; }

/* the parts, as a table of contents */
.toc { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.toc button { width: 100%; text-align: left; background: none; border: 1px solid transparent; border-radius: 8px; padding: 8px 10px;
  display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 2px 10px; cursor: pointer; }
.toc button:hover { background: var(--surface); }
.toc button[aria-current="true"] { background: var(--surface); border-color: var(--rule); box-shadow: inset 3px 0 0 var(--role); }
.toc .n { grid-row: span 2; font: 700 12px/20px var(--mono); text-align: center; border-radius: 6px; height: 20px; color: var(--surface); background: var(--role); }
.toc .t { font-weight: 500; font-size: 13.5px; line-height: 1.35; }
.toc .w { font-size: 12px; color: var(--muted); line-height: 1.3; }
.toc .ov .n { background: var(--ink); }
.toc .minor .t { font-weight: 400; color: var(--muted); }

/* the map: flows as lines, the selected part's stops lit, the others faint */
.flow { display: grid; gap: 2px; }
.flow h3 { font: 700 12.5px/1.2 var(--display); font-stretch: 80%; margin: 6px 0 2px; letter-spacing: .02em; }
.stops { list-style: none; margin: 0; padding: 0; position: relative; display: grid; }
.stops::before { content: ""; position: absolute; left: 7px; top: 10px; bottom: 10px; width: 2px; background: var(--line); }
.stop { position: relative; display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 8px; align-items: start; width: 100%;
  text-align: left; background: none; border: 0; border-radius: 6px; padding: 3px 4px 3px 0; font-size: 12.5px; line-height: 1.3; color: var(--muted); }
button.stop { cursor: pointer; }
button.stop:hover { background: var(--surface); }
.stop .dot { width: 12px; height: 12px; margin: 1px 2px; border-radius: 50%; background: var(--paper); border: 2px solid var(--line); position: relative; z-index: 1; }
.stop.touched { color: var(--ink); }
.stop.touched .dot { border-color: var(--role); }
.stop.lit { font-weight: 600; }
.stop.lit .dot { background: var(--sel, var(--role)); border-color: var(--sel, var(--role)); box-shadow: 0 0 0 3px var(--paper), 0 0 0 5px var(--sel, var(--role)); }
.stop .nm { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.stop.lit .nm { -webkit-line-clamp: unset; }
/* the overview's map: each touched flow as a line of stops, the parts that run each stop under it */
.lanes { display: grid; gap: 14px; }
.lane { display: grid; gap: 6px; }
.lane h3 { font: 700 13px/1.2 var(--display); font-stretch: 80%; margin: 0; letter-spacing: .02em; }
.lane ol { list-style: none; margin: 0; padding: 0; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(120px, 1fr); overflow-x: auto; }
.lane li { position: relative; display: grid; gap: 6px; align-content: start; padding: 0 8px 4px 0; font-size: 12px; line-height: 1.3; color: var(--muted); }
.lane li::before { content: ""; position: absolute; top: 6px; left: 0; right: 0; height: 2px; background: var(--line); }
.lane li:first-child::before { left: 6px; } .lane li:last-child::before { right: calc(100% - 8px); }
.lane .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--surface); border: 2px solid var(--line); position: relative; }
.lane li.touched { color: var(--ink); }
.lane li.touched .dot { background: var(--role); border-color: var(--role); }
.lane .refs { display: flex; flex-wrap: wrap; gap: 4px; }
.ref { font: 600 11px/1 var(--mono); border-radius: 999px; padding: 3px 7px; border: 1px solid var(--role); color: var(--role); background: var(--surface); cursor: pointer; }
.ref:hover { background: var(--accent-soft); }
.quiet-flows { font-size: 12px; color: var(--muted); margin: 4px 0 0; }
.folded { font-size: 12px; color: var(--muted); margin: 0; overflow-wrap: anywhere; }

/* the pane: one part */
.pane { background: var(--surface); border: 1px solid var(--rule); border-top: 4px solid var(--role); border-radius: 12px;
  padding: 22px 24px; display: grid; gap: 18px; min-width: 0; }
.ch-tags { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.num { font: 700 12px var(--mono); color: var(--surface); background: var(--role); border-radius: 6px; padding: 2px 8px; }
.tag { font: 600 11px var(--body); text-transform: uppercase; letter-spacing: .08em; color: var(--role); }
.kind { font-size: 12px; color: var(--muted); }
.pane h2 { font: 750 clamp(21px, 2.6vw, 28px)/1.15 var(--display); font-stretch: 80%; margin: 4px 0 0; }
.claim { margin: 0; font-size: 16px; color: var(--muted); max-width: 70ch; }
.pane:focus { outline: none; }
.runs { margin: 0; font-size: 13px; color: var(--muted); }
.runs b { color: var(--ink); font-weight: 500; }

.ba { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
@media (max-width: 720px) { .ba { grid-template-columns: minmax(0, 1fr); } }
.ba > div { background: var(--surface); padding: 12px 14px; display: grid; gap: 4px; align-content: start; }
.ba .after { background: var(--paper); }
.ba p { margin: 0; font-size: 14px; }
.why { margin: 0; max-width: 72ch; padding-left: 12px; border-left: 3px solid var(--role); }
.note { font-size: 13px; color: var(--muted); margin: 0; }

.qs { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.q { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; align-items: start; }
.q input { margin-top: 4px; width: 16px; height: 16px; accent-color: var(--accent); }
.q label { display: grid; gap: 3px; cursor: pointer; }
.q .qtext { font-weight: 500; }
.q .qwhy { color: var(--muted); font-size: 13px; }
.qkind { font: 600 10.5px var(--body); text-transform: uppercase; letter-spacing: .08em; border-radius: 4px; padding: 1px 6px; margin-right: 6px; white-space: nowrap; }
.qkind.ask { background: var(--accent-soft); color: var(--accent); }
.qkind.check, .qkind.graph { background: var(--paper); color: var(--muted); border: 1px solid var(--rule); }
.qkind.graph { color: var(--support); }

/* evidence, folded */
.more { display: grid; gap: 0; border-top: 1px solid var(--rule); }
.more details { border-bottom: 1px solid var(--rule); }
.more summary { cursor: pointer; padding: 10px 2px; font-size: 14px; font-weight: 500; display: flex; gap: 10px; align-items: baseline; }
.more summary small { color: var(--muted); font-weight: 400; font-size: 12.5px; }
.more details > div { padding: 2px 2px 14px; display: grid; gap: 10px; }
.paths, .rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 12.5px; }
.path { display: flex; flex-wrap: wrap; align-items: center; gap: 3px; font-family: var(--mono); font-size: 11.5px; }
.path span { background: var(--paper); border: 1px solid var(--rule); border-radius: 4px; padding: 1px 5px; }
.path span.end { border-color: var(--role); color: var(--role); }
.path i { color: var(--muted); font-style: normal; }
.rows li { display: flex; gap: 8px; align-items: baseline; font-family: var(--mono); font-size: 11.5px; overflow-wrap: anywhere; }
.mark { font-family: var(--body); font-size: 11px; font-weight: 600; flex: none; width: 80px; }
.mark.add { color: var(--gain); } .mark.rem { color: var(--loss); } .mark.no { color: var(--outside); } .mark.yes { color: var(--gain); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 11.5px/1 var(--mono); border: 1px solid var(--rule); background: var(--paper); border-radius: 999px; padding: 4px 9px; cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--role); color: var(--role); background: var(--surface); }
.chip i { font-style: normal; color: var(--muted); margin-left: 4px; }
.hunk { border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
[hidden] { display: none !important; }
.hunk .hh { font: 11.5px var(--mono); color: var(--muted); padding: 6px 10px; background: var(--paper); border-bottom: 1px solid var(--rule); overflow-wrap: anywhere; }
.hunk pre { margin: 0; overflow-x: auto; background: var(--code-bg); font: 12px/1.5 var(--mono); padding: 6px 0; }
.hunk pre span { display: block; padding: 0 10px; white-space: pre; min-width: max-content; }
.hunk .a { background: rgba(30, 138, 76, .13); } .hunk .r { background: rgba(200, 66, 59, .13); }

.step-nav { display: flex; justify-content: space-between; gap: 12px; }
.step-nav button { background: none; border: 1px solid var(--rule); border-radius: 8px; padding: 8px 12px; cursor: pointer; text-align: left;
  display: grid; gap: 1px; max-width: 48%; font-size: 13px; }
.step-nav button:hover { border-color: var(--accent); }
.step-nav button[data-dir="1"] { text-align: right; margin-left: auto; }
.step-nav small { color: var(--muted); font-size: 11.5px; }
.keys { font-size: 12px; color: var(--muted); margin: 0; }
kbd { font: 11px var(--mono); border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--surface); }

/* the review tray: ticked questions, ready to paste */
.tray { position: fixed; inset: auto 0 0 0; background: var(--surface); border-top: 1px solid var(--rule); box-shadow: 0 -6px 18px rgba(0,0,0,.06); z-index: 5; }
.tray-in { max-width: 1240px; margin: 0 auto; padding: 10px 16px; display: grid; gap: 10px; }
.tray .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.tray .count { font-weight: 600; }
.tray textarea { width: 100%; min-height: 140px; font: 13px/1.5 var(--mono); color: var(--ink); background: var(--paper);
  border: 1px solid var(--rule); border-radius: 8px; padding: 10px; resize: vertical; }
button.primary { font: 600 14px var(--body); background: var(--accent); color: var(--surface); border: 0; border-radius: 8px; padding: 7px 14px; cursor: pointer; }
button.ghost { background: none; border: 1px solid var(--rule); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
.status { font-size: 13px; color: var(--muted); }

/* viewer mode: no data in the page or the link, so ask for a file */
.drop { background: var(--surface); border: 2px dashed var(--rule); border-radius: 12px; padding: 32px 20px; display: grid; gap: 10px; justify-items: start; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop h1 { font: 800 28px/1.1 var(--display); font-stretch: 74%; margin: 0; }
.drop p { margin: 0; max-width: 68ch; color: var(--muted); }
.drop .err { color: var(--loss); }
</style>

<div class="wrap">
  <header id="top"></header>
  <div class="body">
    <nav class="rail" aria-label="The change">
      <section><h2 class="label" id="toc-h"></h2><p class="folded">Core first, then what it needs; refactors and files off the map last.</p><ol class="toc" id="toc"></ol></section>
      <section id="rail-map"><h2 class="label">Where it lands</h2><div id="map"></div></section>
      <p class="folded" id="folded"></p>
    </nav>
    <main class="pane" id="pane" tabindex="-1"></main>
  </div>
</div>
<aside class="tray" aria-label="Review note">
  <div class="tray-in">
    <div class="row">
      <span><span class="count" id="count"></span> <span class="status">ticked for the author</span></span>
      <button class="ghost" id="peek" type="button" aria-expanded="false" aria-controls="note">Show</button>
      <button class="primary" id="copy" type="button">Copy questions</button>
      <span class="status" id="status" aria-live="polite"></span>
    </div>
    <textarea id="note" aria-label="Review note" readonly hidden></textarea>
  </div>
</aside>

l as source; Pages serves it.","+#   change pages (any branch): https://<owner>.github.io/<repo>/changes/<name>.html","+#   atlas (default branch):    https://<owner>.github.io/<repo>/atlas.html","+# One-time setup: Settings -> Pages -> Deploy from a branch -> gh-pages / (root).","+name: flowmap pages","+","+on:","+  push:","+    paths: [\"docs/flowmap/**\", \".github/workflows/flowmap-pages.yml\"]","+  workflow_dispatch:","+","+permissions:","+  contents: write","+","+concurrency:","+  group: flowmap-pages","+  cancel-in-progress: false","+","+jobs:","+  publish:","+    runs-on: ubuntu-latest","+    steps:","+      - uses: actions/checkout@v4","+        with:","+          path: src","+","+      - name: Check out gh-pages (or start it)","+        run: |","+          if git ls-remote --exit-code --heads \"https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}\" gh-pages >/dev/null; then","+            git clone --depth 1 --branch gh-pages \"https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}\" site","+          else","+            git init -b gh-pages site","+            git -C site remote add origin \"https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}\"","+            touch site/.nojekyll","+          fi","+","+      - name: Copy pages","+        run: |","+          OUT=src/docs/flowmap","+          mkdir -p site/changes","+          cp \"$OUT\"/changes/*.html site/changes/ 2>/dev/null || true","+          if [ \"${{ github.ref_name }}\" = \"${{ github.event.repository.default_branch }}\" ] && [ -f \"$OUT/atlas.html\" ]; then","+            cp \"$OUT/atlas.html\" site/atlas.html","+          fi","+          {","+            echo '<!doctype html><meta charset=\"utf-8\"><title>flowmap pages<\/title><ul>'","+            [ -f site/atlas.html ] && echo '<li><a href=\"atlas.html\">atlas<\/a><\/li>'","+            for f in site/changes/*.html; do [ -e \"$f\" ] && n=$(basename \"$f\") && echo \"<li><a href=\\\"changes/$n\\\">${n%.html}<\/a><\/li>\"; done","+            echo '<\/ul>'","+          } > site/index.html","+","+      - name: Push","+        working-directory: site","+        run: |","+          git config user.name \"github-actions[bot]\"","+          git config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"","+          git add -A","+          git diff --cached --quiet && exit 0","+          git commit -m \"flowmap pages from ${{ github.ref_name }}@${GITHUB_SHA::7}\"","+          git push origin gh-pages"],"symbols":[]},{"file":"CLAUDE.md","old":0,"new":1,"ctx":"","lines":["+# flowmap","+","+Every PR carries its flowmap, before it is opened:","+","+- Commit `docs/flowmap/changes/pr-<n>.story.json` and the page `flowmap change <base> <head> --name pr-<n>`","+  renders from it (`docs/flowmap/changes/pr-<n>.html`). Follow \"The change page\" in `skills/pr-lens/SKILL.md`.","+- Write the PR body in the pr-lens output format, and link the rendered change page:","+  `https://nelisverhoef.github.io/Flowmap/changes/pr-<n>.html` (published by","+  `.github/workflows/flowmap-pages.yml`; GitHub itself shows committed HTML as source)."],"symbols":[]},{"file":"README.md","old":49,"new":49,"ctx":"flowmap change <base> <head> --name pr-123      # the change as chapters on the","lines":[" ```"," ","+GitHub shows committed HTML as source, not as a page. `.github/workflows/flowmap-pages.yml`","+publishes `docs/flowmap/changes/*.html` (from any branch) and `atlas.html` (from the default","+branch) to a `gh-pages` branch. Turn on Settings \u2192 Pages \u2192 Deploy from a branch \u2192 `gh-pages`","+once, then link `https://<owner>.github.io/<repo>/changes/pr-123.html` from the PR. Copy the","+workflow into other repos as is.","+"," ## With Claude Code"," "],"symbols":[]},{"file":"README.md","old":58,"new":64,"ctx":"This repo is also a Claude Code plugin with two skills:","lines":["   ask the author, without you reading the diff first."," ","-Install the plugin from this repo, or copy `skills/*` into `.claude/skills/`.","+### Install","+","+```","+/plugin marketplace add NelisVerhoef/flowmap","+/plugin install flowmap@flowmap","+```","+","+While the plugin is enabled, `bin/flowmap` is on the Bash tool's PATH, so the skills (and you,","+inside Claude Code) just run `flowmap ...`. The skills show up as `/flowmap:flowmap-build` and","+`/flowmap:pr-lens`.","+","+To have teammates prompted to install it when they open your repo, commit this to the repo's","+`.claude/settings.json`:","+","+```json","+{","+  \"extraKnownMarketplaces\": {","+    \"flowmap\": { \"source\": { \"source\": \"github\", \"repo\": \"NelisVerhoef/flowmap\" } }","+  },","+  \"enabledPlugins\": { \"flowmap@flowmap\": true }","+}","+```","+","+Without the plugin system: clone this repo, put its `bin/` on PATH, and copy `skills/*` into","+the target repo's `.claude/skills/`."," "," ## flowmap.toml"],"symbols":[]},{"file":"docs/flowmap/changes/pr-3.html","old":0,"new":1,"ctx":"","lines":["+<!doctype html>","+<meta charset=\"utf-8\">","+<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">","+<title>flowmap installs into any repo as a Claude Code plugin<\/title>","+<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">","+<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>","+<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..100,500..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap\">","+<style>","+/* Layout: a change told as chapters on a fixed system map. The map keeps the atlas's positions","+   so the same place always looks the same; each chapter says where, before -> after, why, and","+   what to ask. Code is folded at the end of each chapter. */","+:root {","+  --paper: #eef1f4;","+  --surface: #ffffff;","+  --ink: #17202b;","+  --muted: #5b6676;","+  --rule: #cdd4dc;","+  --line: #9aa6b4;","+  --accent: #2e5bff;","+  --accent-soft: rgba(46, 91, 255, .12);","+  --core: #2e5bff;","+  --support: #0f7c86;","+  --refactor: #6b7686;","+  --outside: #b7791f;","+  --gain: #1e8a4c;","+  --loss: #c8423b;","+  --code-bg: #f6f8fa;","+  --display: \"Archivo\", \"Arial Narrow\", system-ui, sans-serif;","+  --body: \"IBM Plex Sans\", system-ui, -apple-system, \"Segoe UI\", sans-serif;","+  --mono: \"IBM Plex Mono\", ui-monospace, \"SFMono-Regular\", Menlo, monospace;","+}","+@media (prefers-color-scheme: dark) {","+  :root:not([data-theme=\"light\"]) {","+    --paper: #0f141a; --surface: #161d26; --ink: #e6ebf1; --muted: #93a0b0; --rule: #2a3441;","+    --line: #4a5666; --accent: #7c9cff; --accent-soft: rgba(124, 156, 255, .16);","+    --core: #7c9cff; --support: #3cc0cb; --refactor: #93a0b0; --outside: #f0b429;","+    --gain: #3fbf78; --loss: #ef6b63; --code-bg: #10161d; color-scheme: dark;","+  }","+}","+:root[data-theme=\"dark\"] {","+  --paper: #0f141a; --surface: #161d26; --ink: #e6ebf1; --muted: #93a0b0; --rule: #2a3441;","+  --line: #4a5666; --accent: #7c9cff; --accent-soft: rgba(124, 156, 255, .16);","+  --core: #7c9cff; --support: #3cc0cb; --refactor: #93a0b0; --outside: #f0b429;","+  --gain: #3fbf78; --loss: #ef6b63; --code-bg: #10161d; color-scheme: dark;","+}","+* { box-sizing: border-box; }","+html, body { margin: 0; }","+body { background: var(--paper); color: var(--ink); font: 15px/1.55 var(--body); }","+.wrap { padding-inline: 16px; padding-block: 28px 64px; max-width: 1180px; margin: 0 auto; display: grid; gap: 28px; }","+code, .mono { font-family: var(--mono); font-size: .86em; }","+p code, li code, dd code { background: var(--accent-soft); padding: 0 .3em; border-radius: 4px; overflow-wrap: anywhere; }","+h1, h2, h3 { text-wrap: balance; }","+:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }","+.label { font: 600 11px var(--body); text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }","+","+/* header */","+header { display: grid; gap: 12px; }","+header h1 { font: 800 clamp(28px, 4.4vw, 44px)/1.02 var(--display); font-stretch: 74%; margin: 0; max-width: 24ch; }","+.range { color: var(--muted); font-size: 13px; }","+.range a { color: inherit; }","+.delta { font-size: 18px; line-height: 1.5; max-width: 68ch; margin: 0; }","+.intent { color: var(--muted); max-width: 68ch; margin: 0; font-size: 14px; }","+","+/* system numbers: each with what drives it */","+.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1px; background: var(--rule);","+  border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }","+.tile { background: var(--surface); padding: 12px 14px; display: grid; gap: 2px; align-content: start; min-width: 0; }","+.tile b { font: 700 22px/1.1 var(--display); font-stretch: 80%; font-variant-numeric: tabular-nums; }","+.tile small { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }","+.tile.zero b { color: var(--muted); }","+","+/* the map */","+.map { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 16px; display: grid; gap: 10px; }","+.map-head { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; justify-content: space-between; }","+.map-head h2 { font: 700 15px var(--display); font-stretch: 80%; margin: 0; letter-spacing: .02em; }","+.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }","+.legend span { display: inline-flex; align-items: center; gap: 6px; }","+.lines { overflow-x: auto; }","+.lines-inner { display: grid; grid-template-columns: repeat(var(--flows, 3), minmax(190px, 1fr)); gap: 14px; }","+.flow h3 { font: 700 13px/1.2 var(--display); font-stretch: 78%; margin: 0 0 8px; padding-left: 4px; letter-spacing: .02em; }","+.flow.quiet h3 { color: var(--muted); }","+.stations { list-style: none; margin: 0; padding: 0; position: relative; display: grid; gap: 2px; }","+.stations::before { content: \"\"; position: absolute; left: 11px; top: 12px; bottom: 12px; width: 3px; background: var(--line); border-radius: 2px; }","+.st { position: relative; display: grid; grid-template-columns: 25px minmax(0, 1fr); gap: 6px; align-items: start;","+  padding: 5px 6px 5px 0; border-radius: 6px; font-size: 12.5px; line-height: 1.3; }","+.st .pin { width: 13px; height: 13px; border-radius: 50%; background: var(--surface); border: 3px solid var(--line);","+  justify-self: center; margin-top: 2px; position: relative; z-index: 1; }","+.st.hit .pin { border-color: var(--accent); background: var(--accent); }","+.st.quiet { color: var(--muted); }","+.st .refs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }","+.ref { font: 600 11px/1 var(--mono); border-radius: 999px; padding: 3px 7px; border: 1px solid currentColor; color: var(--role, var(--accent));","+  background: none; cursor: pointer; text-decoration: none; }","+.ref:hover { background: var(--accent-soft); }","+.offmap { font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }","+","+/* chapters */","+.chapters { display: grid; gap: 22px; counter-reset: ch; }","+.chapter { --role: var(--accent); background: var(--surface); border: 1px solid var(--rule); border-radius: 12px;","+  padding: 20px; display: grid; gap: 16px; scroll-margin-top: 16px; border-top: 4px solid var(--role); }","+.chapter.core { --role: var(--core); } .chapter.supporting { --role: var(--support); }","+.chapter.refactor { --role: var(--refactor); } .chapter.outside, .chapter.unassigned, .chapter.off-map { --role: var(--outside); }","+.chapter:target { box-shadow: 0 0 0 3px var(--accent-soft); }","+.ch-head { display: grid; gap: 6px; }","+.ch-tags { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }","+.num { font: 800 13px var(--mono); color: var(--surface); background: var(--role); border-radius: 6px; padding: 2px 8px; }","+.tag { font: 600 11px var(--body); text-transform: uppercase; letter-spacing: .08em; color: var(--role); }","+.kind { font-size: 12px; color: var(--muted); }","+.chapter h2 { font: 750 clamp(20px, 2.6vw, 26px)/1.15 var(--display); font-stretch: 80%; margin: 0; }","+.claim { margin: 0; color: var(--muted); max-width: 70ch; }","+","+.where { display: grid; grid-template-columns: minmax(0, 260px) minmax(0, 1fr); gap: 18px; align-items: start; }","+@media (max-width: 720px) { .where { grid-template-columns: minmax(0, 1fr); } }","+.here { display: grid; gap: 8px; }","+.minimap { background: var(--paper); border-radius: 8px; padding: 10px; }","+.minimap svg { display: block; width: 100%; height: auto; }","+.minimap .dot { fill: var(--surface); stroke: var(--line); stroke-width: 2; }","+.minimap .dot.on { fill: var(--role); stroke: var(--role); }","+.minimap .rail { stroke: var(--line); stroke-width: 2; }","+.minimap text { fill: var(--muted); font: 9px var(--body); }","+.crumbs { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 13px; }","+.crumbs li { display: grid; gap: 1px; }","+.crumbs .flow-name { color: var(--muted); font-size: 11.5px; }","+","+.morph { display: grid; gap: 10px; margin: 0; }","+.morph > div { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 10px; }","+.morph dt { font: 600 11px var(--body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding-top: 3px; }","+.morph dd { margin: 0; }","+.morph .after dd { font-weight: 500; }","+.why { border-left: 3px solid var(--role); padding: 6px 12px; background: var(--paper); border-radius: 0 8px 8px 0; display: grid; gap: 2px; }","+.why p { margin: 0; max-width: 72ch; }","+","+.evidence { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px 24px; }","+.evidence > div { display: grid; gap: 6px; align-content: start; min-width: 0; }","+.paths, .callers, .edges { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 12.5px; }","+.path { display: flex; flex-wrap: wrap; align-items: center; gap: 3px; font-family: var(--mono); font-size: 11.5px; }","+.path span { background: var(--paper); border: 1px solid var(--rule); border-radius: 4px; padding: 1px 5px; }","+.path span.end { border-color: var(--role); color: var(--role); }","+.path i { color: var(--muted); font-style: normal; }","+.callers li, .edges li { display: flex; gap: 8px; align-items: baseline; font-family: var(--mono); font-size: 11.5px; overflow-wrap: anywhere; }","+.mark { font-family: var(--body); font-size: 11px; font-weight: 600; flex: none; width: 72px; }","+.mark.yes { color: var(--gain); } .mark.no { color: var(--outside); }","+.edges .add { color: var(--gain); } .edges .rem { color: var(--loss); }","+.note { font-size: 12.5px; color: var(--muted); margin: 0; }","+","+.qs { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; counter-reset: q; }","+.q { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; align-items: start; }","+.q input { margin-top: 4px; width: 16px; height: 16px; accent-color: var(--accent); }","+.q label { display: grid; gap: 3px; cursor: pointer; }","+.q .qtext { font-weight: 500; }","+.q .qwhy { color: var(--muted); font-size: 13px; }","+.qkind { font: 600 10.5px var(--body); text-transform: uppercase; letter-spacing: .08em; border-radius: 4px; padding: 1px 6px; margin-right: 6px; }","+.qkind.ask { background: var(--accent-soft); color: var(--accent); }","+.qkind.check { background: var(--paper); color: var(--muted); border: 1px solid var(--rule); }","+.qkind.graph { background: var(--paper); color: var(--support); border: 1px solid var(--rule); }","+","+details.code { border-top: 1px dashed var(--rule); padding-top: 10px; }","+details.code summary { cursor: pointer; font-size: 13px; color: var(--muted); }","+.hunk { margin-top: 10px; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }","+.hunk .hh { font: 11.5px var(--mono); color: var(--muted); padding: 6px 10px; background: var(--paper); border-bottom: 1px solid var(--rule); overflow-wrap: anywhere; }","+.hunk pre { margin: 0; overflow-x: auto; background: var(--code-bg); font: 12px/1.5 var(--mono); padding: 6px 0; }","+.hunk pre span { display: block; padding: 0 10px; white-space: pre; min-width: max-content; }","+.hunk .a { background: rgba(30, 138, 76, .13); } .hunk .r { background: rgba(200, 66, 59, .13); }","+","+/* the review note */","+.ask-box { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 20px; display: grid; gap: 12px; }","+.ask-box h2 { font: 750 22px var(--display); font-stretch: 80%; margin: 0; }","+.ask-box textarea { width: 100%; min-height: 160px; font: 13px/1.5 var(--mono); color: var(--ink); background: var(--paper);","+  border: 1px solid var(--rule); border-radius: 8px; padding: 10px; resize: vertical; }","+.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }","+button.primary { font: 600 14px var(--body); background: var(--accent); color: var(--surface); border: 0; border-radius: 8px; padding: 8px 14px; cursor: pointer; }","+.status { font-size: 13px; color: var(--muted); }","+.folded { font-size: 13px; color: var(--muted); }","+@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }","+html { scroll-behavior: smooth; }","+<\/style>","+","+<div class=\"wrap\">","+  <header id=\"top\"><\/header>","+  <section class=\"tiles\" id=\"tiles\" aria-label=\"How the system moved\"><\/section>","+  <section class=\"map\" aria-label=\"System map\">","+    <div class=\"map-head\">","+      <h2>Where this lands on the system<\/h2>","+      <div class=\"legend\"><span><i class=\"ref\" style=\"cursor:default\">1<\/i> chapter that runs here<\/span><span>grey: untouched<\/span><\/div>","+    <\/div>","+    <div class=\"lines\"><div class=\"lines-inner\" id=\"lines\"><\/div><\/div>","+    <div class=\"offmap\" id=\"offmap\" hidden><\/div>","+  <\/section>","+  <section class=\"ch rite-pass-brief\",\"name\":\"Maintainer writes one brief per independent pass (run id + bottom-up/top-down method)\",\"endpoints\":[\"CLI flowmap brief\"],\"evidence\":\"agreed\"},{\"key\":\"new:run-mapping-passes/reconcile-runs\",\"name\":\"Maintainer votes the passes into one map with evidence levels and a list of open questions\",\"endpoints\":[\"CLI flowmap reconcile\"],\"evidence\":\"agreed\"},{\"key\":\"new:run-mapping-passes/verify-pass-citations\",\"name\":\"Maintainer checks each pass's anchors exist and every entry point is placed\",\"endpoints\":[\"CLI flowmap verify\"],\"evidence\":\"agreed\"}]}],\"files\":[{\"path\":\".claude-plugin/marketplace.json\",\"kind\":\"outside\",\"added\":14,\"removed\":0},{\"path\":\".claude-plugin/plugin.json\",\"kind\":\"outside\",\"added\":4,\"removed\":1},{\"path\":\"README.md\",\"kind\":\"doc\",\"added\":25,\"removed\":1},{\"path\":\"skills/flowmap-build/SKILL.md\",\"kind\":\"doc\",\"added\":2,\"removed\":1},{\"path\":\"skills/pr-lens/SKILL.md\",\"kind\":\"doc\",\"added\":3,\"removed\":3}],\"symbols\":[],\"endpoints\":{\"added\":[],\"removed\":[]},\"reach\":{\"gained\":{},\"lost\":{}},\"edges\":{\"added\":[],\"removed\":[]},\"modules\":{\"added\":[],\"removed\":[]},\"flow_share\":{},\"flow_entropy\":0.0,\"tests\":{\"configured\":false,\"changed\":[]},\"hunks\":[{\"file\":\".claude-plugin/marketplace.json\",\"old\":0,\"new\":1,\"ctx\":\"\",\"lines\":[\"+{\",\"+  \\\"name\\\": \\\"flowmap\\\",\",\"+  \\\"description\\\": \\\"flowmap: map a codebase as user flows and review PRs on that map.\\\",\",\"+  \\\"owner\\\": {\",\"+    \\\"name\\\": \\\"Nelis Verhoef\\\"\",\"+  },\",\"+  \\\"plugins\\\": [\",\"+    {\",\"+      \\\"name\\\": \\\"flowmap\\\",\",\"+      \\\"source\\\": \\\"./\\\",\",\"+      \\\"description\\\": \\\"Map a codebase as user flows -> steps -> code, and review PRs by where they land on that map.\\\"\",\"+    }\",\"+  ]\",\"+}\"],\"symbols\":[]},{\"file\":\".claude-plugin/plugin.json\",\"old\":2,\"new\":2,\"ctx\":\"\",\"lines\":[\"   \\\"name\\\": \\\"flowmap\\\",\",\"   \\\"version\\\": \\\"0.1.0\\\",\",\"-  \\\"description\\\": \\\"Map a codebase as user flows -> steps -> code by agreement between independent passes, and review PRs by where they land on that map.\\\"\",\"+  \\\"description\\\": \\\"Map a codebase as user flows -> steps -> code by agreement between independent passes, and review PRs by where they land on that map.\\\",\",\"+  \\\"author\\\": {\",\"+    \\\"name\\\": \\\"Nelis Verhoef\\\"\",\"+  }\",\" }\"],\"symbols\":[]},{\"file\":\"README.md\",\"old\":58,\"new\":58,\"ctx\":\"This repo is also a Claude Code plugin with two skills:\",\"lines\":[\"   ask the author, without you reading the diff first.\",\" \",\"-Install the plugin from this repo, or copy `skills/*` into `.claude/skills/`.\",\"+### Install\",\"+\",\"+```\",\"+/plugin marketplace add NelisVerhoef/flowmap\",\"+/plugin install flowmap@flowmap\",\"+```\",\"+\",\"+While the plugin is enabled, `bin/flowmap` is on the Bash tool's PATH, so the skills (and you,\",\"+inside Claude Code) just run `flowmap ...`. The skills show up as `/flowmap:flowmap-build` and\",\"+`/flowmap:pr-lens`.\",\"+\",\"+To have teammates prompted to install it when they open your repo, commit this to the repo's\",\"+`.claude/settings.json`:\",\"+\",\"+```json\",\"+{\",\"+  \\\"extraKnownMarketplaces\\\": {\",\"+    \\\"flowmap\\\": { \\\"source\\\": { \\\"source\\\": \\\"github\\\", \\\"repo\\\": \\\"NelisVerhoef/flowmap\\\" } }\",\"+  },\",\"+  \\\"enabledPlugins\\\": { \\\"flowmap@flowmap\\\": true }\",\"+}\",\"+```\",\"+\",\"+Without the plugin system: clone this repo, put its `bin/` on PATH, and copy `skills/*` into\",\"+the target repo's `.claude/skills/`.\",\" \",\" ## flowmap.toml\"],\"symbols\":[]},{\"file\":\"skills/flowmap-build/SKILL.md\",\"old\":9,\"new\":9,\"ctx\":\"The map is built by **agreement between independent passes**, not by any single\",\"lines\":[\" right. Agreement only means something between *different methods*, so never skip the mix.\",\" \",\"-`flowmap` below is `<plugin root>/bin/flowmap` (or `python3 <plugin root>/flowmap/<cmd>.py`).\",\"+`flowmap` is on PATH when this plugin is installed. If the bare command isn't found, use\",\"+`\\\"${CLAUDE_PLUGIN_ROOT}/bin/flowmap\\\"` (or wherever the flowmap repo is checked out).\",\" Run everything from the root of the repo being mapped.\",\" \"],\"symbols\":[]},{\"file\":\"skills/pr-lens/SKILL.md\",\"old\":20,\"new\":20,\"ctx\":\"A PR number, a branch, or a commit range. Resolve to `<base> <head>`:\",\"lines\":[\" ## Steps\",\" \",\"-1. From the repo root, run `python3 <flowmap>/bin/flowmap lens <base> <head>` (the repo you are reviewing must already have a map;\",\"+1. From the repo root (if `flowmap` isn't on PATH, use `\\\"${CLAUDE_PLUGIN_ROOT}/bin/flowmap\\\"`), run `flowmap lens <base> <head>` (the repo you are reviewing must already have a map;\",\"    build one with the flowmap-build skill). This is the ground truth for\",\"    placement \\u2014 do not contradict it; if you think the map is wrong, say so separately.\"],\"symbols\":[]},{\"file\":\"skills/pr-lens/SKILL.md\",\"old\":76,\"new\":76,\"ctx\":\"specific and occasionally wrong over safe and vague.\",\"lines\":[\" Also write the change as a page people can read without the diff:\",\" \",\"-1. `python3 <flowmap>/bin/flowmap change <base> <head> --facts` prints the deterministic facts:\",\"+1. `flowmap change <base> <head> --facts` prints the deterministic facts:\",\"    changed symbols with the map steps that run them (and a call path proving it), callers left\",\"    unedited, call edges and module dependencies added or removed, reach that moved, flow spread.\"],\"symbols\":[]},{\"file\":\"skills/pr-lens/SKILL.md\",\"old\":102,\"new\":102,\"ctx\":\"Also write the change as a page people can read without the diff:\",\"lines\":[\"    agent (skills, prompts) is behaviour: give it a chapter. Two to five questions per chapter.\",\"    \\\"Ask\\\" means only the author can answer; \\\"check\\\" means the reviewer can settle it themselves.\",\"-3. `python3 <flowmap>/bin/flowmap change <base> <head> --name <name>` writes\",\"+3. `flowmap change <base> <head> --name <name>` writes\",\"    `docs/flowmap/changes/<name>.html`. Symbols the story leaves out land in a \\\"not in the story\\\"\",\"    chapter, so nothing changed is hidden.\"],\"symbols\":[]}]},\"story\":{\"title\":\"flowmap installs into any repo as a Claude Code plugin\",\"pr\":\"PR #3\",\"url\":\"https://github.com/NelisVerhoef/Flowmap/pull/3\",\"intent\":\"Make flowmap easy to use on other repos: installable with two /plugin commands instead of a clone and hand-copied skills.\",\"delta\":\"No flow, step or call edge moves: the CLI is untouched. What changes is how the tools reach another repo. The repo now serves as its own plugin marketplace, and the two skills call `flowmap` from PATH, where the plugin's bin/ lives, instead of from a placeholder path.\"},\"chapters\":[{\"title\":\"The repo is its own plugin marketplace\",\"role\":\"core\",\"kind\":\"distribution\",\"symbols\":[],\"files\":[\".claude-plugin/marketplace.json\",\".claude-plugin/plugin.json\"],\"before\":\"plugin.json existed, but with no marketplace there was no install command; the README said to copy skills/* by hand.\",\"after\":\"`/plugin marketplace add NelisVerhoef/flowmap` then `/plugin install flowmap@flowmap` installs both skills and puts bin/flowmap on the Bash PATH while enabled. `claude plugin validate .` passes.\",\"claim\":\"Any repo can get flowmap in two commands.\",\"why\":\"Every other repo reaches the build and review flows through this. Installs track the default branch, so it does nothing until merged.\",\"questions\":[{\"q\":\"Should the marketplace entry pin a version or tag, so a push to main doesn't change every installed copy at once?\",\"why\":\"Decides whether users get updates continuously or by release.\",\"kind\":\"ask\"},{\"q\":\"The marketplace and plugin are both named `flowmap`, so installs read `flowmap@flowmap`. Keep that, or name the marketplace after the owner?\",\"why\":\"The name is hard to change once people have it in their settings.\",\"kind\":\"ask\"}]},{\"title\":\"The skills run flowmap from PATH\",\"role\":\"supporting\",\"kind\":\"agent instructions\",\"symbols\":[],\"files\":[\"skills/flowmap-build/SKILL.md\",\"skills/pr-lens/SKILL.md\"],\"before\":\"The skills told the agent to run `<plugin root>/bin/flowmap` or `python3 <flowmap>/bin/flowmap`, placeholders it had to resolve by guessing.\",\"after\":\"They run bare `flowmap`, falling back to `${CLAUDE_PLUGIN_ROOT}/bin/flowmap` when the command isn't found.\",\"claim\":\"An agent following either skill no longer has to find the tool.\",\"why\":\"Every map build and PR lens run through an agent starts with this line; a wrong path fails the first command.\",\"questions\":[{\"q\":\"When the skills are copied into .claude/skills instead of installed, neither PATH nor CLAUDE_PLUGIN_ROOT is set. Is the README's manual route (put bin/ on PATH) enough of a fallback?\",\"why\":\"Decides whether the skills need a third fallback.\",\"kind\":\"check\"}]},{\"title\":\"The README documents three install routes\",\"role\":\"supporting\",\"kind\":\"docs\",\"symbols\":[],\"files\":[\"README.md\"],\"before\":\"One line: install the plugin from this repo, or copy skills/*.\",\"after\":\"Plugin install commands; a .claude/settings.json snippet (extraKnownMarketplaces + enabledPlugins) so teammates are offered the plugin when they open a repo; and a manual route.\",\"claim\":\"A team can adopt flowmap by committing one settings file.\",\"why\":\"This is what makes it spread across repos without each person installing it by hand.\",\"questions\":[{\"q\":\"The settings snippet hasn't been tried end to end. Try it in one repo once this is merged, before recommending it to a team.\",\"why\":\"Decides whether the team route is documented as working.\",\"kind\":\"check\"}]}],\"folded\":[]};","+const F = DATA.facts, S = DATA.story;","+const $ = (s) => document.querySelector(s);","+const el = (tag, attrs = {}, ...kids) => {","+  const n = document.createElement(tag);","+  for (const [k, v] of Object.entries(attrs)) {","+    if (k === \"class\") n.className = v; else if (k === \"text\") n.textContent = v; else if (k === \"html\") n.innerHTML = v; else n.setAttribute(k, v);","+  }","+  for (const c of kids) if (c != null) n.append(c);","+  return n;","+};","+const esc = (s) => String(s).replace(/&/g, \"&amp;\").replace(/<\/g, \"&lt;\").replace(/>/g, \"&gt;\");","+const md = (s) => esc(s || \"\").replace(/`([^`]+)`/g, \"<code>$1<\/code>\");","+const sym = (id) => id.split(\":\").pop();","+const file = (id) => id.split(\":\")[0].split(\"/\").pop();","+const flowName = (id) => id.replace(/^new:/, \"\").replace(/-/g, \" \");","+const ROLE = { core: \"Core change\", supporting: \"Supporting change\", refactor: \"Refactor\", outside: \"Outside the map\",","+  unassigned: \"Not in the story\", \"off-map\": \"Off the map\" };","+","+const steps = new Map();","+F.map.forEach((f, fi) => f.steps.forEach((s, si) => steps.set(s.key, { ...s, flow: f.id, fi, si })));","+const symById = new Map(F.symbols.map(s => [s.id, s]));","+","+// chapter facts","+const chapters = DATA.chapters.map((c, i) => {","+  const syms = (c.symbols || []).map(id => symById.get(id)).filter(Boolean);","+  const keys = new Set(syms.flatMap(s => s.steps));","+  const ids = new Set(c.symbols || []);","+  const mine = (n) => ids.has(n) || ids.has(n + \".__init__\");  // calls to a class are calls to its constructor","+  const edgesIn = (list) => list.filter(([a, b]) => mine(a) || mine(b));","+  const callers = new Map();","+  syms.filter(s => s.status === \"modified\").forEach(s => s.callers.forEach(c => { if (!ids.has(c.id)) callers.set(c.id, c.edited); }));","+  const hunks = F.hunks.filter(h => h.symbols.some(x => ids.has(x)) || (c.files || []).includes(h.file));","+  const role = c.role || (c.kind === \"outside\" ? \"outside\" : c.kind === \"unassigned\" ? \"unassigned\" : c.kind === \"off-map\" ? \"off-map\" : i === 0 ? \"core\" : \"supporting\");","+  return { ...c, n: i + 1, id: \"ch\" + (i + 1), syms, keys, role, callers,","+    added: edgesIn(F.edges.added), removed: edgesIn(F.edges.removed), hunks };","+});","+","+// header","+const range = el(\"div\", { class: \"range\" });","+range.append(S.pr ? (S.url ? el(\"a\", { href: S.url, text: S.pr }) : S.pr) : \"\", S.pr ? \" \u00b7 \" : \"\",","+  el(\"span\", { class: \"mono\", text: `${F.base_sha} \u2192 ${F.head_sha}` }), ` \u00b7 ${F.name}`);","+$(\"#top\").append(range, el(\"h1\", { text: S.title || `${F.base}..${F.head}` }));","+if (S.delta) $(\"#top\").append(el(\"p\", { class: \"delta\", html: md(S.delta) }));","+if (S.intent) $(\"#top\").append(el(\"p\", { class: \"intent\", html: \"<b>Author's intent:<\/b> \" + md(S.intent) }));","+","+// system numbers, each with its drivers","+const touchedFlows = new Set(F.symbols.flatMap(s => s.steps.map(k => k.split(\"/\")[0])));","+const gained = Object.keys(F.reach.gained), lost = Object.keys(F.reach.lost);","+const outside = F.files.filter(f => f.kind === \"outside\" || f.kind === \"doc\");","+const tiles = [","+  [`${touchedFlows.size} of ${F.map.length}`, \"flows run changed code\",","+    touchedFlows.size ? [...touchedFlows].map(flowName).join(\", \") + (F.flow_entropy === 0 ? \" \u00b7 one flow, no spread\" : ` \u00b7 spread ${F.flow_entropy} bits`) : \"none\"],","+  [`+${F.endpoints.added.length} \u2212${F.endpoints.removed.length}`, \"entry points\",","+    [...F.endpoints.added.map(e => \"+ \" + e), ...F.endpoints.removed.map(e => \"\u2212 \" + e)].join(\", \") || \"no capability added or removed\"],","+  [`+${gained.length} \u2212${lost.length}`, \"existing code reached\",","+    [...gained.slice(0, 2).map(s => \"+ \" + sym(s)), ...lost.slice(0, 2).map(s => \"\u2212 \" + sym(s))].join(\", \") || \"no entry point gains or loses existing code\"],","+  [`+${F.modules.added.length} \u2212${F.modules.removed.length}`, \"module dependencies\",","+    [...F.modules.added.map(([a, b]) => `${a.split(\"/\").pop()} \u2192 ${b.split(\"/\").pop()}`)].join(\", \") || \"no new links between modules\"],","+  [`+${F.edges.added.length} \u2212${F.edges.removed.length}`, \"calls\", `${F.symbols.filter(s => s.status === \"new\").length} new functions, ${F.symbols.filter(s => s.status === \"modified\").length} changed`],","+  [`${outside.length}`, \"files outside the map\", outside.map(f => f.path).join(\", \") || \"none\"],","+  [F.tests.changed.length ? `${F.tests.changed.length}` : \"0\", \"tests changed\", F.tests.configured ? (F.tests.changed.join(\", \") || \"none changed\") : \"no test suite configured\"],","+];","+for (const [v, k, d] of tiles) {","+  const zero = /^(\\+0 \u22120|0|0 of \\d+)$/.test(v);","+  $(\"#tiles\").append(el(\"div\", { class: \"tile\" + (zero ? \" zero\" : \"\") }, el(\"span\", { class: \"label\", text: k }), el(\"b\", { text: v }), el(\"small\", { text: d })));","+}","+","+// the map: positions fixed by map.json, refs say which chapters run where","+$(\"#lines\").style.setProperty(\"--flows\", F.map.length);","+for (const f of F.map) {","+  const ol = el(\"ol\", { class: \"stations\" });","+  let any = false;","+  for (const s of f.steps) {","+    const hits = chapters.filter(c => c.keys.has(s.key));","+    any = any || hits.length > 0;","+    const refs = el(\"span\", { class: \"refs\" }, ...hits.map(c => el(\"a\", { class: \"ref\", href: \"#\" + c.id, text: String(c.n),","+      style: `--role: var(--${c.role === \"core\" ? \"core\" : c.role === \"supporting\" ? \"support\" : c.role === \"refactor\" ? \"refactor\" : \"outside\"})`,","+      title: c.title })));","+    ol.append(el(\"li\", { class: \"st\" + (hits.length ? \" hit\" : \" quiet\") }, el(\"span\", { class: \"pin\", \"aria-hidden\": \"true\" }),","+      el(\"span\", {}, s.name, hits.length ? refs : null)));","+  }","+  $(\"#lines\").append(el(\"section\", { class: \"flow\" + (any ? \"\" : \" quiet\") }, el(\"h3\", { text: flowName(f.id) }), ol));","+}","+const offChapters = chapters.filter(c => !c.keys.size);","+if (offChapters.length) {","+  const box = $(\"#offmap\");","+  box.hidden = false;","+  box.append(\"Not on any flow:\", ...offChapters.map(c => el(\"a\", { class: \"ref\", href: \"#\" + c.id, text: `${c.n} \u00b7 ${c.title}`, style: \"--role: var(--outside)\" })));","+}","+","+// minimap: same positions as the big map, dots only","+function minimap(c) {","+  const cols = F.map.length, rows = Math.max(...F.map.map(f => f.steps.length));","+  const W = 240, colW = W / cols, rowH = 16, top = 22, H = top + rows * rowH + 4;","+  const ns = \"http://www.w3.org/2000/svg\";","+  const svg = document.createElementNS(ns, \"svg\");","+  svg.setAttribute(\"viewBox\", `0 0 ${W} ${H}`);","+  svg.setAttribute(\"role\", \"img\");","+  svg.setAttribute(\"aria-label\", `System map, ${c.keys.size} of ${steps.size} steps highlighted`);","+  F.map.forEach((f, fi) => {","+    const x = colW * fi + colW / 2;","+    const t = document.createElementNS(ns, \"text\");","+    t.setAttribute(\"x\", x); t.setAttribute(\"y\", 11); t.setAttribute(\"text-anchor\", \"middle\");","+    const nm = flowName(f.id);","+    t.textContent = nm.length > 18 ? nm.slice(0, 17) + \"\u2026\" : nm;","+    svg.append(t);","+    if (f.steps.length > 1) {","+      const l = document.createElementNS(ns, \"line\");","+      Object.entries({ x1: x, x2: x, y1: top, y2: top + (f.steps.length - 1) * rowH, class: \"rail\" }).forEach(([k, v]) => l.setAttribute(k, v));","+      svg.append(l);","+    }","+    f.steps.forEach((s, si) => {","+      const d = document.createElementNS(ns, \"circle\");","+      Object.entries({ cx: x, cy: top + si * rowH, r: 5, class: \"dot\" + (c.keys.has(s.key) ? \" on\" : \"\") }).forEach(([k, v]) => d.setAttribute(k, v));","+      const tip = document.createElementNS(ns, \"title\"); tip.textContent = s.name; d.append(tip);","+      svg.append(d);","+    });","+  });","+  return el(\"div\", { class: \"minimap\" }, svg);","+}","+","+function pathEl(p) {","+  const box = el(\"div\", { class: \"path\" });","+  p.forEach((n, i) => {","+    if (i) box.append(el(\"i\", { text: \"\u203a\" }));","+    box.append(el(\"span\", { class: i === p.length - 1 ? \"end\" : \"\", title: n, text: i === 0 ? file(n) : sym(n) }));","+  });","+  return box;","+}","+","+const picked = new Set();","+function renderNote() {","+  const lines = [];","+  for (const c of chapters) {","+    const qs = (c._qs || []).filter(q => picked.has(q.id));","+    if (!qs.length) continue;","+    lines.push(`${c.n}. ${c.title}`);","+    qs.forEach(q => lines.push(`   - ${q.q}`));","+  }","+  $(\"#note\").value = lines.join(\"\\n\") || \"\";","+}","+","+for (const c of chapters) {","+  const card = el(\"article\", { class: `chapter ${c.role}`, id: c.id });","+  card.append(el(\"div\", { class: \"ch-head\" },","+    el(\"div\", { class: \"ch-tags\" }, el(\"span\", { class: \"num\", text: String(c.n) }), el(\"span\", { class: \"tag\", text: ROLE[c.role] || c.role }),","+      c.kind && c.kind !== c.role ? el(\"span\", { class: \"kind\", text: c.kind }) : null),","+    el(\"h2\", { text: c.title }),","+    c.claim ? el(\"p\", { class: \"claim\", html: md(c.claim) }) : null));","+","+  // where + before/after","+  const crumbs = el(\"ul\", { class: \"crumbs\" });","+  const keys = [...c.keys].sort((a, b) => (steps.get(a).fi - steps.get(b).fi) || (steps.get(a).si - steps.get(b).si));","+  for (const k of keys) {","+    const s = steps.get(k);","+    crumbs.append(el(\"li\", {}, el(\"span\", { class: \"flow-name\", text: flowName(s.flow) }), el(\"span\", { text: s.name })));","+  }","+  if (!keys.length) crumbs.append(el(\"li\", {}, el(\"span\", { class: \"flow-name\", text: \"No flow runs this\" }),","+    el(\"span\", { text: (c.files || []).join(\", \") || c.syms.map(s => s.id).join(\", \") })));","+  const here = el(\"div\", { class: \"here\" }, el(\"span\", { class: \"label\", text: \"You are here\" }), minimap(c), crumbs);","+  const morph = el(\"dl\", { class: \"morph\" });","+  if (c.before) morph.append(el(\"div\", {}, el(\"dt\", { text: \"Before\" }), el(\"dd\", { html: md(c.before) })));","+  if (c.after) morph.append(el(\"div\", { class: \"after\" }, el(\"dt\", { text: \"After\" }), el(\"dd\", { html: md(c.after) })));","+  const right = el(\"div\", { class: \"here\" }, el(\"span\", { class: \"label\", text: \"How the system changes\" }), morph);","+  if (c.why) right.append(el(\"div\", { class: \"why\" }, el(\"span\", { class: \"label\", text: \"Why it matters\" }), el(\"p\", { html: md(c.why) })));","+  if (!c.before && !c.after && !c.why) right.append(el(\"p\", { class: \"note\", text: \"No story for this chapter: the graph facts below are all flowmap knows. Add it to the story file to say what changes and why.\" }));","+  card.append(el(\"div\", { class: \"where\" }, here, right));","+","+  // evidence from the graph","+  const ev = el(\"div\", { class: \"evidence\" });","+  const graphQs = [];","+  const witnesses = new Map();","+  c.syms.forEach(s => Object.entries(s.witness).forEach(([k, p]) => { if (!witnesses.has(k) || witnesses.get(k).length > p.length) witnesses.set(k, p); }));","+  if (witnesses.size) {","+    const ul = el(\"ul\", { class: \"paths\" });","+    for (const [k, p] of witnesses) ul.append(el(\"li\", {}, el(\"div\", { class: \"note\", text: steps.get(k).endpoints.join(\", \") }), pathEl(p)));","+    const unproved = keys.filter(k => !witnesses.has(k));","+    ev.append(el(\"div\", {}, el(\"span\", { class: \"label\", text: \"Runs under (call path as proof)\" }), ul,","+      unproved.length ? el(\"p\", { class: \"note\", text: `Also on the map's own anchors for: ${unproved.map(k => steps.get(k).name).join(\"; \")} (no call path found).` }) : null));","+  }","+  if (c.callers.size) {","+    const ul = el(\"ul\", { class: \"callers\" });","+    [...c.callers].sort((a, b) => a[1] - b[1]).forEach(([id, edited]) =>","+      ul.append(el(\"li\", {}, el(\"span\", { class: \"mark \" + (edited ? \"yes\" : \"no\"), text: edited ? \"edited\" : \"not edited\" }), el(\"span\", { title: id, text: `${file(id)} \u00b7 ${sym(id)}` }))));","+    ev.append(el(\"div\", {}, el(\"span\", { class: \"label\", text: \"Callers of what changed\" }), ul));","+  }","+  if (c.added.length || c.removed.length) {","+    const ul = el(\"ul\", { class: \"edges\" });","+    c.added.slice(0, 8).forEach(([a, b]) => ul.append(el(\"li\", {}, el(\"span\", { class: \"mark add\", text: \"+ call\" }), el(\"span\", { text: `${sym(a)} \u2192 ${sym(b)}` }))));","+    c.removed.slice(0, 8).forEach(([a, b]) => ul.append(el(\"li\", {}, el(\"span\", { class: \"mark rem\", text: \"\u2212 call\" }), el(\"span\", { text: `${sym(a)} \u2192 ${sym(b)}` }))));","+    ev.append(el(\"div\", {}, el(\"span\", { class: \"label\", text: \"Calls added and removed\" }), ul));","+  }","+  // reach that moved under this chapter's steps, though the code reached may be untouched","+  const myEps = new Set(keys.flatMap(k => steps.get(k).endpoints));","+  const moved = (table) => Object.entries(table).map(([s, eps]) => [s, eps.filter(e => myEps.has(e))]).filter(([, eps]) => eps.length);","+  const gainedHere = moved(F.reach.gained), lostHere = moved(F.reach.lost);","+  if (gainedHere.length || lostHere.length) {","+    const ul = el(\"ul\", { class: \"edges\" });","+    lostHere.forEach(([s, eps]) => ul.append(el(\"li\", {}, el(\"span\", { class: \"mark rem\", text: \"no longer\" }), el(\"span\", { title: s, text: `${file(s)} \u00b7 ${sym(s)} from ${eps.join(\", \")}` }))));","+    gainedHere.forEach(([s, eps]) => ul.append(el(\"li\", {}, el(\"span\", { class: \"mark add\", text: \"now reaches\" }), el(\"span\", { title: s, text: `${file(s)} \u00b7 ${sym(s)} from ${eps.join(\", \")}` }))));","+    ev.prepend(el(\"div\", {}, el(\"span\", { class: \"label\", text: \"Reach that moved (unedited code)\" }), ul));","+    lostHere.forEach(([s, eps], i) => graphQs.push({ id: `${c.id}l${i}`, kind: \"graph\", q: `${eps.join(\", \")} no longer reaches ${sym(s)} (${file(s)}). Was dropping it intended?`, why: \"Lost reach to existing code is how a removed check looks.\" }));","+    gainedHere.forEach(([s, eps], i) => graphQs.push({ id: `${c.id}w${i}`, kind: \"graph\", q: `${eps.join(\", \")} now reaches existing ${sym(s)} (${file(s)}). Is it safe to run there?`, why: \"Existing code running under a new entry point.\" }));","+  }","+  if (ev.children.length) card.append(ev);","+","+  // questions: the story's, then what the graph raises on its own","+  const qs = [...graphQs, ...(c.questions || []).map((q, i) => ({ ...q, id: `${c.id}q${i}` }))];","+  c.syms.filter(s => s.contract).forEach((s, i) => {","+    const still = s.callers.filter(x => !x.edited).map(x => sym(x.id));","+    if (still.length) qs.push({ id: `${c.id}g${i}`, kind: \"graph\", q: `${sym(s.id)} changed its arguments (${s.signature[0]} \u2192 ${s.signature[1]}) but ${still.length} caller(s) were not edited: ${still.join(\", \")}. Are they still correct?`, why: \"Signature changed, callers did not.\" });","+  });","+  c.syms.filter(s => s.status === \"new\" && !s.steps.length).forEach((s, i) =>","+    qs.push({ id: `${c.id}o${i}`, kind: \"graph\", q: `New ${sym(s.id)} is not run by any flow on the map. Which step is it for?`, why: \"New code no flow reaches is either a map gap or dead.\" }));","+  c._qs = qs;","+  if (qs.length) {","+    const ol = el(\"ol\", { class: \"qs\" });","+    for (const q of qs) {","+      const box = el(\"input\", { type: \"checkbox\", id: q.id });","+      if (q.kind === \"ask\" || q.kind === \"graph\") { box.checked = true; picked.add(q.id); }","+      box.addEventListener(\"change\", () => { box.checked ? picked.add(q.id) : picked.delete(q.id); renderNote(); });","+      const kind = { ask: \"Ask the author\", check: \"Check yourself\", graph: \"From the graph\" }[q.kind] || q.kind;","+      ol.append(el(\"li\", { class: \"q\" }, box, el(\"label\", { for: q.id },","+        el(\"span\", { class: \"qtext\", html: `<span class=\"qkind ${esc(q.kind)}\">${esc(kind)}<\/span>` + md(q.q) }),","+        q.why ? el(\"span\", { class: \"qwhy\", html: md(q.why) }) : null)));","+    }","+    card.append(el(\"div\", { class: \"here\" }, el(\"span\", { class: \"label\", text: \"Questions, most decisive first\" }), ol));","+  }","+","+  // code last","+  if (c.hunks.length) {","+    const d = el(\"details\", { class: \"code\" }, el(\"summary\", { text: `Code: ${c.hunks.length} hunk${c.hunks.length === 1 ? \"\" : \"s\"} in ${[...new Set(c.hunks.map(h => h.file))].join(\", \")}` }));","+    for (const h of c.hunks) {","+      const pre = el(\"pre\");","+      h.lines.forEach(l => pre.append(el(\"span\", { class: l[0] === \"+\" ? \"a\" : l[0] === \"-\" ? \"r\" : \"\", text: l })));","+      d.append(el(\"div\", { class: \"hunk\" }, el(\"div\", { class: \"hh\", text: `${h.file} @ ${h.new}${h.ctx ? \" \u00b7 \" + h.ctx : \"\"}` }), pre));","+    }","+    card.append(d);","+  }","+  $(\"#chapters\").append(card);","+}","+renderNote();","+if (DATA.folded.length) $(\"#folded\").textContent = \"Folded, not shown: \" + DATA.folded.join(\", \");","+","+$(\"#copy\").addEventListener(\"click\", async () => {","+  const t = $(\"#note\");","+  try { await navigator.clipboard.writeText(t.value); $(\"#status\").textContent = \"Copied\"; }","+  catch (e) { t.focus(); t.select(); $(\"#status\").textContent = \"Selected: press Ctrl+C or Cmd+C to copy\"; }","+});","+<\/script>"],"symbols":[]},{"file":"docs/flowmap/changes/pr-3.story.json","old":0,"new":1,"ctx":"","lines":["+{","+  \"title\": \"flowmap installs into any repo as a Claude Code plugin\",","+  \"pr\": \"PR #3\",","+  \"url\": \"https://github.com/NelisVerhoef/Flowmap/pull/3\",","+  \"intent\": \"Make flowmap easy to use on other repos: installable with two /plugin commands instead of a clone and hand-copied skills.\",","+  \"delta\": \"No flow, step or call edge moves: the CLI is untouched. What changes is how the tools reach another repo. The repo now serves as its own plugin marketplace, and the two skills call `flowmap` from PATH, where the plugin's bin/ lives, instead of from a placeholder path.\",","+  \"chapters\": [","+    {","+      \"title\": \"The repo is its own plugin marketplace\",","+      \"role\": \"core\",","+      \"kind\": \"distribution\",","+      \"symbols\": [],","+      \"files\": [\".claude-plugin/marketplace.json\", \".claude-plugin/plugin.json\"],","+      \"before\": \"plugin.json existed, but with no marketplace there was no install command; the README said to copy skills/* by hand.\",","+      \"after\": \"`/plugin marketplace add NelisVerhoef/flowmap` then `/plugin install flowmap@flowmap` installs both skills and puts bin/flowmap on the Bash PATH while enabled. `claude plugin validate .` passes.\",","+      \"claim\": \"Any repo can get flowmap in two commands.\",","+      \"why\": \"Every other repo reaches the build and review flows through this. Installs track the default branch, so it does nothing until merged.\",","+      \"questions\": [","+        {\"q\": \"Should the marketplace entry pin a version or tag, so a push to main doesn't change every installed copy at once?\", \"why\": \"Decides whether users get updates continuously or by release.\", \"kind\": \"ask\"},","+        {\"q\": \"The marketplace and plugin are both named `flowmap`, so installs read `flowmap@flowmap`. Keep that, or name the marketplace after the owner?\", \"why\": \"The name is hard to change once people have it in their settings.\", \"kind\": \"ask\"}","+      ]","+    },","+    {","+      \"title\": \"The skills run flowmap from PATH\",","+      \"role\": \"supporting\",","+      \"kind\": \"agent instructions\",","+      \"symbols\": [],","+      \"files\": [\"skills/flowmap-build/SKILL.md\", \"skills/pr-lens/SKILL.md\"],","+      \"before\": \"The skills told the agent to run `<plugin root>/bin/flowmap` or `python3 <flowmap>/bin/flowmap`, placeholders it had to resolve by guessing.\",","+      \"after\": \"They run bare `flowmap`, falling back to `${CLAUDE_PLUGIN_ROOT}/bin/flowmap` when the command isn't found.\",","+      \"claim\": \"An agent following either skill no longer has to find the tool.\",","+      \"why\": \"Every map build and PR lens run through an agent starts with this line; a wrong path fails the first command.\",","+      \"questions\": [","+        {\"q\": \"When the skills are copied into .claude/skills instead of installed, neither PATH nor CLAUDE_PLUGIN_ROOT is set. Is the README's manual route (put bin/ on PATH) enough of a fallback?\", \"why\": \"Decides whether the skills need a third fallback.\", \"kind\": \"check\"}","+      ]","+    },","+    {","+      \"title\": \"The README documents three install routes\",","+      \"role\": \"supporting\",","+      \"kind\": \"docs\",","+      \"symbols\": [],","+      \"files\": [\"README.md\"],","+      \"before\": \"One line: install the plugin from this repo, or copy skills/*.\",","+      \"after\": \"Plugin install commands; a .claude/settings.json snippet (extraKnownMarketplaces + enabledPlugins) so teammates are offered the plugin when they open a repo; and a manual route.\",","+      \"claim\": \"A team can adopt flowmap by committing one settings file.\",","+      \"why\": \"This is what makes it spread across repos without each person installing it by hand.\",","+      \"questions\": [","+        {\"q\": \"The settings snippet hasn't been tried end to end. Try it in one repo once this is merged, before recommending it to a team.\", \"why\": \"Decides whether the team route is documented as working.\", \"kind\": \"check\"}","+      ]","+    }","+  ]","+}"],"symbols":[]},{"file":"skills/flowmap-build/SKILL.md","old":9,"new":9,"ctx":"The map is built by **agreement between independent passes**, not by any single","lines":[" right. Agreement only means something between *different methods*, so never skip the mix."," ","-`flowmap` below is `<plugin root>/bin/flowmap` (or `python3 <plugin root>/flowmap/<cmd>.py`).","+`flowmap` is on PATH when this plugin is installed. If the bare command isn't found, use","+`\"${CLAUDE_PLUGIN_ROOT}/bin/flowmap\"` (or wherever the flowmap repo is checked out)."," Run everything from the root of the repo being mapped."," "],"symbols":[]},{"file":"skills/pr-lens/SKILL.md","old":20,"new":20,"ctx":"A PR number, a branch, or a commit range. Resolve to `<base> <head>`:","lines":[" ## Steps"," ","-1. From the repo root, run `python3 <flowmap>/bin/flowmap lens <base> <head>` (the repo you are reviewing must already have a map;","+1. From the repo root (if `flowmap` isn't on PATH, use `\"${CLAUDE_PLUGIN_ROOT}/bin/flowmap\"`), run `flowmap lens <base> <head>` (the repo you are reviewing must already have a map;","    build one with the flowmap-build skill). This is the ground truth for","    placement \u2014 do not contradict it; if you think the map is wrong, say so separately."],"symbols":[]},{"file":"skills/pr-lens/SKILL.md","old":76,"new":76,"ctx":"specific and occasionally wrong over safe and vague.","lines":[" Also write the change as a page people can read without the diff:"," ","-1. `python3 <flowmap>/bin/flowmap change <base> <head> --facts` prints the deterministic facts:","+1. `flowmap change <base> <head> --facts` prints the deterministic facts:","    changed symbols with the map steps that run them (and a call path proving it), callers left","    unedited, call edges and module dependencies added or removed, reach that moved, flow spread."],"symbols":[]},{"file":"skills/pr-lens/SKILL.md","old":102,"new":102,"ctx":"Also write the change as a page people can read without the diff:","lines":["    agent (skills, prompts) is behaviour: give it a chapter. Two to five questions per chapter.","    \"Ask\" means only the author can answer async function inflate(b64) {

  return JSON.parse(await new Response(stream).text());
}

    el("div", {}, el("p", { class: "label", text: "Before" }), el("p", { html: md(c.before || "—") })),
    el("div", { class: "after" }, el("p", { class: "label", text: "After" }), el("p", { html: md(c.after || "—") }))));
  if (c.why) pane.append(el("p", { class: "why", html: "<b>Why it matters.</b> " + md(c.why) }));
  if (!c.before && !c.after && !c.why) pane.append(el("p", { class: "note", text: "No story for this part: the facts below are all flowmap knows. Add it to the story file to say what changes and why." }));

  if (c.qs.length) {
    const ol = el("ol", { class: "qs" });
    for (const q of c.qs) {
      const kind = { ask: "Ask the author", check: "Check yourself", graph: "From the graph" }[q.kind] || q.kind;
      ol.append(el("li", { class: "q" },
        el("input", { type: "checkbox", id: q.id, checked: picked.has(q.id) ? "" : null,
          onchange: (e) => { e.target.checked ? picked.add(q.id) : picked.delete(q.id); renderNote(); } }),
        el("label", { for: q.id }, el("span", { class: "qtext", html: `<span class="qkind ${esc(q.kind)}">${esc(kind)}</span>` + md(q.q) }),
          q.why ? el("span", { class: "qwhy", html: md(q.why) }) : null)));
    }
    pane.append(el("section", { style: "display:grid;gap:10px" }, el("h3", { class: "label", text: "Questions, most decisive first" }), ol));
  }

  // evidence, on demand
  const more = el("div", { class: "more" });
  const witnesses = new Map();
  c.syms.forEach(s => Object.entries(s.witness).forEach(([k, p]) => { if (!witnesses.has(k) || witnesses.get(k).length > p.length) witnesses.set(k, p); }));
  if (witnesses.size) {
    const unproved = c.keys.filter(k => !witnesses.has(k));
    more.append(fold("How the flows reach this code", `${plural(witnesses.size, "call path")} from an entry point`,
      el("ul", { class: "paths" }, ...[...witnesses].map(([k, p]) => el("li", {}, el("p", { class: "note", text: `${steps.get(k).name} · ${steps.get(k).endpoints.join(", ")}` }), pathEl(p)))),
      unproved.length ? el("p", { class: "note", text: `Also on the map's own anchors for: ${unproved.map(k => steps.get(k).name).join("; ")} (no call path found).` }) : null));
  }
  const myEps = new Set(c.keys.flatMap(k => steps.get(k).endpoints));
  const moved = (table) => Object.entries(table).map(([s, eps]) => [s, eps.filter(e => myEps.has(e))]).filter(([, eps]) => eps.length);
  const ripple = [
    ...moved(F.reach.lost).map(([s, eps]) => ["rem", "no longer", `${file(s)} · ${sym(s)} from ${eps.join(", ")}`]),
    ...moved(F.reach.gained).map(([s, eps]) => ["add", "now reaches", `${file(s)} · ${sym(s)} from ${eps.join(", ")}`]),
    ...[...c.callers].sort((a, b) => a[1] - b[1]).map(([id, edited]) => [edited ? "yes" : "no", edited ? "caller, edited" : "caller, not edited", `${file(id)} · ${sym(id)}`]),
    ...c.added.map(([a, b]) => ["add", "+ call", `${sym(a)} → ${sym(b)}`]),
    ...c.removed.map(([a, b]) => ["rem", "− call", `${sym(a)} → ${sym(b)}`]),
  ];
  if (ripple.length) {
    const notEdited = [...c.callers.values()].filter(e => !e).length;
    more.append(fold("Ripple", [notEdited && `${notEdited} caller${notEdited === 1 ? "" : "s"} not edited`, (c.added.length || c.removed.length) && `+${c.added.length} −${c.removed.length} calls`].filter(Boolean).join(" · "),
      el("ul", { class: "rows" }, ...ripple.map(([k, m, t]) => el("li", {}, el("span", { class: "mark " + k, text: m }), el("span", { text: t }))))));
  }
  if (c.hunks.length) {
    const box = el("div", { style: "display:grid;gap:10px" });
    const hunkEls = c.hunks.map(h => {
      const pre = el("pre");
      h.lines.forEach(l => pre.append(el("span", { class: l[0] === "+" ? "a" : l[0] === "-" ? "r" : "", text: l })));
      const n = el("div", { class: "hunk" }, el("div", { class: "hh", text: `${h.file} @ ${h.new}${h.ctx ? " · " + h.ctx : ""}` }), pre);
      n._syms = h.symbols; n._file = h.file;
      return n;
    });
    // pick a symbol (or file) to see only its hunks
    const keysOf = [...new Set([...c.syms.map(s => s.id), ...c.hunks.filter(h => !h.symbols.length).map(h => h.file)])];
    const chips = el("div", { class: "chips" });
    const filter = (key) => {
      chips.querySelectorAll(".chip").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.k === key)));
      hunkEls.forEach(n => { n.hidden = key != null && !(n._syms.includes(key) || (!n._syms.length && n._file === key)); });
    };
    if (keysOf.length > 1) keysOf.forEach(k => {
      const s = symById.get(k);
      chips.append(el("button", { type: "button", class: "chip", "data-k": k, "aria-pressed": "false", title: k,
        onclick: (e) => filter(e.currentTarget.getAttribute("aria-pressed") === "true" ? null : k) },
        s ? (c.syms.filter(o => sym(o.id) === sym(k)).length > 1 ? `${file(k)} · ${sym(k)}` : sym(k)) : k.split("/").pop(), s && s.status !== "modified" ? el("i", { text: s.status }) : null));
    });
    box.append(chips, ...hunkEls);
    const files = [...new Set(c.hunks.map(h => h.file.split("/").pop()))];
    more.append(fold("Code", `${plural(c.hunks.length, "hunk")} in ${files.slice(0, 4).join(", ")}${files.length > 4 ? ` and ${files.length - 4} more` : ""}`, box));
  }
  if (more.children.length) pane.append(more);
}

function renderNote() {
  const lines = [];
  for (const c of chapters) {
    const qs = c.qs.filter(q => picked.has(q.id));
    if (!qs.length) continue;
    lines.push(`${c.n}. ${c.title}`);
    qs.forEach(q => lines.push(`   - ${q.q}`));
  }
  $("#note").value = lines.join("\n");
  $("#count").textContent = plural(picked.size, "question");
}

addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  const d = { ArrowRight: 1, j: 1, ArrowLeft: -1, k: -1 }[e.key];
  if (d && current + d >= 0 && current + d <= chapters.length) { e.preventDefault(); show(current + d); }
});
$("#peek").addEventListener("click", (e) => {
  const open = $("#note").hidden;
  $("#note").hidden = !open;
  e.target.setAttribute("aria-expanded", String(open));
  e.target.textContent = open ? "Hide" : "Show";
});
$("#copy").addEventListener("click", async () => {
  const t = $("#note");
  try { await navigator.clipboard.writeText(t.value); $("#status").textContent = "Copied"; }
  catch (e) { t.hidden = false; t.focus(); t.select(); $("#status").textContent = "Selected: press Ctrl+C or Cmd+C to copy"; }
});
renderNote();
show(0, false);
</script>
