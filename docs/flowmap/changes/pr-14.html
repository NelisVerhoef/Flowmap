yped.get(owner, {}).get(node.value.id)","+                    if cls and f\"{cls}.{node.attr}\" in self.defs:","+                        return {f\"{cls}.{node.attr}\"}  # uf = UnionFind(); uf.union()","                 if not called:","                     return set()  # `x.score` read as a field is not a call to any .score()","+                app = isinstance(node.value, ast.Name) and (node.value.id in (\"self\", \"cls\") or node.value.id in typed.get(owner, {}))","+                if node.attr in BUILTIN and not app:","+                    return set()  # `s.replace()` is str's, not the app's new Doc.replace","                 cands = self.methods.get(node.attr, set()) | {","                     self.by_module[m][node.attr] for m in self.module_values if node.attr in self.by_module.get(m, {})}"],"symbols":["flowmap/graphs/python.py:_Builder._link.targets"]},{"file":"flowmap/graphs/python.py","old":275,"new":289,"ctx":"class _Builder:","lines":["                             elif isinstance(sub, (ast.Name, ast.Attribute)):","                                 self.edges[nid] |= targets(sub, called=False)","+                    typed[nid] = {a.targets[0].id: cls for a in ast.walk(child)","+                                  if isinstance(a, ast.Assign) and len(a.targets) == 1 and isinstance(a.targets[0], ast.Name)","+                                  and isinstance(a.value, ast.Call) for cls in targets(a.value.func, owner=nid) & self.bases.keys()}","                     walk(child, nid)","                     continue"],"symbols":["flowmap/graphs/python.py:_Builder._link.walk"]},{"file":"skills/pr-lens/SKILL.md","old":132,"new":132,"ctx":"Also write the change as a page people can read without the diff:","lines":["    cites in the diff, test names that exist at head) and prints no link until the story passes;","    the page shows anything that failed. The link opens `https://flowmap.testabl.ai/v1/change.html`","-   unless `viewer` in `flowmap.toml` names another; put lder._link.targets","step":"new:review-change-on-map/callgraph-impact"},{"was":"Every doc or other non-code file a PR changes rides in the link as full diff text, under \"Changed outside the map\"","cite":"flowmap/change.py:merge"},{"was":"A link over 60,000 characters gets a warning and nothing else","cite":"flowmap/change.py:main"}]},"chapters":[{"title":"The call graph stops linking builtin-type calls to app methods of the same name","role":"core","kind":"graph accuracy","symbols":["flowmap/graphs/python.py:_Builder._link","flowmap/graphs/python.py:_Builder._link.targets","flowmap/graphs/python.py:_Builder._link.walk"],"before":"`obj.method()` with an unknown receiver got an edge to every app method of that name (up to AMBIGUOUS = 6). So `set().union(...)` called `UnionFind.union`, `m.groups()` called `UnionFind.groups`, and in issue #13 a new `replace` method gained 155 false callers. The verdict said the PR spread to 196 entry points.","after":"When the name is a public method of str, bytes, bytearray, dict, list, set, frozenset, tuple, re.Pattern or re.Match, the call is resolved only if the receiver is known to be the app's: `self`/`cls`, or a local assigned from an app class in the same def (`uf = UnionFind()`). That local rule also resolves `uf.union` (and `map(d.component, ...)`) to the exact method when the class defines it, for any name. On the golden commits (6d9eaff, 770f1a7) that drops 5 false edges and finds 1 real one (`atlas.build` \u2192 `Diagrams.component`).","claim":"Reach and the verdict stop counting callers that only call str, dict or regex methods.","why":"Reach, the verdict and the questions all come from this graph. A false edge from every `str.replace()` makes a contained change look like it spreads everywhere, and then the witnesses fill the link. Rather than tracking types in general, this checks only the case the issue hit: a name that builtin types also have.","verified":[{"how":"test","what":"tests/test_graphs.py:PythonResolutionTest.test_a_method_named_like_a_builtin_is_not_every_str_call"},{"how":"looked","what":"golden graph diff for 6d9eaff and 770f1a7: the 5 removed edges are set().union and re.Match.groups; the added edge is `d = Diagrams()` then `map(d.component, ...)` in atlas.build"},{"how":"test","what":"tests/test_change.py:FactsTest.test_a_reach_move_names_the_call_that_caused_it"}],"questions":[{"q":"An app object whose type the graph can't see (a parameter `repo`, an attribute `self.store`) calling `.get()` or `.update()` now gets no edge. Is losing those true edges acceptable next to the false ones dropped?","why":"Decides whether the receiver rule needs parameter annotations or attribute types next.","kind":"ask"},{"q":"Run `flowmap callgraph dump` on a repo you know and diff the edges into methods named like builtins: are the removed ones all calls on str, dict or regex values?","why":"The golden repo has only a few such methods; a bigger repo is a better check.","kind":"check"}]},{"title":"The page carries diff text only for code and claimed files, and one call path per symbol","role":"supporting","kind":"smaller page","symbols":["flowmap/change.py:merge","flowmap/change.py:facts"],"files":["flowmap/change.template.html"],"before":"`merge` kept the diff text of every file in any chapter, including the automatic \"Changed outside the map\" chapter, so a long plan doc no part claimed filled the link. `facts` kept one call path per changed symbol per reachable step: about 650 paths in issue #13.","after":"`merge` keeps diff text for hunks in changed code and for files a story chapter names in `files`; unclaimed docs and other non-code files show their path and line counts. The call tree says \"see the PR diff\" for those. `facts` keeps one path per flow (the step list still has every step), and the page data keeps one path per symbol, which is all the page draws.","claim":"A long doc or a widely reached symbol no longer makes the link too big.","why":"A reviewer needs one path proving a flow is reached, not one per step. A plan doc's diff text is readable in the PR itself. Rather than capping doc text at N lines, drop it unless the story chose the file, because the story author knows which non-code files are part of the change.","verified":[{"how":"test","what":"tests/test_change.py:LinkSizeTest"},{"how":"ran","what":"a probe commit adding a 2,500-line plan doc with no story: link 48,041 characters before, 1,281 after"},{"how":"ran","what":"links for PRs #8, #9, #10, #12 on this repo: within 200 characters of before"}],"questions":[{"q":"Should a story be able to keep a doc's text without naming it as a chapter file, for a PR whose point is the doc?","why":"Today naming it in `files` is the only way.","kind":"ask"}]},{"title":"--link fits the budget by dropping diff text, or prints a line to paste","role":"supporting","kind":"overflow","symbols":["flowmap/change.py:fitted_link","flowmap/change.py:main"],"files":["README.md","skills/pr-lens/SKILL.md",".claude-plugin/plugin.json"],"before":"Past 60,000 characters, `main` printed a warning and the too-long link anyway; the reader had to download the page and drop it on the viewer.","after":"`fitted_link` drops diff text of non-code files, then all diff text, until the link fits BUDGET (60,000). It records what it dropped in the page's `trimmed`, which the page shows under the parts list. If nothing fits, `main` prints a line for the PR body: open the viewer and drop the committed page on it. README and pr-lens say so; the plugin moves to 0.2.2.","claim":"--link always prints something that fits a PR body.","why":"Diff text is the one part of the page the PR itself already shows, so it goes first. The committed HTML keeps everything.","verified":[{"how":"test","what":"tests/test_change.py:LinkSizeTest.test_an_oversized_link_drops_diff_text_and_says_so"},{"how":"ran","what":"a story-claimed 120 KB doc: the link drops its text, prints the note to stderr, and is 1,298 characters; the page rendered in Chromium shows \"Left out of this link to fit a PR body\""}],"questions":[{"q":"The hosted viewer at flowmap.testabl.ai is built from this template; until it is redeployed, trimmed links render without the \"left out\" note. Redeploy with this PR?","why":"Without it, a reader of a trimmed link isn't told the code is missing.","kind":"ask"}]}],"folded":["docs/flowmap/changes/pr-14.html","docs/flowmap/changes/pr-14.story.json","tests/golden/change-facts-6d9eaff-770f1a7.json","tests/golden/graph-6d9eaff.json","tests/golden/graph-770f1a7.json","tests/test_change.py","tests/test_graphs.py"],"lint":[]};

async function inflate(b64) {
  const bytes = Uint8Array.from(atob(b64.replace(/-/g, "+").replace(/_/g, "/")), (c) => c.charCodeAt(0));
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return JSON.parse(await new Response(stream).text());
}

function fromFile(error) {
  const box = document.createElement("section");
  box.className = "drop";
  box.innerHTML = `<h1>Open a flowmap change</h1>
    <p>Drop a change page (<code>docs/flowmap/changes/&lt;name&gt;.html</code>) or its data as JSON here.
    It is read in this tab and sent nowhere.</p>
    <p><input type="file" accept=".html,.json"></p><p class="err" hidden></p>`;
  const err = box.querySelector(".err");
  if (error) { err.hidden = false; err.textContent = error; }
  document.querySelector(".wrap").replaceChildren(box);
  document.querySelector(".tray").hidden = true;
  return new Promise((resolve) => {
    const read = async (f) => {
      try {
        const text = await f.text();
        const m = /const EMBEDDED = (\{.*?\});\n/s.exec(text) || /const DATA = (\{.*?\});\n/s.exec(text);
        const data = JSON.parse(m ? m[1] : text);
        if (!data.facts || !data.chapters) throw new Error("not flowmap change data");
        resolve(data);
      } catch (e) { err.hidden = false; err.textContent = `Could not read ${f.name}: ${e.message}`; }
    };
    box.querySelector("input").addEventListener("change", (e) => e.target.files[0] && read(e.target.files[0]));
    addEventListener("dragover", (e) => { e.preventDefault(); box.classList.add("over"); });
    addEventListener("dragleave", () => box.classList.remove("over"));
    addEventListener("drop", (e) => { e.preventDefault(); box.classList.remove("over"); e.dataTransfer.files[0] && read(e.dataTransfer.files[0]); });
  });
}

async function load() {
  if (EMBEDDED) return EMBEDDED;
  if (PAYLOAD) {
    try { return await inflate(PAYLOAD[1]); }
    catch (e) { return fromFile("The link's data is cut off or damaged. Was the whole link copied?"); }
  }
  return fromFile();
}

  const c = chapters[n - 1];
  current = n;
  document.querySelectorAll("#toc button").forEach(b => b.setAttribute("aria-current", String(+b.dataset.ch === n)));
  // the overview lights every touched stop in its own part's colour; a part lights only its own
  document.querySelectorAll("#map .stop").forEach(s => s.classList.toggle("lit", c ? c.keys.includes(s.dataset.key) || +s.dataset.off === n : s.classList.contains("touched")));
  $("#map").style.removeProperty("--sel");
  if (c) $("#map").style.setProperty("--sel", `var(--${{ core: "core", supporting: "support", refactor: "refactor" }[c.role] || "outside"})`);
  $("#rail-map").hidden = !c;
  const pane = $("#pane");
  pane.replaceChildren();
  if (!c) overview(pane);
  else part(pane, c);

  const nav = el("div", { class: "step-nav" });
  for (const [dir, label] of [[-1, "Previous"], [1, n ? "Next" : "Start"]]) {
    const o = n + dir === 0 ? { n: 0, title: "Overview" } : chapters[n - 1 + dir];
    if (o) nav.append(el("button", { type: "button", "data-dir": String(dir), onclick: () => show(o.n) }, el("small", { text: o.n ? `${label} · ${o.n} of ${chapters.length}` : label }), o.title));
  }
  pane.append(nav, el("p", { class: "keys", html: "<kbd>←</kbd> <kbd>→</kbd> or <kbd>j</kbd> <kbd>k</kbd> to move between parts" }));
  if (focus) { pane.focus({ preventScroll: true }); if (pane.getBoundingClientRect().top < 0) pane.scrollIntoView({ block: "start" }); }
}

function part(pane, c) {
  pane.className = "pane " + c.role;

  pane.append(el("div", {},
    el("div", { class: "ch-tags" }, el("span", { class: "num", text: `${c.n} of ${chapters.length}` }), el("span", { class: "tag", text: ROLE[c.role] || c.role }),
      c.kind && c.kind !== c.role ? el("span", { class: "kind", text: c.kind }) : null),
    el("h2", { html: md(c.title) })));
  if (c.claim) pane.append(el("p", { class: "claim", html: md(c.claim) }));
  pane.append(el("p", { class: "runs", html: c.keys.length
    ? "Runs in " + F.map.filter(f => c.keys.some(k => steps.get(k).flow === f.id)).map(f => {
        const mine = f.steps.filter(s => c.keys.includes(s.key));
        return `<b title="${esc(mine.map(s => s.name).join("\n"))}">${esc(flowName(f.id))}</b> (${mine.length === 1 ? esc(mine[0].name) : `${mine.length} of ${f.steps.length} steps`})`;
      }).join(" · ")
    : "No flow on the map runs this." }));

  if (c.before || c.after) pane.append(el("div", { class: "ba" },
    el("div", {}, el("p", { class: "label", text: "Before" }), el("p", { html: md(c.before || "—") })),
    el("div", { class: "after" }, el("p", { class: "label", text: "After" }), el("p", { html: md(c.after || "—") }))));
  if ((c.verified || []).length) pane.append(el("p", { class: "verified", html: "<b>Verified:</b> " +
    c.verified.map(v => `<span class="how${v.how === "not checked" ? " no" : ""}">${esc(v.how)}</span> ${md(v.what)}`).join(" · ") }));
  const tree = callTree(c);
  if (tree) pane.append(el("section", { style: "display:grid;gap:8px" }, el("h3", { class: "label", text: "Calls, before → after" }), tree,
    el("p", { class: "note", text: "+ added, − removed by this change; the rest existed before. Built from the call graph, so dispatch it can't follow (dicts, templates) is missing." })));
  if (c.why) pane.append(el("p", { class: "why", html: "<b>Why it matters.</b> " + md(c.why) }));
  if (!c.before && !c.after && !c.why) pane.append(el("p", { class: "note", text: "No story for this part: the facts below are all flowmap knows. Add it to the story file to say what changes and why." }));

  if (c.qs.length) {
    const ol = el("ol", { class: "qs" });
    for (const q of c.qs) {
      const kind = { ask: "Ask the author", check: "Check yourself", graph: "From the graph" }[q.kind] || q.kind;
      ol.append(el("li", { class: "q" },
        el("input", { type: "checkbox", id: q.id, checked: picked.has(q.id) ? "" : null,
          onchange: (e) => { e.target.checked ? picked.add(q.id) : picked.delete(q.id); renderNote(); } }),
        el("label", { for: q.id }, el("span", { class: "qtext", html: `<span class="qkind ${esc(q.kind)}">${esc(kind)}</span>` + md(q.q) }),
          q.why ? el("span", { class: "qwhy", html: md(q.why) }) : null)));
    }
    pane.append(el("section", { style: "display:grid;gap:10px" }, el("h3", { class: "label", text: "Questions, most decisive first" }), ol));
  }

  // evidence, on demand
  const more = el("div", { class: "more" });
  const rows = [
    ...movesFor(c, c.keys, "lost").map(([s, eps]) => ["rem", "no longer", `${file(s)} · ${sym(s)} from ${eps.join(", ")}`]),
    ...movesFor(c, c.keys, "gained").map(([s, eps]) => ["add", "now reaches", `${file(s)} · ${sym(s)} from ${eps.join(", ")}`]),
    ...[...c.callers].sort((a, b) => a[1] - b[1]).map(([id, edited]) => [edited ? "yes" : "no", edited ? "caller, edited" : "caller, not edited", `${file(id)} · ${sym(id)}`]),
  ];
  if (rows.length) {
    const notEdited = [...c.callers.values()].filter(e => !e).length;
    more.append(fold("Callers and reach", notEdited ? `${notEdited} caller${notEdited === 1 ? "" : "s"} not edited` : "",
      el("ul", { class: "rows" }, ...rows.map(([k, m, t]) => el("li", {}, el("span", { class: "mark " + k, text: m }), el("span", { text: t }))))));
  }
  if (c.hunks.length) {
    const box = el("div", { style: "display:grid;gap:10px" });
    const hunkEls = c.hunks.map(h => {
      const pre = el("pre");
      h.lines.forEach(l => pre.append(el("span", { class: l[0] === "+" ? "a" : l[0] === "-" ? "r" : "", text: l })));
      const n = el("div", { class: "hunk" }, el("div", { class: "hh", text: `${h.file} @ ${h.new}${h.ctx ? " · " + h.ctx : ""}` }), pre);
      n._syms = h.symbols; n._file = h.file;
      return n;
    });
    // pick a symbol (or file) to see only its hunks
    const keysOf = [...new Set([...c.syms.map(s => s.id), ...c.hunks.filter(h => !h.symbols.length).map(h => h.file)])];
    const chips = el("div", { class: "chips" });
    const filter = (key) => {
      chips.querySelectorAll(".chip").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.k === key)));
      hunkEls.forEach(n => { n.hidden = key != null && !(n._syms.includes(key) || (!n._syms.length && n._file === key)); });
    };
    if (keysOf.length > 1) keysOf.forEach(k => {
      const s = symById.get(k);
      chips.append(el("button", { type: "button", class: "chip", "data-k": k, "aria-pressed": "false", title: k,
        onclick: (e) => filter(e.currentTarget.getAttribute("aria-pressed") === "true" ? null : k) },
        s ? (c.syms.filter(o => sym(o.id) === sym(k)).length > 1 ? `${file(k)} · ${sym(k)}` : sym(k)) : k.split("/").pop(), s && s.status !== "modified" ? el("i", { text: s.status }) : null));
    });
    box.append(chips, ...hunkEls);
    const files = [...new Set(c.hunks.map(h => h.file.split("/").pop()))];
    more.append(fold("Code", `${plural(c.hunks.length, "hunk")} in ${files.slice(0, 4).join(", ")}${files.length > 4 ? ` and ${files.length - 4} more` : ""}`, box));
  }
  if (more.children.length) pane.append(more);
}

function renderNote() {
  const lines = [];
  for (const c of chapters) {
    const qs = c.qs.filter(q => picked.has(q.id));
    if (!qs.length) continue;
    lines.push(`${c.n}. ${c.title}`);
    qs.forEach(q => lines.push(`   - ${q.q}`));
  }
  $("#note").value = lines.join("\n");
  $("#count").textContent = plural(picked.size, "question");
}

addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  const d = { ArrowRight: 1, j: 1, ArrowLeft: -1, k: -1 }[e.key];
  if (d && current + d >= 0 && current + d <= chapters.length) { e.preventDefault(); show(current + d); }
});
$("#peek").addEventListener("click", (e) => {
  const open = $("#note").hidden;
  $("#note").hidden = !open;
  e.target.setAttribute("aria-expanded", String(open));
  e.target.textContent = open ? "Hide" : "Show";
});
$("#copy").addEventListener("click", async () => {
  const t = $("#note");
  try { await navigator.clipboard.writeText(t.value); $("#status").textContent = "Copied"; }
  catch (e) { t.hidden = false; t.focus(); t.select(); $("#status").textContent = "Selected: press Ctrl+C or Cmd+C to copy"; }
});
renderNote();
show(0, false);
</script>
