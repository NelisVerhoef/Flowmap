<style>
/* One canvas, read left to right: screens, the flows and their steps, the code they run (a card
   per file, placed by call depth), the data they write. A flow is a path on it; a change is paint
   on it. Positions follow the map's own order, so the picture stays put between builds. */
:root {
  --paper: #eef1f4; --surface: #ffffff; --ink: #17202b; --muted: #5b6676; --faint: #8a95a3;
  --rule: #d5dbe2; --wire: #aab4c0; --wire-hi: #2e5bff; --accent: #2e5bff; --accent-soft: rgba(46, 91, 255, .10);
  --chg: #c77700; --chg-soft: rgba(230, 150, 20, .16); --new: #1e8a4c; --new-soft: rgba(30, 138, 76, .13);
  --ev-good: #2f9e5b; --ev-mid: #d99a0b; --ev-bad: #c8423b;
  --k-screen: #7a4fd6; --k-code: #2e5bff; --k-data: #0f8a8a; --k-flow: #17202b;
  --display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f141a; --surface: #171e27; --ink: #e6ebf1; --muted: #9aa6b5; --faint: #6b7787; --rule: #2a3441;
    --wire: #3f4b5b; --wire-hi: #7c9cff; --accent: #7c9cff; --accent-soft: rgba(124, 156, 255, .14);
    --chg: #f0a83a; --chg-soft: rgba(240, 168, 58, .16); --new: #4cc27f; --new-soft: rgba(76, 194, 127, .14);
    --k-screen: #a98cf0; --k-code: #7c9cff; --k-data: #3cc2c2; --k-flow: #e6ebf1; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f141a; --surface: #171e27; --ink: #e6ebf1; --muted: #9aa6b5; --faint: #6b7787; --rule: #2a3441;
  --wire: #3f4b5b; --wire-hi: #7c9cff; --accent: #7c9cff; --accent-soft: rgba(124, 156, 255, .14);
  --chg: #f0a83a; --chg-soft: rgba(240, 168, 58, .16); --new: #4cc27f; --new-soft: rgba(76, 194, 127, .14);
  --k-screen: #a98cf0; --k-code: #7c9cff; --k-data: #3cc2c2; --k-flow: #e6ebf1; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--paper); color: var(--ink); font: 14px/1.45 var(--body); display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
button { font: inherit; color: inherit; }
.mono { font-family: var(--mono); }

/* header */
header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 12px 16px; border-bottom: 1px solid var(--rule); background: var(--surface); z-index: 5; }
h1 { font: 800 22px/1 var(--display); font-stretch: 75%; margin: 0; letter-spacing: .01em; }
.crumbs { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; min-width: 0; }
.crumbs a { color: inherit; cursor: pointer; text-decoration: none; }
.crumbs a:hover { color: var(--ink); text-decoration: underline; }
.crumbs b { color: var(--ink); font-weight: 600; }
.spacer { flex: 1; }
.ctl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
select, input[type="search"] { font: 13px var(--body); color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; padding: 6px 10px; }
input[type="search"] { width: 200px; }
.btn { border: 1px solid var(--rule); background: var(--surface); border-radius: 8px; padding: 6px 11px; cursor: pointer; font-size: 13px; }
.btn:hover { border-color: var(--muted); }
.btn.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }

/* stage */
main { display: grid; grid-template-columns: 1fr 360px; min-height: 0; }
#stage { position: relative; overflow: hidden; cursor: grab; touch-action: none; background-image: radial-gradient(var(--rule) 1px, transparent 1px); background-size: 22px 22px; }
#stage.panning { cursor: grabbing; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#wires { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.zoom { position: absolute; left: 14px; bottom: 14px; display: flex; gap: 4px; z-index: 3; }
.zoom .btn { width: 34px; padding: 6px 0; text-align: center; }
.colhead { position: absolute; font: 600 11px/1 var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); white-space: nowrap; }

/* wires */
.w { fill: none; stroke: var(--wire); stroke-width: 1.3; transition: opacity .15s, stroke .15s; }
.w.ui { stroke-dasharray: 4 4; }
.w.writes { stroke: var(--k-data); stroke-opacity: .55; stroke-dasharray: 2 3; }
.w.hi { stroke: var(--wire-hi); stroke-opacity: 1; stroke-width: 2.2; }
.w.writes.hi { stroke: var(--k-data); stroke-width: 2.2; }
.dim .w:not(.hi) { opacity: .18; }
.pulse { fill: var(--wire-hi); }

/* cards */
.card { position: absolute; background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; padding: 10px 12px; cursor: pointer; transition: opacity .15s, box-shadow .15s, border-color .15s; overflow: hidden; }
.card:hover { border-color: var(--muted); }
.card.sel { box-shadow: 0 0 0 2px var(--accent); border-color: var(--accent); }
.dim .card:not(.hi):not(.sel), .dim .flowbox:not(.hi) > .fbhead { opacity: .28; }
.kind { display: inline-flex; align-items: center; gap: 6px; font: 600 10.5px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.card .kind { display: flex; }  /* inline-flex would sit in a body-height line box and push the card's text down */
.kind i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.title { font-weight: 600; font-size: 14px; line-height: 1.3; margin-top: 4px; display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; }
.sub { color: var(--muted); font-size: 12px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card.screen .kind i { background: var(--k-screen); }
.card.file .kind i { background: var(--k-code); }
.card.data { border-style: dashed; }
.card.off { border-style: dashed !important; }
.card.data .kind i { background: var(--k-data); border-radius: 50%; }
.card.file .title { font-family: var(--mono); font-size: 13.5px; -webkit-line-clamp: 1; }
.card.step { border-radius: 10px; padding: 8px 11px; }
.card.step .title { -webkit-line-clamp: 2; font-weight: 500; font-size: 13px; margin-top: 0; }
.card.step .foot { display: flex; gap: 6px; align-items: center; margin-top: 5px; color: var(--muted); font-size: 11.5px; min-width: 0; white-space: nowrap; }
.card.step .foot span:last-child { overflow: hidden; text-overflow: ellipsis; }
.ep { font: 500 11px/1.2 var(--mono); background: var(--paper); border-radius: 5px; padding: 2px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
.ev { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: none; }
.ev.confirmed, .ev.tested, .ev.agreed { background: var(--ev-good); }
.ev.contested { background: var(--ev-mid); }
.ev.single-source, .ev.single { background: var(--ev-bad); }
.card.flow { border-width: 1.5px; border-color: var(--k-flow); border-radius: 16px; }
.card.flow .title { font: 700 17px/1.15 var(--display); font-stretch: 85%; -webkit-line-clamp: 1; }
.card.flow .summary { color: var(--muted); font-size: 12px; margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tag { display: inline-block; font: 600 10.5px/1 var(--body); padding: 3px 6px; border-radius: 5px; background: var(--paper); color: var(--muted); letter-spacing: .02em; }
.flowbox { position: absolute; border: 1.5px solid var(--k-flow); border-radius: 18px; background: color-mix(in srgb, var(--surface) 55%, transparent); }
.fbhead { position: absolute; left: 14px; right: 10px; top: 10px; display: flex; align-items: center; gap: 8px; cursor: pointer; }
.fbhead .title { font: 700 17px/1.15 var(--display); font-stretch: 85%; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.icon-btn { border: 0; background: none; cursor: pointer; color: var(--muted); padding: 2px 6px; border-radius: 6px; font-size: 13px; }
.icon-btn:hover { background: var(--paper); color: var(--ink); }
.fnlist { margin-top: 4px; line-height: 1.35 !important; font: 11.5px/1.45 var(--mono); color: var(--muted); }
.fnlist span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.far .sub, .far .fnlist, .far .card.step .foot, .far .summary { visibility: hidden; }

/* change paint */
.card.p-changed { background: linear-gradient(var(--chg-soft), var(--chg-soft)), var(--surface); border-color: var(--chg); border-width: 2px; }
.card.p-new { background: linear-gradient(var(--new-soft), var(--new-soft)), var(--surface); border-color: var(--new); border-width: 2px; }
.card.p-direct { box-shadow: inset 4px 0 0 var(--chg); border-color: var(--chg); }
.card.p-reach { box-shadow: inset 4px 0 0 var(--chg); border-style: dashed; border-color: var(--chg); }
.card.p-newstep { box-shadow: inset 4px 0 0 var(--new); border-color: var(--new); }
.card.sel.p-direct, .card.sel.p-reach, .card.sel.p-newstep { box-shadow: 0 0 0 2px var(--accent); }
.badges { position: absolute; top: -9px; right: 10px; display: flex; gap: 4px; }
.badge { min-width: 20px; height: 20px; border-radius: 10px; background: var(--chg); color: #fff; font: 700 11px/20px var(--body); text-align: center; padding: 0 6px; box-shadow: 0 0 0 2px var(--paper); }
.badge.n { background: var(--ink); color: var(--surface); }
.card { overflow: visible; }
.card .clip { overflow: hidden; }
.pill { position: absolute; border: 1px dashed var(--muted); border-radius: 999px; padding: 6px 14px; background: var(--surface); font-size: 12.5px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill:hover { border-style: solid; }

/* flow bar */
#flowbar { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; padding: 10px 14px; display: none; gap: 12px; align-items: center; z-index: 4; box-shadow: 0 8px 24px rgba(0,0,0,.08); max-width: min(720px, calc(100% - 28px)); }
#flowbar.on { display: flex; }
#flowbar .fb-text { min-width: 0; }
#flowbar .fb-k { font-size: 11px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
#flowbar .fb-t { font-weight: 600; font-size: 13.5px; }

/* panel */
aside { border-left: 1px solid var(--rule); background: var(--surface); overflow: auto; padding: 18px 18px 40px; }
aside h2 { font: 800 21px/1.12 var(--display); font-stretch: 80%; margin: 4px 0 8px; }
aside h3 { font: 600 11px/1 var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 20px 0 8px; }
aside p { margin: 6px 0; }
aside .lead { color: var(--muted); }
aside ul { margin: 4px 0; padding-left: 18px; }
aside li { margin: 3px 0; }
.rowlink { display: flex; gap: 8px; align-items: baseline; padding: 6px 8px; margin: 0 -8px; border-radius: 8px; cursor: pointer; }
.rowlink:hover { background: var(--paper); }
.rowlink > span { min-width: 0; }
.rowlink .sub { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.rowlink .n { font: 700 11px/18px var(--body); min-width: 18px; height: 18px; border-radius: 9px; text-align: center; background: var(--paper); color: var(--muted); flex: none; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { font: 12px var(--mono); background: var(--paper); border-radius: 6px; padding: 2px 7px; cursor: pointer; }
.chip:hover { outline: 1px solid var(--muted); }
.kv { display: grid; grid-template-columns: 88px 1fr; gap: 4px 10px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.verdict { display: inline-block; font: 700 11px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; padding: 4px 7px; border-radius: 5px; color: #fff; }
.verdict.contained { background: var(--ev-good); }
.verdict.spreads { background: var(--chg); }
.verdict.blind { background: var(--ev-bad); }
.ba { display: grid; grid-template-columns: 1fr; gap: 6px; margin: 8px 0; }
.ba div { background: var(--paper); border-radius: 8px; padding: 8px 10px; font-size: 13px; }
.ba b { display: block; font: 600 10.5px/1.4 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.legend { display: grid; gap: 7px; font-size: 12.5px; }
.legend div { display: flex; gap: 9px; align-items: center; }
.sw { width: 22px; height: 14px; border-radius: 4px; border: 1px solid var(--rule); background: var(--surface); flex: none; }
.calltree { font: 12px/1.6 var(--mono); }
.calltree ul { list-style: none; padding-left: 14px; margin: 0; border-left: 1px solid var(--rule); }
.calltree > ul { border: 0; padding-left: 0; }
.struck { text-decoration: line-through; text-decoration-color: var(--ev-bad); color: var(--muted); }
.q { border-left: 3px solid var(--accent); padding: 2px 0 2px 10px; margin: 6px 0; font-size: 13px; }
a.ext { color: var(--accent); }
@media (max-width: 860px) {
  main { grid-template-columns: 1fr; grid-template-rows: 1fr 42%; }
  aside { border-left: 0; border-top: 1px solid var(--rule); }
  input[type="search"] { width: 140px; }
}
</style>

  </div>

</main>

function wirePath(a, b, ia, na, ib, nb) {
  const ya = a.y + a.h * (na > 1 ? 0.2 + 0.6 * ia / (na - 1) : 0.5);

  if (x2 > x1 + 10) { const dx = Math.max(36, (x2 - x1) * 0.5); return `M${x1} ${ya}C${x1 + dx} ${ya},${x2 - dx} ${yb},${x2} ${yb}`; }
  // backwards (a cycle, or a call into an earlier column): loop out and come back in
  const lift = Math.min(a.y, b.y) - 26;
  return `M${x1} ${ya}C${x1 + 70} ${ya},${x1 + 70} ${lift},${(x1 + x2) / 2} ${lift}S${x2 - 70} ${yb},${x2} ${yb}`;
}

function draw() {
  L = S.view === "map" ? layoutMap() : layoutInside(S.view);
  world.querySelectorAll(".card,.flowbox,.colhead,.pill").forEach(n => n.remove());
  wiresSvg.replaceChildren();
  const off = -L.top + 40;
  for (const n of Object.values(L.nodes)) n.y += off;
  for (const b of L.boxes) {
    const f = flowOf[b.id];
    const box = el("div", { class: "flowbox", "data-id": b.id, style: `left:${b.x}px;top:${b.y + off}px;width:${SIZE.flow[0]}px;height:${b.h}px` },
      el("div", { class: "fbhead", onclick: ev => { ev.stopPropagation(); select(b.id); } },
        el("span", { class: "title" }, f.title),
        el("button", { class: "icon-btn", title: "Play this flow", onclick: ev => { ev.stopPropagation(); play(b.id); } }, "▶"),
        el("button", { class: "icon-btn", title: "Fold", onclick: ev => { ev.stopPropagation(); toggleFlow(b.id, false); } }, "−")));
    world.append(box);
  }
  for (const h of L.heads) if (h.name) world.append(el("div", { class: "colhead", style: `left:${h.x}px;top:${off - 28}px` }, h.name));
  // ports: spread each card's wires along its side, ordered by where the other end is
  const outs = {}, ins = {};
  for (const w of L.wires) { (outs[w.a] ||= []).push(w); (ins[w.b] ||= []).push(w); }
  const cy = id => L.nodes[id].y + L.nodes[id].h / 2;
  Object.values(outs).forEach(ws => ws.sort((p, q) => cy(p.b) - cy(q.b)));
  Object.values(ins).forEach(ws => ws.sort((p, q) => cy(p.a) - cy(q.a)));
  for (const w of L.wires) {
    const a = L.nodes[w.a], b = L.nodes[w.b];

    w.d = wirePath(a, b, outs[w.a].indexOf(w), outs[w.a].length, ins[w.b].indexOf(w), ins[w.b].length);
    w.el = svgEl("path", { d: w.d, class: "w " + w.kind, "stroke-width": (1.2 + Math.min(2.4, Math.log2(w.w) * 0.5)).toFixed(2) });
    if (w.labels && w.labels.size) { const t = svgEl("title", {}); t.textContent = [...w.labels].join("\n"); w.el.append(t); }
    wiresSvg.append(w.el);
  }
  for (const n of Object.values(L.nodes)) world.append(card(n));
  const maxX = Math.max(...Object.values(L.nodes).map(n => n.x + n.w)), maxY = Math.max(...Object.values(L.nodes).map(n => n.y + n.h));
  wiresSvg.setAttribute("width", maxX + 40); wiresSvg.setAttribute("height", maxY + 40);
  L.bounds = { w: maxX, h: maxY + 20 };

           : el("p", {}, el("button", { class: "btn", onclick: () => openInside(id) }, "Open it up →")));
  if (p) P.append(el("p", { style: "color:var(--chg)" }, (p.kind === "new" ? "New: " : "Changed: ") + p.syms.join(", ")));
  P.append(el("h3", {}, "Used by"), ...Object.entries(byFlow).map(([f, ss]) => el("div", {}, el("b", {}, flowOf[f].title), el("div", {}, ss.map(s => link(s, STEPS[s].name))))));
  if (callers.length) P.append(el("div", { class: "chips", style: "margin-top:6px" }, callers.map(f => chip(f, FILES[f].label))));
  P.append(el("h3", {}, "Inside"), el("div", { class: "calltree" }, el("ul", {}, F.fns.map(n => el("li", {}, FNS[n].url ? el("a", { class: "ext", href: FNS[n].url, target: "_blank", rel: "noopener" }, FNS[n].sym) : FNS[n].sym, FNS[n].doc ? el("div", { class: "sub", style: "font-family:var(--body);white-space:normal" }, FNS[n].doc) : null)))));
  if (calls.length || writes.length) P.append(el("h3", {}, "Uses"), el("div", { class: "chips" }, calls.map(f => chip(f, FILES[f].label)), writes.map(d => chip(d, DATA[d].label))));
  }

function crumbs() {
  const c = $("#crumbs"); c.replaceChildren();
  if (S.view === "map") c.append(el("b", {}, "Map"));
  else c.append(el("a", { onclick: back }, "Map"), " / ", el("b", { class: "mono" }, FILES[S.view].label));
}

// ---------- pan and zoom ----------
let T = { x: 40, y: 20, k: 1 };
const apply = () => { world.style.transform = `translate(${T.x}px,${T.y}px) scale(${T.k})`; world.classList.toggle("far", T.k < 0.55); };
function fitBox(x0, y0, x1, y1, maxK = 1.1) {
  const r = stage.getBoundingClientRect(), pad = 48;
  const k = Math.min(maxK, (r.width - pad * 2) / (x1 - x0 || 1), (r.height - pad * 2) / (y1 - y0 || 1));
  T = { k, x: (r.width - (x1 - x0) * k) / 2 - x0 * k, y: (r.height - (y1 - y0) * k) / 2 - y0 * k + 10 };
  apply();
}
function fit() {
  // whole picture when it reads; otherwise full width from the top, and scroll down
  const r = stage.getBoundingClientRect(), pad = 48;
  const kw = (r.width - pad * 2) / L.bounds.w, kh = (r.height - pad * 2) / L.bounds.h;
  if (Math.min(kw, kh) >= 0.42) return fitBox(0, 0, L.bounds.w, L.bounds.h, 1);
  const k = Math.min(1, Math.max(0.6, kw));
  T = { k, x: kw >= k ? (r.width - L.bounds.w * k) / 2 : pad / 2, y: 12 }; apply();
}
function fitTo(ids, neighbours = true) {
  const ns = ids.map(i => L.nodes[i] || L.boxes.find(b => b.id === i)).filter(Boolean);
  if (!ns.length) return;
  const lit = neighbours ? L.wires.filter(w => ids.includes(w.a) || ids.includes(w.b)).flatMap(w => [L.nodes[w.a], L.nodes[w.b]]) : [];
  const all = [...ns.map(n => ({ x: n.x ?? 0, y: n.y, w: n.w ?? SIZE.flow[0], h: n.h })), ...lit];
  fitBox(Math.min(...all.map(n => n.x)), Math.min(...all.map(n => n.y)) - 30, Math.max(...all.map(n => n.x + n.w)), Math.max(...all.map(n => n.y + n.h)), 1);
}
function centre(id) {
  const n = L.nodes[rep(id)] || L.nodes[id]; if (!n) return;
  const r = stage.getBoundingClientRect();
  T.x = r.width / 2 - (n.x + n.w / 2) * T.k; T.y = r.height / 2 - (n.y + n.h / 2) * T.k; apply();
}
stage.addEventListener("wheel", ev => {
  ev.preventDefault();
  const r = stage.getBoundingClientRect(), mx = ev.clientX - r.left, my = ev.clientY - r.top;
  const k = Math.max(0.15, Math.min(2.5, T.k * Math.exp(-ev.deltaY * (ev.ctrlKey ? 0.01 : 0.0018))));
  T.x = mx - (mx - T.x) * k / T.k; T.y = my - (my - T.y) * k / T.k; T.k = k; apply();
}, { passive: false });
let drag = null; const touches = new Map(); let pinch = null;
stage.addEventListener("pointerdown", ev => { touches.set(ev.pointerId, ev); if (touches.size === 2) { const [a, b] = [...touches.values()]; pinch = { d: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), k: T.k, x: T.x, y: T.y, mx: (a.clientX + b.clientX) / 2, my: (a.clientY + b.clientY) / 2 }; drag = null; } });
stage.addEventListener("pointermove", ev => { if (!touches.has(ev.pointerId)) return; touches.set(ev.pointerId, ev); if (!pinch || touches.size < 2) return;
  const [a, b] = [...touches.values()], r = stage.getBoundingClientRect(), d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
  const k = Math.max(0.15, Math.min(2.5, pinch.k * d / pinch.d)), mx = pinch.mx - r.left, my = pinch.my - r.top;
  T.k = k; T.x = mx - (mx - pinch.x) * k / pinch.k; T.y = my - (my - pinch.y) * k / pinch.k; apply(); });
["pointerup", "pointercancel"].forEach(t => stage.addEventListener(t, ev => { touches.delete(ev.pointerId); if (touches.size < 2) pinch = null; }));
stage.addEventListener("pointerdown", ev => { if (ev.target.closest(".card,.pill,.fbhead,.zoom,#flowbar")) return; drag = { x: ev.clientX, y: ev.clientY, tx: T.x, ty: T.y, moved: false }; stage.setPointerCapture(ev.pointerId); stage.classList.add("panning"); });
stage.addEventListener("pointermove", ev => { if (!drag || pinch) return; const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y; if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true; T.x = drag.tx + dx; T.y = drag.ty + dy; apply(); });
stage.addEventListener("pointerup", () => { if (drag && !drag.moved && S.sel && !S.play) { S.sel = null; highlight(); panel(); writeHash(); } drag = null; stage.classList.remove("panning"); });
$("#z-in").onclick = () => { T.k = Math.min(2.5, T.k * 1.25); apply(); };
$("#z-out").onclick = () => { T.k = Math.max(0.15, T.k / 1.25); apply(); };
$("#z-fit").onclick = fit;

// ---------- controls ----------
const chSel = $("#change");
chSel.append(el("option", { value: -1 }, "No change painted"), ...G.changes.map((c, i) => el("option", { value: i }, "Paint: " + (c.story && c.story.title ? c.title + " — " + c.story.title.slice(0, 48) + (c.story.title.length > 48 ? "…" : "") : c.title))));
if (!G.changes.length) chSel.style.display = "none";
chSel.onchange = () => { S.change = +chSel.value; S.sel = null; draw(); fitChange(); };
$("#expand").onclick = () => { const all = S.expanded.size === FLOWS.length; S.expanded = new Set(all ? [] : FLOWS.map(f => f.id)); draw(); fit(); };
const find = $("#find");
find.addEventListener("keydown", ev => {
  if (ev.key !== "Enter") return;
  const q = find.value.trim().toLowerCase(); if (!q) return;
  const hit = Object.values(STEPS).find(s => s.name.toLowerCase().includes(q) || s.endpoints.some(e => e.toLowerCase().includes(q)))
    || Object.values(FILES).find(f => f.path.toLowerCase().includes(q) || f.fns.some(n => FNS[n].sym.toLowerCase().includes(q)))
    || Object.values(DATA).find(d => d.label.toLowerCase().includes(q)) || FLOWS.find(f => f.title.toLowerCase().includes(q));
  if (!hit) { find.style.borderColor = "var(--ev-bad)"; return; }
  find.style.borderColor = "";
  if (S.view !== "map") S.view = "map";
  if (STEPS[hit.id]) S.expanded.add(STEPS[hit.id].flow);
  draw(); select(hit.id); centre(hit.id);
});
document.addEventListener("keydown", ev => {
  if (ev.target.matches("input,select")) return;
  if (S.play && ev.key === "ArrowRight") stepTo(S.play.i + 1);
  else if (S.play && ev.key === "ArrowLeft") stepTo(S.play.i - 1);
  else if (ev.key === "Escape") { if (S.play) { stop(); panel(); } else if (S.sel) { S.sel = null; highlight(); panel(); writeHash(); } else back(); }
  else if (ev.key === "Backspace") back();
  else if (ev.key === "f" || ev.key === "F") fit();
  else if (ev.key === "e" || ev.key === "E") $("#expand").click();
  else if (ev.key === "/") { ev.preventDefault(); find.focus(); }
});

// ---------- the view lives in the URL ----------
function writeHash() {
  const p = new URLSearchParams();
  if (S.view !== "map") p.set("in", S.view);
  if (S.sel) p.set("s", S.sel);
  if (S.change >= 0) p.set("c", S.change); else if (G.changes.length) p.set("c", -1);
  if (S.expanded.size && S.expanded.size < FLOWS.length) p.set("x", [...S.expanded].map(f => f.slice(5)).join(","));
  else if (S.expanded.size === FLOWS.length && total > 12) p.set("x", "all");
  history.replaceState(null, "", "#" + (PAYLOAD ? PAYLOAD[1] + "&" : "") + p.toString());
}
function readHash() {
  const p = new URLSearchParams(PAYLOAD ? PAYLOAD[2] : location.hash.slice(1));
  if (p.has("c")) S.change = Math.min(G.changes.length - 1, +p.get("c"));
  if (p.has("x")) S.expanded = new Set(p.get("x") === "all" ? FLOWS.map(f => f.id) : p.get("x").split(",").map(f => "flow:" + f).filter(f => flowOf[f]));
  if (p.has("in") && FILES[p.get("in")]) S.view = p.get("in");
  if (p.has("s")) S.sel = p.get("s");
}
readHash();
chSel.value = S.change;
draw();
const changeIds = () => { const c = change(); return c ? [...Object.keys(c.files), ...Object.keys(c.steps).map(rep), ...c.off_files.map(o => o.id)].filter(id => L.nodes[id]) : []; };
const fitChange = () => change() && Object.keys(change().files).length ? fitTo(changeIds(), false) : fit();
if (S.sel && L.nodes[rep(S.sel)]) fitTo([rep(S.sel)]); else fitChange();
window.addEventListener("resize", () => fit());
</script>
